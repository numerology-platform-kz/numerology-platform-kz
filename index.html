  "11": "Жоғарғы күштерден сый ретінде адам физикалық денемен, денсаулықпен жұмыс істеуді алды. Біреулер сый ретінде жақсы денсаулық пен үлкен физикалық күш алды. Басқалары — әлсіз әрі ауру денсаулық. Және өмір бойы денсаулықты жақсартудың ақпараты мен әдістерін іздеумен өткізеді. Бойындағы әлеуеттерді, таланттарды, бейімділіктерді тиімді пайдалану таланты, бұл бастапқы алған орнына қарамастан, өмірде жоғары нәтижелерге жетуге мүмкіндік береді.",
  "12": "Жоғарғы күштерден сый ретінде адам Дұғаларды Жоғарғы күштерге жеткізуді, сананың өзгерген күйлеріне оңай кіруді, өзінің ішкі әлемімен, Құдаймен, басқа Әлемдермен байланыс орнатуды алды. Олардың Дұғаларының емдік қабілеті және тазартатын қасиеттері бар. Бәрін төңкеріп, басқаларға ұқсамайтын осындай көзқарастан бастап бәрін жаңадан бастау — сый.",
  "13": "Жоғарғы күштерден сый ретінде адам өзін де, айналадағы әлемді де трансформациялау қабілетін, сондай-ақ тән мен жанды емдеу талантын алды. Өзгерістерден, тағдырдың сын-қатерлерінен және туындайтын мүмкіндіктерден қорықпау. Басқа адамдардың тағдырына оңай өзгерістер әкеле алады немесе мықты жүйке мен өзін толық бақылауды талап ететін экстремалды кәсіптерде жүзеге аса алады.",
  "14": "Жоғарғы күштерден сый ретінде адам өте проблемалы әрі шиеленіскен қарым-қатынасқа тепе-теңдік енгізуді, қиын жағдайлардан шығар жол таба білуді, айналасына үйлесім мен тыныштық әкелуді алды. Жұмсақтық пен ішкі үйлесім.",
  "15": "Жоғарғы күштерден сый ретінде адам түрлі деңгейлерде жүзеге асуы мүмкін орасан зор энергияны алды. Емшілік дарыны. Кез келген ортада көңіл-күй көтеріп, жағымды энергия әкеле алады. Биоэнерготерапиямен, Рейкимен немесе емшіліктің басқа түрімен айналыса алады.",
  "16": "Жоғарғы күштерден сый ретінде адам ескі, өзін ескірткен, қатып қалған жүйелерді бұзып, олардың орнына жаңа, заманауилау жүйелерді құра білуді алды. Жоқтан кез келген жағдайда ұзақ жылдар өмір сүре алатын күрделі құрылым жасай алады. Болашағы бар, тұрақты деп санаса, кез келген құрылымға сыйып кетеді. Уақытты сезіну дарыны, оны ұйымдастырып, әр минутты пайдалы жұмсай алады. Логиктер. Ұйымдастырушылар.",
  "17": "Жоғарғы күштерден сый ретінде адам көркемдік талантты алды, олар креативті, өнер туындысын жасай алады. Достық байланыстар орната алады. Сезімталдық, нәзіктік, әдептілік. Жоғарғы күштердің қамқорлығы дарыны.",
  "18": "Жоғарғы күштерден сый ретінде адам түйсікті, адам психикасы туралы білімді, жанды қиялды, бай фантазияны, аса сезімталдықты алды. Санаастымен (подсознание) байланыс орнатып, оның кеңестерін түсіну дарыны.",
  "19": "Жоғарғы күштерден сый ретінде адам көшбасшы, басшы болуды алды. Кез келген басшылық лауазымға оңай орналасады. Харизма дарыны, көпшілік алдында сөйлеу таланты, өз көзқарасын сенімді әрі дәл баяндай білу, дәлелдеу және кез келген істің мәнін баяндау қабілеті.",
  "20": "Жоғарғы күштерден сый ретінде адам сау әрі дана құндылықтар жүйесін жасай білуді, адамдар арасында жағымды қарым-қатынасты дамытуды алды, сондай-ақ талдау мен жинақтауға аса қабілетті ашық ақыл көрсетеді, бұл жағдайды шынайы бағалауға, қорытынды жасауға және алған тәжірибені іс жүзінде қолдануға көмектеседі. Өте отбасылық адамдар. Көбі әулеттік кармалық қарыздарды өтеп жүргенін тіпті білмейді. Жағымды дүниетанымы бар, ал депрессия оларға мүлдем таныс емес.",
  "21": "Жоғарғы күштерден сый ретінде адам космополитизмді, төзімділікті, шетелдіктермен және шетелдік компаниялармен байланыс орната білуді алды. Мұндай адам кез келген ортада өзін жақсы сезінеді, кез келген жағдайға бейімделе алады, өзі өмір сүруге тура келген елдің тілін, салт-дәстүрі мен мәдениетін тез үйрене алады. Әзіл сезімі, өзіне сырттан қарай білу, өзінің және басқалардың өмірін жеңілдету таланты. Күлкімен, қызығушылықпен, позитивпен өмір сүру, заманауи әрі өзіне сенімді адамдар.",
  "22": "Жоғарғы күштерден сый ретінде адам ынта-жігерді, өмірге деген құштарлықты, кез келген істі ерекше, жаңа тәсілмен шешу мүмкіндіктерін алды. Өмір — ойын, және ойнап өмір сүру керек — бұл адам ұстанатын ұран осы. Ол жаңашыл және жаңа көкжиектерді қуана ашады."
 },
 "harmony": {
  "1": "Ғаламның өзі сізді алдыңғы шепке қойды. Туғаннан энергияларға сезімталсыз, істер жердегі де, рухани да, шығармашылық та болады. Сізде ақыл күші мен Жер күші бар. Сізге ақыл күшін, ой күшін басқаруды үйрену, тағдыр белгілерін түсінуге тырысу маңызды. Сіз көпке игілік әкелуге қабілеттісіз! Сізге Ғажайып жасаушы болып туғаныңызды түсіну керек! Өз қолыңызбен жасауға болатынның бәрі — сіздің бағытыңыз.",
  "2": "Сізге табиғатынан байқампаздық берілген, жасырын және әдеттегі қабылдау мен түсініктің шегінен тыс жатқан нәрсені көріп, байқай аласыз. Олардың қамқоршысы — магия құдайы. Психология, медицина, емшілік, магия, астрология, актерлік.",
  "3": "Сізге табиғатынан әлемнің, Ғаламның барлық қазынасына ие болуға, сөзсіз гүлденуге деген ықылас берілген. Табиғатынан өзін сүюмен және өз денесіне, сондай-ақ үйге және балаларға қамқорлық жасап, күтім жасай білумен дарытылған. Сыртқы сұлулыққа ие, ақшаны тарта біледі, ақша оларды жақсы көреді. Адамдарға ертеңгі күнге деген сенім сыйлаңыз. Молшылық тақырыбы — сіздің тақырыбыңыз. Бизнес, кондитерлер, мейрамхана бизнесі, сұлулық бизнесі.",
  "4": "Сізге табиғатынан шешім қабылдау және жауапкершілікті өз мойныңызға алу энергиясы, тек өзіңіз үшін ғана емес, көптеген адам үшін жауап бере білу берілген. Кімге тағдыры бойынша билік энергиясы берілсе, соған қоғамда өрлеу жолында үлкен мүмкіндіктер мен көкжиектер ашық. Басқару жолымен жүріңіз, сонда ақша сізді өзі табады. Бизнес, саясат, прорабтар, сәулетшілер, директорлар, басқарушылар.",
  "5": "Сіздің міндетіңіз — өмірде білім іздеу. Табиғат сізге шешендік, ұстаздық, сендіру талантын берген. Сізге дәстүрлерді, негіздерді, ережелерді, білімді, әдістерді сақтау, өзгерту және жақсарту қабілеті берілген. Әлемді жаңа біліммен толтыру. Педагогика, заңгерлер, жылжымайтын мүлік, психология, мемлекеттік қызметтер.",
  "6": "Сізге табиғатынан сұлулық пен өмір мерекесін сезіну берілген. Шынайылық дәл қуаныш пен нұрда туады. Айналаңызда мереке жасаңыз. Сұлулық. Сіз адамдарға сұлуырақ, жеңілірек, қуаныштырақ болуға, сиқырға, күлуге, әзілдесуге көмектесе аласыз. Продюсерлік, стилистика, мереке жүргізушілері, режиссерлер, махаббат магиясы.",
  "7": "Сізге табиғатынан көшбасшы, жауынгер энергиясы, жеңіске, мақсатқа ұмтылу берілген. Сіз үшін түпкі мақсатты түсіну және білу маңызды. Табандылық, нәтижеге бағытталу, қайсарлық, құлап, қайта тұрып, құлағаннан кейін тағы да тұрып, мақсатқа қарай жүре алады. Сізде үлкен мүмкіндіктер бар. Тәжірибемен бөлісіңіз, адамдарды шабыттандырыңыз, соңыңыздан ертіңіз. Бизнес, жол инспекциясы, курьерлер, фитнес жаттықтырушысы, әскери құрылымдар, армия, құқық қорғаушылар, шендер, арнайы қызметтер, туризм, рухани және саяси көшбасшылар.",
  "8": "Сізге табиғатынан өткен өмірлердің кармасымен көрінбейтін энергетикалық жіп берілген. Дәл соларға кармалық әділдік заңын тереңірек әрі нәзігірек көру, сезіну және түсіну берілген. Оларға үнемі өз кармасын жақсарту үстінде жұмыс істеу берілген. Сізге Ғаламдық кармалық заңмен терең байланыс берілген. Бұл — сіздің туғаннан, арнауыңыз бойынша берілген қасиетіңіз. Түйсікпен көру қабілеті. Карманы емдеу қабілеті. Заңдылық, билік, салық құрылымдарында жұмыс, заңгерлік, әскери қызмет. Бизнес, кармалық психология, нумерология, емшілік, эзотерика.",
  "9": "Сіз табиғатынан өзін-өзі жеткілікті және даналыққа ие адамсыз. Даналық пен жарқын ақыл оларға кез келген, тіпті көптеген басқалар үшін ең күрделі міндеттерді де түсінуге көмектеседі. Емшілік қабілеттер сізге туғаннан берілген. Сіз сөзбен емдей аласыз, сондықтан бұл дарынды бәрінің игілігіне пайдаланасыз. Сізге адамдар үшін пайдалана алатын жаңа білім ашылады. Қарапайым құралдармен көп нәрсеге жету. Қойылған мақсатқа баяу әрі сенімді жылжу. Сауықтыру, емдеу. Жоғары қамқоршылар. Жақсы оқу және жақсы оқыту. Ғылым, медицина, психология, Оқытушылық, жазушылар, монахтар, жаңа ғылыми әзірлемелер, жаңа технологиялар, жаңа әдістер.",
  "10": "Сіз туғаннан бақытты жұлдыз астындасыз. Жоғары қамқоршылар. Бақтың өзі сізді кез келген жағдайдан шығарады. Сізге жаңа ағымдардың Энергияларымен біртұтас болуды үйрену керек. Өмір дана, ол кармалық міндеттеріңізге сәйкес сізге қазіргі сәтте не керек екенін өзі біледі. Физикалық денемен айналысып, салауатты әрі белсенді өмір салтын ұстану керек, өйткені Ағын — белгілі бір бағыттағы қозғалыс. Ал адамның өзі өз өмірі мен тағдырының бағытын белгілеуі керек. Енжар емес, шығармашыл әрі жасампаз (созидательный) болу. Стюардессалар, туризм, футбол, би ұжымдары. Қаржы құрылымдары, банктер, бағалы қағаздар нарығы.",
  "11": "Сіз табиғатынан дарасыз. Әлеуетке ие, ойларыңыз бен энергияларыңызды басқаруды үйреніңіз. Көшбасшылық энергиясы. Адамдарды соңыңнан ерту. Сізге ерекше күш берілген. Жоғары рухани идеялар мен мақсаттарға назар аударыңыз. Тек сіздің жағымды тәжірибеңіз арқылы адамдар сізді естіп, өмірде өзгерістерге және жақсы жаққа өзгеруге келгісі келеді. Айналадағыларды азырақ қинап, өзіңіз де азырақ ширығуға тырысыңыз. Бизнес, өз ісіңіз, спорттық іс-шаралар, құқық қорғау органдары, құтқарушылар, күш жұмсаумен байланысты кәсіптер.",
  "12": "Сіз Құдайдың қызмет ету заңымен белгіленгенсіз. Сізде ерекше міндет бар: көбірек мейірім, рақым, жанашырлық әкелу. Адамдарды ашық болуға үйрету. Сізбен туғаннан Періштелер жұмыс істейді, сізде жақсы көктегі сақтаушылар бар. Сіз арқылы бірегей әдістер мен жаңа жолдар келеді. Сізге заттардың, оқиғалардың, адамдардың, құбылыстардың мәнін басқаша көру және түсіну берілген. Психология, эзотерика, емшілік, медицина, педагогика, балабақшалар, қайырымдылық жұмысы, науқас адамдармен жұмыс, фармацевтер, ветеринарлар, шығармашылық.",
  "13": "Сіз табиғатынан арнау энергияңыз бойынша мистикалық және болжауға келмейтінсіз. Сіз Жердегі циклдік ырғақтарды ешкімге ұқсамай түсінесіз. Батылдыққа, ержүректілікке, қорқынышсыздыққа иесіз, батыл, белсенді, ерлікке, сезім серпілістеріне қабілеттісіз. Сіздің өміріңіз циклдерге құрылған: бір күйлер басқаларымен ауысады, өмірдің өз тынысы сияқты. Адамдарға өзгеруге, қиындықтардан рухани сабақ алуға, ескіні жіберуге көмектесу, адамдарға өзгерістер жолын көрсету — бұл сіздің Жердегі миссияңыз, бұл сіздің арнауыңыз. Сізге энергетикалық практикалар мен энергетикалық гимнастикаларды дамыту, Ғаламның шексіз энергия көзінен нәр алу пайдалы. Жоғары бейімделу. Хирургтар, жедел жәрдем, ыстық нүктелердегі қызмет, каскадерлер, кеңістіктер мен аумақтарды тазарту, кармалық емшілік, психология, эзотерика.",
  "14": "Сізде туғаннан Періште-сақтаушымен байланыс бар, сондықтан түйсік пен экстрасенсорлық сезіну дамыған. Сізге Жерде шығармашылық процесті жасау энергиялары, адам жанын емдеу күші, оның өнер арқылы оянуы мен пісіп-жетілуі берілген. Психология, дәрігерлер, емшілік, фармацевтика, театр қызметі, өнертану, әдебиет, мұражай, энергетикалық емшілік.",
  "15": "Сізге Құдай үлкен мүмкіндіктер берген. Адамдарды жердегі қуаныштарды бағалауға үйретіңіз, бірақ жердегі нәрсеге жабыспаңыз, өйткені рух күші біз ілгектер мен тәуелділіктерді жібергенде қалыптасады. Ізгілік үшін өмір сүріңіз! Продюсерлер, қаржы, рухани практикалар жаттықтырушысы, шенеунік, бизнес. Жылжымайтын мүлік, музыка.",
  "16": "Адамдарды ояту — Жердегі игі миссия және жауапты міндет. Өмір алдыңызға биік планка қояды, сізге рухани өсу сатыларымен көтерілу керек. Құрылыс, сәулет, дизайн, медицина, травматология, спорт, сапёрлер, мергендер, ұсталар, археологтар, геологтар, мұнайшылар.",
  "17": "Сіз өзіңіздің бірегей жұлдызыңыздың астында өмір сүресіз және жарқын қабілеттер мен таланттарға иесіз. Сіз бәрінде талантсыз. Күнделікті дұғалар, медитациялар, энергетикалық жаттығулар практикасы сіздің табиғи энергетикалық, жұлдыздық арналарыңыздың өткізгіштігін арттырады. Жазушылар, суретшілер, әншілер, артистер, сұлулық салондары, теңіз ісі, астрономия, биоэнергеттер, емшілер.",
  "18": "Сізге магиялық күш берілген, оны бәрінің игілігі үшін пайдалануды үйрену керек. Энергетикалық заңды зерттеңіз. Түйсікпен көру, түс көру практикасын меңгеріңіз. Физикалық денеңізге күтім жасап, оны жаттықтырыңыз, мистикалық Ай сияқты сұлу әрі мықты етіңіз. Фантастар, ертегішілер, ақындар, фотографтар, музыканттар, театр, сән, флористер, оккультистер, магтар, емшілер, шығыстанушылар, психиатрлар, наркологтар, криминалистер, бағдарламашылар.",
  "19": "Сізге Құдай көптеген адамға арналған міндет берген. Жер мен адамдарды жақсартуға, емдеуге қатысыңыз. Сізге адамдардың ақыл-ойы мен санасын нұрландыру, жандарды нұрландырып, махаббатқа толтыру қабілеттері берілген. Көпке үлгі болу. Қоғамдық қызмет, саясат, бас қолбасшылар, мемлекет басшылары, маркетинг, бағалы қағаздар, валюта нарығы, бизнес. Мұғалімдер, директорлар, әскери-қорғаныс кәсіпорындары.",
  "20": "Сізге айқын есту, ақпарат беру және кармалық емшілік қабілеттері берілген. Сізге карманы және кармалық ауруларды емдеу мәселелері бағынады. Сіз адамдардың өткен өмірлері туралы, олардың осы өмірге арналған міндеттері туралы ақпаратты ала аласыз. Сізде жаңа уақытқа сай жаңа білімді беру миссиясы бар. Дәрігерлер, хирургтар, стоматологтар, психотерапевтер, криминалистер, жерлеу бюросы. Мистиктер, медиумдар, болжаушылар, экстрасенстер. Бизнес, саясат, журналистика, археология. Қолбасшылар, стратегтер. Қаржы құрылымдары. Шығармашылық. Жазушылар. Байланысшылар. Жердегі аномальды құбылыстарды зерттеу.",
  "21": "Сізді планетаның барлық адамдарымен кең жүрегіңіз, көптеген адамның игілігі үшін Жоғары қызметке толы болуыңыз біріктіреді. Сіз — басшы, сіз — байланыс. Планетамызды емдеу үшін барлық прогрессивті әрі жарқын нәрсені біріктіріңіз. Сіз — бітімгерсіз! Аудармашылар, гидтер, туризм, әскери қорғаныс. Саясат, дін, дипломатия. Журналистика. Экономика. Қаржы, инвестициялау, несиелеу. Фестивальдер, көрмелер. Пайдалы қазбалар. Емшілер, биоэнергеттер, бақсылар (шамандар).",
  "22": "Сіздің Жаныңыз өзін шығармашылықта көрсеткісі келеді. Сіз үшін қабілеттеріңізге ерік беру өте маңызды. Шығармашылық өзін-өзі көрсету сізді энергия мен қуанышқа толтырып, өмірге деген құштарлықты тұтандырады. Сізге тағдыр бойынша адамдарға өз үлгіңізбен жаңа жолдарды көрсету, көңілді болу берілген. Авантюрист, белгісізге қуана қадам басатын, жаңа циклдерді, істерді оңай бастайтын, жаңа жолдар ашатын, батыл. Туризм, саяхаттар, парашют спорты, журналистика, дипломатия, көрмелер, тренингтер."
 },
 "mission": {
  "1": "Мейірімді әрі дана сөзбен көмектесу. Әлемге үйлесім әкеліп, энергетикалық шиеленісті басу. Сіздің сөздеріңіз адамдардың санасында із қалдырады, айтылған сөздеріңізді қадағалап, адамдарды шабыттандырыңыз. Талантыңызды пайдаланбау немесе оны пайдакүнемдік мақсатта пайдалану қате болады.",
  "2": "Өз аналығыңызды сөздің кең мағынасында жүзеге асыру: басқа адамдарға қамқорлық, мұқтаждарды қамқорлыққа алу, өмірдегі бағытын жоғалтқан жастарға қолдау көрсету арқылы. Матрицада жатқан құпия білімді ашу. Бойыңыздағы әйелдік көріністен бас тарту қате болады, сонда әйелдермен мәселелер туындайды. Ер адамдарға бұл арканды өңдеу қиынырақ, бірақ мүмкін: дәрігерлер, емшілер, ветеринарлар, кез келген көріністегі құтқарушылар. Астрологтар, нумерологтар.",
  "3": "Адам сөздің кең мағынасында ана болуы керек: көп балалы аналар, балалары мен күйеуінің талантын ашқан аналар, балалардың бос уақытын, мектепке дейінгі білімді ұйымдастырған әйелдер. Шығармашылық шеберханалар құрғандар. «Берегиня» әйелдер клубтары және т.б. Талантты адамдардың жүзеге асуының жаңа жолдарын туғызу және ашу. Бала тууынан, балалардан, отбасынан, жаңа бағыттардан бас тарту, жан және шығармашылық бедеулігі қате болады.",
  "4": "Адам өзінен кейін із қалдыруы керек. Бойында биліктің шынайы сезімін ашу. Бейбітшілік пен мейіріммен басқару жауапкершілігін өз мойнына алу. Үлкен, жаһандық жобалар мен ақшадан қорқуды өңдеу. Сізден туыстарыңыз да, айналаңыздағы адамдар да нұсқау күтеді. Таланттары мен мүмкіндіктерін кәсіби жүзеге асырудан бас тарту қате болады. Алдыңызда тұрған жауапкершілікті түсінбеу. Пайда үшін билікке құштарлық.",
  "5": "Жоғары, ең жақсы білім алу. Немесе тұлғаның діни даму жолын таңдау. Ғылымда немесе көне құпия білімде, дінде, көне мәдениеттер мен салт-дәстүрлерде, басқа адамдардың дәстүрлерінде зерттеулермен айналысу. Миссия — адамдарды ақиқат жолға бағыттау, өмірдің түрлі салаларында ұстаз болу. Адамдарды түсінуді үйрену. Сондай-ақ әкемен, балалармен және өзіңіз жауапкершілік алған адамдармен, мысалы, бағыныштылармен, студенттермен қарым-қатынасты реттеу керек... Басқа ұстаздардың пікірін қабылдамау және жалпы білімнен бас тарту — қате.",
  "6": "Бүкіл әлемді және оның әр бөлшегін сүйіспеншілікпен сыйлау: барлық тіршілік иелерінің нәсілдері мен түрлеріне төзімділікпен қарау, өз отбасыңызды, жақын ортаңызды және бүкіл Ғаламды жақсы көру арқылы. Өз таңдауыңыз үшін жауапкершілік алуды үйрену. Махаббатқа жеңілтек, ұятсыз (циникалық) және бейқам қарау қате болады.",
  "7": "Өз табыстарыңыз, кәсіби қызметіңіз, мансабыңыз арқылы әлемді өзгерту және мойындалу. Адам мен оның еңбектері көрініп тұруы керек. Ең кең адамдар тобына пайдасы тиетін табыстарға жету. Тағдыр сізге қамқорлық жасағанша отырып күту қате болады.",
  "8": "Терең әділдік сезімі, басқа адамдардың ренжістеріне мұқият қарау, адамдардың құқықтарын сақтау және қорғау. Алдымен өзіңізге қатысты әділдік сезімін өзіңізде өңдеу. Отбасыңызға деген әділетсіз қарым-қатынасқа көз жұммай, оны қорғауға тұру. Кімге болсын әділетсіз қарым-қатынасқа немқұрайлы қарамау. Егер адам болып жатқан әділетсіздікке, тіпті ұсақ-түйекте де, немқұрайлы қалса, қате болады. Соттардан, сот талқылауларынан қорқу.",
  "9": "Құпия эзотерикалық білімді зерттеу. Аға буынмен өзара әрекеттесу және оларға көмек. Адам алған білімі мен даналығының арқасында қарт адамдардың өмірін «нұрландыруы», дәлірек айтқанда жеңілдетуі және өмірде болып жатқан барлық процестердің мәнін түсінуі керек. Рухани дамуды елемеу қате болады, сонымен бірге ол эзотерикамен айналысудан бас тартып, діни даму жолымен жүруі мүмкін.",
  "10": "Ақшаға және материалдық істерге тиісті көзқарас қалыптастыру. Әлемде тұрақты ештеңе жоқ екенін түсіну. Жоғары деңгейде аркан кармалық қарыздарды саналы түрде өңдеу және карманы тазарту туралы айтады. Өз әулетінің, отбасының, елінің гүлденуіне қамқорлық жасау. Қаржылық істерді елемеу қате болады, басқаның — ата-ананың, жұбайдың есебінен, несие есебінен өмір сүруге болмайды.",
  "11": "Өз денеңіздің үстінен жұмыс, өзіңізді физикалық әлемнен табу, алған әлеуетті дамыту. Әулеттің, отбасының, компанияның, елдің көшбасшысы болу. Мәселелерден қашу, сырттан болуы мүмкін қауіптерге көз жұму қате болады. Ұлы көсемдер, әскерилер.",
  "12": "Ішкі әлемді зерттеу, өзіңіздің Жоғарғы Меніңізді табу. Рухани өсу, рухани даму жолымен жүру, эмоцияларды және әлеммен эмоционалдық өзара әрекеттесуді зерттеу. Кез келген жағдайдан шығудың жаңа көзқарасын жеткізу. Өзіңіздің армандар әлеміңізге тұйықталу — қате. Оқшаулану.",
  "13": "Трансформация — адамның басты миссиясы: ішкі процестердің трансформациясы, сыртқы өзгерістер. Өзгерістерге үйреніп, оларды басқаруды үйрену. Қиын жағдайларда адамдарға қызмет етіп, көмектесу, шешім табу және қажет болса мұны пайдасыз жасау. Мысалы, біреудің үйі өртенді, ал сіз оны қайта салуға немесе қажетті қағаздарды рәсімдеуге көмектесе аласыз, немесе сізде үй мен саяжай бар және көмек ұсына аласыз, немесе күшіңіз жететін басқа бір нәрсе. Немқұрайлы немесе сырттан бақылаушы болып қалу қате болады.",
  "14": "«Алтын орта» — бұл өмірдегі сіздің кредоңыз. Сіз — үйлесім мен қамқорлықтың, тепе-теңдік пен теңгерімнің өзісіз. Төзімді мінез-құлық пен қарым-қатынасты көрсету. Қате — эмоционалдық тұрақсыздық, күмән, шектен шығушылық, шатастыру.",
  "15": "Өз энергияңызды бақылау және оны дұрыс бөлу. Миссия — қарапайым азғырулардан арылу. Эзотерика саласында, құпияны түсінуде тиісті көзқарас қалыптастыру. Адамдардың игілігі үшін пайдалану керек емшілік қабілеттер. Қате — энергияны, жыныстық қатынастарды теріс пайдалану, қылмыстық әрекеттер, азғыруларға берілу.",
  "16": "Кең мағынадағы құрылыс: тұлғаны, мінезді, қарым-қатынасты, әлеуметтік байланыстарды, саясатты, үйлерді, мүсіндерді салу. Жүзеге асудың заманауирақ әрі өзектірек жаңа жолдарын табу. Аяқталған бағдарламаларды жою. Қате — өмірде ештеңені өзгертпеуге деген қыңыр ықылас, ескі өмір құрылымдары мен психикалық бағдарламаларды пайдалану.",
  "17": "Мұндай адам біздің әлемге өзінің шығармашылық туындыларын әкелуі керек. Достық байланыстар орната білу, өзінің және басқалардың сезімдерін түсініп, ажырата білу, сұлулыққа, табиғатқа, тағамға, тарихқа сүйсіне білу... Өз таланттарын жете бағаламау және оларға сенбеу, шынайы қарым-қатынас пен достықтан бас тарту қате болады.",
  "18": "Отбасында, ұжымда ауа мен атмосфераны реттей білу. Тамақ дайындау, үйді безендіру шеберлігі. Түйсікті, қиялды, фантазияны дамыту үстінде жұмыс істеу. Әйелдік бастауды нығайтып, үйге көп уақыт арнау. Санаастымен (подсознание) байланыс орнату. Қате — басқалардың өтініштеріне жеңілтек қарау, түйсік пен санаасты кеңестерін елемеу, жақын адамдармен құрғақ қарым-қатынас, үйдегі ретсіздік.",
  "19": "Бойыңызда харизманы, асылдықты, мейірімді, адалдықты дамыту. Әрқашан дана әрі жауапты болу. Жалпы игілік үшін жұмыс істеу. Өз тұлғаңызға тұйықталу қате болады.",
  "20": "Мұндай адам жерге отбасылық қарым-қатынасты өңдеу, ата-анаға және жақындарға тиісті көзқарас қалыптастыру үшін жіберілген. Ол өз әулеті туралы бәрін біліп, өмірдегі өз орнын табуы керек. Өз құндылықтар жүйесін қайта қарап, кемелденген дүниетаным қалыптастыру. Әлемге сау әрі дұрыс құндылықтар жүйесін көрсету, отбасын қолдап, оған көмек көрсету. Қате — отбасындағы мәселелерді елемеу, шыққан тегіңізден, дүниетаныммен ұялу.",
  "21": "Мұндай адамның миссиясы — шетелдіктермен байланыс, техникалық инновацияларды енгізу, түрлі мәдениет пен дәстүрдегі адамдарды біріктіруге ұмтылу. Қате — надандық, өз нәсілін, ұлтын асқақтату, төзімділіктің болмауы.",
  "22": "Бастаманы өз қолына алу қабілеті, кәсіпкер, шебер (қолөнерші), фрилансер, стартапшы болу. Жаңалықтарды бірінші болып танып, оларды әлемге жаппай енгізу, өмірге жеңіл әрі ынталы көзқарас. Қате — өзін шектеу және өмірге тым байыпты қарау."
 },
 "cycles": {
  "1": "Кез келген адаммен тіл табыса білу. Ақпаратқа ғылыми тәсіл. Дамыған интеллект. Көпшілік алдында сөйлей білу. Тамаша мұғалім, дәріскер.",
  "2": "Емшілік. Басқа адамдардың психофизикалық және эмоционалдық күйін сезіну. Түйсік, жануарларды түсіну. Шөптерді ажырата білу.",
  "3": "Балаларды тәрбиелей білу. Ойларды материалдандыру («Құпия» (Секрет) фильмі). Жақсы кәсіпкерлер, бірақ оларға жұп (серіктес құрылтайшылар, достар) керек. Таланттар, шығармашылық.",
  "4": "Жоқтан бизнес құра білу. Бәрінде кәсіпқой, оған қажетті тәжірибе мен дағдылар беріледі. Тамаша басшылар, қатал, бірақ әділ.",
  "5": "Даналық, руханилық. Басқа адамдардың арнауын көре білу, олардың қажеттіліктерін оқу. Сөзбен емдеу. Не жақсы, не жаман екенін түсіну.",
  "6": "Отбасын, қарым-қатынаста үйлесім құра білу. Жақындарды алыстан сезіну. Қолөнер, қонақжайлылық, үйдегі барлық кәсіпті меңгеру. Қарым-қатынасқа ашықтық, күлімсіреу. Адамдар оларды әрқашан мейіріммен қабылдайды.",
  "7": "Толқынның қырын сезе білу, яғни керекті сәтте және керекті уақытта көру, тез шешім қабылдау. Көптеген нұсқаның ішінен ең сәттісін таңдау. Жылдам ойлау. Бейтаныс адаммен сәтті диалог құру дарыны.",
  "8": "Кез келген заңдарды, қағидаларды, негіздерді білу. Әділдік, өлшем сезімі. Эмоцияларды басқара білу. Жанжалда салқын, екі бағытта ойлайды. Әрқашан «Б» жоспары бар. Құжаттарды бәрінен жақсы қолдан жасайды.",
  "9": "Эзотерикалық таланттар, «айқын...» дегеннің барлық түрлері (айқын көру, айқын есту, айқын түсіну...). Абсолютті өзін-өзі жеткілікті, тәуелсіз, кез келген нәрсені жалғыз жасай алады. Жоғарғы күштердің көмегі.",
  "10": "Ауадан ақша жасай білу. Бизнесті қалай көбейту, дамыту керегін сезіну. Кез келген істегі болашақ.",
  "11": "Қарсыластың әлсіз жақтарын көреді. Тіпті шарасыз жағдайларда да жеңе білу. Басқа адамдардың эмоцияларын басқара білу. Жауларды және олардың жоспарларын алдын ала тани алады. Әсіресе сыни жағдайларда (шкафты жалғыз жылжыту) ғажайып күшке ие. Төзімділік пен ақылдың салқындығы.",
  "12": "Психологтар. Басқа адамдардың эмоцияларын сезеді. Лайықты сөздер таба білу. Қарым-қатынасқа ашықтық. Басқа адамдардың арнауын білу.",
  "13": "Көбірек көреді, көлемдірек түсінеді. Баламаларды көреді. Кез келген жағдайдан шығар жол табады. Ерекше (эксклюзивті) нәрсені көру. «А» жоспары мен «Б» жоспары бар. Гипноз дарыны. Басқа адамды қайта бағдарламалау қабілеті. Оған өз еркін таңу.",
  "14": "Кез келген динамикалық жағдайды тыныштандыра білу. Жасушалардың қалпына келуіне (регенерация) бейімділік. Емшілік дарыны. Тамаша селекционерлер. Өсімдіктердің жаңа сорттарын шығара алады. Жануарлар оларды қатты жақсы көреді (ветеринария).",
  "15": "Айқын көру және басқа экстрасенсорлық қабілеттер, соның ішінде магиялық қорғаныс. Қалағанының бәрі, тіпті басқа адамдарға зиян келтірсе де, орындалады. Ақылға сыймайтын харизма. Тамаша әзіл сезімі. Ұйымдастырушылық қабілеттер.",
  "16": "Ешқандай құралсыз кез келген нәрсені нөлден сала білу. Іске іргелі тәсіл. Тез шешімдер. Болашаққа жоспар құра білу. Алдын ала көру.",
  "17": "Шығармашылықтың барлық түрлері, сезімдердің романтикалығы. Түстердің, иістердің, дыбыстардың кеңірек ауқымы. Кез келген идеяны, арманды, міндетті іліп алып, жүзеге асыра білу. Даңқ пен табыс алу қабілеті.",
  "18": "Үйдегі қолөнердің барлық түрлері. Адамның стиль, сұлулық сезімі бар. Үйлеспейтінді үйлестіреді. Кез келген нәрсені өзгерте алады. Өтірікті сезеді. Өздері шебер өтірік айтады. Түс көру дарыны. Олардың қолында орасан зор жасампаз (созидательный) энергия бар. Сұлулық жарата алу қабілеті.",
  "19": "Мансап жасау қабілеті. Бәрінде сәтті, рухы мен еркі мықты. Сымбатты, келбетті. Әлеуметтік тұрғыда орташа деңгейден жоғары көрінеді.",
  "20": "Әулеттің барлық таланттары (ана мен әке жағынан).",
  "21": "Қажылық (зиярат). Адамдарды, басқа халықтарды түйсікпен түсіну. Бейнелі ойлау. Кез келген жағдайға бейімделе білу. Жаңашылдық.",
  "22": "Қарым-қатынасқа ашықтық. Жеңілдік, достық пейіл. Адам жағымды әрі сүйкімді. Бірнеше істі бір мезгілде атқара алады. Ең кемі — бәрінің екіден болуы. Көп қырлылық."
 },
 "eventsPlus": {
  "1": "Бауырлардың, құрдастардың және жасы кішілердің, шәкірттердің көмегі; жаңа жобалар (стартаптар) оңай жүзеге асады; тез нәтижелер; құжаттарды дұрыс рәсімдеу, жеңіл мәмілелер; көпшілік алдындағы кәсіптердегі табыс.",
  "2": "Мықты денсаулық; әйелдермен жақсы қарым-қатынас; ықпалды әйелдердің қамқорлығы; болашақ беретін мәмілелер; неке, бала тууы.",
  "3": "Неке, бала тууы; балалардың көмегі; адам анық елестеткеннің бәрі жүзеге асады; бірлескен жобаларды жүзеге асыру; өндіріске (материалдық немесе зияткерлік) байланысты шағын бизнестің тұрақтылығы.",
  "4": "Мансап, жақсы мансаптық өсу; адам тікелей қатысатын сәтті бизнес; ірі бизнес (50-ден көп адам); болашағы бар мәмілелер; әріптестер тарапынан көмек; адам өзі істесе, бәрі шығады; пайдакүнем (есеппен құрылған) некелер.",
  "5": "Ықпалды ер адамдар тарапынан көмек; адамға өмірлік тәлімгер беріледі; мансап сатысымен алдын ала (аванспен) жоғарылау; сапарлардағы табыс.",
  "6": "Неке, бала тууы; махаббатқа негізделген қарым-қатынас; шағын отбасылық бизнес немесе үйде жұмыс; отбасылық бизнесті немесе әулеттік кәсіпті дамыту; болашағы бар және ұзақ мерзімді келісімшарттар; жеке және дербес кәсіпкерліктегі табыс; шынайы серіктестікке негізделген болашағы бар мәмілелер.",
  "7": "Міндеттерді тез шешу; сәтті саяхаттар, сапарлар, көшулер; көп нұсқалылық (барлық нұсқа бірдей жақсы); жылдам мансаптық өсу; тез бастау, тез нәтижелер; «ауызша жарнама» (сарафанное радио).",
  "8": "Бизнес; мансап; сәтті мәмілелер, әсіресе сатып алу-сату; мемлекеттің көмегі; келісім бойынша неке.",
  "9": "Аға буынның (жасы, мәртебесі бойынша) көмегі; зейнеткерлердің көмегі; барлық бұрынғылардың көмегі; адам ешкімге сенбейтін істер жүзеге асады; ішкі әлеуеттер мен қабілеттердің ашылуы; денсаулық және эзотерика саласындағы әл-ауқат; құрылтайшыларсыз жеке бизнес (ірі де, ұсақ та, бастысы — құрылтайшы біреу болуы); адамда бәрі бақылауда екенінің кепілі.",
  "10": "Мансап пен бизнестегі табыс; ірі бизнес; үлкен қаржы ағындары; жоғары табыс, байлық; жылжымайтын мүлік сатып алу; болашаққа орасан зор перспектива; бәрі тез қозғалып, өте жоғары нәтижелер береді.",

  const t = {};

  'abcdefghijklmnopqrstuvwxyz'.split('').forEach((ch, i) => { t[ch] = (i % 9) + 1; });
  Object.assign(t, { 'ö': 1, 'ü': 2, 'ß': 3, 'ä': 9 }); // как в таблице файла

const r22 = (x) => { while (x > 22) x -= 22; return x; };

const digitSum = (n) => digits(n).reduce((s, d) => s + d, 0);

  russian: 'абвгдеёжзийклмнопрстуфхцчшщъыьэюя',

  english: 'abcdefghijklmnopqrstuvwxyz',
};
function letterTable(alphabet) {
  if (!alphabet || !ALPHABET_LETTERS[alphabet]) return LETTERS;
  const t = {};
  ALPHABET_LETTERS[alphabet].split('').forEach((ch, i) => { t[ch] = (i % 9) + 1; });
  if (alphabet === 'english') Object.assign(t, { 'ö': 1, 'ü': 2, 'ß': 3, 'ä': 9 });
  return t;
}

function nameArcana(name, alphabet) {
  const table = letterTable(alphabet);

  const sum = letters.reduce((s, ch) => s + (table[ch] || 0), 0);

}

  const Dt = day > 22 ? day - 22 : day;

  const ys = digitSum(year);
  const Gt = ys > 22 ? ys - 22 : ys;

  // Сумма всех цифр даты (AB20 = K15) и её «корень» для границ событий (D48)
  const allDigits = (day < 10 ? [0, day] : digits(day))
    .concat(month < 10 ? [0, month] : digits(month))
    .concat(digits(year));
  const chzp = allDigits.reduce((s, d) => s + d, 0); // AB20
  let root = chzp;
  while (root >= 10) root = digitSum(root);

  const SZ = r22(Dt + Mt + Gt);                         // C22 = V32 (СЗ)
  const TP = r22(Dt + Mt);                              // L29 = V26
  const O29 = r22(Mt + Gt);                             // O29
  const ZK = r22(TP + O29);                             // N30 = V31 (ЗК)
  const L31 = diff22(Dt, Mt);                           // L31 (ОПВ)
  const KU1 = diff22(SZ, L31);                          // N32 = V33
  const KU2 = r22(Dt + L31);                            // K29 = V34
  const KU3 = diff22(Dt, Gt);                           // N26 = V35
  const KU4 = r22(Gt + SZ);                             // R29 = V36

  // Точки препятствия человека (строка 43)
  const TP1 = sum22(Dt + Mt);
  const TP2 = sum22(Dt + Gt);
  const TP3 = sum22(TP1 + TP2);
  const TP4 = sum22(Mt + Gt);
  const TP5 = r22(TP1 + TP2 + TP3 + TP4);

  // Ошибки прошлого воплощения (строка 45)
  const OPV1 = diff22(Dt, Mt);
  const OPV2 = diff22(Dt, Gt);
  const OPV3 = diff22(OPV1, OPV2);
  const OPV4 = diff22(Mt, Gt);
  const OPV5 = r22(OPV1 + OPV2 + OPV3 + OPV4);

  const angel = r22(TP1 + TP4);                         // BJ18
  const talent = r22(angel + Mt);                       // BJ19
  const harmony = r22(Dt + SZ + Mt + angel);            // BJ20
  const karmaWork = r22(SZ + angel);                    // BJ21

  const ev1 = 36 - root;                                // D48
  return {
    month, day, SZ, OPV: [OPV1, OPV2, OPV3, OPV4, OPV5], name: nameArcana(firstName, alphabet),
    ZK, TP, TPchel: [TP1, TP2, TP3, TP4, TP5], KU: [KU1, KU2, KU3, KU4],
    angel, talent, harmony, karmaWork,
    cycles: [
      { from: 0, to: chzp, value: Dt },
      { from: chzp + 1, to: chzp + 9, value: Mt },
      { from: chzp + 10, to: null, value: Gt },
    ],
    events: [
      { from: 0, to: ev1, plus: TP1, minus: OPV1 },
      { from: ev1 + 1, to: ev1 + 9, plus: TP2, minus: OPV2 },
      { from: ev1 + 10, to: ev1 + 18, plus: TP3, minus: OPV3 },
      { from: ev1 + 19, to: null, plus: TP4, minus: OPV4 },
      { from: null, to: null, plus: TP5, minus: OPV5 },
    ],
  };
}

function karmicPeriod(from, to) {
  if (from === null) return '∞';
  return from + '-' + (to === null ? '∞' : to);
}

  const blocks = [];
  const one = (title, table, n) => blocks.push({ title: title + ' — ' + n, entries: [{ number: n, text: t(table, n) }] });

  one('Туған айы', 'month', r.month);
  one('Өзін-өзі жүзеге асыру (СЗ)', 'sz', r.SZ);

  blocks.push({

    entries: r.OPV.map((n, i) => ({ number: (i === 4 ? 'Басты кармалық түйін 5' : (i + 1) + '-кармалық түйін') + ': ' + n, text: t('opv', n) })),
  });
  one('Есім', 'name', r.name);
  one('Жайлылық аймағы', 'zk', r.ZK);
  one('Кедергі нүктесі', 'tp', r.TP);
  blocks.push({
    title: 'Адамның кедергі нүктелері (карма сандары)',
    entries: r.TPchel.map((n, i) => ({ number: (i === 4 ? 'Басты карма саны 5' : (i + 1) + '-карма саны') + ': ' + n, text: t('tpChel', n) })),
  });
  blocks.push({
    title: 'Кармалық сабақтар',
    entries: r.KU.map((n, i) => ({ number: (i + 1) + '-кармалық сабақ: ' + n, text: t(['ku1', 'ku2', 'ku3', 'sz'][i], n) })),
  });
  one('Періште-қорғаушы', 'gift', r.angel);
  one('Талант', 'gift', r.talent);
  one('Жан үйлесімі', 'harmony', r.harmony);
  one('Карманы өңдеу', 'mission', r.karmaWork);
  blocks.push({
    title: 'Өмір циклдері',
    entries: r.cycles.map((c) => ({ number: 'Цикл ' + karmicPeriod(c.from, c.to) + ' жас: ' + c.value, text: t('cycles', c.value) })),
  });
  blocks.push({
    title: 'Өмір кезеңдері бойынша оқиғалар',
    entries: r.events.flatMap((e) => [
      { number: '«+» оқиғалары ' + karmicPeriod(e.from, e.to) + ': ' + e.plus, text: t('eventsPlus', e.plus) },
      { number: '«−» оқиғалары ' + karmicPeriod(e.from, e.to) + ': ' + e.minus, text: t('eventsMinus', e.minus) },
    ]),
  });
  return { numbers: r, blocks };
}

function formatBirthDate(input) {
  let value = input.value.replace(/\D/g, "");
  if (value.length > 8) value = value.substring(0, 8);
  if (value.length > 4) value = value.substring(0, 2) + "." + value.substring(2, 4) + "." + value.substring(4);
  else if (value.length > 2) value = value.substring(0, 2) + "." + value.substring(2);
  input.value = value;
}

function isValidBirthDate(value) {
  const match = String(value || "").match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (!match) return false;
  const day = Number(match[1]), month = Number(match[2]), year = Number(match[3]);
  if (year < 1900 || year > 2100) return false;
  const date = new Date(year, month - 1, day);
  return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day;
}

async function saveCalculationHistory(fields) {
  if (window._skipHistorySave) return;
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;
    await supabaseClient.from("calculation_history").insert({
      user_id: session.user.id,
      direction: fields.direction,
      title: fields.title,
      person_name: fields.personName || null,
      birth_date: fields.birthDate || null,
      birth_date2: fields.birthDate2 || null,
      last_name: fields.lastName || null,
      first_name: fields.firstName || null,
      patronymic: fields.patronymic || null,
      alphabet: fields.alphabet || null,
    });
  } catch (error) {
    console.error("Есептеуді тарихқа сақтау мүмкін болмады:", error);
  }
}

function calculate(type) {
  const name = document.getElementById("name")?.value.trim();
  const birthDate = document.getElementById("birthDate")?.value.trim();
  const dateError = document.getElementById("dateError");
  const result = document.getElementById("result");
  if (dateError) dateError.textContent = "";
  if (result) result.innerHTML = "";

  if (!name) { if (dateError) dateError.textContent = "Атыңызды енгізіңіз."; return; }
  if (!isValidBirthDate(birthDate)) {
    if (dateError) dateError.textContent = "Туған күнді КК.АА.ЖЖЖЖ форматында дұрыс енгізіңіз.";
    return;
  }

  let interestYear = null, interestMonth = null;
  if (type === "vedic") {
    const yearInput = document.getElementById("vedicYear");
    const yearError = document.getElementById("vedicYearError");
    const monthInput = document.getElementById("vedicMonth");
    if (yearError) yearError.textContent = "";
    const yearRaw = yearInput ? yearInput.value.trim() : "";
    if (!/^\d{4}$/.test(yearRaw) || Number(yearRaw) < 1900 || Number(yearRaw) > 2100) {
      if (yearError) yearError.textContent = "Дұрыс жыл енгізіңіз — 4 сан, мысалы 2026.";
      return;
    }
    interestYear = Number(yearRaw);
    interestMonth = monthInput ? Number(monthInput.value) : null;
  }

  const readYear = function (id) {
    const input = document.getElementById(id), err = document.getElementById(id + "Error");
    if (err) err.textContent = "";
    const raw = input ? input.value.trim() : "";
    if (!/^\d{4}$/.test(raw) || Number(raw) < 1900 || Number(raw) > 2100) {
      if (err) err.textContent = "Дұрыс жыл енгізіңіз — 4 сан, мысалы " + new Date().getFullYear() + ".";
      return null;
    }
    return Number(raw);
  };
  let moonSunYear = null, prognostikaYear = null;
  if (type === "moonsun") { moonSunYear = readYear("moonSunYear"); if (moonSunYear === null) return; }
  if (type === "prognostika") { prognostikaYear = readYear("prognostikaYear"); if (prognostikaYear === null) return; }
  let bioStartDate = null;
  if (type === "biorhythms") {
    const startInput = document.getElementById("bioStartDate");
    const startError = document.getElementById("bioStartDateError");
    if (startError) startError.textContent = "";
    const startRaw = startInput ? startInput.value.trim() : "";
    if (!isValidBirthDate(startRaw)) {
      if (startError) startError.textContent = "Есептеу басталатын күнді КК.АА.ЖЖЖЖ форматында енгізіңіз.";
      return;
    }
    const [sd, sm, sy] = startRaw.split(".").map(Number);
    const [bd, bm, by] = birthDate.split(".").map(Number);
    if (Date.UTC(sy, sm - 1, sd) < Date.UTC(by, bm - 1, bd)) {
      if (startError) startError.textContent = "Есептеу басталатын күн туған күннен ерте бола алмайды.";
      return;
    }
    bioStartDate = startRaw;
  }

  if (!result) return;

  // Форма у всех калькуляторов одной ширины; для широких результатов расширяем блок после расчёта.
  const calcBox = document.getElementById("calcBox");
  if (calcBox) calcBox.style.maxWidth = type === "moonsun" ? "1100px" : type === "adult" ? "900px" : "650px";

  if (type === "moonsun" && window.MoonSunTable) {
    renderMoonSunResult(name, birthDate, moonSunYear, result);
    saveCalculationHistory({ direction: "moonsun", title: "Ай және Күн әдісі бойынша болжау - " + name + " - " + birthDate, personName: name, birthDate });
    return;
  }
  if (type === "prognostika" && window.PrognostikaEngine) {
    renderPrognostikaResult(name, birthDate, prognostikaYear, result);
    saveCalculationHistory({ direction: "prognostika", title: "Прогностика - " + name + " - " + birthDate, personName: name, birthDate });
    return;
  }
  if (type === "karmic" && window.KarmicEngine) {
    if (renderKarmicResult(name, birthDate, result)) {
      saveCalculationHistory({ direction: "karmic", title: "Кармалық нумерология - " + name + " - " + birthDate, personName: name, birthDate });
    }
    return;
  }

  if (type === "biorhythms" && window.BiorhythmEngine) {
    if (renderBiorhythmResult(name, birthDate, bioStartDate, result)) {
      saveCalculationHistory({ direction: "biorhythms", title: "Биоырғақтар - " + name + " - " + birthDate, personName: name, birthDate });
    }
    return;
  }

  if (type === "adult" && window.AdultMatrixEngine) {
    renderAdultMatrixResult(name, birthDate, result);
    saveCalculationHistory({ direction: "adult", title: "Ересек матрицасы - " + name + " - " + birthDate, personName: name, birthDate });
    return;
  }
  if (type === "child" && window.ChildMatrixEngine) {
    renderChildMatrixResult(name, birthDate, result);
    saveCalculationHistory({ direction: "child", title: "Бала матрицасы - " + name + " - " + birthDate, personName: name, birthDate });
    return;
  }
  if (type === "vedic" && window.VedicEngine) {
    renderVedicResult(name, birthDate, result);
    saveCalculationHistory({ direction: "vedic", title: "Ведалық нумерология - " + name + " - " + birthDate, personName: name, birthDate });
    return;
  }

  result.innerHTML = `
    <div style="padding:20px;border:1px solid rgba(225,180,52,.5);border-radius:14px;background:rgba(0,0,0,.12);">
      <h3 style="margin-top:0;color:#f6d66c;font-family:PT Serif,Georgia,serif;">${DIRECTION_NAMES[type] || "Есептеу"}</h3>

      <p style="margin-bottom:0;color:#d9d0bd;">Бұл бөлім әлі нақты есептеуге қосылмаған.</p>
    </div>`;
}

function reduceTo22(n) {
  while (n > 22) {
    n = String(n).split("").reduce((sum, d) => sum + Number(d), 0);
  }
  return n;
}

function colLetterToIndex(letters) {
  let n = 0;
  for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n;
}

function reduceTo22Diag(n) {
  while (n > 22) {
    n = String(n).split("").reduce((sum, d) => sum + Number(d), 0);
  }
  return n;
}

// Кольцо прогноза: те же значения, что в разделе «Прогноз» (buildForecastTable), разложенные по возрастам.
// Все подписи горизонтальные: числа — снаружи восьмиугольника, возраст — внутри, на одинаковом расстоянии от линии.
function buildForecastRingSvg(engine, positions, mid) {
  const anchors = getForecastAnchors(engine);
  const table = buildForecastTable(anchors, 80);
  const order = ["a", "f", "b", "g", "c", "y", "d", "k"]; // 0, 10, 20 … 70 лет
  const numColor = "#e9dfc6", numStrong = "#f6d66c", ageColor = "#9fb8b2", lineColor = "rgba(233,223,198,.75)";
  const font = "Arial,Helvetica,sans-serif";
  const fmt = (s) => String(s).replace(/\./g, ",");
  const anchorFor = (nx) => nx > 0.35 ? "start" : nx < -0.35 ? "end" : "middle";
  let lines = "", labels = "";
  // Восьмиугольник прогноза — снаружи матрицы: большие кружки остаются внутри и не пересекаются линиями кольца
  const R = Math.hypot(positions.a.x - mid, positions.a.y - mid);
  const k = (R + 34) / R;
  const V = order.map(key => ({ x: mid + (positions[key].x - mid) * k, y: mid + (positions[key].y - mid) * k }));
  for (let d = 0; d < 8; d++) {
    const p1 = V[d], p2 = V[(d + 1) % 8];
    const ex = p2.x - p1.x, ey = p2.y - p1.y, len = Math.hypot(ex, ey);
    // внешняя нормаль к ребру (от центра)
    let nx = ey / len, ny = -ex / len;
    const cx = (p1.x + p2.x) / 2 - mid, cy = (p1.y + p2.y) / 2 - mid;
    if (nx * cx + ny * cy < 0) { nx = -nx; ny = -ny; }
    const r0 = 0.07;
    lines += `<line class="fr-line" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${lineColor}" stroke-width="1"/>`;
    for (let i = 1; i < 8; i++) {
      const row = table[d * 8 + i];
      const t = r0 + (1 - 2 * r0) * (i / 8);
      const x = p1.x + ex * t, y = p1.y + ey * t;
      const isFive = i === 4;
      lines += isFive
        ? `<circle class="fr-five" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#1c3a37" stroke="${lineColor}" stroke-width="1.1"/>`
        : `<circle class="fr-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.6" fill="${lineColor}"/>`;
      const ox = x + nx * 7, oy = y + ny * 7 + (ny > 0.35 ? 6 : ny < -0.35 ? 0 : 3);
      labels += `<text class="${isFive ? "fr-num5" : "fr-num"}" x="${ox.toFixed(1)}" y="${oy.toFixed(1)}" text-anchor="${anchorFor(nx)}" font-family="${font}" font-size="${isFive ? 10.5 : 9.5}" font-weight="${isFive ? 700 : 400}" fill="${isFive ? numStrong : numColor}">${row.energy1}</text>`;
      const ageText = isFive ? `${d * 10 + 5} жас` : fmt(row.label.replace(/ (лет|жас)$/, ""));
      const ix = x - nx * 6, iy = y - ny * 6 + (-ny > 0.35 ? 5 : -ny < -0.35 ? 0 : 2);
      labels += `<text class="${isFive ? "fr-age5" : "fr-age"}" x="${ix.toFixed(1)}" y="${iy.toFixed(1)}" text-anchor="${anchorFor(-nx)}" font-family="${font}" font-size="${isFive ? 6.4 : 5.4}" font-weight="${isFive ? 700 : 400}" fill="${isFive ? numColor : ageColor}">${ageText}</text>`;
    }
    // подпись десятилетия у вершины, снаружи
    const vx = p1.x - mid, vy = p1.y - mid, vl = Math.hypot(vx, vy);
    lines += `<circle class="fr-dot" cx="${p1.x.toFixed(1)}" cy="${p1.y.toFixed(1)}" r="1.8" fill="${lineColor}"/>`;
    labels += `<text class="fr-dec" x="${(p1.x + vx / vl * 14).toFixed(1)}" y="${(p1.y + vy / vl * 14 + 3).toFixed(1)}" text-anchor="middle" font-family="${font}" font-size="8" font-weight="700" fill="${numColor}">${d * 10} жас</text>`;
  }
  return { lines, labels };
}

function buildDiagramSvgMarkup(engine, sheetName, rowOffset, svgSize, omitAncestral, hideLineageLabels, withForecast) {
  // omitAncestral: false/undefined = все точки; true = совсем без f/g/k/y и их подточек;
  // "corners" = f/g/k/y (углы) есть, но БЕЗ подточек (s1/s2/p1/p2/p3/p4/s3/s4) и без e1/e2.
  const omitCorners = omitAncestral === true;
  const omitSubs = omitAncestral === true || omitAncestral === "corners";
  function shift(ref) {
    const m = ref.match(/^([A-Z]+)(\d+)$/);
    return m[1] + (Number(m[2]) + rowOffset);
  }

  const baseCellRefs = omitCorners
    ? { a: "H24", a1: "O24", a2: "L24", b: "AA6", c: "AS24", d: "AA43", e: "AA23" }
    : {
        a: "H24", a1: "O24", a2: "L24",
        b: "AA6",
        c: "AS24",
        d: "AA43",
        e: "AA23",
        f: "N12", f2: "P14", f3: "R16",
        g: "AM12", g2: "AK14", g3: "AI16",
        k: "N37", k2: "P35", k3: "R33",
        y: "AM37", y2: "AK35", y3: "AI33",
      };
  const cellRefs = {};
  for (const key in baseCellRefs) cellRefs[key] = shift(baseCellRefs[key]);

  const values = {};
  try {
    for (const key in cellRefs) values[key] = engine.cell(sheetName, cellRefs[key]);
  } catch (err) {
    return null;
  }

  values.a3 = reduceTo22Diag(values.a1 + values.e);
  values.b1 = reduceTo22Diag(values.b + values.e);
  values.b2 = reduceTo22Diag(values.b + values.b1);
  values.b3 = reduceTo22Diag(values.b1 + values.e);
  values.c1 = reduceTo22Diag(values.c + values.e);
  values.c2 = reduceTo22Diag(values.c + values.c1);
  values.d1 = reduceTo22Diag(values.d + values.e);
  values.d2 = reduceTo22Diag(values.d + values.d1);
  // Линия Благополучия: x — центральная энергия между c1 и d1, x2 — «под долларом», x1 — «под сердцем».
  values.x = reduceTo22Diag(values.d1 + values.c1);
  values.x2 = reduceTo22Diag(values.x + values.c1);
  values.x1 = reduceTo22Diag(values.d1 + values.x);
  // e1 = f+g+y+k, e2 = e+e1 (родовые энергии сексуальности, стр. «Сексуальность» методички)
  if (!omitCorners && !omitSubs) {
    values.e1 = reduceTo22Diag(values.f + values.g + values.y + values.k);
    values.e2 = reduceTo22Diag(values.e + values.e1);
  }

  // Чистая геометрия: центр строго по точке e, остальные точки — по углу и расстоянию от центра.
  // Расположение вдоль линии — равными долями, независимо от исходных координат в Excel (те нужны только для значений).
  // mid = истинный центр viewBox (410/2=205, 240/2=120) — раньше был сдвинут на +20/+10,
  // из-за чего точки c и d (справа и снизу) вылезали за край и обрезались.
  const bigRing = withForecast && svgSize !== "small" && omitAncestral !== true;
  const mid = svgSize === "small" ? 120 : bigRing ? 250 : 205;
  // Все 8 углов (a,b,c,d,f,g,k,y) — на одной окружности, равное расстояние от центра.
  const R1 = svgSize === "small" ? 100 : bigRing ? 222 : 175;
  const R2 = R1;

  function polar(angleDeg, radius) {
    const rad = (angleDeg * Math.PI) / 180;
    return { x: mid + radius * Math.cos(rad), y: mid + radius * Math.sin(rad) };
  }
  function along(p1, p2, t) {
    return { x: p1.x + (p2.x - p1.x) * t, y: p1.y + (p2.y - p1.y) * t };
  }

  const positions = { e: { x: mid, y: mid } };
  positions.a = polar(180, R1);
  positions.b = polar(270, R1);
  positions.c = polar(0, R1);
  positions.d = polar(90, R1);

  // Подточки: шаг увеличен, чтобы кружки не перекрывали друг друга и сам угловой кружок
  // (радиус углового кружка 16, подточек — 9, минимальный зазор между центрами ~25/18px).
  positions.a2 = along(positions.a, positions.e, 0.15);
  positions.a1 = along(positions.a, positions.e, 0.26);
  positions.a3 = along(positions.a1, positions.e, 0.5);
  positions.b2 = along(positions.b, positions.e, 0.15);
  positions.b1 = along(positions.b, positions.e, 0.26);
  positions.b3 = along(positions.b1, positions.e, 0.5);
  positions.c2 = along(positions.c, positions.e, 0.15);
  positions.c1 = along(positions.c, positions.e, 0.26);
  positions.d2 = along(positions.d, positions.e, 0.15);
  positions.d1 = along(positions.d, positions.e, 0.26);

  // Линия Благополучия: c1 → x2 → x → x1 → d1, одной линией.
  positions.x2 = along(positions.c1, positions.d1, 0.30);
  positions.x = along(positions.c1, positions.d1, 0.50);
  positions.x1 = along(positions.c1, positions.d1, 0.70);

  if (!omitCorners) {
    positions.f = polar(225, R2);
    positions.g = polar(315, R2);
    positions.k = polar(135, R2);
    positions.y = polar(45, R2);
  }
  if (!omitCorners && !omitSubs) {
    positions.f2 = along(positions.f, positions.e, 0.15);
    positions.f3 = along(positions.f, positions.e, 0.30);
    positions.g2 = along(positions.g, positions.e, 0.15);
    positions.g3 = along(positions.g, positions.e, 0.30);
    positions.k2 = along(positions.k, positions.e, 0.15);
    positions.k3 = along(positions.k, positions.e, 0.30);
    positions.y2 = along(positions.y, positions.e, 0.15);
    positions.y3 = along(positions.y, positions.e, 0.30);
    positions.e1 = along(positions.e, positions.c, 0.16);
    positions.e2 = along(positions.e, positions.c, 0.32);
  }

  const pointColor = {
    a: CHAKRA_COLOR.sahasrara, a1: CHAKRA_COLOR.vishudha, a2: CHAKRA_COLOR.adjna, a3: CHAKRA_COLOR.anahata,
    b: CHAKRA_COLOR.sahasrara, b1: CHAKRA_COLOR.vishudha, b2: CHAKRA_COLOR.adjna, b3: CHAKRA_COLOR.anahata,
    c: CHAKRA_COLOR.muladhara, c1: CHAKRA_COLOR.svadhistana, c2: "white",
    d: CHAKRA_COLOR.muladhara, d1: CHAKRA_COLOR.svadhistana, d2: "white",
    x: "white", x1: "white", x2: "white",
    m1: "white", m2: "white", h1: "white", h2: "white",
    e: CHAKRA_COLOR.manipura, e1: "white", e2: "white",
    f: "white", f2: "white", f3: "white",
    g: "white", g2: "white", g3: "white",
    k: "white", k2: "white", k3: "white",
    y: "white", y2: "white", y3: "white",
  };

  const mainKeys = ["a", "b", "c", "d"];
  const outerKeys = omitCorners ? [] : ["f", "g", "k", "y"];
  const wellbeingKeys = ["x", "x1", "x2"];
  const subKeys = (omitSubs ? ["a1", "a2", "b1", "b2", "c1", "c2", "d1", "d2"] : ["a1", "a2", "a3", "b1", "b2", "b3", "c1", "c2", "d1", "d2"])
    .concat(omitSubs ? [] : ["f2", "f3", "g2", "g3", "k2", "k3", "y2", "y3", "e1", "e2"])
    .concat(wellbeingKeys);

  const outerSquareLines = omitCorners ? "" : `
    <line x1="${positions.f.x}" y1="${positions.f.y}" x2="${positions.g.x}" y2="${positions.g.y}" stroke="rgba(225,180,52,.3)" stroke-width="1"/>
    <line x1="${positions.g.x}" y1="${positions.g.y}" x2="${positions.y.x}" y2="${positions.y.y}" stroke="rgba(225,180,52,.3)" stroke-width="1"/>
    <line x1="${positions.y.x}" y1="${positions.y.y}" x2="${positions.k.x}" y2="${positions.k.y}" stroke="rgba(225,180,52,.3)" stroke-width="1"/>
    <line x1="${positions.k.x}" y1="${positions.k.y}" x2="${positions.f.x}" y2="${positions.f.y}" stroke="rgba(225,180,52,.3)" stroke-width="1"/>`;
  const innerDiamondLines = `
    <line x1="${positions.b.x}" y1="${positions.b.y}" x2="${positions.c.x}" y2="${positions.c.y}" stroke="rgba(225,180,52,.45)" stroke-width="1"/>
    <line x1="${positions.c.x}" y1="${positions.c.y}" x2="${positions.d.x}" y2="${positions.d.y}" stroke="rgba(225,180,52,.45)" stroke-width="1"/>
    <line x1="${positions.d.x}" y1="${positions.d.y}" x2="${positions.a.x}" y2="${positions.a.y}" stroke="rgba(225,180,52,.45)" stroke-width="1"/>
    <line x1="${positions.a.x}" y1="${positions.a.y}" x2="${positions.b.x}" y2="${positions.b.y}" stroke="rgba(225,180,52,.45)" stroke-width="1"/>`;
  // Оси через центр: a-e-c (горизонталь) и b-e-d (вертикаль) — вдоль них лежат подточки.
  const axisLines = `
    <line x1="${positions.a.x}" y1="${positions.a.y}" x2="${positions.c.x}" y2="${positions.c.y}" stroke="rgba(100,140,138,.35)" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="${positions.b.x}" y1="${positions.b.y}" x2="${positions.d.x}" y2="${positions.d.y}" stroke="rgba(100,140,138,.35)" stroke-width="1" stroke-dasharray="2,3"/>`;
  const lineageLines = omitCorners ? "" : `
    <line x1="${positions.f.x}" y1="${positions.f.y}" x2="${positions.y.x}" y2="${positions.y.y}" stroke="rgba(120,80,190,.5)" stroke-width="1.2" stroke-dasharray="3,2"/>
    <line x1="${positions.g.x}" y1="${positions.g.y}" x2="${positions.k.x}" y2="${positions.k.y}" stroke="rgba(200,60,60,.5)" stroke-width="1.2" stroke-dasharray="3,2"/>`;
  const lineageLabels = (omitCorners || hideLineageLabels) ? "" : (function () {
    const mp = along(positions.f, positions.e, 0.65);
    const fp = along(positions.g, positions.e, 0.65);
    // Небольшой перпендикулярный сдвиг (не вдоль линии!), чтобы подпись легла НАД пунктиром
    // с зазором, а не поверх него.
    const mDx = positions.e.x - positions.f.x, mDy = positions.e.y - positions.f.y;
    const mLen = Math.hypot(mDx, mDy) || 1;
    const mOff = { x: (mDy / mLen) * 4, y: -(mDx / mLen) * 4 };
    const fDx = positions.e.x - positions.g.x, fDy = positions.e.y - positions.g.y;
    const fLen = Math.hypot(fDx, fDy) || 1;
    const fOff = { x: -(fDy / fLen) * 4, y: (fDx / fLen) * 4 };
    mp.x += mOff.x; mp.y += mOff.y;
    fp.x += fOff.x; fp.y += fOff.y;
    return `
      <text x="${mp.x}" y="${mp.y}" text-anchor="middle" font-size="7" fill="rgba(120,80,190,.9)" transform="rotate(45 ${mp.x} ${mp.y})">ер тегінің желісі</text>
      <text x="${fp.x}" y="${fp.y}" text-anchor="middle" font-size="7" fill="rgba(200,60,60,.9)" transform="rotate(-45 ${fp.x} ${fp.y})">әйел тегінің желісі</text>`;
  })();
  const wellbeingLine = `
    <line x1="${positions.c1.x}" y1="${positions.c1.y}" x2="${positions.x2.x}" y2="${positions.x2.y}" stroke="rgba(140,200,90,.5)" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="${positions.x2.x}" y1="${positions.x2.y}" x2="${positions.x.x}" y2="${positions.x.y}" stroke="rgba(140,200,90,.5)" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="${positions.x.x}" y1="${positions.x.y}" x2="${positions.x1.x}" y2="${positions.x1.y}" stroke="rgba(210,70,70,.5)" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="${positions.x1.x}" y1="${positions.x1.y}" x2="${positions.d1.x}" y2="${positions.d1.y}" stroke="rgba(210,70,70,.5)" stroke-width="1" stroke-dasharray="2,2"/>`;
  const dollarSign = `<text x="${positions.x2.x}" y="${positions.x2.y - 14}" text-anchor="middle" font-size="13" fill="#8fd98f" font-weight="700">$</text>`;
  const heartSign = `<text x="${positions.x1.x}" y="${positions.x1.y - 12}" text-anchor="middle" font-size="13" fill="#e07a7a">♥</text>`;

  function circle(p, value, r, fs, fill) {
    const isWhite = fill === "white";
    const fillColor = isWhite ? "#f4f0fa" : fill;
    const textColor = isWhite ? "#2a2040" : "#fff";
    const strokeColor = isWhite ? "#6b5f8a" : "#122522";
    return `
      <circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${fillColor}" fill-opacity="${isWhite ? 1 : 0.9}" stroke="${strokeColor}" stroke-width="1"/>
      <text x="${p.x}" y="${p.y + fs * 0.35}" text-anchor="middle" font-family="PT Serif,Georgia,serif" font-size="${fs}" fill="${textColor}" font-weight="600">${escapeHtml(String(value))}</text>`;
  }

  const rScale = svgSize === "small" ? 0.62 : 1;
  const mainSvg = mainKeys.map(k => circle(positions[k], values[k], 16 * rScale, 13 * rScale, pointColor[k])).join("");
  const outerSvg = outerKeys.map(k => circle(positions[k], values[k], 13 * rScale, 11 * rScale, pointColor[k])).join("");
  const subSvg = subKeys.map(k => circle(positions[k], values[k], 9 * rScale, 8.5 * rScale, pointColor[k])).join("");
  const centerSvg = circle(positions.e, values.e, 18 * rScale, 14 * rScale, pointColor.e);

  const viewSize = svgSize === "small" ? 240 : bigRing ? 500 : 410;
  const inner = `${outerSquareLines}${innerDiamondLines}${axisLines}${lineageLines}${lineageLabels}${wellbeingLine}${dollarSign}${heartSign}${centerSvg}${subSvg}${outerSvg}${mainSvg}`;
  let svg;
  if (withForecast && svgSize !== "small" && !omitCorners) {
    // Кольцо прогноза по возрастам вокруг матрицы: восьмиугольник через 8 внешних точек (0, 10, 20 … 70 лет)
    const pad = 64, full = viewSize + pad * 2;
    const ring = buildForecastRingSvg(engine, positions, mid);
    svg = `<div class="matrix-ring-scroll" style="overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;">
      <div class="matrix-ring-inner" style="max-width:860px;margin:0 auto;">
      <svg viewBox="${-pad} ${-pad} ${full} ${full}" width="${full}" height="${full}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;aspect-ratio:1 / 1;display:block;">
      ${ring.lines}${inner}${ring.labels}
    </svg></div></div>
    <button type="button" class="matrix-ring-hint" onclick="toggleMatrixRingZoom(this)" style="display:none;margin:10px auto 0;padding:9px 16px;border:1px solid #d7aa31;border-radius:10px;background:rgba(0,0,0,.2);color:#f6d66c;font-size:14px;cursor:pointer;">🔍 Диаграмманы үлкейту</button>`;
  } else {
    svg = `<svg viewBox="0 0 ${viewSize} ${viewSize}" style="width:100%;max-width:${svgSize === "small" ? 250 : 420}px;">
      ${inner}
    </svg>`;
  }

  return { svg, values };
}

function renderMatrixDiamondDiagram(engine, container, includeHealthMap, purposeCount) {
  const result = buildDiagramSvgMarkup(engine, "Диаграмма", 0, "large", false, false, engine === window.AdultMatrixEngine);
  if (!result) return;
  const { svg, values } = result;
  window._lastDiagramValues = values;

  const box = document.createElement("div");
  box.style.cssText = "max-width:" + (engine === window.AdultMatrixEngine ? 860 : 380) + "px;margin:0 auto 20px;text-align:center;";
  box.className = "dl-matrix-box";
  box.innerHTML = `<div style="color:#c9bfa8;font-size:14px;margin-bottom:10px;">Матрица диаграммасы</div>${svg}`;
  container.insertBefore(box, container.firstChild);
  centerMatrixRingScroll(box);

  let afterNode = box;
  if (includeHealthMap !== false) {
    renderHealthMapDiagram(values, container, box);
    afterNode = box.nextSibling;
  }
  renderPurposeDiagram(values, container, afterNode, purposeCount);
}

// На телефоне диаграмма сначала видна целиком; кнопка «Увеличить» делает её крупной (листается пальцем)
function centerMatrixRingScroll(root) {
  (root || document).querySelectorAll(".matrix-ring-scroll").forEach(function (el) {
    const btn = el.parentNode.querySelector(".matrix-ring-hint");
    if (btn && el.clientWidth < 600) btn.style.display = "block";
  });
}

function toggleMatrixRingZoom(btn) {
  const scroll = btn.parentNode.querySelector(".matrix-ring-scroll");
  const inner = scroll && scroll.querySelector(".matrix-ring-inner");
  if (!inner) return;
  const zoomed = inner.style.minWidth === "780px";
  inner.style.minWidth = zoomed ? "" : "780px";
  btn.textContent = zoomed ? "🔍 Диаграмманы үлкейту" : "↩ Толық көрсету (саусақпен жылжытыңыз)";
  if (!zoomed) {
    scroll.scrollLeft = (scroll.scrollWidth - scroll.clientWidth) / 2;
    scroll.scrollIntoView({ block: "nearest" });
  }
}

function renderHealthMapDiagram(v, container, afterNode) {
  const l = reduceTo22Diag(v.a + v.b);
  const l1 = reduceTo22Diag(v.a2 + v.b2);
  const l2 = reduceTo22Diag(v.a1 + v.b1);
  const l3 = reduceTo22Diag(v.a3 + v.b3);
  const l4 = reduceTo22Diag(v.e + v.e);
  const l5 = reduceTo22Diag(v.d1 + v.c1);
  const l6 = reduceTo22Diag(v.d + v.c);

  // Физика — горизонтальная линия (a: слева-направо), Энергия — вертикальная линия (b: сверху-вниз).
  const chakras = [
    { name: "Сахасрара", color: CHAKRA_COLOR.sahasrara, phys: v.a, energy: v.b, emo: l },
    { name: "Аджна", color: CHAKRA_COLOR.adjna, phys: v.a2, energy: v.b2, emo: l1 },
    { name: "Вишудха", color: CHAKRA_COLOR.vishudha, phys: v.a1, energy: v.b1, emo: l2 },
    { name: "Анахата", color: CHAKRA_COLOR.anahata, phys: v.a3, energy: v.b3, emo: l3 },
    { name: "Манипура", color: CHAKRA_COLOR.manipura, phys: v.e, energy: v.e, emo: l4 },
    { name: "Свадхистана", color: CHAKRA_COLOR.svadhistana, phys: v.c1, energy: v.d1, emo: l5 },
    { name: "Муладхара", color: CHAKRA_COLOR.muladhara, phys: v.c, energy: v.d, emo: l6 },
  ];

  const itogPhys = reduceTo22Diag(chakras.reduce((s, ch) => s + ch.phys, 0));
  const itogEnergy = reduceTo22Diag(chakras.reduce((s, ch) => s + ch.energy, 0));
  const itogEmo = reduceTo22Diag(chakras.reduce((s, ch) => s + ch.emo, 0));

  const rowsHtml = chakras.map((ch, i) => `
    <tr style="background:${i % 2 === 0 ? "rgba(255,255,255,.03)" : "transparent"};">
      <td style="padding:7px 8px;border:1px solid rgba(225,180,52,.25);white-space:nowrap;text-align:left;">
        <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${ch.color};margin-right:7px;vertical-align:middle;"></span>
        <span style="vertical-align:middle;">${escapeHtml(ch.name)}</span>
      </td>
      <td style="text-align:center;color:#f6d66c;border:1px solid rgba(225,180,52,.25);">${ch.phys}</td>
      <td style="text-align:center;color:#f6d66c;border:1px solid rgba(225,180,52,.25);">${ch.energy}</td>
      <td style="text-align:center;color:#f6d66c;border:1px solid rgba(225,180,52,.25);">${ch.emo}</td>
    </tr>`).join("") + `
    <tr style="background:rgba(225,180,52,.12);font-weight:600;">
      <td style="padding:7px 8px;border:1px solid rgba(225,180,52,.25);white-space:nowrap;text-align:left;"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#9aa0a6;margin-right:7px;vertical-align:middle;"></span><span style="vertical-align:middle;">Қорытынды</span></td>
      <td style="text-align:center;color:#f6d66c;border:1px solid rgba(225,180,52,.25);">${itogPhys}</td>
      <td style="text-align:center;color:#f6d66c;border:1px solid rgba(225,180,52,.25);">${itogEnergy}</td>
      <td style="text-align:center;color:#f6d66c;border:1px solid rgba(225,180,52,.25);">${itogEmo}</td>
    </tr>`;

  const box = document.createElement("div");

function renderPurposeDiagram(diagramValues, container, afterNode, count) {
  count = count || 4;
  const v = diagramValues;
  const nebo = reduceTo22Diag(v.b + v.d);
  const zemlya = reduceTo22Diag(v.a + v.c);
  const pred1 = reduceTo22Diag(nebo + zemlya);
  const muzh = v.f != null ? reduceTo22Diag(v.f + v.y) : null;
  const zhen = v.g != null ? reduceTo22Diag(v.g + v.k) : null;
  const pred2 = (muzh != null && zhen != null) ? reduceTo22Diag(muzh + zhen) : null;
  const pred3 = pred2 != null ? reduceTo22Diag(pred1 + pred2) : null;
  const pred4 = pred3 != null ? reduceTo22Diag(pred2 + pred3) : null;

  function item(title, formula, result) {
    return `
      <div class="dl-purpose-item" style="width:180px;text-align:center;">
        <div class="dl-pt" style="color:#f6d66c;font-family:PT Serif,Georgia,serif;font-size:13px;margin-bottom:6px;">${title}</div>
        <div class="dl-pr" style="color:#fff;font-family:PT Serif,Georgia,serif;font-size:20px;">${result}</div>
        <div class="dl-pf" style="color:#a9bdb8;font-size:11px;">(${formula})</div>
      </div>`;
  }

  const items = [item("Жеке миссия", `Аспан ${nebo} + Жер ${zemlya}`, pred1)];
  if (count >= 2 && pred2 != null) items.push(item("Әлеуметтік миссия", `Ер желісі ${muzh} + Әйел желісі ${zhen}`, pred2));
  if (count >= 3 && pred3 != null) items.push(item("Рухани миссия", `Жеке ${pred1} + Әлеуметтік ${pred2}`, pred3));
  if (count >= 4 && pred4 != null) items.push(item("Планетарлық миссия", `Әлеуметтік ${pred2} + Рухани ${pred3}`, pred4));

  const rows = [];
  for (let i = 0; i < items.length; i += 2) rows.push(items.slice(i, i + 2));

  const box = document.createElement("div");
  box.style.cssText = "max-width:420px;margin:0 auto 30px;";
  box.className = "dl-purpose-box";
  box.innerHTML = `<div class="dl-purpose-heading" style="display:none;">Тағдыр мақсаты</div>` + rows.map(function (row) {
    return `<div class="dl-purpose-row" style="display:flex;justify-content:center;gap:24px;margin-bottom:16px;">${row.join("")}</div>`;
  }).join("");
  container.insertBefore(box, afterNode.nextSibling);
}

/* ============================================================
   ПРОГНОЗ ПО ВОЗРАСТНЫМ ПЕРИОДАМ (взрослая матрица)
   ============================================================ */

// 8 "үлкен шеңберлер" по кругу матрицы — те же самые точки, что уже используются
// в диаграмме (buildDiagramSvgMarkup): a=0 лет, f=10, b=20, g=30, c=40, y=50, d=60, k=70.
function getForecastAnchors(engine) {
  const refs = { a: "H24", b: "AA6", c: "AS24", d: "AA43", f: "N12", g: "AM12", k: "N37", y: "AM37" };
  const v = {};
  for (const key in refs) v[key] = engine.cell("Диаграмма", refs[key]);
  return [v.a, v.f, v.b, v.g, v.c, v.y, v.d, v.k]; // offsets 0,10,20,30,40,50,60,70
}

// Внутри каждого десятилетия — фиксированная схема из 8 точек (подтверждено реальным
// файлом-калькулятором): якорь + 7 "фракталды" точек, каждая — сумма двух соседних
// уже найденных значений, с приведением к ≤22 (цифровая сумма).
const FORECAST_TEMPLATE = [
  { pos: 0, range: null },
  { pos: 1.25, range: [1, 2.5] },
  { pos: 2.5, range: [2.5, 3.5] },
  { pos: 3.75, range: [3.5, 4] },
  { pos: 5, range: null },
  { pos: 6.25, range: [6, 7.5] },
  { pos: 7.5, range: [7.5, 8.5] },
  { pos: 8.75, range: [8.5, 9] },
];

function forecastFmtAge(n) {
  const rounded = Math.round(n * 10) / 10;
  return Number.isInteger(rounded) ? String(rounded) : String(rounded).replace(".", ",");
}

function forecastLabel(decadeStart, entry) {
  if (entry.range) {
    return `${forecastFmtAge(decadeStart + entry.range[0])}-${forecastFmtAge(decadeStart + entry.range[1])} жас`;
  }
  if (entry.pos === 0) {
    return decadeStart === 0 ? "0/80 жас" : `${decadeStart} жас`;
  }
  return `${decadeStart + entry.pos} жас`;
}

// Строит полную таблицу периодов от 0 до maxAge (по умолчанию с запасом до 90 лет).
function buildForecastTable(anchors, maxAge) {
  maxAge = maxAge || 90;
  const decades = Math.ceil(maxAge / 10) + 1;
  const rows = [];
  for (let d = 0; d < decades; d++) {
    const left = anchors[d % 8];
    const right = anchors[(d + 1) % 8];
    const decadeStart = d * 10;
    const mid5 = reduceTo22Diag(left + right);
    const qLeft = reduceTo22Diag(left + mid5);
    const qRight = reduceTo22Diag(mid5 + right);
    const eLL = reduceTo22Diag(left + qLeft);
    const eLR = reduceTo22Diag(qLeft + mid5);
    const eRL = reduceTo22Diag(mid5 + qRight);
    const eRR = reduceTo22Diag(qRight + right);
    const values = [left, eLL, qLeft, eLR, mid5, eRL, qRight, eRR];
    FORECAST_TEMPLATE.forEach(function (entry, i) {
      rows.push({
        pos: decadeStart + entry.pos,
        label: forecastLabel(decadeStart, entry),
        energy1: values[i],
      });
    });
  }
  rows.push({ pos: decades * 10, label: (decades * 10) === 80 ? "0/80 жас" : `${decades * 10} жас`, energy1: anchors[decades % 8] });

  // 2-я энергия: значение первой энергии на точке ±40 лет (по кругу), 3-я — сумма первых двух.
  const perDecade = FORECAST_TEMPLATE.length; // 8
  rows.forEach(function (row, i) {
    const mirrorSteps = 4 * perDecade; // 40 лет = 4 десятилетия по 8 точек
    let mirrorIdx = i + mirrorSteps;
    if (mirrorIdx >= rows.length) mirrorIdx = i - mirrorSteps;
    const mirrorRow = rows[mirrorIdx];
    row.energy2 = mirrorRow ? mirrorRow.energy1 : row.energy1;
    row.energy3 = reduceTo22Diag(row.energy1 + row.energy2);
  });
  return rows;
}

function computeExactAge(birthDateStr) {
  const [d, m, y] = birthDateStr.split(".").map(Number);
  const birth = new Date(y, m - 1, d);
  const now = new Date();
  let years = now.getFullYear() - birth.getFullYear();
  const thisYearBirthday = new Date(now.getFullYear(), m - 1, d);
  let fraction;
  if (now >= thisYearBirthday) {
    const nextBirthday = new Date(now.getFullYear() + 1, m - 1, d);
    fraction = (now - thisYearBirthday) / (nextBirthday - thisYearBirthday);
  } else {
    years -= 1;
    const prevBirthday = new Date(now.getFullYear() - 1, m - 1, d);
    fraction = (now - prevBirthday) / (thisYearBirthday - prevBirthday);
  }
  return years + fraction;
}

function findNearestForecastIndex(table, age) {
  let bestIdx = 0, bestDist = Infinity;
  table.forEach(function (row, i) {
    const dist = Math.abs(row.pos - age);
    if (dist < bestDist) { bestDist = dist; bestIdx = i; }
  });
  return bestIdx;
}

function buildForecastHtml(birthDate) {
  const engine = window.AdultMatrixEngine;
  const anchors = getForecastAnchors(engine);
  const table = buildForecastTable(anchors, 90);
  const age = computeExactAge(birthDate);
  const currentIdx = findNearestForecastIndex(table, age);

  // Видимый на платформе диапазон — от «20 лет», ранние детские периоды не показываем.
  const visibleStart = table.findIndex(r => r.pos >= 20);
  const visibleIdxs = [];
  for (let i = visibleStart; i < table.length; i++) visibleIdxs.push(i);

  window._forecastTable = table;
  window._forecastCurrentIdx = currentIdx;
  window._forecastBirthDate = birthDate;

  const tabsHtml = visibleIdxs.map(function (i) {
    const row = table[i];
    const active = i === currentIdx ? " active" : "";
    return `<button type="button" class="materials-tab${active}" id="forecastTab-${i}" onclick="selectForecastPeriod(${i})">${escapeHtml(row.label)}</button>`;
  }).join("");

  const panelsHtml = visibleIdxs.map(i => forecastPeriodPanelHtml(table[i], i)).join("");

  const body = `
    <div class="materials-tabs" style="max-height:140px;overflow-y:auto;">${tabsHtml}</div>

  return `
    <div class="accordion-item">

        <span>Болжам</span><span>▾</span>

    </div>`;
}

function downloadForecastText() {
  const table = window._forecastTable;
  if (!table) return;
  const n = table.length;
  const centerIdx = window._forecastCurrentIdx || 0;
  const idxs = [-2, -1, 0, 1, 2].map(o => Math.min(Math.max(centerIdx + o, 0), n - 1));

  function energyBlockText(num) {
    const data = (window.ForecastData && window.ForecastData[String(num)]) || null;
    if (!data) return "";
    let html = `<div class="entry-block"><div class="num">${escapeHtml(String(num))}</div>`;
    data.main.split(/\n+/).forEach(t => { if (t.trim()) html += `<p>${escapeHtml(t.trim())}</p>`; });
    if (data.positive) html += `<p><strong>Оң:</strong> ${escapeHtml(data.positive)}</p>`;
    if (data.negative) html += `<p><strong>Теріс:</strong> ${escapeHtml(data.negative)}</p>`;
    html += `</div>`;
    return html;
  }

  let bodyHtml = `<h1>Жас кезеңдері бойынша болжам</h1>`;
  idxs.forEach(function (i) {
    const row = table[i];
    bodyHtml += `<h2>${escapeHtml(row.label)}${i === centerIdx ? " (ағымдағы кезең)" : ""}</h2>`;
    bodyHtml += energyBlockText(row.energy1);
    bodyHtml += energyBlockText(row.energy2);
    bodyHtml += energyBlockText(row.energy3);

function stripDuplicateTitle(fullText, title) {
  const idx = fullText.indexOf("\n");

  const firstLine = fullText.slice(0, idx).trim();
  if (firstLine === String(title).trim()) {
    return fullText.slice(idx + 1).replace(/^\n+/, "");
  }
  return fullText;
}

function svgElementToPngDataUrl(svgEl) {
  return new Promise(function (resolve) {
    const viewBox = svgEl.getAttribute("viewBox");
    const [, , vbW, vbH] = viewBox ? viewBox.split(/\s+/).map(Number) : [0, 0, 300, 300];
    const scale = 3;
    const clone = svgEl.cloneNode(true);
    clone.setAttribute("width", vbW);
    clone.setAttribute("height", vbH);
    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");

    const svgString = new XMLSerializer().serializeToString(clone);
    const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(svgBlob);

    const img = new Image();
    img.onload = function () {
      const canvas = document.createElement("canvas");
      canvas.width = vbW * scale;
      canvas.height = vbH * scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/png"));
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      resolve(null);
    };
    img.src = url;
  });
}

      .ms-table td:nth-child(3), .ms-table td:nth-child(4) { width: 5%; }
      .ms-table td:nth-child(5) { width: 11%; } .ms-table td:nth-child(6) { width: 8%; }
      .ms-table td:nth-child(7) { width: 13%; } .ms-table td:nth-child(8) { width: 10%; }
      .ms-table td:nth-child(9) { width: 16%; } .ms-table td:nth-child(10) { width: 13%; } .ms-table td:nth-child(11) { width: 7%; }
