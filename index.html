<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numerology Platform KZ</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="theme-color" content="#1d3f3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Numerology Platform">
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background:
    radial-gradient(circle at 70% 15%, rgba(47, 109, 106, 0.22), transparent 28%),
    radial-gradient(circle at 20% 80%, rgba(40, 90, 87, 0.18), transparent 30%),
    linear-gradient(135deg, #142b28 0%, #1d3f3c 45%, #142b28 100%);
  color: #f8e7a8;
  font-family: Arial, sans-serif;
  visibility: hidden;
}

/* ===================== ПЛАТФОРМА ===================== */

.platform {
  min-height: 100vh;
  display: flex;
  padding: 8px;
}

/* Левое меню */

.sidebar {
  width: 245px;
  min-height: calc(100vh - 16px);
  padding: 28px 18px 24px;
  border: 1px solid rgba(220, 169, 42, 0.65);
  border-radius: 18px 0 0 18px;
  background:
    radial-gradient(circle at 50% 10%, rgba(47, 109, 106, 0.30), transparent 28%),
    linear-gradient(180deg, #1c3a37 0%, #142b28 100%);
  display: flex;
  flex-direction: column;
}

.logo { text-align: center; margin-bottom: 38px; }

.logo-symbol {
  width: 100px; height: 100px; margin: 0 auto 14px;
  border-radius: 50%; border: 2px solid #e7bd43;
  display: flex; align-items: center; justify-content: center;
  color: #f5d46b; font-size: 48px;
  box-shadow: 0 0 20px rgba(225, 184, 64, 0.35), inset 0 0 20px rgba(225, 184, 64, 0.12);
}

.logo-title { font-family: Georgia, serif; font-size: 25px; color: #f5d46b; letter-spacing: 1px; }
.logo-subtitle { margin-top: 8px; font-size: 20px; color: #e7bd43; }

.nav { display: flex; flex-direction: column; gap: 12px; }

.nav-item {
  width: 100%; min-height: 52px; padding: 15px 16px;
  border-radius: 12px; border: 1px solid transparent;
  background: transparent; color: #f5f0df;
  font-size: 18px; line-height: 1.2; text-align: left; cursor: pointer;
  transition: background 0.25s, border-color 0.25s, color 0.25s;
  display: flex; align-items: center;
}
.nav-item:hover { background: rgba(47, 109, 106, 0.25); border-color: rgba(218, 173, 49, 0.55); }
.nav-item.active {
  background: linear-gradient(90deg, rgba(60, 135, 131, 0.55), rgba(47, 109, 106, 0.35));
  border-color: #d7aa31; color: #f8d96d;
  box-shadow: 0 0 15px rgba(212, 164, 43, 0.12);
}
.nav-icon {
  display: inline-flex; width: 32px; min-width: 32px; margin-right: 2px;
  align-items: center; justify-content: center; color: #f2c84d; font-size: 22px;
}
.logout { margin-top: auto; color: #f5d46b; }

/* Основная область */

.main {
  flex: 1; min-height: calc(100vh - 16px);
  padding: 42px 30px 36px;
  border: 1px solid rgba(220, 169, 42, 0.65); border-left: none;
  border-radius: 0 18px 18px 0;
  background:
    radial-gradient(circle at 55% 5%, rgba(47, 109, 106, 0.23), transparent 28%),
    radial-gradient(circle at 90% 85%, rgba(40, 90, 87, 0.16), transparent 30%),
    #1c3a3a;
}

.top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; }
.welcome h1 { margin: 0; font-family: Georgia, serif; font-size: 43px; font-weight: 500; color: #f8dc78; }
.account { display: flex; align-items: center; gap: 12px; color: #f4e9cc; font-size: 16px; }
.account-icon {
  width: 45px; height: 45px; border: 1px solid #e3b936; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; color: #f4c94f; font-size: 23px;
}

/* Карточки направлений */

.cards {
  display: grid;
  grid-template-columns: repeat(5, 180px);
  gap: 20px;
  justify-content: start;
  align-items: start;
  width: 100%;
  margin-top: 18px;
}

.cards .card, .method-card {
  width: 180px; height: 250px; min-height: 250px; box-sizing: border-box;
  padding: 18px 14px; border: 1px solid rgba(225, 180, 52, 0.9); border-radius: 18px;
  background:
    radial-gradient(circle at 50% 10%, rgba(47, 109, 106, 0.30), transparent 40%),
    linear-gradient(145deg, #24504c 0%, #1c3a37 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; cursor: pointer; overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18), inset 0 0 30px rgba(47, 109, 106, 0.08);
  transition: transform 0.25s, box-shadow 0.25s;
}
.cards .card:hover, .method-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 14px 35px rgba(0, 0, 0, 0.25), 0 0 22px rgba(222, 174, 47, 0.12);
}
.method-card:not([onclick]) { cursor: default; }

.cards .card-icon {
  height: 65px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 52px; line-height: 1; color: #f2c94c;
  text-shadow: 0 0 20px rgba(239, 192, 62, 0.3);
}
.cards .card-content h3 { margin: 0 0 9px; font-family: Georgia, serif; font-size: 20px; line-height: 1.12; font-weight: 500; color: #f6d66c; }
.cards .card-content p { margin: 0; font-size: 14px; line-height: 1.3; color: #eee5d0; }

.card.has-material { border-color: #8fe3a1; }

.pythagoras-icon {
  display: grid !important; grid-template-columns: repeat(3, 1fr); gap: 3px 8px;
  width: 88px; height: 65px !important; font-size: 17px !important; line-height: 1 !important;
}
.pythagoras-icon span { display: flex; align-items: center; justify-content: center; }

.library-icon { font-size: 54px !important; line-height: 1; height: 65px !important; display: flex; align-items: center; justify-content: center; }

.section-title { width: 100%; margin: 0 0 20px; }
.section-title h2 { margin: 0; font-family: Georgia, serif; font-size: 31px; font-weight: 500; color: #f6d66c; }

.back-link {
  display: inline-flex; align-items: center; gap: 8px;
  color: #f6d66c; background: none; border: none; cursor: pointer;
  font-size: 16px; margin-bottom: 14px; padding: 0;
}

/* Иәшборд-блоки (доступы / статистика / мои расчёты) */

.dashboard-wrap { width: 100%; }
.dashboard-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 22px; }
.dashboard-head h2 { margin: 0 0 8px; font-family: Georgia, serif; font-size: 31px; color: #f6d66c; }
.dashboard-head p { margin: 0; color: #eee5d0; font-size: 16px; }
.dashboard-badge {
  border: 1px solid rgba(225,180,52,.75); border-radius: 999px; padding: 8px 14px;
  color: #f6d66c; background: rgba(255,255,255,.05); white-space: nowrap;
}

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat-card, .table-card {
  border: 1px solid rgba(225,180,52,.65); border-radius: 16px;
  background: linear-gradient(145deg, rgba(30,64,62,.92), rgba(20,45,43,.92));
  box-shadow: inset 0 0 25px rgba(126,65,167,.08);
}
.stat-card { padding: 18px; overflow: hidden; }
.stat-card span { display: block; color: #eee5d0; font-size: 14px; margin-bottom: 8px; min-height: 34px; overflow-wrap: break-word; }
.stat-card strong { display: block; color: #f6d66c; font-family: Georgia, serif; font-size: 30px; }
.table-card { padding: 18px; overflow-x: auto; }
.table-title { color: #f6d66c; font-family: Georgia, serif; font-size: 22px; margin-bottom: 14px; }
.data-table { width: 100%; border-collapse: collapse; color: #eee5d0; }
.data-table th, .data-table td { padding: 12px 10px; border-bottom: 1px solid rgba(225,180,52,.18); text-align: left; }
.data-table th { color: #f6d66c; font-weight: 600; }
.empty-table { padding: 28px 10px; color: #d9d0bd; text-align: center; }

.access-locked { width: 100%; text-align: center; padding: 55px 30px; }
.access-locked-icon { font-size: 55px; margin-bottom: 15px; }
.access-locked h2 { font-family: Georgia, serif; font-size: 27px; color: #f6d66c; margin-bottom: 12px; }
.access-locked p { font-size: 17px; color: #eee5d0; line-height: 1.6; max-width: 650px; margin: 0 auto; }

/* ===================== СПИСОК МАТЕРИАЛОВ (полноценная страница) ===================== */

.materials-page { width: 100%; }

.materials-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 18px; flex-wrap: wrap; gap: 14px;
}
.materials-head h2 { margin: 0; font-family: Georgia, serif; font-size: 27px; color: #f6d66c; }

.materials-add-btn {
  padding: 12px 20px; border-radius: 10px; border: 1px solid #d7aa31;
  background: linear-gradient(90deg, #3c8783, #2f6d6a);
  color: #f8d96d; cursor: pointer; font-size: 15px;
}

.materials-tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.materials-tab {
  padding: 9px 16px; border-radius: 10px; border: 1px solid rgba(225,180,52,.4);
  background: rgba(255,255,255,.03); color: #eee5d0; cursor: pointer; font-size: 14px;
}
.materials-tab.active { background: rgba(113,49,153,.55); border-color: #d7aa31; color: #f8d96d; }

.material-row {
  display: flex; align-items: center; gap: 16px;
  padding: 16px; border-radius: 14px; margin-bottom: 12px;
  border: 1px solid rgba(225,180,52,.35);
  background: linear-gradient(145deg, rgba(30,64,62,.75), rgba(20,45,43,.75));
}
.material-row-icon {
  width: 46px; height: 46px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
  background: rgba(255,255,255,.06); color: #f2c94c;
}
.material-row-body { flex: 1; min-width: 0; }
.material-row-title { color: #f8e7a8; font-size: 16px; margin-bottom: 4px; }
.material-row-meta { color: #b8ad98; font-size: 13px; overflow-wrap: anywhere; word-break: break-word; }
.material-row-open {
  padding: 10px 18px; border-radius: 10px; border: 1px solid #d7aa31;
  background: linear-gradient(90deg, #3c8783, #2f6d6a); color: #f8d96d;
  cursor: pointer; font-size: 14px; white-space: nowrap; text-decoration: none;
}
.materials-note { color: #b8ad98; font-size: 13px; margin-top: 10px; }

/* ===================== ОКНО ДОБАВЛЕНИЯ МАТЕРИАЛА ===================== */

.material-manager-overlay {
  position: fixed; inset: 0; z-index: 99999; display: flex;
  align-items: center; justify-content: center; padding: 20px;
  background: rgba(0, 0, 0, 0.72);
}
.material-manager {
  width: 560px; max-width: 95vw; max-height: 90vh; overflow-y: auto; padding: 30px;
  border-radius: 20px; background: linear-gradient(145deg, #24504c, #1c3a37);
  border: 1px solid #d7aa31; color: #f8e7a8; box-shadow: 0 20px 70px rgba(0, 0, 0, 0.5);
}
.material-manager h2 { margin: 0 35px 24px 0; color: #f6d66c; font-family: Georgia, serif; }
.material-manager-close { float: right; background: none; border: none; color: #f6d66c; font-size: 30px; line-height: 1; cursor: pointer; }
.material-manager-label { display: block; margin: 16px 0 8px; color: #eee5d0; }
.material-manager-input {
  width: 100%; box-sizing: border-box; padding: 13px; margin-bottom: 12px;
  border-radius: 10px; border: 1px solid rgba(225, 180, 52, 0.5);
  background: rgba(0,0,0,.2); color: #fff; outline: none; font-size: 16px;
}
.material-manager-input::placeholder { color: #aaa1b4; }
.material-manager-button {
  width: 100%; margin-top: 4px; padding: 13px 16px; border-radius: 10px; border: 1px solid #d7aa31;
  background: linear-gradient(90deg, #3c8783, #2f6d6a); color: #f8d96d; cursor: pointer; font-size: 16px;
}
.material-manager-button:disabled { opacity: .55; cursor: wait; }
.material-manager-or { margin: 18px 0 4px; text-align: center; color: #c8bca4; }
.material-manager-status { margin-top: 18px; line-height: 1.45; }
.material-manager-status.ok { color: #a9e4b4; }
.material-manager-status.error { color: #ffb0b0; }
.material-manager-hint { margin-top: 8px; color: #bdb3c5; font-size: 13px; line-height: 1.4; }

/* ===================== АВТОРИЗАЦИЯ ===================== */

.auth-shell {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px;
  background:
    radial-gradient(circle at 50% 20%, rgba(47, 109, 106, 0.22), transparent 30%),
    linear-gradient(135deg, #142b28, #1d3f3c, #142b28);
}
.auth-card {
  width: 420px; max-width: 100%; padding: 38px;
  border: 1px solid rgba(225, 180, 52, 0.7); border-radius: 20px;
  background: linear-gradient(145deg, #24504c, #1c3a37);
  box-shadow: 0 20px 70px rgba(0, 0, 0, 0.4); text-align: center;
}
.auth-card-register { width: 600px; }
.auth-symbol { font-size: 48px; color: #f5d46b; margin-bottom: 8px; }
.auth-title { font-family: Georgia, serif; font-size: 28px; color: #f5d46b; }
.auth-subtitle { color: #e7bd43; margin-top: 5px; margin-bottom: 25px; }
.auth-card h2 { color: #f6d66c; font-family: Georgia, serif; font-weight: 500; }
.auth-card input {
  width: 100%; padding: 14px; margin: 7px 0; border: 1px solid rgba(225, 180, 52, 0.4);
  border-radius: 10px; background: rgba(0, 0, 0, 0.18); color: #fff; font-size: 16px; outline: none;
}
.auth-card button {
  width: 100%; padding: 14px; margin-top: 12px; border: 1px solid #d7aa31; border-radius: 10px;
  background: linear-gradient(90deg, #3c8783, #2f6d6a); color: #f8d96d; font-size: 16px; cursor: pointer;
}
.auth-link { background: transparent !important; border: none !important; color: #d9cba8 !important; }
.auth-divider { margin: 15px 0; color: #a99d83; }
.auth-register { background: transparent !important; }
.auth-description { color: #ddd4c1; line-height: 1.5; }
.auth-message { margin-top: 14px; min-height: 22px; line-height: 1.4; }
.auth-message.error { color: #ff9b9b; }
.auth-message.success { color: #a8e6b0; }
.auth-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }

/* ===================== АДАПТАЦИЯ ===================== */

@media (max-width: 1200px) {
  .sidebar { width: 210px; }
  .cards { grid-template-columns: repeat(3, 180px); }
}
@media (max-width: 900px) {
}
@media (max-width: 800px) {
  .platform { display: block; }
  .sidebar { width: 100%; min-height: auto; border-radius: 18px 18px 0 0; }
  .main { border-left: 1px solid rgba(220, 169, 42, 0.65); border-top: none; border-radius: 0 0 18px 18px; }
  .cards { grid-template-columns: repeat(2, 180px); }
  .top { display: block; }
  .account { margin-top: 20px; }
  .auth-grid { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .main { padding: 28px 15px 25px; }
  .welcome h1 { font-size: 31px; }
  .cards { grid-template-columns: 1fr; justify-items: center; }
  .cards .card, .method-card { width: 100%; max-width: 320px; }
  .material-row { flex-wrap: wrap; }
  .material-row-body { flex-basis: 100%; order: 1; }
  .material-row-icon { order: 0; }
  .material-row-open { order: 2; margin-left: 0 !important; }
  .data-table { font-size: 12px; width: max-content; min-width: 100%; }
  .data-table th, .data-table td { padding: 8px 9px; white-space: nowrap; }
  .data-table td a { white-space: nowrap; }
  .table-card { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .dashboard-head { flex-direction: column; align-items: flex-start; gap: 10px; }
}

/* ===================== АККОРДЕОН РЕЗУЛЬТАТА РАСЧЁТА ===================== */

.accordion-item {
  border: 1px solid rgba(225,180,52,.4);
  border-radius: 12px;
  margin-bottom: 10px;
  overflow: hidden;
}
.accordion-header {
  width: 100%;
  text-align: left;
  padding: 14px 16px;
  background: rgba(255,255,255,.04);
  border: none;
  color: #f6d66c;
  font-family: Georgia, serif;
  font-size: 17px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.accordion-header:hover { background: rgba(255,255,255,.08); }
.accordion-body {
  padding: 16px;
  border-top: 1px solid rgba(225,180,52,.25);
  color: #eee5d0;
  line-height: 1.6;
  white-space: pre-wrap;
}
.accordion-body.hidden { display: none; }
.test-option {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: left;
  padding: 14px 16px;
  margin-bottom: 10px;
  border: 1px solid rgba(225,180,52,.35);
  border-radius: 12px;
  background: rgba(255,255,255,.03);
  color: #f8e7a8;
  font-size: 15px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.test-option:hover { background: rgba(255,255,255,.08); }
.test-option.selected {
  background: rgba(215,170,49,.22);
  border-color: #d7aa31;
}
.test-option-letter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  border-radius: 50%;
  border: 1px solid rgba(225,180,52,.5);
  color: #f6d66c;
  font-family: Georgia, serif;
  font-size: 14px;
}
.test-option.selected .test-option-letter {
  background: #d7aa31;
  color: #122522;
}
.key-numbers-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
}
.key-number-box {
  padding: 10px 12px;
  border-radius: 8px;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(225,180,52,.25);
}
.key-number-box strong { display: block; font-size: 22px; color: #f6d66c; }
.key-number-box span { font-size: 12px; color: #b8ad98; }

</style>
</head>

<script>

/* ============================================================

function formatBirthDate(input) {
  let value = input.value.replace(/\D/g, "");
  if (value.length > 8) value = value.substring(0, 8);
  if (value.length > 4) value = value.substring(0, 2) + "." + value.substring(2, 4) + "." + value.substring(4);
  else if (value.length > 2) value = value.substring(0, 2) + "." + value.substring(2);
  input.value = value;
}

function isValidBirthDate(value) {
  const match = String(value || "").match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (!match) return false;
  const day = Number(match[1]), month = Number(match[2]), year = Number(match[3]);
  if (year < 1900 || year > 2100) return false;
  const date = new Date(year, month - 1, day);
  return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day;
}

}

    if (dateError) dateError.textContent = "Введите корректную дату рождения в формате КК.АА.ЖЖЖЖ.";
    return;

      if (yearError) yearError.textContent = "Дұрыс жыл енгізіңіз — 4 сан, мысалы 2026.";
      return;
    }
    interestYear = Number(yearRaw);
    interestMonth = monthInput ? Number(monthInput.value) : null;
  }

  if (!result) return;

  if (type === "adult" && window.AdultMatrixEngine) {
    renderAdultMatrixResult(name, birthDate, result);
    saveCalculationHistory({ direction: "adult", title: "Ересек матрица - " + name + " - " + birthDate, personName: name, birthDate });
    return;
  }
  if (type === "child" && window.ChildMatrixEngine) {
    renderChildMatrixResult(name, birthDate, result);
    saveCalculationHistory({ direction: "child", title: "Балалар матрицасы - " + name + " - " + birthDate, personName: name, birthDate });
    return;
  }
  if (type === "vedic" && window.VedicEngine) {
    renderVedicResult(name, birthDate, result);
    saveCalculationHistory({ direction: "vedic", title: "Ведическая нумерология - " + name + " - " + birthDate, personName: name, birthDate });
    return;
  }

  result.innerHTML = `
    <div style="padding:20px;border:1px solid rgba(225,180,52,.5);border-radius:14px;background:rgba(0,0,0,.12);">
      <h3 style="margin-top:0;color:#f6d66c;font-family:Georgia,serif;">${DIRECTION_NAMES[type] || "Есептеу"}</h3>
      <p>Аты: <strong>${escapeHtml(name)}</strong></p>
      <p>Туған күні: <strong>${escapeHtml(birthDate)}</strong></p>
      <p style="margin-bottom:0;color:#d9d0bd;">Бұл бөлім әлі нақты есептеуге қосылмаған.</p>
    </div>`;
}

function reduceTo22(n) {
  while (n > 22) {
    n = String(n).split("").reduce((sum, d) => sum + Number(d), 0);
  }
  return n;
}

function colLetterToIndex(letters) {
  let n = 0;
  for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n;
}

function reduceTo22Diag(n) {
  while (n > 22) {
    n = String(n).split("").reduce((sum, d) => sum + Number(d), 0);
  }
  return n;
}

// Традиционные цвета чакр — используются и в главной диаграмме, и в карте здоровья.
const CHAKRA_COLOR = {
  sahasrara: "#6bb5b0", // фиолетовый
  adjna: "#5b8ef2",     // синий
  vishudha: "#4fc3c0",  // голубой
  anahata: "#6fbf5e",   // зелёный
  manipura: "#e0c23e",  // жёлтый
  svadhistana: "#e0913e", // оранжевый
  muladhara: "#d1483e",   // красный
  neutral: "#8a7fae",
};

function buildDiagramSvgMarkup(engine, sheetName, rowOffset, svgSize, omitAncestral, hideLineageLabels) {
  // omitAncestral: false/undefined = все точки; true = совсем без f/g/k/y и их подточек;
  // "corners" = f/g/k/y (углы) есть, но БЕЗ подточек (s1/s2/p1/p2/p3/p4/s3/s4) и без e1/e2.
  const omitCorners = omitAncestral === true;
  const omitSubs = omitAncestral === true || omitAncestral === "corners";
  function shift(ref) {
    const m = ref.match(/^([A-Z]+)(\d+)$/);
    return m[1] + (Number(m[2]) + rowOffset);
  }

  const baseCellRefs = omitCorners
    ? { a: "H24", a1: "O24", a2: "L24", b: "AA6", c: "AS24", d: "AA43", e: "AA23" }
    : {
        a: "H24", a1: "O24", a2: "L24",
        b: "AA6",
        c: "AS24",
        d: "AA43",
        e: "AA23",
        f: "N12", f2: "P14", f3: "R16",
        g: "AM12", g2: "AK14", g3: "AI16",
        k: "N37", k2: "P35", k3: "R33",
        y: "AM37", y2: "AK35", y3: "AI33",
      };
  const cellRefs = {};
  for (const key in baseCellRefs) cellRefs[key] = shift(baseCellRefs[key]);

  const values = {};
  try {
    for (const key in cellRefs) values[key] = engine.cell(sheetName, cellRefs[key]);
  } catch (err) {
    return null;
  }

  values.a3 = reduceTo22Diag(values.a1 + values.e);
  values.b1 = reduceTo22Diag(values.b + values.e);
  values.b2 = reduceTo22Diag(values.b + values.b1);
  values.b3 = reduceTo22Diag(values.b1 + values.e);
  values.c1 = reduceTo22Diag(values.c + values.e);
  values.c2 = reduceTo22Diag(values.c + values.c1);
  values.d1 = reduceTo22Diag(values.d + values.e);
  values.d2 = reduceTo22Diag(values.d + values.d1);
  // Линия Благополучия: x — центральная энергия между c1 и d1, x2 — «под долларом», x1 — «под сердцем».
  values.x = reduceTo22Diag(values.d1 + values.c1);
  values.x2 = reduceTo22Diag(values.x + values.c1);
  values.x1 = reduceTo22Diag(values.d1 + values.x);
  // e1 = f+g+y+k, e2 = e+e1 (родовые энергии сексуальности, стр. «Сексуальность» методички)
  if (!omitCorners && !omitSubs) {
    values.e1 = reduceTo22Diag(values.f + values.g + values.y + values.k);
    values.e2 = reduceTo22Diag(values.e + values.e1);
  }

  // Чистая геометрия: центр строго по точке e, остальные точки — по углу и расстоянию от центра.
  // Расположение вдоль линии — равными долями, независимо от исходных координат в Excel (те нужны только для значений).
  // mid = истинный центр viewBox (410/2=205, 240/2=120) — раньше был сдвинут на +20/+10,
  // из-за чего точки c и d (справа и снизу) вылезали за край и обрезались.
  const mid = svgSize === "small" ? 120 : 205;
  // Все 8 углов (a,b,c,d,f,g,k,y) — на одной окружности, равное расстояние от центра.
  const R1 = svgSize === "small" ? 100 : 175;
  const R2 = R1;

  function polar(angleDeg, radius) {
    const rad = (angleDeg * Math.PI) / 180;
    return { x: mid + radius * Math.cos(rad), y: mid + radius * Math.sin(rad) };
  }
  function along(p1, p2, t) {
    return { x: p1.x + (p2.x - p1.x) * t, y: p1.y + (p2.y - p1.y) * t };
  }

  const positions = { e: { x: mid, y: mid } };
  positions.a = polar(180, R1);
  positions.b = polar(270, R1);
  positions.c = polar(0, R1);
  positions.d = polar(90, R1);

  // Подточки: шаг увеличен, чтобы кружки не перекрывали друг друга и сам угловой кружок
  // (радиус углового кружка 16, подточек — 9, минимальный зазор между центрами ~25/18px).
  positions.a2 = along(positions.a, positions.e, 0.15);
  positions.a1 = along(positions.a, positions.e, 0.26);
  positions.a3 = along(positions.a1, positions.e, 0.5);
  positions.b2 = along(positions.b, positions.e, 0.15);
  positions.b1 = along(positions.b, positions.e, 0.26);
  positions.b3 = along(positions.b1, positions.e, 0.5);
  positions.c2 = along(positions.c, positions.e, 0.15);
  positions.c1 = along(positions.c, positions.e, 0.26);
  positions.d2 = along(positions.d, positions.e, 0.15);
  positions.d1 = along(positions.d, positions.e, 0.26);

  // Линия Благополучия: c1 → x2 → x → x1 → d1, одной линией.
  positions.x2 = along(positions.c1, positions.d1, 0.30);
  positions.x = along(positions.c1, positions.d1, 0.50);
  positions.x1 = along(positions.c1, positions.d1, 0.70);

  if (!omitCorners) {
    positions.f = polar(225, R2);
    positions.g = polar(315, R2);
    positions.k = polar(135, R2);
    positions.y = polar(45, R2);
  }
  if (!omitCorners && !omitSubs) {
    positions.f2 = along(positions.f, positions.e, 0.15);
    positions.f3 = along(positions.f, positions.e, 0.30);
    positions.g2 = along(positions.g, positions.e, 0.15);
    positions.g3 = along(positions.g, positions.e, 0.30);
    positions.k2 = along(positions.k, positions.e, 0.15);
    positions.k3 = along(positions.k, positions.e, 0.30);
    positions.y2 = along(positions.y, positions.e, 0.15);
    positions.y3 = along(positions.y, positions.e, 0.30);
    positions.e1 = along(positions.e, positions.c, 0.16);
    positions.e2 = along(positions.e, positions.c, 0.32);
  }

  const pointColor = {
    a: CHAKRA_COLOR.sahasrara, a1: CHAKRA_COLOR.vishudha, a2: CHAKRA_COLOR.adjna, a3: CHAKRA_COLOR.anahata,
    b: CHAKRA_COLOR.sahasrara, b1: CHAKRA_COLOR.vishudha, b2: CHAKRA_COLOR.adjna, b3: CHAKRA_COLOR.anahata,
    c: CHAKRA_COLOR.muladhara, c1: CHAKRA_COLOR.svadhistana, c2: "white",
    d: CHAKRA_COLOR.muladhara, d1: CHAKRA_COLOR.svadhistana, d2: "white",
    x: "white", x1: "white", x2: "white",
    m1: "white", m2: "white", h1: "white", h2: "white",
    e: CHAKRA_COLOR.manipura, e1: "white", e2: "white",
    f: "white", f2: "white", f3: "white",
    g: "white", g2: "white", g3: "white",
    k: "white", k2: "white", k3: "white",
    y: "white", y2: "white", y3: "white",
  };

  const mainKeys = ["a", "b", "c", "d"];
  const outerKeys = omitCorners ? [] : ["f", "g", "k", "y"];
  const wellbeingKeys = ["x", "x1", "x2"];
  const subKeys = (omitSubs ? ["a1", "a2", "b1", "b2", "c1", "c2", "d1", "d2"] : ["a1", "a2", "a3", "b1", "b2", "b3", "c1", "c2", "d1", "d2"])
    .concat(omitSubs ? [] : ["f2", "f3", "g2", "g3", "k2", "k3", "y2", "y3", "e1", "e2"])
    .concat(wellbeingKeys);

  const outerSquareLines = omitCorners ? "" : `
    <line x1="${positions.f.x}" y1="${positions.f.y}" x2="${positions.g.x}" y2="${positions.g.y}" stroke="rgba(225,180,52,.3)" stroke-width="1"/>
    <line x1="${positions.g.x}" y1="${positions.g.y}" x2="${positions.y.x}" y2="${positions.y.y}" stroke="rgba(225,180,52,.3)" stroke-width="1"/>
    <line x1="${positions.y.x}" y1="${positions.y.y}" x2="${positions.k.x}" y2="${positions.k.y}" stroke="rgba(225,180,52,.3)" stroke-width="1"/>
    <line x1="${positions.k.x}" y1="${positions.k.y}" x2="${positions.f.x}" y2="${positions.f.y}" stroke="rgba(225,180,52,.3)" stroke-width="1"/>`;
  const innerDiamondLines = `
    <line x1="${positions.b.x}" y1="${positions.b.y}" x2="${positions.c.x}" y2="${positions.c.y}" stroke="rgba(225,180,52,.45)" stroke-width="1"/>
    <line x1="${positions.c.x}" y1="${positions.c.y}" x2="${positions.d.x}" y2="${positions.d.y}" stroke="rgba(225,180,52,.45)" stroke-width="1"/>
    <line x1="${positions.d.x}" y1="${positions.d.y}" x2="${positions.a.x}" y2="${positions.a.y}" stroke="rgba(225,180,52,.45)" stroke-width="1"/>
    <line x1="${positions.a.x}" y1="${positions.a.y}" x2="${positions.b.x}" y2="${positions.b.y}" stroke="rgba(225,180,52,.45)" stroke-width="1"/>`;
  // Оси через центр: a-e-c (горизонталь) и b-e-d (вертикаль) — вдоль них лежат подточки.
  const axisLines = `
    <line x1="${positions.a.x}" y1="${positions.a.y}" x2="${positions.c.x}" y2="${positions.c.y}" stroke="rgba(100,140,138,.35)" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="${positions.b.x}" y1="${positions.b.y}" x2="${positions.d.x}" y2="${positions.d.y}" stroke="rgba(100,140,138,.35)" stroke-width="1" stroke-dasharray="2,3"/>`;
  const lineageLines = omitCorners ? "" : `
    <line x1="${positions.f.x}" y1="${positions.f.y}" x2="${positions.y.x}" y2="${positions.y.y}" stroke="rgba(120,80,190,.5)" stroke-width="1.2" stroke-dasharray="3,2"/>
    <line x1="${positions.g.x}" y1="${positions.g.y}" x2="${positions.k.x}" y2="${positions.k.y}" stroke="rgba(200,60,60,.5)" stroke-width="1.2" stroke-dasharray="3,2"/>`;
  const lineageLabels = (omitCorners || hideLineageLabels) ? "" : (function () {
    const mp = along(positions.f, positions.e, 0.65);
    const fp = along(positions.g, positions.e, 0.65);
    // Небольшой перпендикулярный сдвиг (не вдоль линии!), чтобы подпись легла НАД пунктиром
    // с зазором, а не поверх него.
    const mDx = positions.e.x - positions.f.x, mDy = positions.e.y - positions.f.y;
    const mLen = Math.hypot(mDx, mDy) || 1;
    const mOff = { x: (mDy / mLen) * 4, y: -(mDx / mLen) * 4 };
    const fDx = positions.e.x - positions.g.x, fDy = positions.e.y - positions.g.y;
    const fLen = Math.hypot(fDx, fDy) || 1;
    const fOff = { x: -(fDy / fLen) * 4, y: (fDx / fLen) * 4 };
    mp.x += mOff.x; mp.y += mOff.y;
    fp.x += fOff.x; fp.y += fOff.y;
    return `
      <text x="${mp.x}" y="${mp.y}" text-anchor="middle" font-size="7" fill="rgba(120,80,190,.9)" transform="rotate(45 ${mp.x} ${mp.y})">ер тегінің желісі</text>
      <text x="${fp.x}" y="${fp.y}" text-anchor="middle" font-size="7" fill="rgba(200,60,60,.9)" transform="rotate(-45 ${fp.x} ${fp.y})">әйел тегінің желісі</text>`;
  })();
  const wellbeingLine = `
    <line x1="${positions.c1.x}" y1="${positions.c1.y}" x2="${positions.x2.x}" y2="${positions.x2.y}" stroke="rgba(140,200,90,.5)" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="${positions.x2.x}" y1="${positions.x2.y}" x2="${positions.x.x}" y2="${positions.x.y}" stroke="rgba(140,200,90,.5)" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="${positions.x.x}" y1="${positions.x.y}" x2="${positions.x1.x}" y2="${positions.x1.y}" stroke="rgba(210,70,70,.5)" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="${positions.x1.x}" y1="${positions.x1.y}" x2="${positions.d1.x}" y2="${positions.d1.y}" stroke="rgba(210,70,70,.5)" stroke-width="1" stroke-dasharray="2,2"/>`;
  const dollarSign = `<text x="${positions.x2.x}" y="${positions.x2.y - 14}" text-anchor="middle" font-size="13" fill="#8fd98f" font-weight="700">$</text>`;
  const heartSign = `<text x="${positions.x1.x}" y="${positions.x1.y - 12}" text-anchor="middle" font-size="13" fill="#e07a7a">♥</text>`;

  function circle(p, value, r, fs, fill) {
    const isWhite = fill === "white";
    const fillColor = isWhite ? "#f4f0fa" : fill;
    const textColor = isWhite ? "#2a2040" : "#fff";
    const strokeColor = isWhite ? "#6b5f8a" : "#122522";
    return `
      <circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${fillColor}" fill-opacity="${isWhite ? 1 : 0.9}" stroke="${strokeColor}" stroke-width="1"/>
      <text x="${p.x}" y="${p.y + fs * 0.35}" text-anchor="middle" font-family="Georgia,serif" font-size="${fs}" fill="${textColor}" font-weight="600">${escapeHtml(String(value))}</text>`;
  }

  const rScale = svgSize === "small" ? 0.62 : 1;
  const mainSvg = mainKeys.map(k => circle(positions[k], values[k], 16 * rScale, 13 * rScale, pointColor[k])).join("");
  const outerSvg = outerKeys.map(k => circle(positions[k], values[k], 13 * rScale, 11 * rScale, pointColor[k])).join("");
  const subSvg = subKeys.map(k => circle(positions[k], values[k], 9 * rScale, 8.5 * rScale, pointColor[k])).join("");
  const centerSvg = circle(positions.e, values.e, 18 * rScale, 14 * rScale, pointColor.e);

  const viewSize = svgSize === "small" ? 240 : 410;
  const svg = `<svg viewBox="0 0 ${viewSize} ${viewSize}" style="width:100%;max-width:${svgSize === "small" ? 250 : 420}px;">
      ${outerSquareLines}${innerDiamondLines}${axisLines}${lineageLines}${lineageLabels}${wellbeingLine}${dollarSign}${heartSign}${centerSvg}${subSvg}${outerSvg}${mainSvg}
    </svg>`;

  return { svg, values };
}

function renderMatrixDiamondDiagram(engine, container, includeHealthMap, purposeCount) {
  const result = buildDiagramSvgMarkup(engine, "Диаграмма", 0, "large");
  if (!result) return;
  const { svg, values } = result;
  window._lastDiagramValues = values;

  const box = document.createElement("div");
  box.style.cssText = "max-width:380px;margin:0 auto 20px;text-align:center;";
  box.innerHTML = `<div style="color:#c9bfa8;font-size:14px;margin-bottom:10px;">Матрица диаграммасы</div>${svg}`;
  container.insertBefore(box, container.firstChild);

  let afterNode = box;
  if (includeHealthMap !== false) {
    renderHealthMapDiagram(values, container, box);
    afterNode = box.nextSibling;
  }
  renderPurposeDiagram(values, container, afterNode, purposeCount);
}

function renderHealthMapDiagram(v, container, afterNode) {
  const l = reduceTo22Diag(v.a + v.b);
  const l1 = reduceTo22Diag(v.a2 + v.b2);
  const l2 = reduceTo22Diag(v.a1 + v.b1);
  const l3 = reduceTo22Diag(v.a3 + v.b3);
  const l4 = reduceTo22Diag(v.e + v.e);
  const l5 = reduceTo22Diag(v.d1 + v.c1);
  const l6 = reduceTo22Diag(v.d + v.c);

  // Физика — горизонтальная линия (a: слева-направо), Энергия — вертикальная линия (b: сверху-вниз).
  const chakras = [
    { name: "Сахасрара", color: CHAKRA_COLOR.sahasrara, phys: v.a, energy: v.b, emo: l },
    { name: "Аджна", color: CHAKRA_COLOR.adjna, phys: v.a2, energy: v.b2, emo: l1 },
    { name: "Вишудха", color: CHAKRA_COLOR.vishudha, phys: v.a1, energy: v.b1, emo: l2 },
    { name: "Анахата", color: CHAKRA_COLOR.anahata, phys: v.a3, energy: v.b3, emo: l3 },
    { name: "Манипура", color: CHAKRA_COLOR.manipura, phys: v.e, energy: v.e, emo: l4 },
    { name: "Свадхистана", color: CHAKRA_COLOR.svadhistana, phys: v.c1, energy: v.d1, emo: l5 },
    { name: "Муладхара", color: CHAKRA_COLOR.muladhara, phys: v.c, energy: v.d, emo: l6 },
  ];

  const itogPhys = reduceTo22Diag(chakras.reduce((s, ch) => s + ch.phys, 0));
  const itogEnergy = reduceTo22Diag(chakras.reduce((s, ch) => s + ch.energy, 0));
  const itogEmo = reduceTo22Diag(chakras.reduce((s, ch) => s + ch.emo, 0));

  const rowsHtml = chakras.map((ch, i) => `
    <tr style="background:${i % 2 === 0 ? "rgba(255,255,255,.03)" : "transparent"};">
      <td style="padding:7px 8px;border:1px solid rgba(225,180,52,.25);white-space:nowrap;text-align:left;">
        <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${ch.color};margin-right:7px;vertical-align:middle;"></span>
        <span style="vertical-align:middle;">${escapeHtml(ch.name)}</span>
      </td>
      <td style="text-align:center;color:#f6d66c;border:1px solid rgba(225,180,52,.25);">${ch.phys}</td>
      <td style="text-align:center;color:#f6d66c;border:1px solid rgba(225,180,52,.25);">${ch.energy}</td>
      <td style="text-align:center;color:#f6d66c;border:1px solid rgba(225,180,52,.25);">${ch.emo}</td>
    </tr>`).join("") + `
    <tr style="background:rgba(225,180,52,.12);font-weight:600;">
      <td style="padding:7px 8px;border:1px solid rgba(225,180,52,.25);white-space:nowrap;text-align:left;"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#9aa0a6;margin-right:7px;vertical-align:middle;"></span><span style="vertical-align:middle;">Қорытынды</span></td>
      <td style="text-align:center;color:#f6d66c;border:1px solid rgba(225,180,52,.25);">${itogPhys}</td>
      <td style="text-align:center;color:#f6d66c;border:1px solid rgba(225,180,52,.25);">${itogEnergy}</td>
      <td style="text-align:center;color:#f6d66c;border:1px solid rgba(225,180,52,.25);">${itogEmo}</td>
    </tr>`;

  const box = document.createElement("div");
  box.style.cssText = "max-width:420px;margin:0 auto 30px;";
  box.innerHTML = `
    <div style="color:#c9bfa8;font-size:14px;margin-bottom:10px;text-align:center;">Денсаулық картасы</div>
    <table style="width:100%;border-collapse:collapse;font-size:13px;color:#eee5d0;border:1px solid rgba(225,180,52,.25);">
      <thead><tr style="color:#8a8098;font-size:11px;"><td style="padding:6px 8px 6px 25px;border:1px solid rgba(225,180,52,.25);">Чакры</td><td style="text-align:center;border:1px solid rgba(225,180,52,.25);">Физика</td><td style="text-align:center;border:1px solid rgba(225,180,52,.25);">Энергия</td><td style="text-align:center;border:1px solid rgba(225,180,52,.25);">Эмоциялар</td></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
  container.insertBefore(box, afterNode.nextSibling);
}

function renderPurposeDiagram(diagramValues, container, afterNode, count) {
  count = count || 4;
  const v = diagramValues;
  const nebo = reduceTo22Diag(v.b + v.d);
  const zemlya = reduceTo22Diag(v.a + v.c);
  const pred1 = reduceTo22Diag(nebo + zemlya);
  const muzh = v.f != null ? reduceTo22Diag(v.f + v.y) : null;
  const zhen = v.g != null ? reduceTo22Diag(v.g + v.k) : null;
  const pred2 = (muzh != null && zhen != null) ? reduceTo22Diag(muzh + zhen) : null;
  const pred3 = pred2 != null ? reduceTo22Diag(pred1 + pred2) : null;
  const pred4 = pred3 != null ? reduceTo22Diag(pred2 + pred3) : null;

  function item(title, formula, result) {
    return `
      <div style="width:180px;text-align:center;">
        <div style="color:#f6d66c;font-family:Georgia,serif;font-size:13px;margin-bottom:6px;">${title}</div>
        <div style="color:#fff;font-family:Georgia,serif;font-size:20px;">${result}</div>
        <div style="color:#8a8098;font-size:11px;">(${formula})</div>
      </div>`;
  }

  const items = [item("Жеке миссия", `Небо ${nebo} + Земля ${zemlya}`, pred1)];
  if (count >= 2 && pred2 != null) items.push(item("Әлеуметтік миссия", `Муж. линия ${muzh} + Жен. линия ${zhen}`, pred2));
  if (count >= 3 && pred3 != null) items.push(item("Рухани миссия", `Личное ${pred1} + Социальное ${pred2}`, pred3));
  if (count >= 4 && pred4 != null) items.push(item("Планетарлық миссия", `Социальное ${pred2} + Духовное ${pred3}`, pred4));

  const rows = [];
  for (let i = 0; i < items.length; i += 2) rows.push(items.slice(i, i + 2));

  const box = document.createElement("div");
  box.style.cssText = "max-width:420px;margin:0 auto 30px;";
  box.innerHTML = rows.map(function (row) {
    return `<div style="display:flex;justify-content:center;gap:24px;margin-bottom:16px;">${row.join("")}</div>`;
  }).join("");
  container.insertBefore(box, afterNode.nextSibling);
}

/* ============================================================
   ПРОГНОЗ ПО ВОЗРАСТНЫМ ПЕРИОДАМ (взрослая матрица)
   ============================================================ */

// 8 "үлкен шеңберлер" по кругу матрицы — те же самые точки, что уже используются
// в диаграмме (buildDiagramSvgMarkup): a=0 лет, f=10, b=20, g=30, c=40, y=50, d=60, k=70.
function getForecastAnchors(engine) {
  const refs = { a: "H24", b: "AA6", c: "AS24", d: "AA43", f: "N12", g: "AM12", k: "N37", y: "AM37" };
  const v = {};
  for (const key in refs) v[key] = engine.cell("Диаграмма", refs[key]);
  return [v.a, v.f, v.b, v.g, v.c, v.y, v.d, v.k]; // offsets 0,10,20,30,40,50,60,70
}

// Внутри каждого десятилетия — фиксированная схема из 8 точек (подтверждено реальным
// файлом-калькулятором): якорь + 7 "фракталды" точек, каждая — сумма двух соседних
// уже найденных значений, с приведением к ≤22 (цифровая сумма).
const FORECAST_TEMPLATE = [
  { pos: 0, range: null },
  { pos: 1.25, range: [1, 2.5] },
  { pos: 2.5, range: [2.5, 3.5] },
  { pos: 3.75, range: [3.5, 4] },
  { pos: 5, range: null },
  { pos: 6.25, range: [6, 7.5] },
  { pos: 7.5, range: [7.5, 8.5] },
  { pos: 8.75, range: [8.5, 9] },
];

function forecastFmtAge(n) {
  const rounded = Math.round(n * 10) / 10;
  return Number.isInteger(rounded) ? String(rounded) : String(rounded).replace(".", ",");
}

function forecastLabel(decadeStart, entry) {
  if (entry.range) {
    return `${forecastFmtAge(decadeStart + entry.range[0])}-${forecastFmtAge(decadeStart + entry.range[1])} лет`;
  }
  if (entry.pos === 0) {
    return decadeStart === 0 ? "0/80 жас" : `${decadeStart} лет`;
  }
  return `${decadeStart + entry.pos} лет`;
}

// Строит полную таблицу периодов от 0 до maxAge (по умолчанию с запасом до 90 лет).
function buildForecastTable(anchors, maxAge) {
  maxAge = maxAge || 90;
  const decades = Math.ceil(maxAge / 10) + 1;
  const rows = [];
  for (let d = 0; d < decades; d++) {
    const left = anchors[d % 8];
    const right = anchors[(d + 1) % 8];
    const decadeStart = d * 10;
    const mid5 = reduceTo22Diag(left + right);
    const qLeft = reduceTo22Diag(left + mid5);
    const qRight = reduceTo22Diag(mid5 + right);
    const eLL = reduceTo22Diag(left + qLeft);
    const eLR = reduceTo22Diag(qLeft + mid5);
    const eRL = reduceTo22Diag(mid5 + qRight);
    const eRR = reduceTo22Diag(qRight + right);
    const values = [left, eLL, qLeft, eLR, mid5, eRL, qRight, eRR];
    FORECAST_TEMPLATE.forEach(function (entry, i) {
      rows.push({
        pos: decadeStart + entry.pos,
        label: forecastLabel(decadeStart, entry),
        energy1: values[i],
      });
    });
  }
  rows.push({ pos: decades * 10, label: (decades * 10) === 80 ? "0/80 жас" : `${decades * 10} лет`, energy1: anchors[decades % 8] });

  // 2-я энергия: значение первой энергии на точке ±40 лет (по кругу), 3-я — сумма первых двух.
  const perDecade = FORECAST_TEMPLATE.length; // 8
  rows.forEach(function (row, i) {
    const mirrorSteps = 4 * perDecade; // 40 лет = 4 десятилетия по 8 точек
    let mirrorIdx = i + mirrorSteps;
    if (mirrorIdx >= rows.length) mirrorIdx = i - mirrorSteps;
    const mirrorRow = rows[mirrorIdx];
    row.energy2 = mirrorRow ? mirrorRow.energy1 : row.energy1;
    row.energy3 = reduceTo22Diag(row.energy1 + row.energy2);
  });
  return rows;
}

function computeExactAge(birthDateStr) {
  const [d, m, y] = birthDateStr.split(".").map(Number);
  const birth = new Date(y, m - 1, d);
  const now = new Date();
  let years = now.getFullYear() - birth.getFullYear();
  const thisYearBirthday = new Date(now.getFullYear(), m - 1, d);
  let fraction;
  if (now >= thisYearBirthday) {
    const nextBirthday = new Date(now.getFullYear() + 1, m - 1, d);
    fraction = (now - thisYearBirthday) / (nextBirthday - thisYearBirthday);
  } else {
    years -= 1;
    const prevBirthday = new Date(now.getFullYear() - 1, m - 1, d);
    fraction = (now - prevBirthday) / (thisYearBirthday - prevBirthday);
  }
  return years + fraction;
}

function findNearestForecastIndex(table, age) {
  let bestIdx = 0, bestDist = Infinity;
  table.forEach(function (row, i) {
    const dist = Math.abs(row.pos - age);
    if (dist < bestDist) { bestDist = dist; bestIdx = i; }
  });
  return bestIdx;
}

function forecastEnergyBlockHtml(num, idPrefix, idx) {
  const data = (window.ForecastData && window.ForecastData[String(num)]) || null;
  const id = `${idPrefix}-${idx}`;
  const parts = [];
  if (data) {
    data.main.split(/\n+/).forEach(function (t) {
      if (t.trim()) parts.push(`<p style="margin:0 0 8px;">${escapeHtml(t.trim())}</p>`);
    });
    if (data.positive || data.negative) {
      parts.push(`<p style="color:#f6d66c;font-family:Georgia,serif;font-size:13px;margin:10px 0 6px;">Негізгі оқиғалар болуы мүмкін</p>`);
    }
    if (data.positive) {
      parts.push(`<p style="color:#8fd98f;margin:0 0 2px;font-weight:600;">Оң:</p>`);
      parts.push(`<p style="margin:0 0 8px;">${escapeHtml(data.positive)}</p>`);
    }

      parts.push(`<p style="color:#e08a8a;margin:0 0 2px;font-weight:600;">Теріс:</p>`);
      parts.push(`<p style="margin:0;">${escapeHtml(data.negative)}</p>`);
    }
  } else {
    parts.push(`<p>Текст для энергии ${escapeHtml(String(num))} не найден.</p>`);
  }
  const body = parts.join("");
  return `<div class="accordion-item" style="border-color:rgba(225,180,52,.25);margin-bottom:0;"><button type="button" class="accordion-header" style="font-size:15px;padding:12px 14px;" onclick="toggleAccordionBody('${id}')"><span>Энергия ${escapeHtml(String(num))}</span><span>▾</span></button><div class="accordion-body" id="${id}" style="white-space:normal;">${body}</div></div>`;
}

function forecastPeriodPanelHtml(row, idx) {
  return `<div id="forecastPanel-${idx}" class="forecast-panel" style="display:flex;flex-direction:column;gap:8px;${idx === window._forecastCurrentIdx ? "" : "display:none;"}">
    ${forecastEnergyBlockHtml(row.energy1, "fc1", idx)}
    ${forecastEnergyBlockHtml(row.energy2, "fc2", idx)}

}

function buildForecastHtml(birthDate) {
  const engine = window.AdultMatrixEngine;
  const anchors = getForecastAnchors(engine);
  const table = buildForecastTable(anchors, 90);
  const age = computeExactAge(birthDate);
  const currentIdx = findNearestForecastIndex(table, age);

  // Видимый на платформе диапазон — от «20 лет», ранние детские периоды не показываем.
  const visibleStart = table.findIndex(r => r.pos >= 20);
  const visibleIdxs = [];
  for (let i = visibleStart; i < table.length; i++) visibleIdxs.push(i);

  window._forecastTable = table;
  window._forecastCurrentIdx = currentIdx;
  window._forecastBirthDate = birthDate;

  const tabsHtml = visibleIdxs.map(function (i) {
    const row = table[i];
    const active = i === currentIdx ? " active" : "";
    return `<button type="button" class="materials-tab${active}" id="forecastTab-${i}" onclick="selectForecastPeriod(${i})">${escapeHtml(row.label)}</button>`;
  }).join("");

  const panelsHtml = visibleIdxs.map(i => forecastPeriodPanelHtml(table[i], i)).join("");

  const body = `
    <div class="materials-tabs" style="max-height:140px;overflow-y:auto;">${tabsHtml}</div>
    <div id="forecastPanels">${panelsHtml}</div>`;

  return `
    <div class="accordion-item">
      <button type="button" class="accordion-header" onclick="toggleAccordionBody('forecast-section-body')">
        <span>Болжам</span><span>▾</span>
      </button>
      <div class="accordion-body hidden" id="forecast-section-body">${body}</div>
    </div>`;
}

function selectForecastPeriod(idx) {
  window._forecastCurrentIdx = idx;
  document.querySelectorAll(".forecast-panel").forEach(function (el) { el.style.display = "none"; });
  const panel = document.getElementById("forecastPanel-" + idx);
  if (panel) panel.style.display = "flex";
  document.querySelectorAll("[id^='forecastTab-']").forEach(function (el) { el.classList.remove("active"); });
  const tab = document.getElementById("forecastTab-" + idx);
  if (tab) { tab.classList.add("active"); tab.scrollIntoView({ block: "nearest", inline: "center" }); }
}

function downloadForecastText() {
  const table = window._forecastTable;
  if (!table) return;
  const n = table.length;
  const centerIdx = window._forecastCurrentIdx || 0;
  const idxs = [-2, -1, 0, 1, 2].map(o => Math.min(Math.max(centerIdx + o, 0), n - 1));

  function energyBlockText(num) {
    const data = (window.ForecastData && window.ForecastData[String(num)]) || null;
    if (!data) return "";
    let html = `<div class="entry-block"><div class="num">${escapeHtml(String(num))}</div>`;
    data.main.split(/\n+/).forEach(t => { if (t.trim()) html += `<p>${escapeHtml(t.trim())}</p>`; });
    if (data.positive) html += `<p><strong>Оң:</strong> ${escapeHtml(data.positive)}</p>`;
    if (data.negative) html += `<p><strong>Теріс:</strong> ${escapeHtml(data.negative)}</p>`;
    html += `</div>`;
    return html;
  }

  let bodyHtml = `<h1>Жас кезеңдері бойынша болжам</h1>`;
  idxs.forEach(function (i) {
    const row = table[i];
    bodyHtml += `<h2>${escapeHtml(row.label)}${i === centerIdx ? " (ағымдағы кезең)" : ""}</h2>`;
    bodyHtml += energyBlockText(row.energy1);
    bodyHtml += energyBlockText(row.energy2);
    bodyHtml += energyBlockText(row.energy3);
  });

  downloadHtmlFile("Болжам - " + (window._forecastBirthDate || "") + ".html", bodyHtml);
}

function stripDuplicateTitle(fullText, title) {
  const idx = fullText.indexOf("\n");
  if (idx === -1) return fullText;
  const firstLine = fullText.slice(0, idx).trim();
  if (firstLine === String(title).trim()) {
    return fullText.slice(idx + 1).replace(/^\n+/, "");
  }
  return fullText;
}

function svgElementToPngDataUrl(svgEl) {
  return new Promise(function (resolve) {
    const viewBox = svgEl.getAttribute("viewBox");
    const [, , vbW, vbH] = viewBox ? viewBox.split(/\s+/).map(Number) : [0, 0, 300, 300];
    const scale = 3;
    const clone = svgEl.cloneNode(true);
    clone.setAttribute("width", vbW);
    clone.setAttribute("height", vbH);
    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");

    const svgString = new XMLSerializer().serializeToString(clone);
    const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(svgBlob);

    const img = new Image();
    img.onload = function () {
      const canvas = document.createElement("canvas");
      canvas.width = vbW * scale;
      canvas.height = vbH * scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/png"));
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      resolve(null);
    };
    img.src = url;
  });
}

function downloadHtmlFile(filename, htmlBody) {
  const title = filename.replace(/\.(html|pdf)$/i, "");
  const printCss = `
      @page { margin: 18mm 14mm; }
      * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      html, body { background:#fff; margin:0; padding:0; }
      body { color:#1c332f; font-family:Arial,sans-serif; }
      .doc-wrap { max-width:720px; margin:0 auto; padding:14px; }
      h1 { color:#2f6d6a; font-family:Georgia,serif; font-weight:600; font-size:20px; margin:0 0 16px; line-height:1.3; break-inside: avoid; }
      h2 { color:#2f6d6a; font-family:Georgia,serif; font-weight:600; font-size:17px; margin-top:22px; border-bottom:1px solid #d7aa31; padding-bottom:5px; line-height:1.3; break-after: avoid; break-inside: avoid; }
      .num { color:#4c9d98; font-family:Georgia,serif; font-size:18px; margin:12px 0 4px; font-weight:700; line-height:1.3; break-after: avoid; break-inside: avoid; }
      p { margin:0 0 12px; line-height:1.5; font-size:14px; orphans: 3; widows: 3; }
      table { border-collapse:collapse; width:100%; margin:8px 0; break-inside: avoid; }
      td { padding:5px 4px; font-size:13px; }
      .entry-block { margin-bottom: 8px; }
      .diagram-wrap { text-align:center; margin-bottom:16px; break-inside: avoid; break-after: page; }
      .diagram-wrap, .diagram-wrap * { color: #3a3245 !important; }
      .accordion-item { border: 1px solid #d7aa31; border-radius: 8px; margin-bottom: 8px; }
      .accordion-header { background: #f5eee0; color: #2f6d6a; border: none; padding: 10px 12px; font-family: Georgia, serif; font-size: 16px; display:block; line-height:1.3; }
      .accordion-body { color: #1c332f; padding: 10px 12px; line-height: 1.5; white-space: normal; display: block; }
      .editable-text { color: #1c332f !important; }
      tr, td, img { break-inside: avoid; }
      svg { max-width: 100%; height: auto; }`;

  const fullHtml = `<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<title>${title.replace(/[<>]/g, "")}</title>
<style>${printCss}</style>
</head><body><div class="doc-wrap">${htmlBody}</div>
</body></html>`;

  // Печать через скрытый iframe — родной движок печати браузера. Это ЕДИНСТВЕННЫЙ
  // вариант из всех опробованных, который стабильно давал корректный, читаемый
  // результат без разрывов, дублей и пустых страниц. На html2pdf.js больше не
  // переключаемся — три разных попытки дали три разных вида поломки без возможности
  // протестировать библиотеку вживую и понять точную причину.
  const iframe = document.createElement("iframe");
  iframe.style.cssText = "position:absolute;left:-10000px;top:0;width:800px;height:1200px;border:0;";
  document.body.appendChild(iframe);

  const originalTitle = document.title;
  let cleaned = false;
  function cleanup() {
    if (cleaned) return;
    cleaned = true;
    document.title = originalTitle;
    if (iframe.parentNode) document.body.removeChild(iframe);
  }
  // Убираем окно печати только когда человек реально закрыл диалог печати
  // (событие afterprint), а не по таймеру — на больших расчётах старый таймер
  // срабатывал раньше, чем браузер успевал всё подготовить, и файл получался пустым.
  // На всякий случай оставляем и запасной таймер, вдруг событие не сработает.
  setTimeout(cleanup, 60000);

  iframe.onload = function () {
    try {
      iframe.contentDocument.title = title;
    } catch (e) { /* игнорируем — не критично */ }
    // Аты файла в диалоге печати браузер берёт с заголовка ОСНОВНОЙ вкладки,
    // а не со скрытого окошка — поэтому временно переименовываем и её тоже.
    document.title = title;
    try {
      iframe.contentWindow.onafterprint = cleanup;
    } catch (e) { /* игнорируем */ }
    setTimeout(function () {
      try {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      } catch (error) {
        console.error("Басып шығару қатесі:", error);
        downloadHtmlFallback(filename, htmlBody);
      }
    }, 700);
  };

  const idoc = iframe.contentWindow.document;
  idoc.open();
  idoc.write(fullHtml);
  idoc.close();
}

async function downloadAdultMatrixMobile(name, birthDate) {
  const res = window._lastAdultMatrixResult;
  const v = window._lastDiagramValues;
  if (!res || !v) { downloadAdultMatrixText(name, birthDate); return; }

  const statusEl = document.getElementById("editToggleBtn");
  const btn = event && event.target;
  const oldLabel = btn ? btn.textContent : null;
  if (btn) { btn.textContent = "Файл дайындап жатырмын..."; btn.disabled = true; }

  try {
    // Подтягиваем возможные правки текста прямо со страницы, как и в обычном скачивании.
    const editedTexts = [];
    document.querySelectorAll(".editable-text").forEach(function (el) { editedTexts.push(el.innerText); });
    let cursor = 0;

    function reduceTo22(n) {
      while (n > 22) { n = String(n).split("").reduce((s, d) => s + Number(d), 0); }
      return n;
    }

    const CHAKRA_NAMES = ["Сахасрара", "Аджна", "Вишудха", "Анахата", "Манипура", "Свадхистана", "Муладхара"];
    const l = reduceTo22(v.a + v.b), l1 = reduceTo22(v.a2 + v.b2), l2 = reduceTo22(v.a1 + v.b1),
      l3 = reduceTo22(v.a3 + v.b3), l4 = reduceTo22(v.e + v.e), l5 = reduceTo22(v.d1 + v.c1), l6 = reduceTo22(v.d + v.c);
    const chakras = [
      { phys: v.a, energy: v.b, emo: l }, { phys: v.a2, energy: v.b2, emo: l1 },
      { phys: v.a1, energy: v.b1, emo: l2 }, { phys: v.a3, energy: v.b3, emo: l3 },
      { phys: v.e, energy: v.e, emo: l4 }, { phys: v.c1, energy: v.d1, emo: l5 }, { phys: v.c, energy: v.d, emo: l6 },
    ];
    const CHAKRA_HEX = ["#6bb5b0", "#5b8ef2", "#4fc3c0", "#6fbf5e", "#e0c23e", "#e0913e", "#d1483e"];
    const healthRows = chakras.map((ch, i) => ({ title: CHAKRA_NAMES[i], physics: ch.phys, energy: ch.energy, emotion: ch.emo, color: CHAKRA_HEX[i] }));
    healthRows.push({
      title: "Қорытынды",
      physics: reduceTo22(chakras.reduce((s, c) => s + c.phys, 0)),
      energy: reduceTo22(chakras.reduce((s, c) => s + c.energy, 0)),
      emotion: reduceTo22(chakras.reduce((s, c) => s + c.emo, 0)),
    });

    const nebo = reduceTo22(v.b + v.d), zemlya = reduceTo22(v.a + v.c), pred1 = reduceTo22(nebo + zemlya);
    const muzh = v.f != null ? reduceTo22(v.f + v.y) : null;
    const zhen = v.g != null ? reduceTo22(v.g + v.k) : null;
    const pred2 = (muzh != null && zhen != null) ? reduceTo22(muzh + zhen) : null;
    const pred3 = pred2 != null ? reduceTo22(pred1 + pred2) : null;
    const pred4 = pred3 != null ? reduceTo22(pred2 + pred3) : null;
    const purposeItems = [{ title: "Жеке миссия", formula: `Небо ${nebo} + Земля ${zemlya}`, result: pred1 }];
    if (pred2 != null) purposeItems.push({ title: "Әлеуметтік миссия", formula: `Муж. линия ${muzh} + Жен. линия ${zhen}`, result: pred2 });
    if (pred3 != null) purposeItems.push({ title: "Рухани миссия", formula: `Личное ${pred1} + Социальное ${pred2}`, result: pred3 });
    if (pred4 != null) purposeItems.push({ title: "Планетарлық миссия", formula: `Социальное ${pred2} + Духовное ${pred3}`, result: pred4 });

    const svgEl = document.querySelector("#result svg");
    const diagramPng = svgEl ? await svgElementToPngDataUrl(svgEl) : null;

    function blocksToPayload(blocks) {
      return (blocks || []).map(function (block) {
        return {
          title: block.title,
          entries: (block.entries || []).map(function (e) {
            return { number: e.number ?? e.axis, text: editedTexts[cursor++] ?? e.text };
          }),
        };
      });
    }

    const programs = (res.programs || []).map(function (p) {
      return { title: p.title, text: stripDuplicateTitle(editedTexts[cursor++] ?? p.fullText, p.title) };
    });

    const forecastTable = window._forecastTable;
    let forecast = [];
    if (forecastTable && forecastTable.length) {
      const centerIdx = window._forecastCurrentIdx || 0;
      const idxs = [-2, -1, 0, 1, 2].map(o => Math.min(Math.max(centerIdx + o, 0), forecastTable.length - 1));
      idxs.forEach(function (i) {
        const row = forecastTable[i];
        [row.energy1, row.energy2, row.energy3].forEach(function (num) {
          const data = (window.ForecastData && window.ForecastData[String(num)]) || null;
          if (!data) return;
          forecast.push({ label: row.label + " — Энергия " + num, text: data.main });
        });
      });
    }

    const filename = "Ересек матрица - " + name + " - " + birthDate + ".pdf";
    const title = "Ересек матрица — " + name + " (" + birthDate + ")";
    const fullRasshifrovka = blocksToPayload(res.rasshifrovka);
    const fullHealth = blocksToPayload(res.health);

    // Делим все записи на порции — так каждый запрос к серверу остаётся
    // лёгким и укладывается в его лимиты, даже если весь расчёт очень длинный.
    const CHUNK_SIZE = 8;
    function chunkBlocks(blocks) {
      const chunks = [];
      let current = [];
      let count = 0;
      blocks.forEach(function (block) {
        let entriesLeft = block.entries;
        while (entriesLeft.length) {
          const room = CHUNK_SIZE - count;
          const take = entriesLeft.slice(0, room);
          entriesLeft = entriesLeft.slice(room);
          current.push({ title: block.title, entries: take });
          count += take.length;
          if (count >= CHUNK_SIZE) { chunks.push(current); current = []; count = 0; }
        }
      });
      if (current.length) chunks.push(current);
      return chunks;
    }

    const rasshChunks = chunkBlocks(fullRasshifrovka);
    const healthChunks = chunkBlocks(fullHealth);

    const requests = [];
    // Первый запрос — титул, диаграмма, карта здоровья (таблица), числа предназначения + первая порция текста.
    requests.push({
      title, diagramPng, healthRows, purposeItems,
      rasshifrovka: rasshChunks[0] || [],
    });
    for (let i = 1; i < rasshChunks.length; i++) {
      requests.push({ rasshifrovka: rasshChunks[i] });
    }
    healthChunks.forEach(function (chunk) { requests.push({ health: chunk }); });
    if (programs.length || forecast.length) {
      requests.push({ programs, forecast });
    }

    const { data: { session } } = await supabaseClient.auth.getSession();
    const authToken = session ? session.access_token : SUPABASE_KEY;

    const pdfBlobs = [];
    for (let i = 0; i < requests.length; i++) {
      if (btn) btn.textContent = "Файл дайындап жатырмын... (" + (i + 1) + "/" + requests.length + ")";
      const resp = await fetch("https://skvprhqsxnlacshucncq.supabase.co/functions/v1/generate-pdf", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
        body: JSON.stringify(requests[i]),
      });
      if (!resp.ok) throw new Error("Сервер бөлікте қате қайтарды " + (i + 1) + ": " + resp.status);
      pdfBlobs.push(await resp.arrayBuffer());
    }

    if (btn) btn.textContent = "Склеиваю файл...";
    const merged = await PDFLib.PDFDocument.create();
    for (const bytes of pdfBlobs) {
      const src = await PDFLib.PDFDocument.load(bytes);
      const copiedPages = await merged.copyPages(src, src.getPageIndices());
      copiedPages.forEach(function (p) { merged.addPage(p); });
    }
    const mergedBytes = await merged.save();
    const blob = new Blob([mergedBytes], { type: "application/pdf" });
    const file = new File([blob], filename, { type: "application/pdf" });

    let shared = false;
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file] });
        shared = true;
      } catch (e) {
        if (e && e.name === "AbortError") shared = true; // сам закрыл окно — это не ошибка
        // В остальных случаях (например, слишком много времени прошло с момента нажатия
        // кнопки) — просто скачиваем файл обычным способом ниже, а не считаем это сбоем.
      }
    }
    if (!shared) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
  } catch (error) {
    console.error("Мобильді жүктеп алу қатесі:", error);
    customAlert("Серверде файл жасау мүмкін болмады (" + (error.message || error) + "). Әдеттегі тәсілмен көріп жатырмын.");
    downloadAdultMatrixText(name, birthDate);
  } finally {
    if (btn) { btn.textContent = oldLabel; btn.disabled = false; }
  }
}

function downloadAdultMatrixText(name, birthDate) {
  const res = window._lastAdultMatrixResult;
  if (!res) return;

  // Подтягиваем возможные правки из полей на странице по порядку их появления.
  const editedTexts = [];
  document.querySelectorAll(".editable-text").forEach(function (el) { editedTexts.push(el.innerText); });
  let cursor = 0;

  // Диаграмма + карта здоровья + предназначение — берём уже отрисованные SVG/таблицы прямо со страницы.
  // Диаграмма + карта здоровья + предназначение — берём уже отрисованные блоки прямо со страницы
  // (это все прямые дочерние div контейнера результата, кроме основного текстового блока).
  const extraBlocksHtml = Array.from(document.querySelectorAll("#result > div"))
    .filter(function (div) { return div.style.maxWidth !== "760px"; })
    .map(function (div) { return div.outerHTML; })
    .join("");

  let bodyHtml = `<div class="diagram-wrap">${extraBlocksHtml}</div>`;
  bodyHtml += `<h1>Ересек матрица — ${escapeHtml(name)} (${escapeHtml(birthDate)})</h1>`;

  function textToHtml(text) {
    // Переносы строк внутри текста превращаем в настоящие абзацы, а не склеиваем всё подряд.
    return text.split(/\n+/).map(function (line) {
      return line.trim() ? `<p>${escapeHtml(line)}</p>` : "";
    }).join("");
  }

  function forecastBlockHtml() {
    const table = window._forecastTable;
    if (!table || !table.length) return "";
    const centerIdx = window._forecastCurrentIdx || 0;
    const idxs = [-2, -1, 0, 1, 2].map(o => Math.min(Math.max(centerIdx + o, 0), table.length - 1));
    let html = `<h2>Болжам</h2>`;
    idxs.forEach(function (i) {
      const row = table[i];
      html += `<div class="num" style="font-size:15px;">${escapeHtml(row.label)}${i === centerIdx ? " (ағымдағы кезең)" : ""}</div>`;
      [row.energy1, row.energy2, row.energy3].forEach(function (num) {
        const data = (window.ForecastData && window.ForecastData[String(num)]) || null;
        if (!data) return;
        html += `<div class="entry-block"><div class="num" style="font-size:15px;">Энергия ${escapeHtml(String(num))}</div>`;
        data.main.split(/\n+/).forEach(function (t) { if (t.trim()) html += `<p>${escapeHtml(t.trim())}</p>`; });
        if (data.positive) html += `<p><strong>Оң:</strong> ${escapeHtml(data.positive)}</p>`;
        if (data.negative) html += `<p><strong>Теріс:</strong> ${escapeHtml(data.negative)}</p>`;
        html += `</div>`;
      });
    });
    return html;
  }

  function programsBlockHtml() {
    if (!res.programs.length) return "";
    let html = `<h2>Бағдарламалар</h2>`;
    res.programs.forEach(function (p) {
      const text = stripDuplicateTitle(editedTexts[cursor++] ?? p.fullText, p.title);
      html += `<div class="entry-block"><div class="num" style="font-size:15px;">${escapeHtml(p.title)}</div>${textToHtml(text)}</div>`;
    });
    return html;
  }

  // Точно тот же порядок, что и на странице: программы и прогноз вставляются сразу после
  // блока «Материальная карма с прошлой жизни», а не в конце.
  res.rasshifrovka.forEach(function (block) {
    bodyHtml += `<h2>${escapeHtml(block.title)}</h2>`;
    block.entries.forEach(function (e) {
      bodyHtml += `<div class="entry-block"><div class="num">${escapeHtml(String(e.number))}</div>${textToHtml(editedTexts[cursor++] ?? e.text)}</div>`;
    });
    if (block.title.toLowerCase().startsWith("материалдық карма")) {
      bodyHtml += programsBlockHtml();
      bodyHtml += forecastBlockHtml();
    }
  });

  res.health.forEach(function (block) {
    bodyHtml += `<h2>${escapeHtml(block.title)}</h2>`;
    block.intro.forEach(function (t) { bodyHtml += `<p>${escapeHtml(t)}</p>`; });
    block.entries.forEach(function (e) {
      bodyHtml += `<div class="entry-block"><div class="num">${escapeHtml(e.axis)}: ${escapeHtml(String(e.number))}</div>${textToHtml(editedTexts[cursor++] ?? e.text)}</div>`;
    });
  });

  downloadHtmlFile("Ересек матрица - " + name + " - " + birthDate + ".html", bodyHtml);
}

function calculatePythagoras() {
  const lastName = document.getElementById("pythLastName")?.value.trim();
  const firstName = document.getElementById("pythFirstName")?.value.trim();
  const patronymic = document.getElementById("pythPatronymic")?.value.trim();
  const alphabet = document.getElementById("pythAlphabet")?.value || "russian";
  const birthDate = document.getElementById("birthDate")?.value.trim();
  const dateError = document.getElementById("dateError");
  const result = document.getElementById("result");
  if (dateError) dateError.textContent = "";
  if (result) result.innerHTML = "";

  if (!lastName || !firstName) {
    if (dateError) dateError.textContent = "Введите фамилию и имя.";
    return;
  }
  if (!isValidBirthDate(birthDate)) {
    if (dateError) dateError.textContent = "Введите корректную дату рождения в формате КК.АА.ЖЖЖЖ.";
    return;
  }
  if (!result || !window.PythagorasEngine) return;

  const [d, m, y] = birthDate.split(".").map(Number);

  let res;
  try {
    res = window.PythagorasEngine.getFullResult(d, m, y, lastName, firstName, patronymic, alphabet);
  } catch (error) {
    console.error("Пифагор бойынша есептеу қатесі:", error);
    result.innerHTML = `<div style="color:#ff9d9d;padding:16px;">Не удалось выполнить расчёт: ${escapeHtml(error.message || String(error))}</div>`;
    return;
  }

  renderEditableResult(res.blocks, result, "Пифагор бойынша нумерология - " + lastName + " " + firstName, birthDate, "pythagoras");
  renderPythDigitSquare(res.psychomatrix, result);
  window._lastPythagorasResult = res;
  saveCalculationHistory({
    direction: "pythagoras",
    title: "Пифагор бойынша нумерология - " + lastName + " " + firstName + " - " + birthDate,
    personName: lastName + " " + firstName,
    birthDate, lastName, firstName, patronymic, alphabet,
  });
}

function renderPythDigitSquare(psychomatrix, container) {

  const q = psychomatrix.qualities;

        </div>`;
    }).join("") + `</div>`;
  }).join("");

  const box = document.createElement("div");
  box.style.cssText = "max-width:420px;margin:0 auto 30px;";
  let html = `<div style="text-align:center;color:#c9bfa8;font-size:14px;margin-bottom:6px;">Сіздің Пифагор квадратыңыз</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:18px;">${cellsHtml}</div>`;

  if (q) {
    const qualityCards = [
      ["Самооценка", "баған 1-2-3", q.samootsenka],
      ["Ақша құндылығы", "баған 4-5-6", q.tsennostDeneg],
      ["Талант әлеуеті", "баған 7-8-9", q.potentsialTalanta],
      ["Мақсаттылық", "жол 1-4-7", q.tseleustremlennost],
      ["Отбасылық", "жол 2-5-8", q.semeynost],
      ["Тұрақтылық", "жол 3-6-9", q.stabilnost],

function toggleResultEditing(btn) {

  const nowEditing = btn.dataset.editing !== "true";
  editables.forEach(function (el) {

async function downloadTextFile(filename, text) {
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });

  // На iPhone/iPad обычный <a download> часто просто открывает файл вместо скачивания.
  // Пытаемся сначала через нативное меню «Поделиться» — там есть «Сақтау в Файлы».
  if (navigator.canShare && navigator.share) {
    try {
      const file = new File([blob], filename, { type: "text/plain" });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    } catch (err) {
      // Пайдаланушы мог отменить — тогда просто пробуем обычный способ ниже.
      if (err && err.name === "AbortError") return;
    }
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function downloadEditableResult(personLabel, dateLabel) {
  const blocks = window._lastEditableBlocks;
  if (!blocks) return;

  // Подтягиваем возможные правки прямо из отредактированных полей на странице.
  document.querySelectorAll(".editable-text").forEach(function (el) {
    const b = Number(el.dataset.block), e = Number(el.dataset.entry);
    if (blocks[b] && blocks[b].entries[e]) {
      blocks[b].entries[e].text = el.innerText;
    }
  });

  // Если на странице уже отрисована диаграмма/карта здоровья/предназначение — берём её тоже.
  const extraBlocksHtml = Array.from(document.querySelectorAll("#result > div"))
    .filter(function (div) { return div.style.maxWidth !== "760px"; })
    .map(function (div) { return div.outerHTML; })
    .join("");

  let bodyHtml = extraBlocksHtml ? `<div class="diagram-wrap">${extraBlocksHtml}</div>` : "";
  bodyHtml += `<h1>${escapeHtml(personLabel)}${dateLabel ? " (" + escapeHtml(dateLabel) + ")" : ""}</h1>`;
  blocks.forEach(function (block) {
    bodyHtml += `<h2>${escapeHtml(block.title)}</h2>`;
    block.entries.forEach(function (e) {
      const numLabelPdf = typeof e.number === "number" ? String(e.number) : (typeof e.number === "string" ? e.number.trim() : "");
      bodyHtml += (numLabelPdf ? `<div class="num">${escapeHtml(numLabelPdf)}</div>` : "") + `<p>${escapeHtml(e.text)}</p>`;
    });
  });

  downloadHtmlFile(personLabel + (dateLabel ? " - " + dateLabel : "") + ".html", bodyHtml);
}

function calculateCompatibility() {
  const birthDate1 = document.getElementById("birthDate1")?.value.trim();
  const birthDate2 = document.getElementById("birthDate2")?.value.trim();
  const dateError = document.getElementById("dateError");
  const result = document.getElementById("result");
  if (dateError) dateError.textContent = "";
  if (result) result.innerHTML = "";

  if (!isValidBirthDate(birthDate1) || !isValidBirthDate(birthDate2)) {
    if (dateError) dateError.textContent = "Введите обе даты рождения в формате КК.АА.ЖЖЖЖ.";
    return;
  }
  if (!result || !window.CompatibilityEngine) return;

  const [d1, m1, y1] = birthDate1.split(".").map(Number);
  const [d2, m2, y2] = birthDate2.split(".").map(Number);

  let res;
  try {
    res = window.CompatibilityEngine.getFullResult(d1, m1, y1, d2, m2, y2);
  } catch (error) {
    console.error("Ошибка расчёта совместимости:", error);
    result.innerHTML = `<div style="color:#ff9d9d;padding:16px;">Не удалось выполнить расчёт: ${escapeHtml(error.message || String(error))}</div>`;
    return;
  }

  renderEditableResult(res.blocks, result, "Үйлесімділік - " + birthDate1 + " и " + birthDate2, "", "compatibility");
  renderCompatibilityDiagrams(d1, m1, y1, d2, m2, y2, result);
  saveCalculationHistory({
    direction: "compatibility",
    title: "Үйлесімділік - " + birthDate1 + " и " + birthDate2,
    birthDate: birthDate1, birthDate2,
  });
}

function computeDiamondPoints(day, month, year) {
  const A = reduceTo22(day);
  const B = month;
  const C = reduceTo22(String(year).split("").reduce((sum, d) => sum + Number(d), 0));
  const D = reduceTo22(A + B + C);
  return { A, B, C, D };
}

function renderCompatibilityDiagrams(d1, m1, y1, d2, m2, y2, container) {
  const engine = window.CompatibilityEngine;
  engine.calculate(d1, m1, y1, d2, m2, y2, "", "");

  const p1 = buildDiagramSvgMarkup(engine, "Үйлесімділік диаграммасы", 0, "small", false, true);
  const p2 = buildDiagramSvgMarkup(engine, "Үйлесімділік диаграммасы", 88, "small", false, true);
  // Полная диаграмма пары — с углами f/g/k/y и линией благополучия, но БЕЗ подточек s1/s2/p1-p4/e1/e2
  // (лишние для сводной диаграммы пары) и без подписей «линия мужского/женского рода».
  // Если этих ячеек нет в листе на этом смещении строк — откатываемся к полностью упрощённой версии,
  // чтобы не сломать всю диаграмму совместимости.
  const combined = buildDiagramSvgMarkup(engine, "Үйлесімділік диаграммасы", 175, "small", "corners", true)
    || buildDiagramSvgMarkup(engine, "Үйлесімділік диаграммасы", 175, "small", true, true);
  if (!p1 || !p2 || !combined) return;

  function labeledDiagram(title, result) {
    // У маленькой диаграммы жёсткий предел max-width:250px в самой разметке — увеличиваем,
    // но не так сильно, как раньше, чтобы все три диаграммы поместились на одной странице.
    const biggerSvg = result.svg.replace("max-width:250px", "max-width:300px");
    return `<div style="width:100%;max-width:300px;margin:0 auto;text-align:center;">
      <div style="color:#c9bfa8;font-size:13px;margin-bottom:6px;">${escapeHtml(title)}</div>
      ${biggerSvg}
    </div>`;
  }

  const box = document.createElement("div");
  box.style.cssText = "max-width:660px;margin:0 auto 30px;page-break-inside:avoid;break-inside:avoid;";
  box.innerHTML = `
    <div style="color:#c9bfa8;font-size:14px;margin-bottom:14px;text-align:center;">Серіктестер мен жұп диаграммалары</div>
    <div style="display:flex;gap:16px;justify-content:center;flex-wrap:nowrap;margin-bottom:16px;">
      ${labeledDiagram("1-серіктес", p1)}
      ${labeledDiagram("2-серіктес", p2)}
    </div>
    <div style="display:flex;justify-content:center;">
      ${labeledDiagram("Жұп", combined)}
    </div>`;
  container.insertBefore(box, container.firstChild);

  renderPurposeDiagram(combined.values, container, box, 3);
}

async function startTest(direction, title) {
  testPageShell(`<p>Сұрақтар жүктелуде...</p>`);

  try {
    const { data, error } = await supabaseClient
      .from(TEST_QUESTIONS_TABLE)
      .select("id, question_order, question_text, option_a, option_b, option_c, option_d, correct_option")
      .eq("direction", direction)
      .order("question_order", { ascending: true });
    if (error) throw error;
    if (!data || !data.length) {
      testPageShell(`<div class="table-card"><div class="empty-table">Сұрақтар табылмады.</div></div>`);
      return;
    }

    testState = { direction, title, questions: data, currentIndex: 0, answers: {} };
    renderTestQuestion();
  } catch (error) {
    console.error("Тестті бастау қатесі:", error);
    testPageShell(`<div class="table-card"><div class="empty-table">Сұрақтарды жүктеу мүмкін болмады.</div></div>`);
  }
}

        <div id="testOptionsBox">
