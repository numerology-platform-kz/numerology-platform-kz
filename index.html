async function loadDeletedUsersLog() {
  const box = document.getElementById("deletedUsersTable");
  if (!box) return;
  const isRealAdmin = window.currentUserRole === "admin";
  const { data: { session } } = await supabaseClient.auth.getSession();

  let query = supabaseClient
    .from("profiles")
    .select("id, first_name, last_name, email, role, created_at, deleted_at, deleted_by, teacher_id, status, restored_at")
    .in("status", ["deleted", "active"])
    .order("deleted_at", { ascending: false });
  if (!isRealAdmin) query = query.eq("teacher_id", session.user.id);

  const { data, error } = await query;
  if (error) { box.innerHTML = `<div class="empty-table">Журналды жүктеу мүмкін болмады.</div>`; return; }

  const allProfiles = data || [];
  const deletedProfiles = allProfiles.filter(p => p.status === "deleted");
  const activeCandidates = allProfiles.filter(p => p.status !== "deleted" && (p.role === "student" || p.role === "numerologist"));

  // Кім жойғанын (әкімші немесе нақты ұстаз) бір сұраныспен аламыз.
  const deleterIds = [...new Set(deletedProfiles.map(r => r.deleted_by).filter(Boolean))];
  const deleterNameById = {};
  if (deleterIds.length) {
    const { data: deleters } = await supabaseClient.from("profiles").select("id, role, first_name, last_name, email").in("id", deleterIds);
    (deleters || []).forEach(d => {
      deleterNameById[d.id] = d.role === "admin" ? "Admin" : ("Teacher: " + ([d.last_name, d.first_name].filter(Boolean).join(" ") || d.email));
    });
  }

  const fmtDT = (v) => v ? new Date(v).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
  const profileById = {};
  allProfiles.forEach(p => { profileById[p.id] = p; });

  // Оқиғалар журналы: әр жою және әр қалпына келтіру — жеке жол, ештеңе жоғалмайды.
  const { data: eventsData } = await supabaseClient
    .from("account_events")
    .select("id, user_id, email, first_name, last_name, role, registered_at, event, event_at, actor_id")
    .order("event_at", { ascending: false });
  const events = eventsData || [];
  const actorIds = [...new Set(events.map(e => e.actor_id).filter(Boolean).filter(id => !deleterNameById[id]))];
  if (actorIds.length) {
    const { data: actors } = await supabaseClient.from("profiles").select("id, role, first_name, last_name, email").in("id", actorIds);
    (actors || []).forEach(d => { deleterNameById[d.id] = d.role === "admin" ? "Admin" : ("Teacher: " + ([d.last_name, d.first_name].filter(Boolean).join(" ") || d.email)); });
  }
  const latestEventId = {};
  events.forEach(e => { if (!latestEventId[e.user_id]) latestEventId[e.user_id] = e.id; });

  const eventRows = events.map(e => {
    const prof = profileById[e.user_id];
    const nm = [e.last_name, e.first_name].filter(Boolean).join(" ");
    let action = `<span style="color:#8a8098;font-size:12px;">—</span>`;
    if (latestEventId[e.user_id] === e.id) {
      if (prof && prof.status === "deleted") {
        action = `<button type="button" class="material-manager-button" style="width:auto;padding:6px 10px;font-size:12px;" onclick='restoreUserAccount(${JSON.stringify(e.user_id)}, ${JSON.stringify(nm || e.email)})'>Қалпына келтіру</button>`;
      } else if (!prof && e.event === "deleted" && isRealAdmin) {
        action = `<span style="color:#8a8098;font-size:12px;">Мүлдем жойылды</span>`;
      }
    }
    return {
      id: prof ? e.user_id : null, email: e.email, name: nm,
      role: e.role, registered_at: e.registered_at, restored_at: prof ? prof.restored_at : null, sortDate: e.event_at,
      statusLabel: (e.event === "restored" ? "Қалпына келтірілді " : "Жойылды ") + fmtDT(e.event_at),
      accessLabel: deleterNameById[e.actor_id] || "—",
      action,
    };
  });
  // Журналда жазбасы жоқ жойылған аккаунттар — қалпына келтіру үшін оларды да көрсетеміз.
  const restorable = deletedProfiles.filter(r => !latestEventId[r.id]).map(r => ({
    id: r.id, email: r.email, name: [r.last_name, r.first_name].filter(Boolean).join(" "),
    role: r.role, registered_at: r.created_at, restored_at: r.restored_at, sortDate: r.deleted_at,
    statusLabel: "Жойылды " + fmtDT(r.deleted_at),
    accessLabel: deleterNameById[r.deleted_by] || "—",
    action: `<button type="button" class="material-manager-button" style="width:auto;padding:6px 10px;font-size:12px;" onclick='restoreUserAccount(${JSON.stringify(r.id)}, ${JSON.stringify([r.last_name, r.first_name].filter(Boolean).join(" ") || r.email)})'>Қалпына келтіру</button>`,
  }));

  // Қолжетімділік мерзімінің өтуі — жою емес, бірақ назар аударуды қажет етеді: сол журналда бөлек белгімен көрсетеміз.
  let expired = [];
  if (activeCandidates.length) {
    const { data: periods } = await supabaseClient
      .from("access_periods")
      .select("profile_id, status, ends_at, starts_at, is_unlimited, payment_status, created_at")
      .in("profile_id", activeCandidates.map(p => p.id))
      .order("created_at", { ascending: false });
    const latestByUser = {};
    (periods || []).forEach(p => { if (!latestByUser[p.profile_id]) latestByUser[p.profile_id] = p; });
    expired = activeCandidates
      .map(p => ({ profile: p, period: latestByUser[p.id] }))
      .filter(x => x.period && !x.period.is_unlimited && !hasActivePlatformAccess(x.period))
      .map(({ profile: r, period }) => {
        const days = Math.max(1, Math.round((new Date(period.ends_at) - new Date(period.starts_at)) / 86400000));
        const durationLabel = days >= 28 ? Math.round(days / 30) + " ай" : days + " күн";
        return {
          id: r.id, email: r.email, name: [r.last_name, r.first_name].filter(Boolean).join(" "),
          role: r.role, registered_at: r.created_at, restored_at: r.restored_at, sortDate: period.ends_at,
          statusLabel: "Мерзімі өтті " + new Date(period.ends_at).toLocaleDateString("ru-RU"),
          accessLabel: `Мерзімі өтті (${durationLabel})`,
          action: `<button type="button" class="material-manager-button" style="width:auto;padding:6px 10px;font-size:12px;" onclick='scrollToGrantAccess(${JSON.stringify(r.id)})'>Жаңарту</button>`,
        };
      });
  }

  const rows = [...eventRows, ...restorable, ...expired].sort((a, b) => new Date(b.sortDate) - new Date(a.sortDate));
  if (!rows.length) { box.innerHTML = `<div class="empty-table">Әлі ешкім жойылған жоқ және ешкімнің мерзімі өтпеген.</div>`; return; }

  const headerHtml = `<thead><tr><th>Email</th><th>Аты</th><th>Рөл</th><th>Тіркелген</th><th>Мәртебе</th><th>Қолжетімділік</th><th>Әрекет</th></tr></thead>`;
  const rowsHtml = rows.map(r => `
          <tr>
            <td>${r.id ? `<a href="javascript:void(0)" style="color:#8a8098;text-decoration:underline;" onclick='showUserDetailModal(${JSON.stringify(r.id)})'>${escapeHtml(r.email || "—")}</a>` : escapeHtml(r.email || "—")}</td>
            <td>${escapeHtml(r.name || "—")}</td>
            <td>${escapeHtml(roleLabel(r.role))}</td>
            <td>${r.registered_at ? fmtDT(r.registered_at) : "—"}${r.restored_at ? " / " + fmtDT(r.restored_at) : ""}</td>
            <td>${escapeHtml(r.statusLabel)}</td>
            <td>${escapeHtml(r.accessLabel)}</td>
            <td>${r.action}</td>
          </tr>`);
  box.innerHTML = paginatedTableHtml("deletedUsersTable", headerHtml, rowsHtml, 15);
}

async function confirmRestoreUser(userId) {
  const btn = document.getElementById("confirmRestoreBtn");
  const msg = document.getElementById("restoreModalMessage");
  if (btn) { btn.disabled = true; btn.textContent = "Қалпына келтіріп жатырмын..."; }
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    const resp = await fetch(SUPABASE_URL + "/functions/v1/delete-user", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + session.access_token },
      body: JSON.stringify({ userId, action: "restore" }),
    });
    const result = await resp.json();
    if (!resp.ok || result.error) throw new Error(result.error || ("Сервер қате қайтарды " + resp.status));
    closeModal();
    loadAdminUsers();
  } catch (error) {
    console.error("Пайдаланушыны қалпына келтіру қатесі:", error);
    if (msg) { msg.textContent = "Аккаунтты қалпына келтіру мүмкін болмады: " + (error.message || error); msg.style.color = "#ff9d9d"; }
    if (btn) { btn.disabled = false; btn.textContent = "Қалпына келтіру"; }
  }
}

const TERM_OPTIONS = [
  { value: "unlimited", label: "Мерзімсіз" },
  { value: "30", label: "1 ай" },
  { value: "90", label: "3 ай" },
  { value: "180", label: "6 ай" },
  { value: "365", label: "12 ай" }
];

function termSelectHtml(extraClass, attrs) {
  return `<select class="material-manager-input ${extraClass || ""}" ${attrs || ""} style="margin-bottom:0;padding:8px 10px;width:auto;">
    ${TERM_OPTIONS.map(t => `<option value="${t.value}">${t.label}</option>`).join("")}
  </select>`;
}

function computeEndsAt(termValue) {
  if (termValue === "unlimited") return { unlimited: true, ends_at: null };
  const days = Number(termValue);
  const d = new Date(Date.now() + days * 24 * 60 * 60 * 1000);
  return { unlimited: false, ends_at: d.toISOString() };
}

function toggleScopeAll(checked) {
  document.querySelectorAll(".scope-cell, .scope-flag, .scope-visible").forEach(function (el) { el.checked = checked; });
}

function fillScopeCheckboxes(scope) {
  scope = scope || {};
  document.querySelectorAll(".scope-cell").forEach(function (el) {
    const dir = el.dataset.direction, type = el.dataset.type;
    const item = (scope[dir] || {})[type];
    el.checked = !!(item && item.granted);
    const termSelect = document.querySelector(`.scope-term-row[data-direction="${dir}"]`);
    if (termSelect && item && item.granted) termSelect.value = item.unlimited ? "unlimited" : (item.ends_at ? String(Math.max(1, Math.round((new Date(item.ends_at) - new Date()) / 86400000))) : "unlimited");
  });
  const setFlag = function (checkboxId, termId, item) {
    const cb = document.getElementById(checkboxId);
    const term = document.getElementById(termId);
    if (cb) cb.checked = !!(item && item.granted);
    if (term && item && item.granted) term.value = item.unlimited ? "unlimited" : (item.ends_at ? String(Math.max(1, Math.round((new Date(item.ends_at) - new Date()) / 86400000))) : "unlimited");
  };
  setFlag("scopeLibrary", "scopeLibraryTerm", scope.library);
  setFlag("scopeMyCalc", "scopeMyCalcTerm", scope.my_calculations);
  setFlag("scopeAccess", "scopeAccessTerm", scope.access);
  setFlag("scopeStatistics", "scopeStatisticsTerm", scope.statistics);
  document.querySelectorAll(".scope-visible").forEach(function (el) {
    const dirScope = scope[el.dataset.direction] || {};
    const vt = dirScope.visible_types;
    el.checked = (vt && typeof vt === "object") ? vt[el.dataset.type] === true : dirScope.visible === true;
  });
  const allBox = document.getElementById("scopeSelectAll");
  if (allBox) allBox.checked = Array.from(document.querySelectorAll(".scope-cell, .scope-flag, .scope-visible")).every(el => el.checked);
}

async function loadScopeForSelectedUser() {
  const userId = document.getElementById("accessUserSelect")?.value || "";
  document.querySelectorAll(".scope-cell, .scope-flag, .scope-visible").forEach(function (el) { el.checked = false; });
  if (!userId) return;
  const { data, error } = await supabaseClient
    .from("access_periods")
    .select("status, payment_status, starts_at, ends_at, is_unlimited, granted_scope, created_at")
    .eq("profile_id", userId)
    .order("created_at", { ascending: false })
    .limit(10);
  if (error) { console.error("Ошибка загрузки текущего доступа:", error); return; }
  const activePeriods = (data || []).filter(hasActivePlatformAccess);
  fillScopeCheckboxes(activePeriods[0]?.granted_scope || {});
}

function collectScope() {
  const scope = {};
  DIRECTIONS.forEach(function (d) { scope[d.key] = {}; });

  document.querySelectorAll(".scope-cell").forEach(function (el) {
    const dir = el.dataset.direction, type = el.dataset.type;
    if (!el.checked) { scope[dir][type] = { granted: false }; return; }
    const termSelect = document.querySelector(`.scope-term-row[data-direction="${dir}"]`);
    const term = termSelect ? termSelect.value : "unlimited";
    scope[dir][type] = Object.assign({ granted: true }, computeEndsAt(term));
  });

  document.querySelectorAll(".scope-visible").forEach(function (el) {
    const dir = scope[el.dataset.direction];
    dir.visible_types = dir.visible_types || {};
    dir.visible_types[el.dataset.type] = el.checked;
    if (el.checked) dir.visible = true;
    else if (dir.visible !== true) dir.visible = false;
  });

  const libChecked = document.getElementById("scopeLibrary")?.checked;
  const libTerm = document.getElementById("scopeLibraryTerm")?.value || "unlimited";
  scope.library = libChecked ? Object.assign({ granted: true }, computeEndsAt(libTerm)) : { granted: false };

  const calcChecked = document.getElementById("scopeMyCalc")?.checked;
  const calcTerm = document.getElementById("scopeMyCalcTerm")?.value || "unlimited";
  scope.my_calculations = calcChecked ? Object.assign({ granted: true }, computeEndsAt(calcTerm)) : { granted: false };

  const accessChecked = document.getElementById("scopeAccess")?.checked;
  const accessTerm = document.getElementById("scopeAccessTerm")?.value || "unlimited";
  scope.access = accessChecked ? Object.assign({ granted: true }, computeEndsAt(accessTerm)) : { granted: false };

  const statsChecked = document.getElementById("scopeStatistics")?.checked;
  const statsTerm = document.getElementById("scopeStatisticsTerm")?.value || "unlimited";
  scope.statistics = statsChecked ? Object.assign({ granted: true }, computeEndsAt(statsTerm)) : { granted: false };

  return scope;
}

function scopeHasAnything(scope) {
  return Object.keys(scope).some(function (key) {
    if (key === "library" || key === "my_calculations" || key === "access" || key === "statistics") return !!scope[key]?.granted;
    if (scope[key] && scope[key].visible === true) return true;
    return Object.values(scope[key] || {}).some(function (item) { return item && item.granted; });
  });
}

async function grantPlatformAccess() {
  const userId = document.getElementById("accessUserSelect")?.value || "";
  const message = document.getElementById("accessAdminMessage");

  const setMsg = function (text, ok) {
    if (!message) return;
    message.textContent = text;
    message.style.color = ok ? "#8fe3a1" : "#ff9d9d";
  };

  if (!userId) { setMsg("Алдымен пайдаланушыны таңдаңыз.", false); return; }

  const scope = collectScope();
  if (!scopeHasAnything(scope)) { setMsg("Қолжетімділіктің кем дегенде бір тармағын белгілеңіз.", false); return; }

  setMsg("Қолжетімділік беріп жатырмын...", true);

  const startsAt = new Date();

  const { error: closeError } = await supabaseClient
    .from("access_periods")
    .update({ status: "expired" })
    .eq("profile_id", userId)
    .eq("status", "active");
  if (closeError) console.warn("Ескі қолжетімділікті жабу мүмкін болмады:", closeError);

  // Общий срок записи считаем по факту выбранных галочек: если ХОТЯ БЫ ОДНА не бессрочная —
  // запись целиком считается срочной, и её датой окончания берём САМУЮ ПОЗДНЮЮ из выбранных сроков
  // (чтобы «Қолжетімділік мерзімі өтті» в общей таблице срабатывал только когда реально закончились ВСЕ пункты).
  let overallUnlimited = true;
  let overallEndsAt = null;
  Object.keys(scope).forEach(function (key) {
    const val = scope[key];
    const items = (val && typeof val.granted === "boolean") ? [val] : Object.values(val || {});
    items.forEach(function (item) {
      if (!item || !item.granted) return;
      if (item.unlimited) return;
      overallUnlimited = false;
      if (item.ends_at && (!overallEndsAt || new Date(item.ends_at) > new Date(overallEndsAt))) {
        overallEndsAt = item.ends_at;
      }
    });
  });

  // Мерзім хранится по каждому пункту внутри granted_scope,
  // общая запись access_periods дублирует самый долгий срок — для показа в общей таблице пользователей.
  const { error } = await supabaseClient.from("access_periods").insert({
    profile_id: userId,
    status: "active",
    payment_status: "paid",
    starts_at: startsAt.toISOString(),
    ends_at: overallUnlimited ? null : overallEndsAt,
    is_unlimited: overallUnlimited,
    granted_scope: scope
  });

  if (error) {
    console.error("Қолжетімділік беру қатесі:", error);
    setMsg("Қолжетімділік беру мүмкін болмады: " + (error.message || "Supabase қатесі"), false);
    return;
  }

  setMsg("Қолжетімділік сәтті берілді.", true);
  await loadAdminUsers();
}

async function renderStatistics() {
  const contentCards = document.getElementById("contentCards");
  if (!contentCards) return;
  contentCards.className = "";

  const isRealAdmin = window.currentUserRole === "admin";
  const { data: { session } } = await supabaseClient.auth.getSession();

  contentCards.innerHTML = `
    <div class="dashboard-wrap">
      <div class="dashboard-head">
        <div><h2>Есептер мен статистика</h2><p>${isRealAdmin ? "Платформаның негізгі көрсеткіштері." : "Сіздің оқушыларыңыз бойынша көрсеткіштер."}</p></div>
      </div>
      <div class="stats-grid" id="clientStats">
        <div class="stat-card"><span>Барлық ${isRealAdmin ? "клиенттер" : "оқушылар"}</span><strong>…</strong></div>
        <div class="stat-card"><span>Айына жаңалар</span><strong>…</strong></div>

      </div>
      <div class="table-card" style="margin-bottom:18px;">
        <div class="table-title">Бағыттар бойынша есептеулер</div>
        <div class="stats-grid" id="calcByDirectionStats">Жүктелуде...</div>
      </div>
      ${isRealAdmin ? `
      <div class="table-card" style="margin-bottom:18px;">
        <div class="table-title">Кімде қолжетімділік жақында аяқталады (7 күн)</div>
        <div id="expiringSoonTable">Жүктелуде...</div>
      </div>
      <div class="table-card" style="margin-bottom:18px;">
        <div class="table-title">Оқушылар саны бойынша ұстаздар рейтингі</div>
        <div id="teacherLeaderboardTable">Жүктелуде...</div>
      </div>` : ""}
      <div class="table-card">
        <div class="table-title">Тесттер бойынша статистика</div>
        <div style="max-width:340px;margin-bottom:14px;">
          <label style="display:block;color:#8a8098;font-size:13px;margin-bottom:6px;">Оқушы бойынша көрсету</label>
          <select id="testStatsUserFilter" class="material-manager-input" style="margin-bottom:0;" onchange="renderTestStatsTable()"><option value="">Барлығы</option></select>
        </div>
        <div id="testStatsTable">Жүктелуде...</div>
      </div>
    </div>`;

  try {
    // ---- Клиенты/ученики и расчёты ----
    let profilesQuery = supabaseClient.from("profiles").select("id, role, created_at, status");
    if (!isRealAdmin) profilesQuery = profilesQuery.eq("teacher_id", session.user.id);
    const { data: clientProfilesRaw } = await profilesQuery;
    // Жойылған аккаунттар статистикада саналмайды.
    const clientProfiles = (clientProfilesRaw || []).filter((p) => String(p.status || "").toLowerCase() !== "deleted");
    const clients = (clientProfiles || []).filter((p) => p.role !== "admin" && p.role !== "numerologist" || !isRealAdmin);
    const clientIds = new Set((isRealAdmin ? (clientProfiles || []) : clients).map((p) => p.id));

    const now = new Date();
    const newThisMonth = (isRealAdmin ? clientProfiles || [] : clients).filter((p) => {
      const d = new Date(p.created_at);
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    }).length;

    let historyQuery = supabaseClient.from("calculation_history").select("user_id, direction, created_at");
    const { data: allHistory } = await historyQuery;
    const relevantHistory = isRealAdmin ? (allHistory || []) : (allHistory || []).filter((h) => clientIds.has(h.user_id));

    const activeThisMonth = new Set(
      relevantHistory.filter((h) => {
        const d = new Date(h.created_at);
        return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
      }).map((h) => h.user_id)
    ).size;

    document.getElementById("clientStats").innerHTML = `
      <div class="stat-card"><span>Барлық ${isRealAdmin ? "клиенттер" : "оқушылар"}</span><strong>${isRealAdmin ? (clientProfiles || []).length : clients.length}</strong></div>

    document.getElementById("calcByDirectionStats").innerHTML = calcStatsByDirection(relevantHistory);

    // ---- Тесттер бойынша статистика (админ — все, учитель — только свои ученики) ----
    let attemptsQuery = supabaseClient
      .from("test_attempts")
      .select("id, user_id, direction, score, total_questions, answers, completed_at")
      .order("completed_at", { ascending: false });
    if (!isRealAdmin) attemptsQuery = attemptsQuery.in("user_id", [...clientIds]);
    const { data: attempts } = await attemptsQuery;

    const attemptUserIds = [...new Set((attempts || []).map(a => a.user_id))];
    let testNameById = {};
    if (attemptUserIds.length) {
      const { data: attemptProfiles } = await supabaseClient.from("profiles").select("id, first_name, last_name, email").in("id", attemptUserIds);
      testNameById = Object.fromEntries((attemptProfiles || []).map((p) => [p.id, [p.last_name, p.first_name].filter(Boolean).join(" ") || p.email]));
    }
    window.__testAttempts = attempts || [];
    window.__testStatsNameById = testNameById;

    const filterSelect = document.getElementById("testStatsUserFilter");
    if (filterSelect) {
      const seen = new Set();
      const options = ["<option value=\"\">Барлығы</option>"];
      (attempts || []).forEach(a => {
        if (seen.has(a.user_id)) return;
        seen.add(a.user_id);
        options.push(`<option value="${escapeHtml(a.user_id)}">${escapeHtml(testNameById[a.user_id] || a.user_id)}</option>`);
      });
      filterSelect.innerHTML = options.join("");
    }
    renderTestStatsTable();

    if (!isRealAdmin) return;

    // ---- У кого скоро заканчивается доступ ----
    const { data: periods } = await supabaseClient.from("access_periods").select("profile_id, granted_scope");
    const { data: allProfilesForNames } = await supabaseClient.from("profiles").select("id, first_name, last_name, email");
    const nameById = Object.fromEntries((allProfilesForNames || []).map((p) => [p.id, [p.last_name, p.first_name].filter(Boolean).join(" ") || p.email]));

    const in7days = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
    const expiringRows = [];
    function scanScopeForExpiry(scope, profileId, path) {
      if (!scope || typeof scope !== "object") return;
      if (scope.granted && scope.ends_at) {
        const endDate = new Date(scope.ends_at);
        if (endDate >= now && endDate <= in7days) {
          expiringRows.push({ profileId, label: path, endsAt: scope.ends_at });
        }
        return;
      }
      Object.keys(scope).forEach((key) => scanScopeForExpiry(scope[key], profileId, path ? path + " / " + key : key));
    }
    (periods || []).forEach((p) => scanScopeForExpiry(p.granted_scope, p.profile_id, ""));
    expiringRows.sort((a, b) => new Date(a.endsAt) - new Date(b.endsAt));

    document.getElementById("expiringSoonTable").innerHTML = expiringRows.length
      ? `<div style="overflow-x:auto;"><table class="data-table"><thead><tr><th>Пайдаланушы</th><th>Не аяқталады</th><th>Аяқталу күні</th></tr></thead><tbody>
          ${expiringRows.map(r => `<tr><td><a href="javascript:void(0)" style="color:#d7aa31;" onclick='showUserDetailModal(${JSON.stringify(r.profileId)})'>${escapeHtml(nameById[r.profileId] || r.profileId)}</a></td><td>${escapeHtml(r.label)}</td><td>${new Date(r.endsAt).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" })}</td></tr>`).join("")}
        </tbody></table></div>`
      : `<div class="empty-table">Алдағы 7 күнде ешнәрсе аяқталмайды.</div>`;

    // ---- Рейтинг учителей ----
    const { data: allProfilesFullRaw } = await supabaseClient.from("profiles").select("id, first_name, last_name, email, role, teacher_id, status");
    const allProfilesFull = (allProfilesFullRaw || []).filter((p) => String(p.status || "").toLowerCase() !== "deleted");
    const teachers = (allProfilesFull || []).filter((p) => p.role === "numerologist");
    const teacherCounts = teachers.map((t) => ({
      id: t.id,
      name: [t.last_name, t.first_name].filter(Boolean).join(" ") || t.email,
      count: (allProfilesFull || []).filter((p) => p.teacher_id === t.id).length,
    })).sort((a, b) => b.count - a.count);

    document.getElementById("teacherLeaderboardTable").innerHTML = teacherCounts.length
      ? `<div style="overflow-x:auto;"><table class="data-table"><thead><tr><th>Ұстаз</th><th>Оқушылар</th></tr></thead><tbody>
          ${teacherCounts.map(t => `<tr><td><a href="javascript:void(0)" style="color:#d7aa31;" onclick='showUserDetailModal(${JSON.stringify(t.id)})'>${escapeHtml(t.name)}</a></td><td>${t.count}</td></tr>`).join("")}
        </tbody></table></div>`
      : `<div class="empty-table">Әлі ұстаздар жоқ.</div>`;

  } catch (error) {
    console.error("Ошибка статистики:", error);
  }
}

async function showTestAttemptDetail(attemptId) {
  const attempt = (window.__testAttempts || []).find(a => a.id === attemptId);
  if (!attempt) return;

  showModal(`<h3 style="margin-top:0;color:#f6d66c;font-family:PT Serif,Georgia,serif;">Жауаптарды талдау</h3><div id="testDetailBody">Жүктелуде...</div>`);

  const { data: questions, error } = await supabaseClient
    .from("test_questions")
    .select("id, question_order, question_text, option_a, option_b, option_c, option_d, correct_option")
    .eq("direction", attempt.direction)
    .order("question_order", { ascending: true });

  const body = document.getElementById("testDetailBody");
  if (!body) return;
  if (error || !questions) { body.innerHTML = `<div class="empty-table">Сұрақтарды жүктеу мүмкін болмады.</div>`; return; }

  const optionLabel = (q, letter) => ({ a: q.option_a, b: q.option_b, c: q.option_c, d: q.option_d }[letter] || letter);

  body.innerHTML = `<div style="max-height:60vh;overflow-y:auto;">` + questions.map((q, i) => {
    const given = attempt.answers ? attempt.answers[q.id] : null;
    const isCorrect = given === q.correct_option;
    return `<div style="padding:10px 0;border-bottom:1px solid rgba(225,180,52,.18);">
      <div style="color:#f8e7a8;margin-bottom:6px;">${i + 1}. ${escapeHtml(q.question_text)}</div>
      <div style="font-size:13px;color:${isCorrect ? "#8fe3a1" : "#ff9d9d"};">
        ${isCorrect ? "✓ Дұрыс жауап берді" : "✗ Жауабы: " + escapeHtml(given ? optionLabel(q, given) : "—")}
      </div>
      ${!isCorrect ? `<div style="font-size:13px;color:#8a8098;">Дұрыс жауап: ${escapeHtml(optionLabel(q, q.correct_option))}</div>` : ""}
    </div>`;
  }).join("") + `</div>`;
}

function normWhatsapp(v) {
  v = String(v || "").trim();
  if (!v) return "";
  const m = v.match(/wa\.me\/(\+?\d+)/i);
  let d = (m ? m[1] : v).replace(/\D/g, "");
  if (d.length === 11 && d[0] === "8") d = "7" + d.slice(1); // 8 701 … → 7 701 … (Казахстан, Россия)
  return d;
}
function normTelegram(v) {
  v = String(v || "").trim();
  if (!v) return "";
  v = v.replace(/^https?:\/\/(www\.)?(t\.me|telegram\.me)\//i, "").replace(/^@/, "").split(/[/?#]/)[0].trim();
  const digits = v.replace(/[\s()\-+]/g, "");
  if (/^\d{7,15}$/.test(digits) && /^[\s()\-+\d]+$/.test(v)) return "+" + digits;
  return v;
}
function validWhatsapp(d) { return !d || /^\d{10,15}$/.test(d); }
function validTelegram(t) { return !t || /^\+\d{7,15}$/.test(t) || /^[A-Za-z0-9_]{5,32}$/.test(t); }
function whatsappLink(d, text) { return "https://wa.me/" + d + (text ? "?text=" + encodeURIComponent(text) : ""); }
function telegramLink(t) { return "https://t.me/" + t; }
function referralBaseUrl() { return window.location.origin + window.location.pathname.replace(/index\.html$/, ""); }

async function loadReferralFor(profileId) {
  window._refTargetId = profileId;
  const msg = document.getElementById("refMessage");
  if (msg) msg.textContent = "";
  document.getElementById("refWhatsapp").value = "";
  document.getElementById("refTelegram").value = "";
  try {
    const { data: row } = await supabaseClient.from("referral_contacts")
      .select("code, whatsapp, telegram").eq("profile_id", profileId).maybeSingle();
    if (row) {
      document.getElementById("refWhatsapp").value = row.whatsapp ? "+" + row.whatsapp : "";
      document.getElementById("refTelegram").value = row.telegram ? (row.telegram.startsWith("+") ? row.telegram : "@" + row.telegram) : "";
    }
    renderReferralLink(row);
  } catch (e) { console.warn("Ссылка для клиентов не загружена:", e); renderReferralLink(null); }
}

async function copyReferralLink() {
  const input = document.getElementById("refLinkInput");
  const msg = document.getElementById("refMessage");
  if (!input) return;
  try { await navigator.clipboard.writeText(input.value); }
  catch (e) { input.select(); document.execCommand("copy"); }
  if (msg) { msg.style.color = "#8fd98f"; msg.textContent = REF_TEXT.copied; }
}

async function saveReferralContacts() {
  const msg = document.getElementById("refMessage");
  const wa = normWhatsapp(document.getElementById("refWhatsapp").value);
  const tg = normTelegram(document.getElementById("refTelegram").value);
  if (!wa && !tg) { msg.style.color = "#ff9b9b"; msg.textContent = REF_TEXT.needOne; return; }
  if (!validWhatsapp(wa)) { msg.style.color = "#ff9b9b"; msg.textContent = REF_TEXT.errWa; return; }
  if (!validTelegram(tg)) { msg.style.color = "#ff9b9b"; msg.textContent = REF_TEXT.errTg; return; }
  msg.style.color = "#c9bfa8"; msg.textContent = REF_TEXT.saving;
  const targetId = window._refTargetId || window._refMyId;
  try {
    const { data: row, error } = await supabaseClient.from("referral_contacts")
      .upsert({ profile_id: targetId, whatsapp: wa || null, telegram: tg || null, updated_at: new Date().toISOString() }, { onConflict: "profile_id" })
      .select("code, whatsapp, telegram").single();
    if (error) throw error;
    document.getElementById("refWhatsapp").value = wa ? "+" + wa : "";
    document.getElementById("refTelegram").value = tg ? (tg.startsWith("+") ? tg : "@" + tg) : "";
    renderReferralLink(row);
    msg.style.color = "#8fd98f"; msg.textContent = REF_TEXT.saved;
  } catch (e) {
    console.error(e);
    msg.style.color = "#ff9b9b"; msg.textContent = REF_TEXT.errSave + ": " + (e.message || e);
  }
}

// Supabase қателері ағылшынша келеді — пайдаланушыға қазақша көрсетеміз
function authErrorKz(error) {
  const m = String((error && error.message) || error || "").toLowerCase();
  if (m.includes("invalid login credentials")) return "Email немесе құпия сөз қате.";
  if (m.includes("email not confirmed")) return "Email расталмаған. Поштаңыздағы хаттағы сілтеме арқылы растаңыз.";
  if (m.includes("already registered") || m.includes("already been registered") || m.includes("already exists")) return "Бұл email бұрын тіркелген. Кіріңіз немесе құпия сөзді қалпына келтіріңіз.";
  if (m.includes("rate limit") || m.includes("too many") || m.includes("security purposes")) return "Тым көп әрекет жасалды. Бірнеше минуттан кейін қайта көріңіз.";
  if (m.includes("password should be") || m.includes("weak password")) return "Құпия сөз тым қарапайым. Кемінде 6 таңба енгізіңіз.";
  if (m.includes("same as the old") || m.includes("different from the old")) return "Жаңа құпия сөз ескісінен өзгеше болуы керек.";
  if (m.includes("invalid email") || m.includes("unable to validate email")) return "Email дұрыс емес.";
  if (m.includes("expired") || m.includes("invalid") && m.includes("token")) return "Сілтеменің мерзімі өтті. Құпия сөзді қалпына келтіруді қайта сұратыңыз.";
  if (m.includes("failed to fetch") || m.includes("network")) return "Интернет байланысын тексеріп, қайта көріңіз.";
  if (m.includes("auth session missing")) return "Сессия табылмады. Поштаңыздағы сілтемені қайта ашыңыз.";
  return "Қате орын алды. Кейінірек қайта көріңіз.";
}

function runTrialMatrix() {
  const name = (document.getElementById("lpName").value || "").trim();
  const birthDate = (document.getElementById("lpBirth").value || "").trim();
  const err = document.getElementById("lpError");
  const out = document.getElementById("lpResult");
  err.textContent = "";
  if (!name) { err.textContent = "Атыңызды енгізіңіз."; return; }
  if (!isValidBirthDate(birthDate)) { err.textContent = "Туған күнді КК.АА.ЖЖЖЖ форматында енгізіңіз."; return; }
  if (!window.AdultMatrixEngine) { err.textContent = "Есептеу уақытша қолжетімсіз. Бетті жаңартып көріңіз."; return; }
  const [day, month, year] = birthDate.split(".").map(Number);

  let res, diagram;
  try {
    res = window.AdultMatrixEngine.getFullResult(day, month, year, name);
    diagram = buildDiagramSvgMarkup(window.AdultMatrixEngine, "Диаграмма", 0, "large", false, false, true);
  } catch (e) {
    console.error("Байқау есептеуінің қатесі:", e);
    err.textContent = "Есептеу орындалмады.";
    return;
  }
  try {
    const refCode = new URLSearchParams(window.location.search).get("ref") || "";
    supabaseClient.rpc("log_trial", { p_code: refCode, p_name: name, p_birth: birthDate }).then(function () {}, function () {});
  } catch (e) { /* не мешаем расчёту */ }
  const blocks = res.rasshifrovka || [];
  const card = blocks.find(b => /визит/i.test(b.title)) || blocks[0];
  const locked = blocks.filter(b => b !== card).map(b => b.title)
    .concat(["Бағдарламалар", "Жылдар бойынша болжам", "Денсаулық картасы"]);

  const cardHtml = card ? card.entries.map(function (e) {
    const num = typeof e.number === "number" ? String(e.number) : String(e.number || "").trim();
    return (num ? `<div class="num">${escapeHtml(num)}</div>` : "") + `<div class="txt">${escapeHtml(e.text)}</div>`;
  }).join("") : "";
  window._trialDownload = {

async function loginUser() {
  const email = document.getElementById("loginEmail")?.value.trim().toLowerCase();
  const password = document.getElementById("loginPassword")?.value || "";
  const errorBox = document.getElementById("loginError");
  if (errorBox) errorBox.textContent = "";

  if (!email || !password) { if (errorBox) errorBox.textContent = "Email мен құпия сөзді енгізіңіз."; return; }

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error || !data?.user) {
    if (errorBox) errorBox.textContent = error ? authErrorKz(error) : "Email немесе құпия сөз қате.";
    return;
  }
  updateLastActivity();
  location.reload();
}

function formatPhoneInput(el) {
  let digits = el.value.replace(/\D/g, "");
  digits = digits.slice(0, 15);
  el.value = digits ? "+" + digits : "";
}

async function registerUser() {
  const lastName = document.getElementById("registerLastName")?.value.trim() || "";
  const firstName = document.getElementById("registerFirstName")?.value.trim() || "";
  const middleName = document.getElementById("registerMiddleName")?.value.trim() || "";
  const phone = document.getElementById("registerPhone")?.value.trim() || "";
  const email = document.getElementById("registerEmail")?.value.trim().toLowerCase() || "";
  const password = document.getElementById("registerPassword")?.value || "";
  const password2 = document.getElementById("registerPassword2")?.value || "";
  const teacherCode = document.getElementById("registerTeacherCode")?.value.trim().toUpperCase() || "";
  const message = document.getElementById("registerMessage");

  const setMessage = (text, ok = false) => {
    if (!message) return;
    message.textContent = text;
    message.className = "auth-message " + (ok ? "success" : "error");
  };

  const nameRe = /^[A-Za-zА-Яа-яЁёӘәҒғҚқҮүҰұІіЖжҮүҺһ' -]{2,}$/;
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  const phoneRe = /^\+\d{8,15}$/;

  if (!lastName || !firstName || !middleName || !phone || !email || !password || !password2) {
    setMessage("Барлық міндетті өрістерді толтырыңыз: тегі, аты, әкесінің аты, телефон, email және құпия сөз.");
    return;
  }
  if (!nameRe.test(lastName)) { setMessage("Тегіңізді тексеріңіз — тек әріптер, кемінде 2 таңба."); return; }
  if (!nameRe.test(firstName)) { setMessage("Атыңызды тексеріңіз — тек әріптер, кемінде 2 таңба."); return; }
  if (!nameRe.test(middleName)) { setMessage("Әкесінің атын тексеріңіз — тек әріптер, кемінде 2 таңба."); return; }
  if (!phoneRe.test(phone)) { setMessage("Телефон нөмірін тексеріңіз — + белгісінен бастап, ел кодын және нөмірді толық, бос орынсыз және артық таңбаларсыз енгізіңіз, мысалы +77001234567."); return; }
  if (!emailRe.test(email)) { setMessage("Email тексеріңіз — дұрыс форматта көрсетіңіз."); return; }
  if (password.length < 6) { setMessage("Құпия сөз кемінде 6 таңбадан тұруы керек."); return; }
  if (password !== password2) { setMessage("Құпия сөздер сәйкес келмейді."); return; }

  setMessage("Аккаунт жасап жатырмын...", true);

  // Егер бұл email жойылған аккаунтқа тиесілі болса — ескі аккаунтты толық өшіріп, жаңа тіркелуге жол береміз
  try { await supabaseClient.rpc("release_deleted_email", { p_email: email }); } catch (e) { console.warn("release_deleted_email:", e); }

  const { data, error } = await supabaseClient.auth.signUp({
    email, password,
    options: {
      data: { first_name: firstName, last_name: lastName, middle_name: middleName, phone, role: "student", status: "pending" },
      emailRedirectTo: window.location.origin + window.location.pathname
    }
  });

  if (error) { setMessage(authErrorKz(error)); return; }

  // Email бұрын тіркелген (белсенді аккаунт) — Supabase бұл жағдайда хат жібермейді
  if (data?.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
    setMessage("Бұл email бұрын тіркелген — жай ғана кіріңіз. Құпия сөзді ұмытсаңыз, «Құпия сөзді ұмыттыңыз ба?» батырмасын басыңыз.");
    return;
  }

  let teacherIdFound = null;
  if (data?.user && teacherCode) {
    try {
      const { data: teachers } = await supabaseClient.from("profiles").select("id").eq("role", "numerologist");
      const match = (teachers || []).find(t => t.id.slice(0, 8).toUpperCase() === teacherCode);
      if (match) teacherIdFound = match.id;
    } catch (e) { console.warn("Ұстаз кодын тексеру мүмкін болмады:", e); }
  }

  if (data?.user) {
    const { error: profileError } = await supabaseClient.from("profiles").upsert({
      id: data.user.id, first_name: firstName, last_name: lastName, middle_name: middleName,
      email, phone, role: "student", status: "pending",
      ...(teacherIdFound ? { teacher_id: teacherIdFound } : {})
    }, { onConflict: "id" });
    if (profileError) console.warn("Профиль не обновлён из браузера:", profileError);
  }

  if (data?.session) {
    setMessage("Тіркелу аяқталды. Қазір платформа ашылады.", true);
    setTimeout(() => location.reload(), 900);
  } else {
    setMessage("Тіркелу жасалды. Email-іңізді растап, кіріңіз. Бөлімдерге қолжетімділікті әкімші немесе ұстаз ашады.", true);
  }
}

let resetSent = false;

function showForgotPassword() {
  document.body.style.visibility = "visible";
  document.body.innerHTML = `
    <div class="auth-shell">

        <div class="auth-symbol">✧</div>

        <button type="button" onclick="sendPasswordReset()">Сілтеме жіберу</button>
        <div id="resetMessage" class="auth-message"></div>
        <button class="auth-link" type="button" onclick="showLogin()">← Кіруге оралу</button>
      </div>

  resetSent = false;

async function sendPasswordReset() {
  const email = document.getElementById("resetEmail")?.value.trim().toLowerCase();
  const message = document.getElementById("resetMessage");

  if (!email) {
    if (message) { message.textContent = "Email енгізіңіз."; message.className = "auth-message error"; }
    return;
  }
  if (resetSent) {
    if (message) { message.textContent = "Сілтеме бұрын жіберілген. Поштаңызды тексеріңіз."; message.className = "auth-message success"; }
    return;
  }

  try {
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname
    });
    if (error) throw error;
    resetSent = true;
    if (message) { message.textContent = "Құпия сөзді қалпына келтіру сілтемесі поштаңызға жіберілді."; message.className = "auth-message success"; }
  } catch (error) {
    console.error("Қалпына келтіру қатесі:", error);
    if (message) { message.textContent = authErrorKz(error); message.className = "auth-message error"; }
  }
}

/* ============================================================
   АВТОМАТИЧЕСКИЙ ВЫХОД ПОСЛЕ 1 ЧАСА БЕЗДЕЙСТВИЯ
   ============================================================ */

const INACTIVITY_LIMIT = 60 * 60 * 1000;
const LAST_ACTIVITY_KEY = "numerology_last_activity";
let inactivityTimer = null;

function updateLastActivity() {
  localStorage.setItem(LAST_ACTIVITY_KEY, Date.now().toString());
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(autoLogoutAfterInactivity, INACTIVITY_LIMIT);
}

async function autoLogoutAfterInactivity() {
  const lastActivity = Number(localStorage.getItem(LAST_ACTIVITY_KEY) || 0);
  if (!lastActivity) { updateLastActivity(); return; }
  const inactiveTime = Date.now() - lastActivity;

  if (inactiveTime >= INACTIVITY_LIMIT) {
    localStorage.removeItem(LAST_ACTIVITY_KEY);
    try { await supabaseClient.auth.signOut(); } catch (error) { console.error("Автоматты шығу қатесі:", error); }
    showLogin();
    return;
  }
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(autoLogoutAfterInactivity, INACTIVITY_LIMIT - inactiveTime);
}

function startInactivityTimer() {
  const lastActivity = Number(localStorage.getItem(LAST_ACTIVITY_KEY) || 0);
  if (lastActivity && Date.now() - lastActivity >= INACTIVITY_LIMIT) { autoLogoutAfterInactivity(); return; }
  updateLastActivity();
}

["click", "keydown", "mousemove", "scroll", "touchstart"].forEach(function (eventName) {
  document.addEventListener(eventName, updateLastActivity, { passive: true });
});
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) autoLogoutAfterInactivity();
});

async function logoutUser() {
  try { await supabaseClient.auth.signOut(); } catch (error) { console.error("Шығу қатесі:", error); }
  localStorage.removeItem(LAST_ACTIVITY_KEY);
  clearTimeout(inactivityTimer);
  window.currentUser = null;
  window.currentUserRole = "";
  window.currentUserIsManager = false;
  window.currentUserHasAccess = false;
  showLogin();
}

  document.body.style.visibility = "visible";
  document.body.innerHTML = `

        <input id="newPassword1" type="password" placeholder="Жаңа құпия сөз">
        <input id="newPassword2" type="password" placeholder="Жаңа құпия сөзді қайталаңыз">
        <button type="button" onclick="submitNewPassword()">Құпия сөзді сақтау</button>
        <div id="newPasswordMessage" class="auth-message error"></div>
      </div>
    </div>`;
}

async function submitNewPassword() {
  const p1 = document.getElementById("newPassword1")?.value || "";
  const p2 = document.getElementById("newPassword2")?.value || "";
  const msg = document.getElementById("newPasswordMessage");
  const setMsg = (text, ok) => { if (msg) { msg.textContent = text; msg.className = "auth-message " + (ok ? "success" : "error"); } };

  if (p1.length < 6) { setMsg("Құпия сөз кемінде 6 таңбадан тұруы керек.", false); return; }
  if (p1 !== p2) { setMsg("Құпия сөздер сәйкес келмейді.", false); return; }

  setMsg("Жаңа құпия сөзді сақтап жатырмын...", true);
  const { error } = await supabaseClient.auth.updateUser({ password: p1 });
  if (error) { setMsg("Құпия сөзді сақтау мүмкін болмады: " + authErrorKz(error), false); return; }

  setMsg("Құпия сөз өзгертілді. Қазір платформа ашылады.", true);
  history.replaceState(null, "", window.location.pathname);
  setTimeout(() => location.reload(), 1000);
}

// Хабарламалардағы бөлім атаулары: әкімші кіргенде платформа бөлімдердің өзекті тізімін базаға өзі жазады
async function syncDirectionLabels() {
  try {
    const rows = DIRECTIONS.map(function (d) { return { key: d.key, title: d.title.replace(/<br>/g, " "), updated_at: new Date().toISOString() }; });
    const { error } = await supabaseClient.from("direction_labels").upsert(rows, { onConflict: "key" });
    if (error) console.warn("Бөлім атауларын жаңарту мүмкін болмады:", error.message);
  } catch (e) { console.warn("Бөлім атауларын жаңарту мүмкін болмады:", e); }
}

async function checkAuth() {
  try {
    if (window.location.hash.includes("type=recovery")) {
      showSetNewPasswordForm();
      return;
    }
    const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
    if (sessionError) { console.error("Сессияны алу қатесі:", sessionError); showLogin("Авторизацияны тексеру мүмкін болмады."); return; }
    if (!session) { showLanding(); return; }

    const user = session.user;
    window.currentUser = user;
    const userEmail = String(user.email || "").trim().toLowerCase();

    let profile = null;
    const { data: profileData, error: profileError } = await supabaseClient
      .from("profiles")
      .select("role, first_name, last_name, middle_name, email, phone, status")
      .eq("id", user.id)
      .maybeSingle();
    if (profileError) console.error("Ошибка загрузки профиля:", profileError);
    else profile = profileData;

    const role = String(profile?.role || user.user_metadata?.role || "student").trim().toLowerCase();
    const isManager = isManagerRole(role) || isAdminEmail(userEmail);

    let hasAccess = false;
    let currentGrant = {};
    let latestPeriod = null;
    {
      const { data: access, error: accessError } = await supabaseClient
        .from("access_periods")
        .select("id, status, starts_at, ends_at, is_unlimited, payment_status, granted_scope, created_at")
        .eq("profile_id", user.id)
        .order("created_at", { ascending: false });
      if (accessError) {
        console.error("Қолжетімділікті тексеру қатесі:", accessError);
      } else {
        latestPeriod = (access || [])[0] || null;
        const activePeriods = (access || []).filter(hasActivePlatformAccess);
        hasAccess = activePeriods.length > 0;
        currentGrant = activePeriods[0]?.granted_scope || {};
      }
    }
    if (isManager) hasAccess = true;

    window.currentUserRole = isAdminEmail(userEmail) ? "admin" : role;
    if (window.currentUserRole === "admin") syncDirectionLabels();
    window.currentUserId = user.id;
    window.currentUserIsManager = isManager;
    window.currentUserHasAccess = hasAccess;
    window.currentUserGrant = currentGrant;
    window.currentUserAccessMeta = {
      hasAnyPeriod: !!latestPeriod,
      isExpired: !!latestPeriod && !latestPeriod.is_unlimited && !hasActivePlatformAccess(latestPeriod),
      startsAt: latestPeriod?.starts_at || null,
      endsAt: latestPeriod?.ends_at || null,
    };

    const displayName = profile?.first_name || profile?.last_name || user.user_metadata?.first_name || (isManager ? "Центр Нумера" : userEmail.split("@")[0]) || "Пайдаланушы";

    const nameNode = document.getElementById("clientName");
    const emailNode = document.getElementById("clientEmail");
    if (nameNode) nameNode.textContent = displayName;
    if (emailNode) emailNode.textContent = profile?.email || user.email || "";

    const navStats = document.getElementById("navStatistics");
    if (navStats) navStats.style.display = window.currentUserIsManager ? "" : "none";

    // Показываем название школы ученику/ученице, если её задал их учитель.
    if (!isManager && profile?.teacher_id) {
      supabaseClient.from("schools").select("name").eq("owner_id", profile.teacher_id).maybeSingle().then(({ data: school }) => {
        const line = document.getElementById("studentSchoolLine");
        if (line && school?.name) {
          line.textContent = "Мектеп/бренд: " + school.name;
          line.style.display = "block";
        }
      });
    }

    document.body.style.visibility = "visible";
    startInactivityTimer();
    setActiveSection("calculators");
    renderCalculators();

  } catch (error) {
    console.error("Ошибка checkAuth:", error);
    showLogin("Платформаға қосылу мүмкін болмады. Байланысты тексеріп, қайта көріңіз.");
  }
}
