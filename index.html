<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numerology Platform KZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap&subset=cyrillic" rel="stylesheet">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="theme-color" content="#1d3f3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Numerology Platform KZ">
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background:
    radial-gradient(circle at 70% 15%, rgba(47, 109, 106, 0.22), transparent 28%),
    radial-gradient(circle at 20% 80%, rgba(40, 90, 87, 0.18), transparent 30%),
    linear-gradient(135deg, #142b28 0%, #1d3f3c 45%, #142b28 100%);
  color: #f8e7a8;
  font-family: Arial, sans-serif;
  visibility: hidden;
}

/* ===================== ПЛАТФОРМА ===================== */

.platform {
  min-height: 100vh;
  display: flex;
  padding: 8px;
}

/* Левое меню */

.sidebar {
  width: 245px;
  min-height: calc(100vh - 16px);
  padding: 28px 18px 24px;
  border: 1px solid rgba(220, 169, 42, 0.65);
  border-radius: 18px 0 0 18px;
  background:
    radial-gradient(circle at 50% 10%, rgba(47, 109, 106, 0.30), transparent 28%),
    linear-gradient(180deg, #1c3a37 0%, #142b28 100%);
  display: flex;
  flex-direction: column;
}

.logo { text-align: center; margin-bottom: 38px; }

.logo-symbol {
  width: 100px; height: 100px; margin: 0 auto 14px;
  border-radius: 50%; border: 2px solid #e7bd43;
  display: flex; align-items: center; justify-content: center;
  color: #f5d46b; font-size: 48px;
  box-shadow: 0 0 20px rgba(225, 184, 64, 0.35), inset 0 0 20px rgba(225, 184, 64, 0.12);
}

.logo-title { font-family: PT Serif, Georgia, serif; font-size: 25px; color: #f5d46b; letter-spacing: 1px; }
.logo-subtitle { margin-top: 8px; font-size: 20px; color: #e7bd43; }

.nav { display: flex; flex-direction: column; gap: 12px; }

.nav-item {
  width: 100%; min-height: 52px; padding: 15px 16px;
  border-radius: 12px; border: 1px solid transparent;
  background: transparent; color: #f5f0df;
  font-size: 18px; line-height: 1.2; text-align: left; cursor: pointer;
  transition: background 0.25s, border-color 0.25s, color 0.25s;
  display: flex; align-items: center;
}
.nav-item:hover { background: rgba(47, 109, 106, 0.25); border-color: rgba(218, 173, 49, 0.55); }
.nav-item.active {
  background: linear-gradient(90deg, rgba(60, 135, 131, 0.55), rgba(47, 109, 106, 0.35));
  border-color: #d7aa31; color: #f8d96d;
  box-shadow: 0 0 15px rgba(212, 164, 43, 0.12);
}
.nav-icon {
  display: inline-flex; width: 32px; min-width: 32px; margin-right: 2px;
  align-items: center; justify-content: center; color: #f2c84d; font-size: 22px;
}
.logout { margin-top: auto; color: #f5d46b; }

/* Основная область */

.main {
  flex: 1; min-height: calc(100vh - 16px);
  padding: 42px 30px 36px;
  border: 1px solid rgba(220, 169, 42, 0.65); border-left: none;
  border-radius: 0 18px 18px 0;
  background:
    radial-gradient(circle at 55% 5%, rgba(47, 109, 106, 0.23), transparent 28%),
    radial-gradient(circle at 90% 85%, rgba(40, 90, 87, 0.16), transparent 30%),
    #1c3a3a;
}

.top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; }
.welcome h1 { margin: 0; font-family: PT Serif, Georgia, serif; font-size: 43px; font-weight: 500; color: #f8dc78; }
.account { display: flex; align-items: center; gap: 12px; color: #f4e9cc; font-size: 16px; }
.account-icon {
  width: 45px; height: 45px; border: 1px solid #e3b936; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; color: #f4c94f; font-size: 23px;
}

/* Карточки направлений */

.cards {
  display: grid;
  grid-template-columns: repeat(5, 180px);
  gap: 20px;
  justify-content: start;
  align-items: start;
  width: 100%;
  margin-top: 18px;
}

.cards .card, .method-card {
  width: 180px; height: 250px; min-height: 250px; box-sizing: border-box;
  padding: 18px 14px; border: 1px solid rgba(225, 180, 52, 0.9); border-radius: 18px;
  background:
    radial-gradient(circle at 50% 10%, rgba(47, 109, 106, 0.30), transparent 40%),
    linear-gradient(145deg, #24504c 0%, #1c3a37 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; cursor: pointer; overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18), inset 0 0 30px rgba(47, 109, 106, 0.08);
  transition: transform 0.25s, box-shadow 0.25s;
}
.cards .card:hover, .method-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 14px 35px rgba(0, 0, 0, 0.25), 0 0 22px rgba(222, 174, 47, 0.12);
}
.method-card:not([onclick]) { cursor: default; }

.cards .card-icon {
  height: 65px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 52px; line-height: 1; color: #f2c94c;
  text-shadow: 0 0 20px rgba(239, 192, 62, 0.3);
}
.cards .card-content h3 { margin: 0 0 9px; font-family: PT Serif, Georgia, serif; font-size: 20px; line-height: 1.12; font-weight: 500; color: #f6d66c; }
.cards .card-content p { margin: 0; font-size: 14px; line-height: 1.3; color: #eee5d0; }

.card.has-material { border-color: #8fe3a1; }

.pythagoras-icon {
  display: grid !important; grid-template-columns: repeat(3, 1fr); gap: 3px 8px;
  width: 88px; height: 65px !important; font-size: 17px !important; line-height: 1 !important;
}
.pythagoras-icon span { display: flex; align-items: center; justify-content: center; }

.library-icon { font-size: 54px !important; line-height: 1; height: 65px !important; display: flex; align-items: center; justify-content: center; }

.section-title { width: 100%; margin: 0 0 20px; }
.section-title h2 { margin: 0; font-family: PT Serif, Georgia, serif; font-size: 31px; font-weight: 500; color: #f6d66c; }

.back-link {
  display: inline-flex; align-items: center; gap: 8px;
  color: #f6d66c; background: none; border: none; cursor: pointer;
  font-size: 16px; margin-bottom: 14px; padding: 0;
}

/* Иәшборд-блоки (доступы / статистика / мои расчёты) */

.dashboard-wrap { width: 100%; }
.dashboard-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 22px; }
.dashboard-head h2 { margin: 0 0 8px; font-family: PT Serif, Georgia, serif; font-size: 31px; color: #f6d66c; }
.dashboard-head p { margin: 0; color: #eee5d0; font-size: 16px; }
.dashboard-badge {
  border: 1px solid rgba(225,180,52,.75); border-radius: 999px; padding: 8px 14px;
  color: #f6d66c; background: rgba(255,255,255,.05); white-space: nowrap;
}

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat-card, .table-card {
  border: 1px solid rgba(225,180,52,.65); border-radius: 16px;
  background: linear-gradient(145deg, rgba(30,64,62,.92), rgba(20,45,43,.92));
  box-shadow: inset 0 0 25px rgba(126,65,167,.08);
}
.stat-card { padding: 18px; overflow: hidden; }
.stat-card span { display: block; color: #eee5d0; font-size: 14px; margin-bottom: 8px; min-height: 34px; overflow-wrap: break-word; }
.stat-card strong { display: block; color: #f6d66c; font-family: PT Serif, Georgia, serif; font-size: 30px; }
.table-card { padding: 18px; overflow-x: auto; }
.table-title { color: #f6d66c; font-family: PT Serif, Georgia, serif; font-size: 22px; margin-bottom: 14px; }
.data-table { width: 100%; border-collapse: collapse; color: #eee5d0; }
.data-table th, .data-table td { padding: 12px 10px; border-bottom: 1px solid rgba(225,180,52,.18); text-align: left; }
.data-table th { color: #f6d66c; font-weight: 600; }
.empty-table { padding: 28px 10px; color: #d9d0bd; text-align: center; }

.access-locked { width: 100%; text-align: center; padding: 55px 30px; }
.access-locked-icon { font-size: 55px; margin-bottom: 15px; }
.access-locked h2 { font-family: PT Serif, Georgia, serif; font-size: 27px; color: #f6d66c; margin-bottom: 12px; }
.access-locked p { font-size: 17px; color: #eee5d0; line-height: 1.6; max-width: 650px; margin: 0 auto; }

/* ===================== СПИСОК МАТЕРИАЛОВ (полноценная страница) ===================== */

.materials-page { width: 100%; }

.materials-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 18px; flex-wrap: wrap; gap: 14px;
}
.materials-head h2 { margin: 0; font-family: PT Serif, Georgia, serif; font-size: 27px; color: #f6d66c; }

.materials-add-btn {
  padding: 12px 20px; border-radius: 10px; border: 1px solid #d7aa31;
  background: linear-gradient(90deg, #3c8783, #2f6d6a);
  color: #f8d96d; cursor: pointer; font-size: 15px;
}

.materials-tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.materials-tab {
  padding: 9px 16px; border-radius: 10px; border: 1px solid rgba(225,180,52,.4);
  background: rgba(255,255,255,.03); color: #eee5d0; cursor: pointer; font-size: 14px;
}
.materials-tab.active { background: rgba(113,49,153,.55); border-color: #d7aa31; color: #f8d96d; }

.material-row {
  display: flex; align-items: center; gap: 16px;
  padding: 16px; border-radius: 14px; margin-bottom: 12px;
  border: 1px solid rgba(225,180,52,.35);
  background: linear-gradient(145deg, rgba(30,64,62,.75), rgba(20,45,43,.75));
}
.material-row-icon {
  width: 46px; height: 46px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
  background: rgba(255,255,255,.06); color: #f2c94c;
}
.material-row-body { flex: 1; min-width: 0; }
.material-row-title { color: #f8e7a8; font-size: 16px; margin-bottom: 4px; }
.material-row-meta { color: #b8ad98; font-size: 13px; overflow-wrap: anywhere; word-break: break-word; }
.material-row-open {
  padding: 10px 18px; border-radius: 10px; border: 1px solid #d7aa31;
  background: linear-gradient(90deg, #3c8783, #2f6d6a); color: #f8d96d;
  cursor: pointer; font-size: 14px; white-space: nowrap; text-decoration: none;
}
.materials-note { color: #b8ad98; font-size: 13px; margin-top: 10px; }

/* ===================== ОКНО ДОБАВЛЕНИЯ МАТЕРИАЛА ===================== */

.material-manager-overlay {
  position: fixed; inset: 0; z-index: 99999; display: flex;
  align-items: center; justify-content: center; padding: 20px;
  background: rgba(0, 0, 0, 0.72);
}
.material-manager {
  width: 560px; max-width: 95vw; max-height: 90vh; overflow-y: auto; padding: 30px;
  border-radius: 20px; background: linear-gradient(145deg, #24504c, #1c3a37);
  border: 1px solid #d7aa31; color: #f8e7a8; box-shadow: 0 20px 70px rgba(0, 0, 0, 0.5);
}
.material-manager h2 { margin: 0 35px 24px 0; color: #f6d66c; font-family: PT Serif, Georgia, serif; }
.material-manager-close { float: right; background: none; border: none; color: #f6d66c; font-size: 30px; line-height: 1; cursor: pointer; }
.material-manager-label { display: block; margin: 16px 0 8px; color: #eee5d0; }
.material-manager-input {
  width: 100%; box-sizing: border-box; padding: 13px; margin-bottom: 12px;
  border-radius: 10px; border: 1px solid rgba(225, 180, 52, 0.5);
  background: rgba(0,0,0,.2); color: #fff; outline: none; font-size: 16px;
}
.material-manager-input::placeholder { color: #aaa1b4; }
.material-manager-button {
  width: 100%; margin-top: 4px; padding: 13px 16px; border-radius: 10px; border: 1px solid #d7aa31;
  background: linear-gradient(90deg, #3c8783, #2f6d6a); color: #f8d96d; cursor: pointer; font-size: 16px;
}
.material-manager-button:disabled { opacity: .55; cursor: wait; }
.material-manager-or { margin: 18px 0 4px; text-align: center; color: #c8bca4; }
.material-manager-status { margin-top: 18px; line-height: 1.45; }
.material-manager-status.ok { color: #a9e4b4; }
.material-manager-status.error { color: #ffb0b0; }
.material-manager-hint { margin-top: 8px; color: #bdb3c5; font-size: 13px; line-height: 1.4; }

/* ===================== АВТОРИЗАЦИЯ ===================== */

.auth-shell {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px;
  background:
    radial-gradient(circle at 50% 20%, rgba(47, 109, 106, 0.22), transparent 30%),
    linear-gradient(135deg, #142b28, #1d3f3c, #142b28);
}
.auth-card {
  width: 420px; max-width: 100%; padding: 38px;
  border: 1px solid rgba(225, 180, 52, 0.7); border-radius: 20px;
  background: linear-gradient(145deg, #24504c, #1c3a37);
  box-shadow: 0 20px 70px rgba(0, 0, 0, 0.4); text-align: center;
}
.auth-card-register { width: 600px; }
.auth-symbol { font-size: 48px; color: #f5d46b; margin-bottom: 8px; }
.auth-title { font-family: PT Serif, Georgia, serif; font-size: 28px; color: #f5d46b; }
.auth-subtitle { color: #e7bd43; margin-top: 5px; margin-bottom: 25px; }
.auth-card h2 { color: #f6d66c; font-family: PT Serif, Georgia, serif; font-weight: 500; }
.auth-card input {
  width: 100%; padding: 14px; margin: 7px 0; border: 1px solid rgba(225, 180, 52, 0.4);
  border-radius: 10px; background: rgba(0, 0, 0, 0.18); color: #fff; font-size: 16px; outline: none;
}
.auth-card button {
  width: 100%; padding: 14px; margin-top: 12px; border: 1px solid #d7aa31; border-radius: 10px;
  background: linear-gradient(90deg, #3c8783, #2f6d6a); color: #f8d96d; font-size: 16px; cursor: pointer;
}
.auth-link { background: transparent !important; border: none !important; color: #d9cba8 !important; }
.auth-divider { margin: 15px 0; color: #a99d83; }
.auth-register { background: transparent !important; }
.auth-description { color: #ddd4c1; line-height: 1.5; }
.auth-message { margin-top: 14px; min-height: 22px; line-height: 1.4; }
.auth-message.error { color: #ff9b9b; }
.auth-message.success { color: #a8e6b0; }
.auth-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }

/* ===================== АДАПТАЦИЯ ===================== */

@media (max-width: 1200px) {
  .sidebar { width: 210px; }
  .cards { grid-template-columns: repeat(3, 180px); }
}
@media (max-width: 900px) {
}
@media (max-width: 800px) {
  .platform { display: block; }
  .sidebar { width: 100%; min-height: auto; border-radius: 18px 18px 0 0; }
  .main { border-left: 1px solid rgba(220, 169, 42, 0.65); border-top: none; border-radius: 0 0 18px 18px; }
  .cards { grid-template-columns: repeat(2, 180px); }
  .top { display: block; }
  .account { margin-top: 20px; }
  .auth-grid { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .main { padding: 28px 15px 25px; }
  .welcome h1 { font-size: 31px; }
  .cards { grid-template-columns: 1fr; justify-items: center; }
  .cards .card, .method-card { width: 100%; max-width: 320px; }
  .material-row { flex-wrap: wrap; }
  .material-row-body { flex-basis: 100%; order: 1; }
  .material-row-icon { order: 0; }
  .material-row-open { order: 2; margin-left: 0 !important; }
  .data-table { font-size: 12px; width: max-content; min-width: 100%; }
  .data-table th, .data-table td { padding: 8px 9px; white-space: nowrap; }
  .data-table td a { white-space: nowrap; }
  .table-card { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .dashboard-head { flex-direction: column; align-items: flex-start; gap: 10px; }
}

/* ===================== АККОРДЕОН РЕЗУЛЬТАТА РАСЧЁТА ===================== */

.accordion-item {
  border: 1px solid rgba(225,180,52,.4);
  border-radius: 12px;
  margin-bottom: 10px;
  overflow: hidden;
}
.accordion-header {
  width: 100%;
  text-align: left;
  padding: 14px 16px;
  background: rgba(255,255,255,.04);
  border: none;
  color: #f6d66c;
  font-family: PT Serif, Georgia, serif;
  font-size: 17px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.accordion-header:hover { background: rgba(255,255,255,.08); }
.accordion-body {
  padding: 16px;
  border-top: 1px solid rgba(225,180,52,.25);
  color: #eee5d0;
  line-height: 1.6;
  white-space: pre-wrap;
}
.accordion-body.hidden { display: none; }
.test-option {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: left;
  padding: 14px 16px;
  margin-bottom: 10px;
  border: 1px solid rgba(225,180,52,.35);
  border-radius: 12px;
  background: rgba(255,255,255,.03);
  color: #f8e7a8;
  font-size: 15px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.test-option:hover { background: rgba(255,255,255,.08); }
.test-option.selected {
  background: rgba(215,170,49,.22);
  border-color: #d7aa31;
}
.test-option-letter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  border-radius: 50%;
  border: 1px solid rgba(225,180,52,.5);
  color: #f6d66c;
  font-family: PT Serif, Georgia, serif;
  font-size: 14px;
}
.test-option.selected .test-option-letter {
  background: #d7aa31;
  color: #122522;
}
.key-numbers-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
}
.key-number-box {
  padding: 10px 12px;
  border-radius: 8px;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(225,180,52,.25);
}
.key-number-box strong { display: block; font-size: 22px; color: #f6d66c; }
.key-number-box span { font-size: 12px; color: #b8ad98; }


body, body * { font-variant-numeric: lining-nums; }

@media (max-width: 600px) {
  body > div[style*="min-height:100vh"][style*="padding:40px"] { padding: 10px !important; }
  body > div[style*="min-height:100vh"] > div[style*="padding:35px"] { padding: 16px 12px !important; border-radius: 14px !important; }
}
</style>
</head>
<body>

<div class="platform">

  <aside class="sidebar">
    <div class="logo">
      <div class="logo-symbol">✧</div>
      <div class="logo-title">NUMEROLOGY</div>
      <div class="logo-subtitle">Platform</div>
    </div>

    <div class="nav">
      <button class="nav-item active" data-section="calculators" onclick="showSection('calculators')">
        <span class="nav-icon">▦</span> Калькуляторлар
      </button>
      <button class="nav-item" data-section="manuals" onclick="showSection('manuals')">
        <span class="nav-icon">📖</span> Әдістемелік құралдар
      </button>
      <button class="nav-item" data-section="videos" onclick="showSection('videos')">
        <span class="nav-icon">▶</span> Бейне
      </button>
      <button class="nav-item" data-section="tests" onclick="showSection('tests')">
        <span class="nav-icon">✎</span> Тесттер
      </button>
      <button class="nav-item" data-section="library" onclick="showSection('library')">
        <span class="nav-icon">📚</span> Нумеролог кітапханасы
      </button>
      <button class="nav-item" data-section="my-calculations" onclick="showSection('my-calculations')">
        <span class="nav-icon">▤</span> Менің есептеулерім
      </button>
      <button class="nav-item" data-section="access" onclick="showSection('access')">
        <span class="nav-icon">🔑</span> Қолжетімділіктер
      </button>
      <button class="nav-item" id="navStatistics" data-section="statistics" onclick="showSection('statistics')">
        <span class="nav-icon">▥</span> Есептер мен статистика
      </button>
    </div>

    <button class="nav-item logout" onclick="logoutUser()">
      <span class="nav-icon">🚪</span> Шығу
    </button>

    <div style="text-align:left;margin-top:10px;padding-left:16px;font-size:11px;line-height:1.8;">
      <a href="oferta.html" target="_blank" style="display:block;color:#8a8098;text-decoration:none;">Оферта шарты</a>
      <a href="privacy-policy.html" target="_blank" style="display:block;color:#8a8098;text-decoration:none;">Құпиялылық саясаты</a>
    </div>
  </aside>

  <main class="main">
    <div class="top" id="welcomeTop">
      <div class="welcome">
        <h1>Қош келдіңіз, <span id="clientName">Центр Нумера</span>! ✨</h1>

window.KARMIC_TEXTS = {
 "month": {
  "1": "Қаңтар. Әулетте (Роду) бауырлар — аға-іні, апа-сіңлілер — арасындағы қарым-қатынас бұзылған. Енді қаңтар баласының өз еркімен алған міндеті — бауырларына көмектесу. Ол бауырының осы өмірде жинаған кармасының 50%-ын өтейді. Адам осы өмірде қателесуге бейім «қаңтарда тумаған» бауырына көмекке туған. Егер екі бала да қаңтарда туса, онда «қаңтарда тумаған» бала жетіспейді.",
  "2": "Ақпан. Әулетте жақындарға қамқорлық пен мейірімнің болмауына байланысты мәселелер бар. Адамдар бір-біріне көмектеспейді. Міндет — мейірімділікті, кешірімшілдікті, қамқорлықты, ілтипатты үйрену. Басқа адамдарды сезіну (емшілер, тәуіптер). Ақпан балаларын әжелері мен аталары тәрбиелеуі керек. Олар үшін бедел — аға буын. Мұндай адам өткен өмірінде онша мейірімді әрі рақымды болмаған. Сондықтан бұл өмірде бойында осы қасиеттерді дамытуы керек. Ол әулетке өз әжесіне немесе атасына (кез келген желі бойынша) келген. Сірә, ол үшін ата-анасы — жарлық емес, ол тек аға буынның өкілдерін тыңдайды. Ата-анасы ақпан баласын бала кезінен біреуге күтім жасауға үйретуі керек. Егер ол мұны үйренбесе, сезімтал әрі қамқор болмаса — оны жағымсыздықтар арқылы үйретеді. Жақын әйелдер ауыра бастайды, ол бәрібір қажетті дағдыларды алады, бірақ мұндай қайғылы жағдайларда.",
  "3": "Наурыз. Әулетте балаларды тәрбиелеудің дұрыс үлгісі бұзылған. Балаларға қысым көрсетілген. Ата-аналар балаларды құрметтеуді тоқтатқан. Бұған шамадан тыс қамқорлық та жатады. Мұндай отбасыларда балаларды «шайқай-тауық ана» немесе «көкек ана» қағидасымен тәрбиелейді.\nНаурызда туған адам өз анасына келген. Өткен өмірінде ол дербес болмаған, тағдыры көп жағынан анасына байланысты болған. Сондықтан осы өмірде дербестікке үйренуі керек. Неғұрлым ертерек дербес өмір бастап, ата-анасына сүйенбей, шешімді өзі қабылдауды үйренсе, ол үшін соғұрлым жақсы.\nКейін өз отбасында балаларды тәрбиелеудің қарама-қарсы үлгісін таңдаған дұрыс. Егер отбасындағы серіктестердің бірі «наурыздық» болса, балаларды тәрбиелеуде екінші — «наурыздық емес» серіктестің үлгісі алынады.",
  "4": "Сәуір. Сәуірде туған адам әкесіне көмектесуге келген. Әулетте ер желісі бойынша қателер жіберілген. Әкесіне сынақтардан өту керек, бірақ ол дайын емес.\nСәуір балалары өз еркімен әкелерінің кармалық кепілі болуды таңдаған, олардың тірі кезінде жасаған кармасының 50%-ын тазартады. Әкесінің қателерін ол тірі болғанша өтейді.",
  "5": "Мамыр. Әулетте әйел желісі бойынша қателер болған, көбіне балаларға қатысты. Анаға сынақ дайындалған, ал ол одан өтуге дайын емес.\nМамырда туған адам анасына келген. Ол өз еркімен анасының кармалық кепілі болуды таңдаған және оның тірі кезінде жасаған кармасының 50%-ын тазартады. Анасының қателерін ол тірі болғанша өтейді.\nМұндай адам анасымен жылы, сенімді қарым-қатынас құруды үйрену міндетімен келген, өйткені әдетте олар жанжалды болады. Анасын кешіріп, оған ренжуді тоқтату керек.",
  "6": "Маусым. Әулетте опасыздық пен сатқындық күнәсі жасалған. Сондықтан қазір маусым баласы өз қарым-қатынасын дұрыс бастауды және құруды үйренуі керек. Көбіне маусым балалары қарым-қатынастың көрнекі теріс үлгісі болуы үшін ата-анасы жағымсыз өмір сүретін отбасыларға келеді.\n«Маусымдықтар» үйленген/тұрмыстағы адамдармен кездесуге бейім. Олардың жеке өмірінде мәселелер, кармалық некелер болуы мүмкін. Олардың негізгі міндеті — кешіруді үйрену, азғыруларға берілмеу (опасыздық жасамау). Ажырасуға жол бермеу.",
  "7": "Шілде. Әулетте тілі, мәдениеті, дәстүрі өзгеріп, көшу болған. Сондай-ақ әулеттік дәстүрлерден бас тарту болған. Қазір шілде баласының міндеттері — өз әулетінің тамырын табу. Оларға шежіре ағашын құру ұсынылады. Егер шілде баласы туса, бұл әулеттің тоқырап қалғанының көрсеткіші. Сондықтан басқа қалаға көшу, тұрғылықты жерді ауыстыру немесе басқа қалада не елде білім алу маңызды. Егер адам өмірде қозғалмаса, өмір батпақтанып қалады. Нумерологияда жеті — арба (колесница) белгісі. Әулетті орнынан қозғау керек.",
  "8": "Тамыз. Шекспир тарихы. Әулетте мүдделердің бітіспес қақтығысы бар. Тамыз балалары — ата-ана арасындағы қарым-қатынастың рәсімдері мен дәстүрлері бұзылғанының көрсеткіші. Сондықтан тамыз баласының міндеті — жанжалдағы ата-анасын татуластыру, отбасының ыдырауына жол бермеу. Ата-аналар бәрібір жиі ажырасады. Сонда міндет — ең болмаса оларды татуластыру. Болашақта баланың өзі де жеке өмірінде ажырасуға бейім.",
  "9": "Қыркүйек. Қыркүйекте астралды денесі өте күшті, ең талантты адамдар туады. Әулетте талант жоғалған, сондықтан қазір баланың міндеті — әулеттің кәсібін (ремеслосын) қалпына келтіріп, оны көбейту. Ол не өз таланттарын ашуы, не ата-бабасы жасаған бір нәрсені тауып, көрсетуі керек.",
  "10": "Қазан. Әулетте қаржылық заңдар бұзылған, отбасы ақшасы ұрланған. Қазан баласының міндеті — мұра алу құқығына лайық болып, оны көбейту. Ал мұра алса — оны ешбір жағдайда сатуға болмайды. Үлкенірек бір нәрсе сатып алу үшін сататын жағдай ғана бұған жатпайды.\nАта-аналар қазан балаларына неғұрлым көп ақша берсе, олар кейін өздері соғұрлым аз таба алады.\nҚазанда туғандар әулеттің капиталын көбейтуі керек.",
  "11": "Қараша. Әулетте аға буын кіші буынға көмектесетін ұрпақтар сабақтастығы бұзылған. Мұндай отбасыларда балалар мен ата-аналар арасында бәсекелестік жиі туындайды. Балалардың тираниясы болады. Бала әулеттің мәртебесі мен шеберлігін көтеруі керек. Ол туралы ата-анасынан да қаттырақ айтуы керек. Үнемі дәлелдеп, назарға лайық болу керек.",
  "12": "Желтоқсан. Желтоқсанда туған бала — әулеттің бытыраңқы екенінің көрсеткіші. Бір-біріңді естуді, психологиялық көмек көрсетуді үйрену керек. Әулетте жанашырлық, түсіністік, жол беруге деген ықылас жоқ. Желтоқсан балаларын жиі үйірмелерге, бес күндік балабақшаға, кадеттерге, әжелері мен аталарына береді. Олар өздеріне назар аудару үшін жиі «құрбан синдромын» қосады. Желтоқсан балаларына жақындардың назары мен жылуы ерекше қажет. 15 желтоқсанда туғандарға артистизм тән, олар басқа адамдарды шебер басқарады (манипуляция жасайды). «Алаңда асылған адам». Бәрі әрқашан олар айтқандай жаман бола бермейді. Олар мұны өздері байқамайды. 12 желтоқсанда туғандарда позитив аз, оларға психологияны үйрену керек."
 },
 "sz": {
  "1": "Бойыңыздағы білім мен әлеуетті тек ауызша түрде бөлісуіңіз керек: шешен, дәріскер болу, семинарлар, келіссөздер жүргізу, мұғалім, журналист, жазушы, менеджер және т.б. болу. Қоғамда сөзіңіз арқылы дамуыңыз керек. Сондай-ақ сіз бауырларыңызға (бар болса) көмектесу жүгін арқалайсыз. Сіз олар үшін тек тірек қана емес, ұстаз да болуыңыз керек.\nОқуыңыз және оқытуыңыз, зияткерлік біліміңіз бен дағдыларыңызды арттыруыңыз керек (жеткен жеріңізде тоқтамаңыз). Оқуды жарты жолда тастауға немесе одан мүлдем бас тартуға болмайды.\nМұндай міндеті бар адамдар көпшілік алдына шығудан жиі қорқады. Бұл қорқынышпен күресу керек.",
  "2": "Сізге қоршаған орта, жануарлар, балалар мен мүмкіндігі шектеулі адамдар үшін жауапкершілік арқалау керек. Әсіресе мұқтаж адамдарға қамқорлық жасап, оларды қорғау. Барлық әйелдерді, әсіресе жақындарыңызды (ана, апа-сіңлі, әйел, қыз және т.б.) қорғауға тұру; олардың денсаулығына қамқорлық жасау керек. Сондай-ақ түйсікті, жанашырлықты, төзімділікті, мейірім мен қамқорлықты дамытуды ұмытпаған жөн. Медицинаға жақын саланы таңдаған дұрыс.",
  "3": "Бұл міндет жай ғана ата-ана болуды емес, балаларыңызға білімді, тәжірибені, дағдыларды, таланттар мен қабілеттерді беруді білдіреді. Балаларыңызды тәрбиелеумен және оқытумен жеке өзіңіз айналысуыңыз керек. Сондай-ақ мұғалім болуыңызға немесе идеяларыңыз бен таланттарыңыздың ізбасарлары болуына болады. Сіздің міндетіңіз — біліміңізді жай беру ғана емес, балаға аяғынан тұруға көмектесу, оған өмірдегі барлық жолды ашу.",
  "4": "Сіз жай ғана кәсіпқой болып қоймай, басқа адамдарға да сіздің табыстарыңыздан табыс табуға мүмкіндік беруіңіз керек. Үлгі тұтарлық, ерік-жігері мықты, әділ басшы болу керек. Егер отбасын таңдап, кәсіби тұрғыда дамығыңыз келмесе, тұрмыстық мәселелерге жұмыста жүргендей қарауыңыз керек. Қаржылық әл-ауқат үшін некеге тұрудан аулақ болуға тырысыңыз. Бірінші орында таңдаған салада кәсіби тұрғыда даму міндеті тұруы керек. Жауапкершілікті өз мойныңызға алуды және қойылған міндетті өз бетіңізше орындай білуді үйренуіңіз керек. Егер өз бизнесіңіз болса, қандай да бір процеске тікелей өзіңіз қатысуыңыз керек («торттың үстіндегі шие»).",
  "5": "Сізге ғылыми немесе рухани зерттеулермен айналысу, білімді кеңейтіп, тереңдету, жақсы білім алу керек. Тексерілген ақпаратты көпшілікке жеткізу. Рухани даму, түрлі елдерге саяхаттау, басқа халықтардың түрлі мәдениеттері мен дәстүрлерін зерттеу керек. Зиянды тағамдарды, алкогольді және т.б. теріс пайдаланбай, дұрыс өмір салтын ұстануға міндеттісіз. Сіз әулет (Род) дәстүрлерінің рухани жалғастырушысы болып, адамгершілікті, моральды және заңдылықты алып жүруіңіз керек. Ер адамдарға ренжуге жол бермеңіз, бәріне лайықты қарауды үйреніңіз.",
  "6": "Сіз шынайы махаббат сезімінің, тазалықтың, қарым-қатынастағы үйлесімнің иесі болуыңыз керек. Жеке қарым-қатынаста эталон болуыңыз керек. Отбасыңызға назар аударып, отбасы мүшелеріңіз үшін тірек, қолдау, жан жұбанышы болуыңыз керек. Тура мағынасында отбасы мүддесіне қызмет ету керек. Ажырасу мен опасыздыққа жол берілмейді!",
  "7": "Өмір ұсынатын барлық қызмет түрлеріне белсенді қосылуыңыз керек. Өз үлгіңізбен адамдарды белсенді әрі прогрессивті өмір салтына үйрету. Сізге көп саяхаттау, басқа мәдениеттерді зерттеу, өмір салтыңызға жаңа бір нәрсе енгізу маңызды. Басқа халықтардың жағымды тәжірибесін үйреніп, Отанға оралып, бұл тәжірибені енгізіп, іс жүзінде қолдану. Көлік, ең болмаса велосипед жүргізуге міндеттісіз. Үнемі қозғалыста болып, жол жүрумен байланысты кәсіп иесі болуыңыз керек. Егер қозғалмасаңыз, аяқпен мәселелер басталуы мүмкін. Сондай-ақ басқа адамдарды белгіленген жоспарларды жүзеге асыруға шабыттандыру керек.",
  "8": "Сіз заңдылықты, әділдікті, ар-намыс пен қадір-қасиетті қорғауда тұруыңыз керек. Ізгі болып, тараптарды татуластыру, қандай да бір дау-жанжалдарда «төреші» болу керек. Өз көзқарасыңыз болып, әрқашан ішкі адамгершілік бағдарларыңызды ұстануыңыз керек. Айналаңызда жанжалға, қорлауға, азғындық пен адалсыздыққа жол бермеу. Сізге дауласуға және жанжалдасуға болмайды. Тепе-теңдік пен ішкі үйлесімді сақтауды үйреніңіз. Заңды сақтау және Құқықты зерттеу маңызды. Сегіз — әділдік пен адалдық арканы.",
  "9": "Сізге әулетіңіздің дәстүрлеріне сәйкес рухани даму, жасы үлкен адамдармен араласу, көне мәдениеттерді, әулетіңіздің, мемлекеттің тарихын зерттеу керек. Әулетіңіздің аға буынына, әсіресе ата-анаңызға барынша көмектесу керек. Туыстарыңызға көмектескіңіз келмегендіктен ұзаққа созылған созылмалы аурулар көрінуі мүмкін. Сіз өмірдің мәнін тауып, басқалардың қателерінен үйренуіңіз керек. Өз біліміңіз бен тәжірибеңіздің арқасында есейген шағыңызда кеңеспен және сөзбен көмектесуіңіз керек. Бұл белгі сондай-ақ кез келген эзотерикалық бағытты зерттеу және дербес өмір салтын ұстану қажеттігін көрсетеді. Тоғызыншы арканның ақшамен ешқандай байланысы жоқ. Егер ақшаның бір бөлігін қарттар үйіне садақа етсеңіз, өткен өмірдің Карма мәселесін жабасыз. Сондай-ақ өз бизнесіңіз болса, зейнеткерлерге жеңілдік жасауыңызға болады.",
  "10": "Сізге ақшаға дұрыс көзқарас қалыптастыру керек. Олардың соңынан қумаңыз, өйткені олар сізге тек көрсеткен руханилығыңыз үшін жоғарғы күштердің алғысы арқылы ғана келеді. Сіз тек өзіңізді ғана емес, жақындарыңызды, ең алдымен балаларыңызды қамтамасыз етуіңіз керек. Жақындарыңыздың сіздің қаржылық мүмкіндіктеріңізге сүйенуге құқығы бар, бөлісуді үйреніңіз. Егер сіз әйел болсаңыз да, бәрібір отбасыңызды, соның ішінде күйеуіңізді де қамтамасыз етуіңіз керек. Өз бизнесіңіздің болуы маңызды. Несие алуға және біреуге қарыз болуға болмайды!",
  "11": "Бұл міндет мінез күшінің, зейінді шоғырландырудың жарқын қырларын береді. Алайда мәні — эмоциялар мен сезімдерді басқара білу, оларды жағымды жасампаз (созидательный) арнаға бағыттау. Жол беруді, күшті қарсыласпен өзара әрекеттесуді, күрделі одақта ымыраға келуді үйрену керек. Кедергілерден қорықпау, кез келген «толқынға» батыл бару, күресу және берілмеу. Өмірде оңай болмайды. Сондай-ақ айналаңызды қорғау керек. Сіздің міндетіңіз — қорғау, қамқорлық жасап, өз позицияңызды қорғау керек. Бойыңызда ерлік, батылдық, қаһармандық сияқты сезімдерді дамыту. Сондай-ақ қорқыныштарыңызды жеңуді үйрену керек. Спортпен айналысу немесе әскерде қызмет ету өте пайдалы. Мұндай міндеті бар адамдар жиі күш қолданатын ерлер кәсіптерін, сондай-ақ хирургияны таңдайды. Дәрігердің айтқанының бәрін қайта тексеру ұсынылады, өйткені дәрігерлік қателер және дұрыс қойылмаған диагноздар болуы мүмкін.",
  "12": "Міндет сізден адамдарды тыңдауды, естуді, түсінуді, ақтауды үйренуді сұрайды. Ол тікелей адамдармен жұмысқа байланысты (психология саласы мінсіз сай келеді). Адамдарға мәселелерін түсінуге көмектесу үшін түйсікті пайдалануды үйрену керек. 12-міндеті бар адамдар әдетте бөтеннің ауыруы мен уайымын бастан кешіріп, сезінеді. Сезімдер мен эмоцияларды көрсетуден ұялмаңыз, жаныңызды ашып, жанашырлық, түсіністік, сүйіспеншілік пен еркелік көрсетіңіз. Күшті, дана, шыдамды тәлімгер болуды үйреніңіз. Ішкі тепе-теңдік және жоғары мақсаттар үшін өз мүддеңізді құрбан ете білу маңызды.",
  "13": "Бұл міндеттің өз атауы бар — Раху міндеті. Кез келген салада жаңалық ашушы болу керек. Ешкім ешқашан жасамаған нәрсені ойлап табу, жасау, жаратып шығару. Өзіңізді тыңдауды және өзіңізді өмірге ерекше көзқарасы бар, қарапайым емес адам ретінде сезінуді үйрену маңызды. Онымен адамдармен бөлісіңіз. Адамдарға альтруизм, мейірімділік арқылы қызмет етіп, пайдасыз көмектесу керек. Үнемі жетіліп, жаңа мақсаттарға ұмтылу. Ғылыми, шығармашылық, медициналық төңкеріс жасау керек, әрі ол адамдарға пайдасын тигізуі керек. Егер адам 13-міндетті орындамаса, жақын адамдарынан айырылу, ауыр сынақтар, аурулар ықтималдығы жоғары.",
  "14": "Бұл миссия тек отбасыңыздың игілігіне ұмтыла отырып, үйлесімді әрі қанағатшыл өмір салтын ұстану қажеттігін көрсетеді. Байлықты оны қатты қаламасаңыз ғана, азға қуануды үйренсеңіз ғана береді. Сіз отбасыңыздың тірегі мен орталығы болып, оларға көмектесіп, туыстарыңызды шабыттандырып, оларға қамқорлық жасауыңыз керек. Татуластырушы, бітімгер, делдал болу. Адамдарды әлемді тамашалауға, оны тәжірибенің алуан түрлілігімен сүюге үйретіңіз. Өсімдік өсіруді және олармен сөйлесуді үйреніңіз. Бұл белгі адамды көп жағынан шектейді (ақшада, қоғамдағы орнында, эмоцияларда және т.б.). Бұл шектеулерді өз кәсібіңіз (ремеслоңыз) арқылы үзу керек, яғни өз қолыңызбен немесе ақылыңызбен бір нәрсе жасауды үйрену керек, сонда өмірдегі барлық жол сізге ашылады. 14-аркан шығын мен несиені жақтырмайды. Түрлі қарыздардан аулақ болған дұрыс.",
  "15": "Эзотерикамен айналысып, түрлі пәндерді зерттеу керек. Өз үлгіңізбен және өмір салтыңызбен азғырулардың, арбаулардың, білімнің, шығармашылық бағыттардың түрлі нұсқаларын көрсету маңызды. Сіз адамдарды толқытып, оларды эмоциялар мен сезімдерге оятуыңыз керек. Тағдырларға ықпал етуге де рұқсат етілген, бірақ қалай екенін тек өзіңіз шешесіз. 15-міндеті бар адамдар өз үлгісімен қалай болмау керегін көрсетуі керек! Оларға бәрінде «алтын ортаны» ұстанған дұрыс — басқалардың өмірін сәл бүлдіру, сәл көтермелеу, сәл жанжалдасып, кейін татуласу және т.б. Мұндай адамдарға сөзге сақ болып, жақындарыңыз бен таныстарыңызға міндетті түрде зиян келтіретін сөзді артынан айтпау керек.",
  "16": "Бұл — тура мағынада да, ауыспалы мағынада да (мысалы, адамдардың дүниетанымын қайта құру) құрылысшының белгісі. Міндетіңіз сіздің бұл сөздің кең мағынасында құрылысшы болуыңыз керек екенін айтады. Өзін ескірткен нәрседен алыстауды, өмірді жаңа, болашағы бар, өзекті нәрсе үшін тазартуды үйренуіңіз керек. Жаңа есіктерді ашуды үйренуіңіз керек. Сіздің міндетіңіз — адамдардың стереотиптерін бұзу, жаңа құндылықтар жүйесін құру, адамзатты жаңа ғарыштық заңдарға дайындау. Сондай-ақ 16-міндеті бар адамдарға үйінің күйін қадағалау керек (бәрі жөнделген, жұмыс істейтін және ақпайтын болуы керек).",
  "17": "Сізге таланттарыңызды, артистизміңізді дамыту, өзін-өзі көрсету, креативтілік, әсемдікті сезіну үстінде жұмыс істеу керек. Сіз біздің әлемге өз шығармашылық туындыларыңызды әкелуіңіз керек, тіпті ол бір ғана өлең немесе өзіңіз салған бір сурет болса да, бастысы — кішкентайдан бастау. Егер бұл мақсат тым биік көрінсе, төменгі деңгейде өз үйіңіздің немесе учаскеңіздің әдемі дизайнын ойластыру ұсынылады. Өнердің түрлі салаларында өзіңізді байқап көру және ішкі әлеміңізді шығармашылық арқылы көрсету маңызды (ғылым, эзотерика, өнер, би, фото, кино және т.б.). Бұл шығармашылықты адамдардан жасыруға болмайды, оны басқаларға көрсету керек (мысалы, әлеуметтік желілер арқылы).",
  "18": "Сіздің міндетіңіз басқалардың қажеттіліктерін сезінуіңізді пайдаланып, адамдарға сол немесе басқа сәтте не маңызды екенін түсініп, басқа адамдар үшін жайлылық пен жайлы орта жасау қажеттілігімен байланысты. Стиль, сұлулық, үйлесім сезімін дамытыңыз. Қиялыңыз бен елестету қабілетіңізді мүмкіндігінше жиі пайдаланыңыз. Үй шаруашылығымен өз бетіңізше айналысып, үйдегі қолөнерді үйрену керек. Түйсік пен көрегендікті пайдаланыңыз. Айналаңызға қамқорлық жасап, қырағылық танытып, жақын адамдарға уақытында көмек көрсетуіңіз керек. Кез келген ортада жылы атмосфера жасауыңыз керек, жақсы тамақ пісіре білуіңіз, сондай-ақ гардероб пен стильді өз бетіңізше таңдай білуіңіз керек. Бұл — стиль, сұлулық пен сән, тоқу, тігін және үйдегі қолөнер белгісі.",
  "19": "Сіз қоғамда жоғары мәртебе мен орынға қол жеткізіп (ауқымы маңызды емес), өз ортаңызда дана, сенімді әрі әділ көшбасшы болуыңыз керек. Жоғары лауазымда отырып, мансап сатысы бойынша табысқа ұмтыла отырып, айналаңызға қолдау көрсетіп, шабыттандырып, үлгі тұтарлық болыңыз. Басқаларға да мансап сатысында жылжуға міндетті түрде көмектесу керек, әйтпесе жоғары лауазымнан түсіреді!",
  "20": "Сіздің міндетіңіз — әулеттің дәстүрлері мен негіздерін қорғау, әулеттің барлық мүшелеріне материалдық та, рухани да игіліктерге ие болуға көмектесу. Әулеттің дәстүрлерін, негіздерін және заңдарын сақтау және ұрпаққа беру. Дұрыс құндылықтар жүйесін сақтап, беру, отбасылық таланттарды, кәсіптер мен дәстүрлерді қайта жаңғырту. Әулет туралы естелікті қалпына келтіру, барлық маңызды есімдерді жаңғырту, ата-бабалардың зираттарын күтіп, барлық туыстарға көмектесу керек. Отбасы болып, қала сыртында тұру (немесе табиғатта жиірек болу), ауыл шаруашылығымен айналысу, балаларды ескі дәстүрлерде тәрбиелеу маңызды. Сондай-ақ Рита (немесе телегония) заңдарын сақтап, әулеттің тазалығын ұстану ұсынылады.",
  "21": "Отанның өкілі және қорғаушысы болу керек. Елдің мүддесін білдіру, шетелде заңдарды сақтау, өз халқыңызды дәріптеу. Шетелде тұру немесе шетелдік компанияларда жұмыс істеу, шет тілінде сөйлесу маңызды. Басқа елдердің технологияларын біздің дәстүрлерге біріктіру. Адамдардың дүниетанымын кеңейту. Бойыңызда төзімділік, жаңаның бәріне ашықтық сияқты қасиеттерді қалыптастыруыңыз керек. Әлем бойынша көп саяхаттап, шетелдіктермен араласып, түрлі елдердің мәдениеттерін, талғамдарын, тіпті инновацияларын біріктіруге ұмтылуыңыз керек. Балаларыңыз әртүрлі тілдерді білуі, әртүрлі халықтардың мәдениетін, тарихы мен дәстүрлерін зерттеуі керек.",
  "22": "Сіздің міндетіңіз — балаларға қарызды өтеу, балаларға байланысты кәсіпті таңдаған дұрыс, осылайша Карманы түзету сізге оңайырақ болады. Басқа балаларды тәрбиелеп, оқыту керек (балабақшаға, мектепке барып, өз кәсібіңіз туралы айту және т.б.). Сіз балалар үшін тірек және қорғаушы, ұстаз, тәлімгер бола аласыз, бұл ретте баланы өмірінде сүйемелдеп, ол үшін толық жауапкершілікті қабылдау маңызды. Сіз ашық, достық пейілді, баладай аңғал адам, сенімді дос, жақындарыңыз үшін тірек болуыңыз керек. Бойыңыздағы мазасыздықты, агрессияны, ренжісті, ашуды, әсіресе балаларға қатысты сөндіру керек."
 },
 "day": {
  "1": "(1) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — көшбасшылық, мақсаткерлік, мақсат қойып, оған жете білу, сөзді меңгеру, білім алу және оны беру.\nОл үшін міндетті орындауыңыз керек — бауырларыңызға қамқорлық жасап, оларға кеңес беріп көмектесу, жанжалға жол бермеу. Егер олармен қарым-қатынас бітіспес болса, онда қарым-қатынас бейтарап, арақашықтықта болғаны жақсы. Егер бауырыңыз болмаса — бұл ата-ананың қатесі. Бұл жағдайда бағдарламаны шәкіртіңіз, тағылымдамашыңыз арқылы өңдеуге болады. Сондай-ақ ұстазға және алған білімге құрметпен қарап, үнемі жаңаны үйрену керек.\n«Бірдің» теріс көрінісі де бар — билікқұмарлық.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: бауырының сатқындығы, олармен жанжал, олардың ауруы. Құжаттарды рәсімдеуде қателер, сөйлеу, есте сақтау, есту қабілетінде мәселелер болуы мүмкін. Адам алаяқтардың құрбаны болуы мүмкін.",
  "2": "(2) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — сезімталдық, қамқорлық, мейірімділік, басқа адамдардың психофизикалық күйін сезіну, емшілік пен тәуіптік дарыны.\nОл үшін міндетті орындауыңыз керек — жақын әйелдерге (ана, әже, қыз) қамқорлық жасау. Бала кезден үй жануарларына күтім жасауға, табиғатты қорғауға ұмтылыңыз.\n«Екінің» теріс көрінісі де бар — өздерін ренжітетін адамдарға деген сезімсіздік.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: жақын әйелдердің ауыр аурулары; жүктілікті сақтау мәселелері; ер адамдарда балалы болуға қатысты қиындықтар; анамен жанжал, әйелдер тарапынан сатқындық, ананың денсаулығына алаңдау; несеп-жыныс жүйесінің аурулары. Жұптың аналары қаламайынша, олардың отбасында бала болмайды.\n«Екілерді» оларға даналықты, жақындарға қамқорлық жасай білуді беру үшін әжелер тәрбиелеуі керек.\nНумерологияда 2 — экология, денсаулық, қамқорлық, мейірім, ана және жалпы әйел белгісі.",
  "3": "(3) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — жақсы есте сақтау қабілеті, Жердің ментальді өрісінен ақпаратты оқи білу, жақсы оқу қабілеті, кез келген нәрсені үйрене алу, шашыраңқы ақпаратты біріктіру қабілеті, ойды материалдандыру дарыны («Құпия» (Секрет) фильмі).\nОл үшін міндетті орындауыңыз керек — ең болмаса бір баланы (асырап алған болса да) тәрбиелеп, оқытып, оған мансап құруға немесе бизнесті өз перзентіндей өсіруге көмектесу. «Үштер» өздері қаламаса, олардың балалары болмайды.\n«Үштің» теріс көрінісі де бар — дербес болмау, шабыт керек — «сиқырлы түрткі».\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: бала тууға бөгет, жүкті болу мәселелері, ене мен қайын енемен жанжал, балалар тарапынан сатқындық, балалардың ауруы, сәттілік жоқ, нақты құрылған жоспарлар орындалмайды.\n«Үштерді» көбіне аналары тәрбиелеуі керек. Олар үшін әйел — бедел. Олардың аналарымен жиі күрделі қарым-қатынасы болады. Ер адамдар «әйелінің уысындағы» және «анасының еркесі» болып өсуі мүмкін.\nНумерологияда 3 — әкелік пен аналық белгісі.",
  "4": "(4) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — жоғары кәсібилік, болжамдылық, тұрақтылық, сенімділік, еңбекқорлық, консерватизм.\nОл үшін міндетті орындауыңыз керек — таңдаған салада кәсіпқой болу. Шала жұмысқа жол берілмейді. Бала кезде сіздің жұмысыңыз — мектептегі оқу, жақсы оқу маңызды.\n«Төрттің» теріс көрінісі де бар — жалқаулық.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: әріптестердің сатқындығы, мансаптың күйреуі, басшылықпен мәселелер, мансап сатысымен жоғарылаудағы қиындықтар, астыртын ойындар, тірек-қимыл аппаратымен мәселелер.\nНумерологияда 4 — император, мансап және бизнес белгісі. «Төрттерді» бір нәрсені тез үйрене алуы үшін абсолютті қатаңдықта тәрбиелеу керек. Оларға өте талапшыл болу керек. Тәрбиесі неғұрлым жұмсақ болса, тағдыры соғұрлым күрделі.",
  "5": "(5) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — кез келген нәрсені кез келген адамға сата білу қабілеті; ғылымдарды зерттеу қабілеті, жылдам ойлау, жеңіл жүкпен саяхаттауды жақсы көру, кез келген адаммен тіл табыса білу.\nОл үшін міндетті орындауыңыз керек — ер адамдарға құрметпен қарау, жақын ортадағы ер адамдарға көмектесу, дұрыс әрі салауатты өмір салтын ұстану (СӨС пен дұрыс тамақтану, спорт), рухани даму, үлгі тұтарлық болу. Жұмыста ер адамдарға жеңілдіктер мен акциялар жасау қолайлы.\n«Бестің» теріс көрінісі де бар — асығыстық, сырттай байыпсыздық, маскүнемдікке бейімділік.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: әкемен жанжал, әкенің денсаулығына алаңдау, басшылармен мәселелер, анестезияға, аллергияға және тыныс алуға қатысты сақ болу керек.\nНумерологияда 5 — Ұлы Абыз (Верховный Жрец) белгісі. Бұл — барлық сұрақтың жауабын білетін адам. Ол дұрыс тамақтануды ұстанады, өйткені ағзасы улануға бейім. «Бестер» кез келген табиғи емес материалдар мен өнімдерге өте сезімтал. Жиі алкогольге тәуелді болады немесе аз мөлшердегі алкогольден уланып қалуы мүмкін. «Бестерді» әкелері немесе ер адам тәрбиелеуі керек. Тек ер адам ғана олар үшін бедел бола алады. Олар тағдырымен әкесіне байланған. «Бес» әйелдерге онша белсенді емес ер адамдар беріледі.",
  "6": "(6) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — сыртқы тартымдылық, харизма, сүйкімділік, қонақжайлылық, басқа адамдардың қажеттіліктерін біледі, стиль сезімі бар (жақсы модельер бола алады), қолөнерге талантты, жақындарын алыстан сезеді.\nОл үшін міндетті орындауыңыз керек — ресми некеде болып, отбасы мүшелеріне, ата-анаға және барлық ұрпаққа қамқорлық жасау керек. Отбасылық қарым-қатынаста үлгі, эталон болу, ажырасуға және опасыздық жасауға, тіпті ойша да болмайды.\n«Алтының» теріс көрінісі де бар — қыңырлық (өте қыңыр).\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: мүлікті бөлісумен ажырасу, кармалық қарым-қатынас, серіктестердің, соның ішінде іскерлік серіктестердің опасыздығы мен сатқындығы, мәмілелер мен келісімшарттардың бұзылуы, жүрек-қантамыр жүйесінде мәселелер.\nНумерологияда 6 — отбасы, үйдегі қолөнер мен үйдегі шығармашылық, сондай-ақ серіктестік белгісі.\nЕгер сіз опасыздық жасаған адам сізді шын жүректен кешірсе, белгінің теріс көріністері жұмсарады.",
  "7": "(7) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — жылдам ойлау, бәрін терең тану, киелі нәрсені зерттеуді жақсы көреді, карма заңдарын сезеді, себеп-салдарлық байланыстарды (неге солай болатынын) көреді, жағдайды алдын ала болжай алады, бірақ оны өзгерте алмайды, сондықтан өз дарынын жиі қарғыс ретінде қабылдайды. «Жетілер» өте тапқыр.\nОл үшін міндетті орындауыңыз керек — ең болмаса ел ішінде саяхаттап, басқа халықтардың мәдениетін зерттеп, олардың технологияларын өз өміріңізде қолдану керек. Өмірге кішкентай пайдалы нәрселер ойлап табу (ең болмаса пакеттерге арналған пакет). Көлік, велосипед, самокат жүргізгені жақсы, жұмысты жол жүрумен, іссапарлармен байланыстысын таңдаған дұрыс, семинар өткізсеңіз, вебинар емес, көшпелі семинар өткізіңіз.\n«Жетінің» теріс көрінісі де бар — айлакерлік, арандатуға бейімділік, біліммен бөліскісі келмеу.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: көлікпен мәселелер (жиі бұзылу), автонесиелермен мәселелер (не бермейді, не төлемдерде қиындық), ұсақ жол-көлік оқиғалары (жеңіл), аяқпен мәселелер, тіпті сал болуға дейін, мансап пен бизнестегі кедергілер.\nНумерологияда 7 — арба (колесница), қозғалыс белгісі. «Жетілер» барлық жасырын, киелі нәрсені жақсы көреді және зияткерлік дамуға ұмтылады.",
  "8": "(8) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — ғалам заңдарына, тепе-теңдікке, әділдікке жауап беру, соттау құқығына ие болу.\nОл үшін міндетті орындауыңыз керек — тараптарды татуластыруыңыз керек, құқықты зерттеп, дұрыс шешім қабылдауды үйрену, сөзде тұру керек, заң бұзуға болмайды, жанжалдасуға болмайды.\n«Сегіздің» теріс көрінісі де бар — жанжалшылдық (адамдарға бұлай істеуге болмайтынын түсіндіруден шаршағандықтан).\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: бизнестегі мәселелер, әріптестер тарапынан арандату мен сатқындық, мұндай қызметкердің еңбегін байқамайды, омыртқамен мәселелер, көбіне бел бөлімі, жарықтар (грыжи), омыртқаның сыну қаупі.\nНумерологияда 8 — әділдік, сот төрелігі белгісі. Олардан тамаша заңгерлер шығады, өйткені олар заңдарды санаасты (подсознание) деңгейде біледі. Олар әрқашан жанжалды ортада өмір сүреді, құжаттарды тамаша қолдан жасайды, жиі қос өмір сүреді.",
  "9": "(9) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — «айқын» деген сөзбен басталатынның бәрі (айқын көру, айқын білу, айқын есту...); астралды қауыммен байланыс (періштелер, архангелдер, жоғары періштелер, қамқоршылар); бақсылық (шаманство), регрессия, экстрасенсорика; дербестік, өзін-өзі жеткілікті сезіну.\nОл үшін міндетті орындауыңыз керек — экстрасенсорлық қабілеттерді дамыту, ешкімге сүйенбей, өзін-өзі жеткілікті, дербес тұлға болу. Аға буынға көмек көрсету керек. Аға буын адамдарына жеңілдіктер немесе акциялар жасау қолайлы. Егер «тоғыз» әлеуметтік игіліктерден өз еркімен бас тартпаса, оны жоғалтулар арқылы кесіп тастайды.\n«Тоғыздың» теріс көрінісі де бар — жалғыздықтан қорқу, өзімшілдік.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: оқшаулану, қоғамнан алшақтау, денсаулыққа жиі көңіл бөлуге тура келеді.\nНумерологияда 9 — экстрасенсорика, дербестік, аға буын, қызмет ету белгісі.\n«Тоғыздың» санаастында (подсознание) жалғыздықтан қорқу бар. Олар жалғыз қалудан қорыққандықтан серіктесіне сұмдық нәрселерді кешіре алады, бірақ олар дәл жалғыздықта ашылады.\n«Тоғыздар» шын жүректен сүйе алмайды, олар өзін сол немесе басқа жағдайда сүйеді.",
  "10": "(10) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — көшбасшылық, мақсаткерлік, мақсат қойып, оған жете білу, сөзді меңгеру, білім алу және оны беру.\nОл үшін міндетті орындауыңыз керек — жақындарыңызды материалдық жағынан қамтамасыз етуіңіз немесе жақын адамыңыз өзін қамтамасыз ете алуы не өз бизнесін құра алуы үшін жайлы тұрмыстық жағдай жасауыңыз керек. Егер мұны істемесе, белгі минусқа кетеді.\n10 — жартылай кармалық туған күн. Қазір туған күнде өткен өмірде жіберілген кармалық мінез ерекшелігі көрінеді. Адам өткен өмірінде қаржы мәселелерінде тым пайдакүнем болған. Бірінші метациклде ол міндетті түрде отбасын қамтамасыз ету мәселесімен айналысуы керек. Егер міндетті орындай алмаса — ақшадан айырыла бастайды.\n10-ның теріс көрінісі де бар — билікқұмарлық.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: барлық айналымдағы процестердің (бизнес, сауда) тоқтауы, ірі қаржылық мәселелер, сәттіліктің болмауы, күтпеген келеңсіздіктер. Ағзадағы сұйықтық айналымының бұзылуы, сусыздану, лимфа мен қанның іркілуі; жиі сүйек аппаратының деформациясына әкелетін лимфамен мәселелер, ісінулер.\nНумерологияда 10 — бақ (фортуна) белгісі.",
  "11": "(11) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — сезімталдық, қамқорлық, мейірімділік, басқа адамдардың психофизикалық күйін сезіну, емшілік пен тәуіптік дарыны, басқа адамдардың эмоцияларын басқару қабілеті және ой күшімен адамды тоқтата алу қабілеті.\nОл үшін міндетті орындауыңыз керек — айналаңызды сөзбен қорғауыңыз керек.\n11 — жартылай кармалық туған күн. Қазір туған күнде өткен өмірде жіберілген кармалық мінез ерекшелігі көрінеді. Адам өткен өмірінде психофизикалық күшті асыра қолданған. Міндетін орындауға тырысса да, шамадан тыс агрессиялы болған. Оған бұл өмірде басқа адамдарды татуластыруды, қорғауды, көңілін көтеруді және жақындарының физикалық әрі психикалық күйіне қамқорлық жасауды үйрену маңызды.\n11-дің теріс көрінісі де бар — өздерін ренжіткендерге деген жүрексіздік.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: жарақаттар, мертігу, жаралану; жанжалдар; қажетсіз хирургиялық операциялар; дәрігерлік қателер (диагнозды қайта тексерген жөн); жасырын жаулар.\nНумерологияда 11 — күш белгісі.\nБарлығына бәсекелестік пен қарсыласу арқылы жетеді. Барлығынан жау көреді, бәріне күдікпен қарайды.",
  "12": "(12) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — жақсы есте сақтау қабілеті, Жердің ментальді өрісінен ақпаратты оқи білу, жақсы оқу қабілеті, кез келген нәрсені үйрене алу, шашыраңқы ақпаратты біріктіру қабілеті, ойды материалдандыру дарыны («Құпия» (Секрет) фильмі).\nОл үшін міндетті орындауыңыз керек — адамдарға күн астындағы өз орнын, өз арнауын табуға көмектесу, пайдасыз көмектесу, айналаңызды психологиялық тұрғыдан қолдау керек.\n12 — жартылай кармалық туған күн. Қазір туған күнде өткен өмірде жіберілген кармалық мінез ерекшелігі көрінеді. Адам өткен өмірінде сәл дөрекі болған, айналасына жеткілікті жұмсақ қарамаған. Ол тек өзіне сеніп, өзіне ғана сүйенген. Енді ол тек өзіне бағдар алуы керек. Ешкімге сүйене алмайды.\n12-нің теріс көрінісі де бар — дербес болмау.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: депрессиялар, тәуелділіктің барлық түрлері, өзін түсінбеу, қоғамның айыптауы, қоғам тарапынан қолдаудың болмауы, денсаулыққа қатысты ауыр мәселелер (жыл сайын тексеріліп тұрған жөн).\nНумерологияда 12 — пайдакүнем болмау белгісі.\n12-лер шексіз сезімтал, әлемді жиі қызғылт түсте көреді, сондықтан өздерін қорлайтындарға тәуелді болып, оларды үнемі ақтайды.",
  "13": "(13) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — стандартты емес ойлау, мүлдем болжауға келмейтін адамдар, гипноздық қасиеттерге ие, балама нұсқаларды көре алады, жаңа істерсіз отыра алмайды.\nОл үшін міндетті орындауыңыз керек — сізге дейін ешкім ешқашан жасамаған нәрсені жасау, ең болмаса бір адамды сізге ілесуге шабыттандыру, жұмыс үшін көп міндетті жұмысты таңдаған дұрыс, мысалы, заңгерлік, құрылыс компаниялары, жаңа жобалар.\n13 — жартылай кармалық туған күн. Қазір туған күнде өткен өмірде жіберілген кармалық мінез ерекшелігі көрінеді. Өткен өмірінде мұндай адам әрқашан паровоздан алда жүгірген. Бұл өмірде оған ең күрделі міндет бұйырды — жаңалық ашушы болу, жаңа жолдар салу және көпшілікті соңынан ерту. Тұрақты нәрсенің бәрі адамнан алынады. Оның міндеті — үнемі жаңа энергоақпараттық ағында болу.\n13-тің теріс көрінісі де бар — жалқаулық (қорқынышты емес, кейде жалқаулануға болады).\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: жоспарлардың бұзылуы, бәрі сіз ойлағаннан бірнеше есе нашар болады, өмірдегі күрт өзгерістер, жолда сақ болу керек, жақындарға қатысты уайым, айналадағылардың түсінбеуі.\nНумерологияда 13 — бұзылу, жаңа қасиеттерге ие болу арқылы трансформация белгісі.",
  "14": "(14) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — басқа адамдардың қажеттілігін түсіну, қарым-қатынасқа ашықтық.\nОл үшін міндетті орындауыңыз керек — бөлісу керек.\n14 — кармалық туған күн. Қазір туған күнде өткен өмірдің өтілмеген сабағы көрінеді. Адам өткен өмірінде тым сараң болған (сараңдық кез келген болуы мүмкін: білімге, ақшаға, эмоцияларға, әсерлерге, махаббатқа сараңдық). Сондықтан бұл өмірде оны көп жағынан шектейді. Оның негізгі міндеті — барына қанағат етуді үйрену. Барынан ләззат ала бастаған бойда — оған көбірек береді. Егер бұл өмірде адамға сараңдық сияқты қасиет тән болса — ол бұл кемшілікпен міндетті түрде күресуі керек.\nАуыл шаруашылығымен айналысу қолайлы. Өсімдік өсіріп, олармен адамдарды тамақтандыру (ең кемі — салатқа арналған салат жапырағын, райхан... өсіру). Әулеттің кәсіптерін қайта жаңғырту немесе жаңаларын бастау қолайлы.\n14-тің теріс көрінісі де бар — асығыстық, сырттай байыпсыздық, маскүнемдікке бейімділік, тоқыраған адамдар, жиі ережемен өмір сүреді.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: «барабашка» (үй иесі рухы) белгісі: үнемі жасырынып жүретін жасырын аурулар, мәселелер және т.б. Немесе мәселе оны түзету мүмкін болмай қалғанда ғана көрінеді. Баяу күйзеліс (разорение). Қазіргі сәтте қажетсіз, табыс пен пайда әкелмейтін нәрсені өз бетімен кесіп тастауды үйрену керек, әйтпесе мүлік пен денсаулықтан толық айырылу. Емделу уақытын жіберіп алу, анықтау қиын аурулар.\nНумерологияда 14 — қанағат (умеренность) белгісі.\nБұл күні туған адамдар «қолдағы торғайды» жақсы көреді. Бұлар — жанының тереңінде ең жомарт адамдар.\nОларда жасушаларды өсіру қабілеті бар. Қолдарында энергия жатыр.\nМұндай адамдар емшілікпен айналысса, ауыр науқастарға энергетикалық әсер етпегені жөн.",
  "15": "(15) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — ерекше тартымды, керемет баурағыш әрі сексуалды болу. Бұлар — тамаша ұйымдастырушылар. Хирургтар, әсіресе нейрохирургтар. Ең күшті рухани тәлімгерлер. Қоғамда — бұлар катализатор адамдар. Олардың қатысуымен керекті жауаптар ойға келеді. Абсолютті магиялық қорғаныс.\nОл үшін міндетті орындауыңыз керек — басқа адамдардың өмірін бүлдіру, адамдарды бір-біріне айдап салу, оларды басқару (манипуляция), не эзотерикамен, магиямен айналысу керек.\nБолмайды: 2 жақтың (қараңғы/жарық) біреуін ғана қабылдау, қараңғы жақпен келісімшартты бұзу; жаман да, жақсы да қылықтар жасап, тепе-теңдік іздеу керек.\nЕгер мұндай адам тек қараңғы жақпен жүрсе, карма бойынша жазаланады.\n15 — кармалық туған күн. Қазір туған күнде өткен өмірдің өтілмеген сабағы көрінеді. Адам өткен өмірінде оған рұқсаты болмай тұрып оккультизммен айналысқан. Денсаулыққа қатысты кейбір мәселелердің себебі өткен өмірде жатыр. Егер мұндай адам бұл өмірде жарық жолға түсуді шешсе — оған өмірде сынақтардан өтуге тура келеді.\n15-тің теріс көрінісі де бар — қыңырлық (өте қыңыр).\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: жақын адамдарды жоғалту, кез келген жағдайды абсолютті минусқа дейін өршіту (шыбыннан түйе жасау), мансап пен бизнестің күйреуі, қабілеттердің жабылуы, өткір бітіспес жанжалдар, жүйкенің қатты шаршауы, ауыр аурулар (денсаулықты уақытында тексеру маңызды).\nНумерологияда 15 — магия, қылмыс, сексуалдылық, эзотерика белгісі.\nӨткен өмірінде қылмыспен немесе магиямен айналысқан. Қиын, шектеулі жағдайларда мұндай адамдар солып қалмай, керісінше дамиды. Оларға алкоголь мен есірткі әсер етпейді, денсаулығына зиян келтірмейді.",
  "16": "(16) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — мұндай адамдарды барлық ерекше әрі жұмбақ нәрсе қызықтырады, олардың өрісінде адамдардың теріс қасиеттері қоздырылады, өйткені олар адамдардың энергетикасын тазартуы керек (бірақ мұны әрқашан істей бермейді).\nОл үшін міндетті орындауыңыз керек — үй салу, адамдардың дүниетанымын құру.\n16 — кармалық туған күн. Қазір туған күнде өткен өмірдің өтілмеген сабағы көрінеді. Адам өткен өмірінде басқа адамдардың өмірін бұзған. Бұл өмірде оған үйлесімді қарым-қатынас құруды; адамдарды қосуды; басқаларға мүлік пен баспанаға ие болуға көмектесуді (құрылыс, жөндеу, риэлторлық) үйрену керек. Ол ешбір жағдайда бұзуға кеңес бермеуі керек. Өз үйін салу; үйдің техникалық күйін қадағалау қолайлы.\n- мұра сұрауға болмайды\n- бұзушы кеңестер беруге болмайды, тек жасампаздық (созидание)\n- отбасыларды біріктіру\n- бөтеннің мүлкіне қызғануға болмайды\n- өткенмен оңай қоштасуды үйрену\n- жылжымайтын мүлікті өз атыңызға рәсімдеу қалаусыз.\n- отпен сақ болу\n- үй салып, оны өз атыңызға рәсімдемеу.\n16-ның теріс көрінісі де бар — айлакерлік, ойланбай кесіп тастайды, «қара тізімдері» бар, қажетсіз нәрсені жинауға, үйді қоқысқа толтыруға бейім; бала кезде бәрін сындырады.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: осы салада қалпына келтіру мүмкіндігінсіз мансап пен бизнестің түбірімен күйреуі, жылжымайтын мүлікпен және оны рәсімдеумен мәселелер, баспанасыз қалу қаупі, жылжымайтын мүліктен айырылу, адамнан өмірлік маңызды бір нәрсені (отбасы, бизнес, денсаулық) жоғалту қаупі.\nНумерологияда 16 — құрылыс (рухани немесе жердегі) белгісі. Адам неғұрлым көп салса, соғұрлым көп игілік алады.",
  "17": "(17) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — романтикалық және талантты болу.\nОл үшін міндетті орындауыңыз керек — талантты адамдарға танымал болуға көмектесу. Өз таланттарыңызды ашып, өзіңіз танымал болуыңыз керек: камера, ютуб... Шығармашылықпен айналысу керек: ғылым, эзотерика, өнер.\n17 — кармалық туған күн. Қазір туған күнде өткен өмірдің өтілмеген сабағы көрінеді. Мұндай адам өткен өмірінде «жұлдыз» болған. Бұл өмірде ол даңқ пен құрметке жұмсағырақ қарауы керек. Өткен өмірінде мұндай адам жалған пайғамбар, жалған ұстаз болуы, авторлық құқықты бұзуы, талантты адамдарға сатқындық жасауы немесе мансап сатысымен даңқ пен гүлденуге тым жылдам көтерілуі мүмкін. Бұл өмірде танымал тұлға болу үшін оған көп нәрсені үйреніп, түсіну керек. Ең алдымен өзі туралы. Мұндай адам даңқ өмірдегі ең басты нәрсе емес екенін түсінбейінше, әрқашан екінші қатарда болады. Кәсіпқой болу керек, сонда оған адамдар тартылады.\n17-нің теріс көрінісі де бар — жанжалшылдық.\nМіндет орындалмаса (өнертабысты, авторлықты ұрласа), жағымсыз оқиғалар болуы мүмкін:\n- тура және ауыспалы мағынада биіктен құлау,\n- мансаптың күйреуі,\n- әскери қызметшілер үшін — погонынан айырылу қаупі,\n- жоғары жылдамдықтағы жол-көлік оқиғалары,\n- ұшақпен ұшқанда сақ болу,\n- бронх-өкпе жүйесімен мәселелер.\nТіпті интернетте де шынайы авторлықты міндетті түрде көрсету керек.\nЕң талантты адамдар 17 қыркүйекте туған.\nНумерологияда 17 — жұлдыз белгісі. Бұлар — өте талантты адамдар, бірақ бұл туралы білмейді.\nЕгер мұндай адамдарды бала кезде басып тастаса, олар циник болып кетеді.",
  "18": "(18) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді —\n- бала кезден өте артистік,\n- өтірікті нәзік сезеді, бірақ өздері әсірелеуге бейім,\n- қалай алдауды біледі,\n- оларда алаяқтық рухы бар,\n- соңғы вагонға секіріп мінеді, жауды тылдан айналып өтеді,\n- өтірікке өте сезімтал,\n- үйде отырғанды жақсы көреді.\nОл үшін міндетті орындауыңыз керек —\n- үй жұмыскерін жалдамай, үй шаруашылығын жеке өзіңіз жүргізу керек,\n- үйдің дизайнымен және әсемдігімен жеке өзіңіз айналысу,\n- ата-анаға көмектесу,\n- жанжалға жол берілмейді.\n18 — кармалық туған күн. Қазір туған күнде өткен өмірдің өтілмеген сабағы көрінеді. Мұндай адам өткен өмірінде өте көп алдаған, бұл өмірде мұны істеуге болмайды. Ол басқа адамдардың логикасын өте нәзік сезеді. Бұл — шығармашыл әрі түйсігі мықты адам. Одан тамаша аспаз, актер немесе дизайнер шығуы мүмкін. Мұндай адам әсірелегенді жақсы көреді. Оның талантын шығармашылық кәсіпте қолданып, дұрыс арнаға бағыттауға болады.\n18-дің теріс көрінісі де бар —\n- ата-анамен жиі жанжал және шиеленіскен қарым-қатынас, оларды жиі елемейді,\n- ата-анасына шағымданады (жала жабады).\n18-лер — жақын ортада (өзіне сенетіндермен) өзімшіл және (ұсақ) алаяқтар — сәл өтірік айтты, бір жерде ақшаны толық бермеді. Әрине, үлкендерді құрметтемеу — әңгімені бөлу, қол сілтеу. Кейін: «Сіздер қандай ызыңсыздар, сіздермен қандай іш пыстырарлық әрі қызықсыз!» деп айту. Осылайша өз қылықтарын ақтау.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін:\n- адамды алдау,\n- алаяқтықтың құрбаны болу,\n- өзі шыңы болмайтын махаббат үшбұрышына қатысу,\n- жайсыз өмір,\n- жайсыз үй, тұрмыстық келеңсіздіктер, ұсақ жөндеу қажет,\n- ішек, бүйрек, несепағармен мәселелер.\nНумерологияда 18 — үй, үй жайлылығы мен әсемдік белгісі.",
  "19": "(19) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — мәртебелілік, мақсаткерлік, мақсат қойып, оған жете білу, айналадағылардың беделі мен құрметі.\nОл үшін міндетті орындауыңыз керек — өз орныңызды пайдаланып, өмір бойы басқа адамдарға көмектесу керек. Өкілеттіктеріңізді өз пайдаңызға қолданбауыңыз керек. Достар, туыстар ортасында мәртебеге жету қолайлы. Сізді құрметтеп, сізден кеңес сұрауы керек. Сіз айналадағылар үшін бедел болуыңыз керек.\n19 — кармалық туған күн. Қазір туған күнде өткен өмірдің өтілмеген сабағы көрінеді. Мұндай адам өткен өмірінде өте жоғары лауазымда болған. Ол министр, шенеунік, ірі өнеркәсіпші немесе кәсіпкер болуы мүмкін. Адам билігін теріс пайдаланған. Ол ерік бостандығы заңын бұзған, сондықтан бұл өмірде басқа адамдарға қысым жасамай, оларды шабыттандыру аса маңызды.\n19-дың теріс көрінісі де бар — билікқұмарлық.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін:\n- мәртебе мен биліктен айырылу,\n- беделге нұқсан келу,\n- мансаптағы мәселе,\n- қарсыластардың астыртын ойындары,\n- шенеуніктермен және мемлекетпен мәселелер (арандату),\n- 19-дарды мәртебесінен айыруы мүмкін, мұны дабырамен, жанжалмен жасайды,\n- ағзадағы күшті қабыну процестері,\n- ағзаның жедел улануы, лимфа айналымы мен шығару жүйелерінің бұзылуы.\nНумерологияда 19 — мәртебе мен билік, қоғамдағы жоғары орын белгісі.",
  "20": "(20) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — мейірім, қамқорлық, рақымдылық, басқа адамдардың психофизикалық күйін сезіну, емшілік пен тәуіптік дарыны.\nОл үшін міндетті орындауыңыз керек — әулеттің (Родтың), халықтың дәстүрлерін еске түсіріп, қолдау немесе өз дәстүрлеріңізді ойлап табу керек. Әулетіңіздің мүшелеріне көмектесу қолайлы.\n20 — кармалық туған күн. Қазір туған күнде өткен өмірдің өтілмеген сабағы көрінеді. Мұндай адам өткен өмірінде өз әулетінің дәстүрлерін сатқан. Мұндай бұзушылықтарға: некеден тыс қарым-қатынас, басқа ұлт өкілімен қарым-қатынас, бөтен мәдениетке кету және тағы басқалар жатады. Соның ішінде адам өз ата-бабаларын есіне алмаған жағдай.\n20-ның теріс көрінісі де бар — өздерін ренжітетін адамдарға деген сезімсіздік.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін:\n- әулеттің барлық мүшелерімен жанжал,\n- олар тарапынан сатқындық (сотқа беруге болмайды),\n- туыстардың аурулары,\n- балалардағы генетикалық ауытқулар.\nНумерологияда 20 — Әулет (Род) белгісі.",
  "21": "(21) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — жақсы есте сақтау қабілеті, Жердің ментальді өрісінен ақпаратты оқи білу, жақсы оқу қабілеті, кез келген нәрсені үйрене алу, шашыраңқы ақпаратты біріктіру қабілеті, ойды материалдандыру дарыны («Құпия» (Секрет) фильмі).\nОл үшін міндетті орындауыңыз керек —\n- шетелге саяхаттау керек,\n- шетелде тұрып, Отанды дәріптеу, Отанның дәстүрлерін сақтау және отандастарыңызға көмектесу,\n- немесе шетелде тұру,\n- немесе шетелдікке тұрмысқа шығу,\n- немесе шетелдік компанияда шетелдіктермен жұмыс істеу,\n- немесе шетелдіктерге кеңес беру,\n- шет тілдерін үйрену (ең болмаса шет тілін түсінуі керек).\n21 — кармалық туған күн. Қазір туған күнде өткен өмірдің өтілмеген сабағы көрінеді. Мұндай адам өткен өмірінде өз Отанына қатысты қылмыс жасаған. Ол басқа мемлекеттің мүддесін білдіруі, өз талантын бөтен елге сатуы, Отанды қорғағысы келмеуі мүмкін. Немесе әйел өз әулетіне ұрпақ тапқысы келмеген.\n21-дің теріс көрінісі де бар — дербес болмау, шабыт керек — «сиқырлы түрткі».\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін:\n- шетелдегі мәселелер, тіпті елден шығарып жіберуге дейін,\n- шетелдіктер немесе шетелдегі отандастар тарапынан сатқындық,\n- паразиттік аурулардың барлық түрлері, сирек вирустар мен аурулар.\nНумерологияда 21 — әлем белгісі.",
  "22": "(22) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — достық пейіл және балаларды сезіну/түсіну, бірнеше істі бір мезгілде атқара білу.\nОл үшін міндетті орындауыңыз керек —\n- өз балаларыңызды тәрбиелеумен жеке айналысу және (немесе) жұмыста көп міндеттілік,\n- бизнес: филиалдар, желі, көп мақсатты бизнес.\n22 — кармалық туған күн. Қазір туған күнде өткен өмірдің өтілмеген сабағы көрінеді. Мұндай адам өткен өмірінде балаларына дөрекі қараған. Немесе адам балаларын тастап кеткен, оларды тәрбиелегісі келмеген.\n22-нің теріс көрінісі де бар — жалқаулық.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін:\n- достар мен 7 жасқа дейінгі кішкентай балалар тарапынан сатқындық,\n- көптеген ұсақ пайдасыз әбігер; неге жармасарын білмейді,\n- бір шешілген мәселе бірнеше жаңасын тудырады,\n- балалар вирустары мен аурулары,\n- міндет орындалмаса — жарақат алу қаупі, жиі абайсыздықтан.\nНумерологияда 22 — балалық шақ пен көптік, достық белгісі.\nБұлар — тәттіні және кәмпитті (кейде) жақсы көретін ең достық пейілді адамдар.\nОлар көп балалы отбасыларда (3 баладан бастап) тууы керек, егер отбасы көп балалы болмаса, белгі достық арқылы өңделеді.",
  "23": "23 санында Меркурий (5) және Күн (1) бойынша екі бағдарлама бар. Олар адамның мінезінде әртүрлі дәрежеде көрінуі мүмкін.\n(1) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — көшбасшылық, мақсаткерлік, мақсат қойып, оған жете білу, сөзді меңгеру, білім алу және оны беру.\nОл үшін міндетті орындауыңыз керек — бауырларыңызға қамқорлық жасап, оларға кеңес беріп көмектесу, жанжалға жол бермеу. Егер олармен қарым-қатынас бітіспес болса, онда қарым-қатынас бейтарап, арақашықтықта болғаны жақсы. Егер бауырыңыз болмаса — бұл ата-ананың қатесі. Бұл жағдайда бағдарламаны шәкіртіңіз, тағылымдамашыңыз арқылы өңдеуге болады. Сондай-ақ ұстазға және алған білімге құрметпен қарап, үнемі жаңаны үйрену керек.\n«Бірдің» теріс көрінісі де бар — билікқұмарлық.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: бауырының сатқындығы, олармен жанжал, олардың ауруы. Құжаттарды рәсімдеуде қателер, сөйлеу, есте сақтау, есту қабілетінде мәселелер болуы мүмкін. Адам алаяқтардың құрбаны болуы мүмкін.\n\n(5) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — кез келген нәрсені кез келген адамға сата білу қабілеті; ғылымдарды зерттеу қабілеті, жылдам ойлау, жеңіл жүкпен саяхаттауды жақсы көру, кез келген адаммен тіл табыса білу.\nОл үшін міндетті орындауыңыз керек — ер адамдарға құрметпен қарау, жақын ортадағы ер адамдарға көмектесу, дұрыс әрі салауатты өмір салтын ұстану (СӨС пен дұрыс тамақтану, спорт), рухани даму, үлгі тұтарлық болу. Жұмыста ер адамдарға жеңілдіктер мен акциялар жасау қолайлы.\n«Бестің» теріс көрінісі де бар — асығыстық, сырттай байыпсыздық, маскүнемдікке бейімділік.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: әкемен жанжал, әкенің денсаулығына алаңдау, басшылармен мәселелер, анестезияға, аллергияға және тыныс алуға қатысты сақ болу керек.\nНумерологияда 5 — Ұлы Абыз (Верховный Жрец) белгісі. Бұл — барлық сұрақтың жауабын білетін адам. Ол дұрыс тамақтануды ұстанады, өйткені ағзасы улануға бейім. «Бестер» кез келген табиғи емес материалдар мен өнімдерге өте сезімтал. Жиі алкогольге тәуелді болады немесе аз мөлшердегі алкогольден уланып қалуы мүмкін. Тек ер адам ғана олар үшін бедел бола алады. Олар тағдырымен әкесіне байланған. «Бес» әйелдерге онша белсенді емес ер адамдар беріледі.",
  "24": "24 санында Венера (6) және Ай (2) бойынша екі бағдарлама бар. Олар адамның мінезінде әртүрлі дәрежеде көрінуі мүмкін.\n24 — жұмсақ адамдар.\n(2) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — сезімталдық, қамқорлық, мейірімділік, басқа адамдардың психофизикалық күйін сезіну, емшілік пен тәуіптік дарыны.\nОл үшін міндетті орындауыңыз керек — жақын әйелдерге (ана, әже, қыз) қамқорлық жасау. Бала кезден үй жануарларына күтім жасауға, табиғатты қорғауға ұмтылыңыз.\n«Екінің» теріс көрінісі де бар — өздерін ренжітетін адамдарға деген сезімсіздік.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: жақын әйелдердің ауыр аурулары; жүктілікті сақтау мәселелері; ер адамдарда балалы болуға қатысты қиындықтар; анамен жанжал, әйелдер тарапынан сатқындық, ананың денсаулығына алаңдау; несеп-жыныс жүйесінің аурулары. Жұптың аналары қаламайынша, олардың отбасында бала болмайды.\n«Екілерді» оларға даналықты, жақындарға қамқорлық жасай білуді беру үшін әжелер тәрбиелеуі керек.\nНумерологияда 2 — экология, денсаулық, қамқорлық, мейірім, ана және жалпы әйел белгісі.\n\n(6) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — сыртқы тартымдылық, харизма, сүйкімділік, қонақжайлылық, басқа адамдардың қажеттіліктерін біледі, стиль сезімі бар (жақсы модельер бола алады), қолөнерге талантты, жақындарын алыстан сезеді.\nОл үшін міндетті орындауыңыз керек — ресми некеде болып, отбасы мүшелеріне, ата-анаға және барлық ұрпаққа қамқорлық жасау керек. Отбасылық қарым-қатынаста үлгі, эталон болу, ажырасуға және опасыздық жасауға, тіпті ойша да болмайды.\n«Алтының» теріс көрінісі де бар — қыңырлық (өте қыңыр).\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: мүлікті бөлісумен ажырасу, кармалық қарым-қатынас, серіктестердің, соның ішінде іскерлік серіктестердің опасыздығы мен сатқындығы, мәмілелер мен келісімшарттардың бұзылуы, жүрек-қантамыр жүйесінде мәселелер.\nНумерологияда 6 — отбасы, үйдегі қолөнер мен үйдегі шығармашылық, сондай-ақ серіктестік белгісі.\nЕгер сіз опасыздық жасаған адам сізді шын жүректен кешірсе, белгінің теріс көріністері жұмсарады.",
  "25": "25 санында Кету (7) және Юпитер (3) бойынша екі бағдарлама бар. Олар адамның мінезінде әртүрлі дәрежеде көрінуі мүмкін.\n(3) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — жақсы есте сақтау қабілеті, Жердің ментальді өрісінен ақпаратты оқи білу, жақсы оқу қабілеті, кез келген нәрсені үйрене алу, шашыраңқы ақпаратты біріктіру қабілеті, ойды материалдандыру дарыны («Құпия» (Секрет) фильмі).\nОл үшін міндетті орындауыңыз керек — ең болмаса бір баланы (асырап алған болса да) тәрбиелеп, оқытып, оған мансап құруға немесе бизнесті өз перзентіндей өсіруге көмектесу. «Үштер» өздері қаламаса, олардың балалары болмайды.\n«Үштің» теріс көрінісі де бар — дербес болмау, шабыт керек — «сиқырлы түрткі».\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: бала тууға бөгет, жүкті болу мәселелері, ене мен қайын енемен жанжал, балалар тарапынан сатқындық, балалардың ауруы, сәттілік жоқ, нақты құрылған жоспарлар орындалмайды.\n«Үштерді» көбіне аналары тәрбиелеуі керек. Олар үшін әйел — бедел. Олардың аналарымен жиі күрделі қарым-қатынасы болады. Ер адамдар «әйелінің уысындағы» және «анасының еркесі» болып өсуі мүмкін.\nНумерологияда 3 — әкелік пен аналық белгісі.\n\n(7) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — жылдам ойлау, бәрін терең тану, киелі нәрсені зерттеуді жақсы көреді, карма заңдарын сезеді, себеп-салдарлық байланыстарды (неге солай болатынын) көреді, жағдайды алдын ала болжай алады, бірақ оны өзгерте алмайды, сондықтан өз дарынын жиі қарғыс ретінде қабылдайды. «Жетілер» өте тапқыр.\nОл үшін міндетті орындауыңыз керек — ең болмаса ел ішінде саяхаттап, басқа халықтардың мәдениетін зерттеп, олардың технологияларын өз өміріңізде қолдану керек. Өмірге кішкентай пайдалы нәрселер ойлап табу (ең болмаса пакеттерге арналған пакет). Көлік, велосипед, самокат жүргізгені жақсы, жұмысты жол жүрумен, іссапарлармен байланыстысын таңдаған дұрыс, семинар өткізсеңіз, вебинар емес, көшпелі семинар өткізіңіз.\n«Жетінің» теріс көрінісі де бар — айлакерлік, арандатуға бейімділік, біліммен бөліскісі келмеу.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: көлікпен мәселелер (жиі бұзылу), автонесиелермен мәселелер (не бермейді, не төлемдерде қиындық), ұсақ жол-көлік оқиғалары (жеңіл), аяқпен мәселелер, тіпті сал болуға дейін, мансап пен бизнестегі кедергілер.\nНумерологияда 7 — арба (колесница), қозғалыс белгісі. «Жетілер» барлық жасырын, киелі нәрсені жақсы көреді және зияткерлік дамуға ұмтылады.",
  "26": "26 санында Сатурн (8) және Уран (4) бойынша екі бағдарлама бар. Олар адамның мінезінде әртүрлі дәрежеде көрінуі мүмкін.\n(4) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — жоғары кәсібилік, болжамдылық, тұрақтылық, сенімділік, еңбекқорлық, консерватизм.\nОл үшін міндетті орындауыңыз керек — таңдаған салада кәсіпқой болу. Шала жұмысқа жол берілмейді. Бала кезде сіздің жұмысыңыз — мектептегі оқу, жақсы оқу маңызды.\n«Төрттің» теріс көрінісі де бар — жалқаулық.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: әріптестердің сатқындығы, мансаптың күйреуі, басшылықпен мәселелер, мансап сатысымен жоғарылаудағы қиындықтар, астыртын ойындар, тірек-қимыл аппаратымен мәселелер.\nНумерологияда 4 — император, мансап және бизнес белгісі. «Төрттерді» бір нәрсені тез үйрене алуы үшін абсолютті қатаңдықта тәрбиелеу керек. Оларға өте талапшыл болу керек. Тәрбиесі неғұрлым жұмсақ болса, тағдыры соғұрлым күрделі.\n\n(8) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — ғалам заңдарына, тепе-теңдікке, әділдікке жауап беру, соттау құқығына ие болу.\nОл үшін міндетті орындауыңыз керек — тараптарды татуластыруыңыз керек, құқықты зерттеп, дұрыс шешім қабылдауды үйрену, сөзде тұру керек, заң бұзуға болмайды, жанжалдасуға болмайды.\n«Сегіздің» теріс көрінісі де бар — жанжалшылдық (адамдарға бұлай істеуге болмайтынын түсіндіруден шаршағандықтан).\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: бизнестегі мәселелер, әріптестер тарапынан арандату мен сатқындық, мұндай қызметкердің еңбегін байқамайды, омыртқамен мәселелер, көбіне бел бөлімі, жарықтар (грыжи), омыртқаның сыну қаупі.\nНумерологияда 8 — әділдік, сот төрелігі белгісі. Олардан тамаша заңгерлер шығады, өйткені олар заңдарды санаасты (подсознание) деңгейде біледі. Олар әрқашан жанжалды ортада өмір сүреді, құжаттарды тамаша қолдан жасайды, жиі қос өмір сүреді.",
  "27": "27 санында Марс (9) және Меркурий (5) бойынша екі бағдарлама бар. Олар адамның мінезінде әртүрлі дәрежеде көрінуі мүмкін.\n(5) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — кез келген нәрсені кез келген адамға сата білу қабілеті; ғылымдарды зерттеу қабілеті, жылдам ойлау, жеңіл жүкпен саяхаттауды жақсы көру, кез келген адаммен тіл табыса білу.\nОл үшін міндетті орындауыңыз керек — ер адамдарға құрметпен қарау, жақын ортадағы ер адамдарға көмектесу, дұрыс әрі салауатты өмір салтын ұстану (СӨС пен дұрыс тамақтану, спорт), рухани даму, үлгі тұтарлық болу. Жұмыста ер адамдарға жеңілдіктер мен акциялар жасау қолайлы.\n«Бестің» теріс көрінісі де бар — асығыстық, сырттай байыпсыздық, маскүнемдікке бейімділік.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: әкемен жанжал, әкенің денсаулығына алаңдау, басшылармен мәселелер, анестезияға, аллергияға және тыныс алуға қатысты сақ болу керек.\nНумерологияда 5 — Ұлы Абыз (Верховный Жрец) белгісі. Бұл — барлық сұрақтың жауабын білетін адам. Ол дұрыс тамақтануды ұстанады, өйткені ағзасы улануға бейім. «Бестер» кез келген табиғи емес материалдар мен өнімдерге өте сезімтал. Жиі алкогольге тәуелді болады немесе аз мөлшердегі алкогольден уланып қалуы мүмкін. «Бестерді» әкелері немесе ер адам тәрбиелеуі керек. Тек ер адам ғана олар үшін бедел бола алады. Олар тағдырымен әкесіне байланған. «Бес» әйелдерге онша белсенді емес ер адамдар беріледі.\n\n(9) Сіз бойыңыздан осы туған күн санына тән жарқын жағымды қасиеттерді ашқыңыз келді — «айқын» деген сөзбен басталатынның бәрі (айқын көру, айқын білу, айқын есту...); астралды қауыммен байланыс (періштелер, архангелдер, жоғары періштелер, қамқоршылар); бақсылық (шаманство), регрессия, экстрасенсорика; дербестік, өзін-өзі жеткілікті сезіну.\nОл үшін міндетті орындауыңыз керек — экстрасенсорлық қабілеттерді дамыту, ешкімге сүйенбей, өзін-өзі жеткілікті, дербес тұлға болу. Аға буынға көмек көрсету керек. Аға буын адамдарына жеңілдіктер немесе акциялар жасау қолайлы. Егер «тоғыз» әлеуметтік игіліктерден өз еркімен бас тартпаса, оны жоғалтулар арқылы кесіп тастайды.\n«Тоғыздың» теріс көрінісі де бар — жалғыздықтан қорқу, өзімшілдік.\nМіндет орындалмаса, жағымсыз оқиғалар болуы мүмкін: оқшаулану, қоғамнан алшақтау, денсаулыққа жиі көңіл бөлуге тура келеді.\nНумерологияда 9 — экстрасенсорика, дербестік, аға буын, қызмет ету белгісі.\n«Тоғыздың» санаастында (подсознание) жалғыздықтан қорқу бар. Олар жалғыз қалудан қорыққандықтан серіктесіне сұмдық нәрселерді кешіре алады, бірақ олар дәл жалғыздықта ашылады.\n«Тоғыздар» шын жүректен сүйе алмайды, олар өзін сол немесе басқа жағдайда сүйеді.",
