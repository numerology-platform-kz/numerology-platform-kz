      .ms-table td { background: #fff !important; }
      .diagram-wrap .ms-table td { color: #2b2238 !important; }
      .ms-table td span[style*="border-radius:14px"] { padding: 4px 6px !important; min-width: 0 !important; font-size: 11px !important; }
      .diagram-wrap .ms-table td span[style*="border-radius:14px"] { color: #1d1433 !important; }
      body, body * { font-variant-numeric: lining-nums; }`;

  const fullHtml = `<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<title>${title.replace(/[<>]/g, "")}</title>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap&subset=cyrillic" rel="stylesheet"><style>${printCss}</style>
</head><body><div class="doc-wrap">${htmlBody}</div>
</body></html>`;

  // Печать через скрытый iframe — родной движок печати браузера. Это ЕДИНСТВЕННЫЙ
  // вариант из всех опробованных, который стабильно давал корректный, читаемый
  // результат без разрывов, дублей и пустых страниц. На html2pdf.js больше не
  // переключаемся — три разных попытки дали три разных вида поломки без возможности
  // протестировать библиотеку вживую и понять точную причину.
  const iframe = document.createElement("iframe");
  iframe.style.cssText = "position:absolute;left:-10000px;top:0;width:800px;height:1200px;border:0;";
  document.body.appendChild(iframe);

  const originalTitle = document.title;
  let cleaned = false;
  function cleanup() {
    if (cleaned) return;
    cleaned = true;
    document.title = originalTitle;
    if (iframe.parentNode) document.body.removeChild(iframe);
  }
  // Убираем окно печати только когда человек реально закрыл диалог печати
  // (событие afterprint), а не по таймеру — на больших расчётах старый таймер
  // срабатывал раньше, чем браузер успевал всё подготовить, и файл получался пустым.
  // На всякий случай оставляем и запасной таймер, вдруг событие не сработает.
  setTimeout(cleanup, 60000);

  iframe.onload = function () {
    try {
      iframe.contentDocument.title = title;
    } catch (e) { /* игнорируем — не критично */ }
    // Аты файла в диалоге печати браузер берёт с заголовка ОСНОВНОЙ вкладки,
    // а не со скрытого окошка — поэтому временно переименовываем и её тоже.
    document.title = title;
    try {
      iframe.contentWindow.onafterprint = cleanup;
    } catch (e) { /* игнорируем */ }
    setTimeout(function () {
      try {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      } catch (error) {
        console.error("Басып шығару қатесі:", error);
        downloadHtmlFallback(filename, htmlBody);
      }
    }, 700);
  };

  const idoc = iframe.contentWindow.document;
  idoc.open();
  idoc.write(fullHtml);
  idoc.close();
}

function downloadHtmlFallback(filename, htmlBody) {
  const fullHtml = `<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<title>${filename.replace(/\.html$/i, "")}</title>
<style>
  body { background:#fff; color:#1c332f; font-family:Arial,sans-serif; padding:20px; max-width:720px; margin:0 auto; }
  h1 { color:#2f6d6a; font-family:PT Serif,Georgia,serif; font-weight:600; font-size:20px; margin:0 0 16px; }
  h2 { color:#2f6d6a; font-family:PT Serif,Georgia,serif; font-weight:600; font-size:17px; margin-top:22px; border-bottom:1px solid #d7aa31; padding-bottom:5px; }
  .num { color:#4c9d98; font-family:PT Serif,Georgia,serif; font-size:18px; margin:12px 0 4px; font-weight:700; }
  p { margin:0 0 12px; line-height:1.5; font-size:14px; }
  table { border-collapse:collapse; width:100%; margin:8px 0; }
  td { padding:5px 4px; font-size:13px; }
  .diagram-wrap { text-align:center; margin-bottom:16px; }
</style></head><body>${htmlBody}</body></html>`;

  const blob = new Blob([fullHtml], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function downloadAdultMatrixAuto(name, birthDate) {
  // Временно вернули печать браузера и на телефоне тоже — серверный вариант
  // пока даёт кривую таблицу и лишние пустые страницы. Сама функция
  // downloadAdultMatrixMobile ниже осталась нетронутой — если решите
  // вернуться к ней после доработки, достаточно поменять эту строку обратно.
  downloadAdultMatrixText(name, birthDate);
}

async function downloadAdultMatrixMobile(name, birthDate) {
  const res = window._lastAdultMatrixResult;
  const v = window._lastDiagramValues;
  if (!res || !v) { downloadAdultMatrixText(name, birthDate); return; }

  const statusEl = document.getElementById("editToggleBtn");
  const btn = event && event.target;
  const oldLabel = btn ? btn.textContent : null;
  if (btn) { btn.textContent = "Файл дайындап жатырмын..."; btn.disabled = true; }

  try {
    // Подтягиваем возможные правки текста прямо со страницы, как и в обычном скачивании.
    const editedTexts = [];
    document.querySelectorAll(".editable-text").forEach(function (el) { editedTexts.push(el.innerText); });
    let cursor = 0;

    function reduceTo22(n) {
      while (n > 22) { n = String(n).split("").reduce((s, d) => s + Number(d), 0); }
      return n;
    }

    const CHAKRA_NAMES = ["Сахасрара", "Аджна", "Вишудха", "Анахата", "Манипура", "Свадхистана", "Муладхара"];
    const l = reduceTo22(v.a + v.b), l1 = reduceTo22(v.a2 + v.b2), l2 = reduceTo22(v.a1 + v.b1),
      l3 = reduceTo22(v.a3 + v.b3), l4 = reduceTo22(v.e + v.e), l5 = reduceTo22(v.d1 + v.c1), l6 = reduceTo22(v.d + v.c);
    const chakras = [
      { phys: v.a, energy: v.b, emo: l }, { phys: v.a2, energy: v.b2, emo: l1 },
      { phys: v.a1, energy: v.b1, emo: l2 }, { phys: v.a3, energy: v.b3, emo: l3 },
      { phys: v.e, energy: v.e, emo: l4 }, { phys: v.c1, energy: v.d1, emo: l5 }, { phys: v.c, energy: v.d, emo: l6 },
    ];
    const CHAKRA_HEX = ["#9b6bd6", "#5b8ef2", "#4fc3c0", "#6fbf5e", "#e0c23e", "#e0913e", "#d1483e"];
    const healthRows = chakras.map((ch, i) => ({ title: CHAKRA_NAMES[i], physics: ch.phys, energy: ch.energy, emotion: ch.emo, color: CHAKRA_HEX[i] }));
    healthRows.push({
      title: "Қорытынды",
      physics: reduceTo22(chakras.reduce((s, c) => s + c.phys, 0)),
      energy: reduceTo22(chakras.reduce((s, c) => s + c.energy, 0)),
      emotion: reduceTo22(chakras.reduce((s, c) => s + c.emo, 0)),
    });

    const nebo = reduceTo22(v.b + v.d), zemlya = reduceTo22(v.a + v.c), pred1 = reduceTo22(nebo + zemlya);
    const muzh = v.f != null ? reduceTo22(v.f + v.y) : null;
    const zhen = v.g != null ? reduceTo22(v.g + v.k) : null;
    const pred2 = (muzh != null && zhen != null) ? reduceTo22(muzh + zhen) : null;
    const pred3 = pred2 != null ? reduceTo22(pred1 + pred2) : null;
    const pred4 = pred3 != null ? reduceTo22(pred2 + pred3) : null;
    const purposeItems = [{ title: "Жеке миссия", formula: `Аспан ${nebo} + Жер ${zemlya}`, result: pred1 }];
    if (pred2 != null) purposeItems.push({ title: "Әлеуметтік миссия", formula: `Ер желісі ${muzh} + Әйел желісі ${zhen}`, result: pred2 });
    if (pred3 != null) purposeItems.push({ title: "Рухани миссия", formula: `Жеке ${pred1} + Әлеуметтік ${pred2}`, result: pred3 });
    if (pred4 != null) purposeItems.push({ title: "Планетарлық миссия", formula: `Әлеуметтік ${pred2} + Рухани ${pred3}`, result: pred4 });

    const svgEl = document.querySelector("#result svg");
    const diagramPng = svgEl ? await svgElementToPngDataUrl(svgEl) : null;

    function blocksToPayload(blocks) {
      return (blocks || []).map(function (block) {
        return {
          title: block.title,
          entries: (block.entries || []).map(function (e) {
            return { number: e.number ?? e.axis, text: editedTexts[cursor++] ?? e.text };
          }),
        };
      });
    }

    const programs = (res.programs || []).map(function (p) {
      return { title: p.title, text: stripDuplicateTitle(editedTexts[cursor++] ?? p.fullText, p.title) };
    });

    const forecastTable = window._forecastTable;
    let forecast = [];
    if (forecastTable && forecastTable.length) {
      const centerIdx = window._forecastCurrentIdx || 0;
      const idxs = [-2, -1, 0, 1, 2].map(o => Math.min(Math.max(centerIdx + o, 0), forecastTable.length - 1));
      idxs.forEach(function (i) {
        const row = forecastTable[i];
        [row.energy1, row.energy2, row.energy3].forEach(function (num) {
          const data = (window.ForecastData && window.ForecastData[String(num)]) || null;
          if (!data) return;
          forecast.push({ label: row.label + " — Энергия " + num, text: data.main });
        });
      });
    }

    const filename = "Ересек матрицасы - " + name + " - " + birthDate + ".pdf";
    const title = "Ересек матрицасы — " + name + " (" + birthDate + ")";
    const fullRasshifrovka = blocksToPayload(res.rasshifrovka);
    const fullHealth = blocksToPayload(res.health);

    // Делим все записи на порции — так каждый запрос к серверу остаётся
    // лёгким и укладывается в его лимиты, даже если весь расчёт очень длинный.
    const CHUNK_SIZE = 8;
    function chunkBlocks(blocks) {
      const chunks = [];
      let current = [];
      let count = 0;
      blocks.forEach(function (block) {
        let entriesLeft = block.entries;
        while (entriesLeft.length) {
          const room = CHUNK_SIZE - count;
          const take = entriesLeft.slice(0, room);
          entriesLeft = entriesLeft.slice(room);
          current.push({ title: block.title, entries: take });
          count += take.length;
          if (count >= CHUNK_SIZE) { chunks.push(current); current = []; count = 0; }
        }
      });
      if (current.length) chunks.push(current);
      return chunks;
    }

    const rasshChunks = chunkBlocks(fullRasshifrovka);
    const healthChunks = chunkBlocks(fullHealth);

    const requests = [];
    // Первый запрос — титул, диаграмма, карта здоровья (таблица), числа предназначения + первая порция текста.
    requests.push({
      title, diagramPng, healthRows, purposeItems,
      rasshifrovka: rasshChunks[0] || [],
    });
    for (let i = 1; i < rasshChunks.length; i++) {
      requests.push({ rasshifrovka: rasshChunks[i] });
    }
    healthChunks.forEach(function (chunk) { requests.push({ health: chunk }); });
    if (programs.length || forecast.length) {
      requests.push({ programs, forecast });
    }

    const { data: { session } } = await supabaseClient.auth.getSession();
    const authToken = session ? session.access_token : SUPABASE_KEY;

    const pdfBlobs = [];
    for (let i = 0; i < requests.length; i++) {
      if (btn) btn.textContent = "Файл дайындап жатырмын... (" + (i + 1) + "/" + requests.length + ")";
      const resp = await fetch(SUPABASE_URL + "/functions/v1/generate-pdf", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
        body: JSON.stringify(requests[i]),
      });
      if (!resp.ok) throw new Error("Сервер бөлікте қате қайтарды " + (i + 1) + ": " + resp.status);
      pdfBlobs.push(await resp.arrayBuffer());
    }

    if (btn) btn.textContent = "Файлды біріктіріп жатырмын...";
    const merged = await PDFLib.PDFDocument.create();
    for (const bytes of pdfBlobs) {
      const src = await PDFLib.PDFDocument.load(bytes);
      const copiedPages = await merged.copyPages(src, src.getPageIndices());
      copiedPages.forEach(function (p) { merged.addPage(p); });
    }
    const mergedBytes = await merged.save();
    const blob = new Blob([mergedBytes], { type: "application/pdf" });
    const file = new File([blob], filename, { type: "application/pdf" });

    let shared = false;
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file] });
        shared = true;
      } catch (e) {
        if (e && e.name === "AbortError") shared = true; // сам закрыл окно — это не ошибка
        // В остальных случаях (например, слишком много времени прошло с момента нажатия
        // кнопки) — просто скачиваем файл обычным способом ниже, а не считаем это сбоем.
      }
    }
    if (!shared) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
  } catch (error) {
    console.error("Мобильді жүктеп алу қатесі:", error);
    customAlert("Серверде файл жасау мүмкін болмады (" + (error.message || error) + "). Әдеттегі тәсілмен көріп жатырмын.");
    downloadAdultMatrixText(name, birthDate);
  } finally {
    if (btn) { btn.textContent = oldLabel; btn.disabled = false; }
  }
}

function downloadAdultMatrixText(name, birthDate) {
  const res = window._lastAdultMatrixResult;
  if (!res) return;

  // Подтягиваем возможные правки из полей на странице по порядку их появления.
  const editedTexts = [];
  document.querySelectorAll(".editable-text").forEach(function (el) { editedTexts.push(el.innerText); });
  let cursor = 0;

  // Диаграмма + карта здоровья + предназначение — берём уже отрисованные SVG/таблицы прямо со страницы.
  // Диаграмма + карта здоровья + предназначение — берём уже отрисованные блоки прямо со страницы
  // (это все прямые дочерние div контейнера результата, кроме основного текстового блока).
  const extraBlocksHtml = Array.from(document.querySelectorAll("#result > div"))
    .filter(function (div) { return div.style.maxWidth !== "760px"; })
    .map(function (div) { return div.outerHTML; })
    .join("");

  let bodyHtml = `<div class="diagram-wrap">${extraBlocksHtml}</div>`;
  bodyHtml += `<h1>Ересек матрицасы — ${escapeHtml(name)} (${escapeHtml(birthDate)})</h1>`;

  function textToHtml(text) {
    // Переносы строк внутри текста превращаем в настоящие абзацы, а не склеиваем всё подряд.
    return text.split(/\n+/).map(function (line) {
      return line.trim() ? `<p>${escapeHtml(line)}</p>` : "";
    }).join("");
  }

  function forecastBlockHtml() {
    const table = window._forecastTable;
    if (!table || !table.length) return "";
    const centerIdx = window._forecastCurrentIdx || 0;
    const idxs = [-2, -1, 0, 1, 2].map(o => Math.min(Math.max(centerIdx + o, 0), table.length - 1));
    let html = `<h2>Болжам</h2>`;
    idxs.forEach(function (i) {
      const row = table[i];
      html += `<div class="num" style="font-size:15px;">${escapeHtml(row.label)}${i === centerIdx ? " (ағымдағы кезең)" : ""}</div>`;
      [row.energy1, row.energy2, row.energy3].forEach(function (num) {
        const data = (window.ForecastData && window.ForecastData[String(num)]) || null;
        if (!data) return;
        html += `<div class="entry-block"><div class="num" style="font-size:15px;">Энергия ${escapeHtml(String(num))}</div>`;
        data.main.split(/\n+/).forEach(function (t) { if (t.trim()) html += `<p>${escapeHtml(t.trim())}</p>`; });
        if (data.positive) html += `<p><strong>Оң:</strong> ${escapeHtml(data.positive)}</p>`;
        if (data.negative) html += `<p><strong>Теріс:</strong> ${escapeHtml(data.negative)}</p>`;
        html += `</div>`;
      });
    });
    return html;
  }

  function programsBlockHtml() {
    if (!res.programs.length) return "";
    let html = `<h2>Бағдарламалар</h2>`;
    res.programs.forEach(function (p) {
      const text = stripDuplicateTitle(editedTexts[cursor++] ?? p.fullText, p.title);
      html += `<div class="entry-block"><div class="num" style="font-size:15px;">${escapeHtml(p.title)}</div>${textToHtml(text)}</div>`;
    });
    return html;
  }

  // Точно тот же порядок, что и на странице: программы и прогноз вставляются сразу после
  // блока «Материальная карма с прошлой жизни», а не в конце.
  res.rasshifrovka.forEach(function (block) {
    bodyHtml += `<h2>${escapeHtml(block.title)}</h2>`;
    block.entries.forEach(function (e) {
      bodyHtml += `<div class="entry-block"><div class="num">${escapeHtml(String(e.number))}</div>${textToHtml(editedTexts[cursor++] ?? e.text)}</div>`;
    });
    if (block.title.toLowerCase().includes("қарыз")) {
      bodyHtml += programsBlockHtml();
      bodyHtml += forecastBlockHtml();
    }
  });

/* ============================================================

   ============================================================ */
function trendArrow(curr, prev) {
  if (prev === null || prev === undefined) return "";
  if (curr > prev) return "↗ ";
  if (curr < prev) return "↘ ";
  return "→ ";
}

function moonSunResultColor(v, values) {
  const mix = (c1, c2, t) => c1.map((x, i) => Math.round(x + (c2[i] - x) * t));
  const red = [248, 105, 107], yellow = [255, 235, 132], green = [99, 190, 123];
  const s = values.slice().sort((x, y) => x - y);
  const min = s[0], max = s[s.length - 1];
  const mid = s.length % 2 ? s[(s.length - 1) / 2] : (s[s.length / 2 - 1] + s[s.length / 2]) / 2;
  let c = yellow;
  if (v < mid && mid > min) c = mix(yellow, red, (mid - v) / (mid - min));
  else if (v > mid && max > mid) c = mix(yellow, green, (v - mid) / (max - mid));
  return "rgb(" + c.join(",") + ")";
}

const BIO_COLORS = { phys: "#ff7a7a", emo: "#6fa8ff", intel: "#7ddc8f" };
const BIO_WEEKDAYS = ["жс", "дс", "сс", "ср", "бс", "жм", "сб"];

function bioDateLabel(date) {
  return String(date.getUTCDate()).padStart(2, "0") + "." + String(date.getUTCMonth() + 1).padStart(2, "0") + "." + date.getUTCFullYear();
}

function buildBiorhythmChartSvg(rows, cycles) {
  const w = 720, h = 300, padL = 44, padR = 12, padT = 16, padB = 40;
  const n = rows.length, stepX = (w - padL - padR) / (n - 1);
  const x = (i) => padL + i * stepX;
  const y = (v) => padT + (1 - v) / 2 * (h - padT - padB);
  let svg = "";
  [1, 0.5, 0, -0.5, -1].forEach(function (v) {
    svg += `<line x1="${padL}" x2="${w - padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="rgba(225,180,52,${v === 0 ? ".6" : ".2"})" stroke-width="1" ${v === 0 ? "" : 'stroke-dasharray="3 4"'}/>`;
    svg += `<text x="${padL - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#c9bfa8">${Math.round(v * 100)}%</text>`;
  });
  rows.forEach(function (r, i) {
    const wd = r.date.getUTCDay();
    const weekend = wd === 0 || wd === 6;
    svg += `<text x="${x(i).toFixed(1)}" y="${h - padB + 15}" text-anchor="middle" font-size="10" fill="${weekend ? "#f6d66c" : "#c9bfa8"}">${r.date.getUTCDate()}</text>`;
    if (i === 0 || r.date.getUTCDate() === 1) {
      svg += `<text x="${x(i).toFixed(1)}" y="${h - padB + 30}" text-anchor="${i === 0 ? "start" : "middle"}" font-size="10" fill="#c9bfa8">${String(r.date.getUTCMonth() + 1).padStart(2, "0")}.${r.date.getUTCFullYear()}</text>`;
    }
  });
  const base = rows[0].daysLived;
  cycles.forEach(function (c) {
    let d = "";
    for (let t = 0; t <= (n - 1) * 6; t++) {
      const day = t / 6;
      const v = Math.sin(2 * Math.PI * (base + day) / c.period);
      d += (t ? "L" : "M") + (padL + day * stepX).toFixed(1) + "," + y(v).toFixed(1);
    }
    svg += `<path d="${d}" fill="none" stroke="${BIO_COLORS[c.key]}" stroke-width="2.4" stroke-linejoin="round"/>`;
    rows.forEach(function (r, i) {
      if (r[c.key].phase === "X") {
        svg += `<circle cx="${x(i).toFixed(1)}" cy="${y(r[c.key].value).toFixed(1)}" r="4.5" fill="#f0a33c" stroke="${BIO_COLORS[c.key]}" stroke-width="2"/>`;
      }
    });
  });
  const legend = cycles.map(c => `<span style="white-space:nowrap;"><span style="display:inline-block;width:16px;height:3px;background:${BIO_COLORS[c.key]};vertical-align:middle;margin-right:5px;"></span>${c.name} (${c.period} күн)</span>`).join(" &nbsp; ")
    + ` &nbsp; <span style="white-space:nowrap;"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#f0a33c;vertical-align:middle;margin-right:5px;"></span>қауіпті күн (критический день)</span>`;
  return `
    <div style="max-width:720px;margin:10px auto 22px;text-align:center;">
      <div style="color:#f6d66c;font-family:PT Serif,Georgia,serif;font-size:16px;margin-bottom:6px;">Биоырғақтар: ${bioDateLabel(rows[0].date)} — ${bioDateLabel(rows[rows.length - 1].date)}</div>
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:720px;background:rgba(0,0,0,.15);border:1px solid rgba(215,170,49,.3);border-radius:10px;">${svg}</svg>
      <div style="color:#c9bfa8;font-size:12px;margin-top:6px;line-height:1.7;">${legend}</div>
      <div style="color:#a9bdb8;font-size:12px;margin-top:4px;">Нөлден жоғары — оң фаза, нөлден төмен — теріс фаза. Демалыс күндері сары түспен белгіленген.</div>
    </div>`;
}

function renderBiorhythmResult(name, birthDate, startDate, container) {
  const [bd, bm, by] = birthDate.split(".").map(Number);
  const [sd, sm, sy] = startDate.split(".").map(Number);
  const E = window.BiorhythmEngine;
  let rows;
  try {
    rows = E.calcBiorhythms({ y: by, m: bm, d: bd }, { y: sy, m: sm, d: sd }, 31);
  } catch (error) {
    console.error("Биоырғақтарды есептеу қатесі:", error);
    container.innerHTML = `<div style="color:#ff9d9d;padding:16px;">Есептеу орындалмады: ${escapeHtml(error.message || String(error))}</div>`;
    return false;
  }

  const first = rows[0];
  const blocks = [];
  blocks.push({
    title: bioDateLabel(first.date) + " күнгі жағдай — күн коды " + first.code,
    entries: E.BIO_CYCLES.map(function (c) {
      const st = first[c.key];
      return {
        number: c.name + ": " + (st.percent > 0 ? "+" : "") + st.percent + "%, " + c.period + " күннің " + st.dayOfCycle + "-күні, " + E.BIO_PHASE_NAMES[st.phase],
        text: E.BIO_PHASE_TEXTS[c.key][st.phase]
      };
    }).concat([{ number: "Күн коды " + first.code, text: E.BIO_DAY_TEXTS[first.code] }])
  });
  blocks.push({
    title: "Күндер бойынша талдау",
    entries: rows.map(function (r) {
      const marks = r.criticalCount === 3 ? " — үштік қауіпті күн" : r.criticalCount === 2 ? " — қос қауіпті күн" : r.criticalCount === 1 ? " — қауіпті күн" : "";
      const detail = E.BIO_CYCLES.map(function (c) { return c.name[0] + ": " + r[c.key].dayOfCycle + "-күн, " + (r[c.key].percent > 0 ? "+" : "") + r[c.key].percent + "%"; }).join("; ");
      return { number: bioDateLabel(r.date) + " (" + BIO_WEEKDAYS[r.date.getUTCDay()] + "), код " + r.code + marks, text: detail + "\n\n" + E.BIO_DAY_TEXTS[r.code] };
    })
  });
  blocks.push({
    title: "Күн кодын қалай оқу керек",
    entries: [{ number: "", text: "Кодтың үш әрпі ретімен: физикалық, эмоционалдық, интеллектуалдық цикл.\nH — оң фаза, L — теріс фаза, X — қауіпті күн (критический день — фазаның ауысуы).\nҚауіпті күндер: физикалық цикл — 1 және 12-күн, эмоционалдық — 1 және 15-күн, интеллектуалдық — 1 және 17-күн.\nБиоырғақтар оқиғаларды алдын ала белгілемейді, тек ықтимал көңіл-күйді көрсетеді." }]
  });

  renderEditableResult(blocks, container, "Биоырғақтар - " + name, birthDate + ", " + startDate + " бастап", "biorhythms");
  container.insertAdjacentHTML("afterbegin", buildBiorhythmChartSvg(rows, E.BIO_CYCLES));
  const firstBody = container.querySelector(".accordion-body");
  if (firstBody) firstBody.classList.remove("hidden");
  return true;
}

async function downloadTextFile(filename, text) {
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });

  // На iPhone/iPad обычный <a download> часто просто открывает файл вместо скачивания.
  // Пытаемся сначала через нативное меню «Поделиться» — там есть «Сақтау в Файлы».
  if (navigator.canShare && navigator.share) {
    try {
      const file = new File([blob], filename, { type: "text/plain" });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    } catch (err) {
      // Пайдаланушы мог отменить — тогда просто пробуем обычный способ ниже.
      if (err && err.name === "AbortError") return;
    }
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function downloadEditableResult(personLabel, dateLabel) {
  const blocks = window._lastEditableBlocks;
  if (!blocks) return;

  // Подтягиваем возможные правки прямо из отредактированных полей на странице.
  document.querySelectorAll(".editable-text").forEach(function (el) {
    const b = Number(el.dataset.block), e = Number(el.dataset.entry);
    if (blocks[b] && blocks[b].entries[e]) {
      blocks[b].entries[e].text = el.innerText;
    }
  });

  // Если на странице уже отрисована диаграмма/карта здоровья/предназначение — берём её тоже.
  const extraBlocksHtml = Array.from(document.querySelectorAll("#result > div"))
    .filter(function (div) { return div.style.maxWidth !== "760px"; })
    .map(function (div) { return div.outerHTML; })
    .join("");

  let bodyHtml = extraBlocksHtml ? `<div class="diagram-wrap">${extraBlocksHtml}</div>` : "";
  bodyHtml += `<h1>${escapeHtml(personLabel)}${dateLabel ? " (" + escapeHtml(dateLabel) + ")" : ""}</h1>`;
  blocks.forEach(function (block) {
    bodyHtml += `<h2>${escapeHtml(block.title)}</h2>`;
    block.entries.forEach(function (e) {
      const numLabelPdf = typeof e.number === "number" ? String(e.number) : (typeof e.number === "string" ? e.number.trim() : "");
      bodyHtml += (numLabelPdf ? `<div class="num">${escapeHtml(numLabelPdf)}</div>` : "") + `<p>${escapeHtml(e.text).replace(/\n/g, "<br>")}</p>`;
    });
  });

  downloadHtmlFile(personLabel + (dateLabel ? " - " + dateLabel : "") + ".html", bodyHtml);
}

function calculateCompatibility() {
  const birthDate1 = document.getElementById("birthDate1")?.value.trim();
  const birthDate2 = document.getElementById("birthDate2")?.value.trim();
  const dateError = document.getElementById("dateError");
  const result = document.getElementById("result");
  if (dateError) dateError.textContent = "";
  if (result) result.innerHTML = "";

  if (!isValidBirthDate(birthDate1) || !isValidBirthDate(birthDate2)) {
    if (dateError) dateError.textContent = "Екі туған күнді де КК.АА.ЖЖЖЖ форматында енгізіңіз.";
    return;
  }
  if (!result || !window.CompatibilityEngine) return;

  const [d1, m1, y1] = birthDate1.split(".").map(Number);
  const [d2, m2, y2] = birthDate2.split(".").map(Number);

  let res;
  try {
    res = window.CompatibilityEngine.getFullResult(d1, m1, y1, d2, m2, y2);
  } catch (error) {
    console.error("Ошибка расчёта совместимости:", error);
    result.innerHTML = `<div style="color:#ff9d9d;padding:16px;">Есептеу орындалмады: ${escapeHtml(error.message || String(error))}</div>`;
    return;
  }

  renderEditableResult(res.blocks, result, "Үйлесімділік - " + birthDate1 + " және " + birthDate2, "", "compatibility");
  renderCompatibilityDiagrams(d1, m1, y1, d2, m2, y2, result);
  saveCalculationHistory({
    direction: "compatibility",
    title: "Үйлесімділік - " + birthDate1 + " және " + birthDate2,
    birthDate: birthDate1, birthDate2,
  });
}

function computeDiamondPoints(day, month, year) {
  const A = reduceTo22(day);
  const B = month;
  const C = reduceTo22(String(year).split("").reduce((sum, d) => sum + Number(d), 0));
  const D = reduceTo22(A + B + C);
  return { A, B, C, D };
}

function renderCompatibilityDiagrams(d1, m1, y1, d2, m2, y2, container) {
  const engine = window.CompatibilityEngine;
  engine.calculate(d1, m1, y1, d2, m2, y2, "", "");

  const p1 = buildDiagramSvgMarkup(engine, "Үйлесімділік диаграммасы", 0, "small", false, true);
  const p2 = buildDiagramSvgMarkup(engine, "Үйлесімділік диаграммасы", 88, "small", false, true);
  // Полная диаграмма пары — с углами f/g/k/y и линией благополучия, но БЕЗ подточек s1/s2/p1-p4/e1/e2
  // (лишние для сводной диаграммы пары) и без подписей «линия мужского/женского рода».
  // Если этих ячеек нет в листе на этом смещении строк — откатываемся к полностью упрощённой версии,
  // чтобы не сломать всю диаграмму совместимости.
  const combined = buildDiagramSvgMarkup(engine, "Үйлесімділік диаграммасы", 175, "small", "corners", true)
    || buildDiagramSvgMarkup(engine, "Үйлесімділік диаграммасы", 175, "small", true, true);
  if (!p1 || !p2 || !combined) return;

  function labeledDiagram(title, result) {
    // У маленькой диаграммы жёсткий предел max-width:250px в самой разметке — увеличиваем,
    // но не так сильно, как раньше, чтобы все три диаграммы поместились на одной странице.
    const biggerSvg = result.svg.replace("max-width:250px", "max-width:300px");
    return `<div style="width:100%;max-width:300px;margin:0 auto;text-align:center;">
      <div style="color:#c9bfa8;font-size:13px;margin-bottom:6px;">${escapeHtml(title)}</div>
      ${biggerSvg}
    </div>`;
  }

  const box = document.createElement("div");
  box.style.cssText = "max-width:660px;margin:0 auto 30px;page-break-inside:avoid;break-inside:avoid;";
  box.innerHTML = `
    <div style="color:#c9bfa8;font-size:14px;margin-bottom:14px;text-align:center;">Серіктестер мен жұп диаграммалары</div>
    <div style="display:flex;gap:16px;justify-content:center;flex-wrap:nowrap;margin-bottom:16px;">
      ${labeledDiagram("1-серіктес", p1)}
      ${labeledDiagram("2-серіктес", p2)}
    </div>
    <div style="display:flex;justify-content:center;">
      ${labeledDiagram("Жұп", combined)}
    </div>`;
  container.insertBefore(box, container.firstChild);

  renderPurposeDiagram(combined.values, container, box, 3);
}

async function startTest(direction, title) {
  testPageShell(`<p>Сұрақтар жүктелуде...</p>`);

  try {
    const { data, error } = await supabaseClient
      .from(TEST_QUESTIONS_TABLE)
      .select("id, question_order, question_text, option_a, option_b, option_c, option_d, correct_option")
      .eq("direction", direction)
      .order("question_order", { ascending: true });
    if (error) throw error;
    if (!data || !data.length) {
      testPageShell(`<div class="table-card"><div class="empty-table">Сұрақтар табылмады.</div></div>`);
      return;
    }

    testState = { direction, title, questions: data, currentIndex: 0, answers: {} };
    renderTestQuestion();
  } catch (error) {
    console.error("Тестті бастау қатесі:", error);
    testPageShell(`<div class="table-card"><div class="empty-table">Сұрақтарды жүктеу мүмкін болмады.</div></div>`);
  }
}

function renderTestQuestion() {
  if (!testState) return;
  const { questions, currentIndex, answers, title } = testState;
  const q = questions[currentIndex];
  const total = questions.length;
  const selected = answers[q.id];
  const isLast = currentIndex === total - 1;
  const answeredCount = Object.keys(answers).length;

  const options = [["a", q.option_a], ["b", q.option_b], ["c", q.option_c], ["d", q.option_d]];

  testPageShell(`
      <button onclick="confirmInterruptTest()" style="background:none;border:none;color:#d7aa31;cursor:pointer;font-size:14px;margin-bottom:16px;">← Тестті тоқтату</button>
      <div>
        <div style="color:#c9bfa8;font-size:14px;margin-bottom:6px;">${escapeHtml(title)} · Сұрақ ${currentIndex + 1} / ${total}</div>
        <div style="height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-bottom:20px;overflow:hidden;">
          <div style="height:100%;width:${((currentIndex + 1) / total) * 100}%;background:#d7aa31;"></div>
        </div>

        <h2 style="color:#f6d66c;font-family:PT Serif,Georgia,serif;font-weight:500;font-size:20px;margin-bottom:20px;">${escapeHtml(q.question_text)}</h2>

        <div id="testOptionsBox">
          ${options.map(([letter, text]) => `
            <button type="button" class="test-option${selected === letter ? " selected" : ""}" onclick="selectTestAnswer('${letter}')">
              <span class="test-option-letter">${letter.toUpperCase()}</span>
              <span>${escapeHtml(text)}</span>
            </button>`).join("")}
        </div>

        <div style="display:flex;gap:12px;margin-top:24px;">
          ${currentIndex > 0 ? `<button class="material-manager-button" style="width:auto;background:rgba(0,0,0,.15);" onclick="goToTestQuestion(${currentIndex - 1})">← Артқа</button>` : ""}
          ${!isLast ? `<button class="material-manager-button" style="width:auto;" onclick="goToTestQuestion(${currentIndex + 1})">Келесі →</button>` : ""}
          ${isLast ? `<button class="material-manager-button" style="width:auto;" onclick="finishTest()">Тестті аяқтау</button>` : ""}
        </div>

        <div style="margin-top:18px;display:flex;flex-wrap:wrap;gap:6px;">
          ${questions.map((qq, i) => `
            <button onclick="goToTestQuestion(${i})" style="width:30px;height:30px;border-radius:6px;border:1px solid rgba(225,180,52,.4);cursor:pointer;font-size:12px;
              background:${i === currentIndex ? "#d7aa31" : (answers[qq.id] ? "rgba(215,170,49,.35)" : "rgba(0,0,0,.15)")};
              color:${i === currentIndex ? "#122522" : "#f8e7a8"};">${i + 1}</button>`).join("")}
        </div>
        <div style="color:#8a8098;font-size:13px;margin-top:8px;">Жауап берілді: ${answeredCount} / ${total}</div>
      </div>`);
}

function selectTestAnswer(letter) {
  if (!testState) return;
  const q = testState.questions[testState.currentIndex];
  testState.answers[q.id] = letter;
  renderTestQuestion();
}

function goToTestQuestion(index) {
  if (!testState) return;
  testState.currentIndex = index;
  renderTestQuestion();
}

async function finishTest() {
  if (!testState) return;
  const { direction, title, questions, answers } = testState;

  const unanswered = questions.filter(q => !answers[q.id]).length;
  if (unanswered > 0 && !(await customConfirm(`Сіз ${unanswered} сұраққа жауап бермедіңіз. Бәрібір тестті аяқтайсыз ба?`))) {
    return;
  }

  let score = 0;
  questions.forEach(q => { if (answers[q.id] === q.correct_option) score++; });

  testPageShell(`<p>Нәтижені сақтап жатырмын...</p>`);

  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      await supabaseClient.from(TEST_ATTEMPTS_TABLE).insert({
        user_id: session.user.id,
        direction,
        score,
        total_questions: questions.length,
        answers,
      });
    }
  } catch (error) {
    console.error("Тест нәтижесін сақтау мүмкін болмады:", error);
  }

  renderTestResult(score, questions.length, answers, questions, direction, title);
}

function renderTestResult(score, total, answers, questions, direction, title) {
  const percent = Math.round((score / total) * 100);
  const dateStr = new Date().toLocaleDateString("ru-RU");

  testPageShell(`
      <div style="text-align:center;">
        <div style="font-size:48px;margin-bottom:10px;">${percent >= 70 ? "🎉" : "📝"}</div>
        <h2 style="color:#f6d66c;font-family:PT Serif,Georgia,serif;font-weight:500;">Тест аяқталды</h2>
        <p style="font-size:24px;color:#f8e7a8;margin:10px 0;">Дұрыс: <strong style="color:#f6d66c;">${score} / ${total}</strong></p>
        <p style="color:#c9bfa8;font-size:14px;">Тапсырған күні: ${dateStr}</p>

        <div style="display:flex;gap:12px;margin-top:24px;justify-content:center;flex-wrap:wrap;">
          <button class="material-manager-button" style="width:auto;" onclick='reviewTestAnswers(${JSON.stringify(direction)},${JSON.stringify(title)})'>Жауаптарды қарау</button>
          <button class="material-manager-button" style="width:auto;" onclick='startTest(${JSON.stringify(direction)},${JSON.stringify(title)})'>Қайта тапсыру</button>
          <button class="material-manager-button" style="width:auto;background:rgba(0,0,0,.15);" onclick="location.reload()">Тесттер тізіміне</button>
        </div>
      </div>`);

  window._lastTestReview = { questions, answers };
}

function reviewTestAnswers(direction, title) {
  const review = window._lastTestReview;
  if (!review) return;
  const { questions, answers } = review;
  const letters = { a: "A", b: "B", c: "C", d: "D" };

  testPageShell(`
      <button onclick="location.reload()" style="background:none;border:none;color:#d7aa31;cursor:pointer;font-size:14px;margin-bottom:16px;">← Тесттер тізіміне</button>
      <h2 style="color:#f6d66c;font-family:PT Serif,Georgia,serif;font-weight:500;">${escapeHtml(title)} — жауаптарды талдау</h2>
      <div>
        ${questions.map((q, i) => {
          const userAns = answers[q.id];
          const isCorrect = userAns === q.correct_option;
          const options = { a: q.option_a, b: q.option_b, c: q.option_c, d: q.option_d };
          return `
            <div style="margin-bottom:20px;padding:16px;border-radius:12px;border:1px solid ${isCorrect ? "rgba(120,200,120,.4)" : "rgba(220,100,100,.4)"};background:rgba(255,255,255,.03);">
              <div style="color:#c9bfa8;font-size:13px;margin-bottom:4px;">Сұрақ ${i + 1}</div>
              <div style="color:#f8e7a8;margin-bottom:10px;">${escapeHtml(q.question_text)}</div>
              <div style="font-size:14px;">
                <div style="color:${isCorrect ? "#8fd98f" : "#ff9d9d"};">Сіздің жауабыңыз: ${userAns ? letters[userAns] + ") " + escapeHtml(options[userAns]) : "жауап берілмеген"}</div>
                ${!isCorrect ? `<div style="color:#8fd98f;margin-top:4px;">Дұрыс жауап: ${letters[q.correct_option]}) ${escapeHtml(options[q.correct_option])}</div>` : ""}
              </div>
            </div>`;
        }).join("")}
      </div>`);
}

          ? `<button class="materials-add-btn" onclick='showMaterialManager(${JSON.stringify(section)},${JSON.stringify(direction)},${JSON.stringify(title)})'>Материал қосу +</button>`
          : ""}
      </div>
      <div id="materialsListBox">Жүктелуде...</div>
    </div>`;

  await loadDirectionMaterialsList();
}

async function loadDirectionMaterialsList() {
  const box = document.getElementById("materialsListBox");
  if (!box || !currentMaterialsView) return;
  const { section, direction } = currentMaterialsView;

  try {
    const { data, error } = await supabaseClient
      .from(PLATFORM_MATERIALS_TABLE)
      .select("id, material_type, url, file_path, title, created_at, created_by")
      .eq("section", section)
      .eq("direction", direction)
      .order("created_at", { ascending: false });
    if (error) throw error;

    currentDirectionMaterials = data || [];

    if (!currentDirectionMaterials.length) {
      box.innerHTML = `<div class="table-card"><div class="empty-table">Материал әлі қосылмаған.</div></div>`;
      return;
    }

    box.innerHTML = currentDirectionMaterials.map(function (item) {
      const isLink = item.material_type === "link";
      const icon = isLink ? "🔗" : (section === "videos" ? "▶" : "📄");
      const label = isLink ? "Сілтеме" : (item.title || (section === "videos" ? "Бейнефайл" : "Файл"));
      const meta = isLink ? escapeHtml(item.url || "") : "";
      const date = item.created_at ? new Date(item.created_at).toLocaleDateString("ru-RU") : "";
      return `
        <div class="material-row">
          <div class="material-row-icon">${icon}</div>
          <div class="material-row-body">
            <div class="material-row-title">${escapeHtml(label)}</div>
            <div class="material-row-meta">${meta}${date ? (meta ? " · " : "") + date : ""}</div>
          </div>
          <button class="material-row-open" onclick='openMaterialById(${JSON.stringify(item.id)})'>Ашу</button>
          ${(!isLink && section !== "videos") ? `<button class="material-row-open" style="margin-left:8px;" onclick='downloadMaterialById(${JSON.stringify(item.id)})'>⬇ Жүктеп алу</button>` : ""}
          ${(window.currentUserRole === "admin" || item.created_by === window.currentUserId) ? `<button class="material-row-open" style="margin-left:8px;background:rgba(200,60,60,.35);" onclick='deleteMaterialById(${JSON.stringify(item.id)})' title="Жою">🗑</button>` : ""}
        </div>`;
    }).join("");
  } catch (error) {
    console.error("Ошибка загрузки списка материалов:", error);
    box.innerHTML = `<div class="table-card"><div class="empty-table">Материалдарды жүктеу мүмкін болмады.</div></div>`;
  }
}

async function deleteMaterialById(id) {
  if (!window.currentUserIsManager) return;
  const item = currentDirectionMaterials.find(m => String(m.id) === String(id));
  if (!item) return;
  if (!(await customConfirm("Бұл материалды қайтарымсыз жою керек пе?"))) return;

  try {
    const { error } = await supabaseClient.from(PLATFORM_MATERIALS_TABLE).delete().eq("id", id);
    if (error) throw error;

    if (item.file_path) {
      await supabaseClient.storage.from(PLATFORM_STORAGE_BUCKET).remove([item.file_path]);
    }

    await loadDirectionMaterialsList();
  } catch (error) {
    console.error("Материалды жою қатесі:", error);
    customAlert("Материалды жою мүмкін болмады. " + (error.message || error));
  }
}

async function downloadMaterialById(id) {
  const item = currentDirectionMaterials.find(m => String(m.id) === String(id));
  if (!item || !item.file_path) return;
  try {
    const fileName = item.title || item.file_path.split("/").pop();
    const { data, error } = await supabaseClient.storage
      .from(PLATFORM_STORAGE_BUCKET)
      .createSignedUrl(item.file_path, 60 * 60, { download: fileName });
    if (error) throw error;
    if (!data?.signedUrl) throw new Error("Файлға сілтеме алу мүмкін болмады.");
    const a = document.createElement("a");
    a.href = data.signedUrl;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch (error) {
    console.error("Материалды жүктеп алу қатесі:", error);
    customAlert("Материалды жүктеп алу мүмкін болмады. " + (error.message || error));
  }
}

async function openMaterialById(id) {
  const item = currentDirectionMaterials.find(m => String(m.id) === String(id));
  if (!item) return;
  const isVideoFile = currentMaterialsView?.section === "videos" && item.material_type === "file";
  try {
    if (item.url) { window.open(item.url, "_blank", "noopener,noreferrer"); return; }
    if (item.file_path) {
      // Открываем вкладку СРАЗУ (по клику), чтобы мобильный браузер не заблокировал её как всплывающее окно —
      // адрес подставляем уже после того, как получим ссылку.
      const newTab = window.open("", "_blank");
      const { data, error } = await supabaseClient.storage
        .from(PLATFORM_STORAGE_BUCKET)
        .createSignedUrl(item.file_path, 60 * 60);
      if (error) throw error;
      if (!data?.signedUrl) throw new Error("Файлға сілтеме алу мүмкін болмады.");

      if (isVideoFile) {
        // Бейне показываем во встроенном плеере без стандартной кнопки "Жүктеп алу" в меню плеера
        // и без контекстного меню — это не абсолютная защита от копирования (её не даёт ни один
        // сайт в браузере), но убирает очевидный способ скачать файл в один клик.
        const niceTitleV = (item.title || "Бейне").replace(/[<>]/g, "");
        const videoWrapperHtml = `<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${niceTitleV}</title>
<style>html,body{margin:0;padding:0;height:100%;background:#000;display:flex;align-items:center;justify-content:center;}video{max-width:100%;max-height:100%;}</style>
</head><body><video src="${data.signedUrl}" controls controlsList="nodownload noremoteplayback" disablePictureInPicture oncontextmenu="return false;" autoplay></video></body></html>`;
        if (newTab) { newTab.document.open(); newTab.document.write(videoWrapperHtml); newTab.document.close(); }
        else window.open(data.signedUrl, "_blank", "noopener,noreferrer");
        return;
      }

      // Показываем файл в собственной обёртке — тогда во вкладке видно нормальное
      // название материала, а не служебное имя файла в хранилище (там оно всегда
      // с случайным кодом впереди, чтобы файлы с одинаковыми именами не перезаписывали друг друга).
      // На телефоне эту рамку не используем — там она мешает нормально листать
      // многостраничный PDF (виден только первый лист), поэтому там просто
      // открываем файл напрямую — родной просмотрщик телефона листает его правильно.
      const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobileDevice) {
        if (newTab) newTab.location.href = data.signedUrl;
        else window.open(data.signedUrl, "_blank", "noopener,noreferrer");
        return;
      }

      const niceTitle = (item.title || "Материал").replace(/[<>]/g, "");
      const wrapperHtml = `<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<title>${niceTitle}</title>
<style>html,body{margin:0;padding:0;height:100%;background:#525659;}iframe{width:100%;height:100%;border:0;display:block;}</style>
</head><body><iframe src="${data.signedUrl}"></iframe></body></html>`;

      if (newTab) {
        newTab.document.open();
        newTab.document.write(wrapperHtml);
        newTab.document.close();
      } else {
        window.open(data.signedUrl, "_blank", "noopener,noreferrer");
      }
    }
  } catch (error) {
    console.error("Материалды ашу қатесі:", error);
    customAlert("Материалды ашу мүмкін болмады. " + (error.message || error));
  }
}

function showMaterialManager(section, direction, title) {

  materialManagerState = { section, direction, title };
  const isVideo = section === "videos";
  const accept = isVideo ? "video/*,.mp4,.webm,.mov,.m4v" : ".pdf,.doc,.docx";

  const box = document.createElement("div");
  box.id = "materialManager";
  box.innerHTML = `
    <div class="material-manager-overlay">

        <input id="materialUrlInput" class="material-manager-input" type="url" placeholder="https://...">
        <button id="saveMaterialUrlButton" class="material-manager-button" onclick="savePlatformMaterialUrl()">🔗 Сілтемені сақтау</button>

        <div class="material-manager-or">немесе</div>

        <label class="material-manager-label">Файл</label>
        <input id="materialFileInput" style="display:none;" type="file" accept="${accept}" onchange="document.getElementById('materialFileNameLabel').textContent = this.files[0] ? this.files[0].name : 'Файл таңдалмады';">
        <button type="button" class="material-manager-button" style="background:linear-gradient(90deg,#3c8783,#4c9d98);margin-bottom:8px;" onclick="document.getElementById('materialFileInput').click()">📁 Файл таңдау</button>
        <div id="materialFileNameLabel" style="color:#c9baa0;font-size:13px;margin-bottom:14px;">Файл таңдалмады</div>

        <div class="material-manager-hint">
          ${isVideo
            ? "Бейне үшін сілтеме көрсетуге (мысалы, YouTube) немесе бейнефайл жүктеуге болады."
            : "Құжатқа сілтеме көрсетуге немесе PDF/DOC/DOCX жүктеуге болады."}

function setMaterialManagerStatus(text, type) {
  const box = document.getElementById("materialManagerStatus");
  if (!box) return;
  box.className = "material-manager-status " + (type || "");
  box.textContent = text || "";
}
function setMaterialManagerBusy(busy) {
  const saveButton = document.getElementById("saveMaterialUrlButton");
  const uploadButton = document.getElementById("uploadMaterialFileButton");
  if (saveButton) saveButton.disabled = busy;
  if (uploadButton) uploadButton.disabled = busy;
}

async function savePlatformMaterialUrl() {
  if (!window.currentUserIsManager) return;
  const { section, direction } = materialManagerState;
  const input = document.getElementById("materialUrlInput");
  const url = input?.value.trim() || "";

  if (!url) { setMaterialManagerStatus("Сілтеме кірістіріңіз.", "error"); return; }
  try { new URL(url); } catch (_) {
    setMaterialManagerStatus("https:// немесе http://-дан басталатын дұрыс сілтеме енгізіңіз", "error");
    return;
  }

  setMaterialManagerBusy(true);
  setMaterialManagerStatus("Сілтемені сақтап жатырмын...", "");

  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) throw new Error("Пайдаланушы сессиясы табылмады.");

    const { error } = await supabaseClient.from(PLATFORM_MATERIALS_TABLE).insert({
      section, direction, material_type: "link", url, file_path: null, created_by: session.user.id
    });
    if (error) throw error;

    setMaterialManagerStatus("Сілтеме сақталды.", "ok");
    await loadDirectionMaterialsList();
    setTimeout(() => document.getElementById("materialManager")?.remove(), 700);
  } catch (error) {
    console.error("Ошибка сохранения ссылки:", error);
    setMaterialManagerStatus("Сілтемені сақтау мүмкін болмады: " + (error.message || error), "error");
  } finally {
    setMaterialManagerBusy(false);
  }
}

async function uploadPlatformMaterialFile() {
  if (!window.currentUserIsManager) return;
  const { section, direction } = materialManagerState;
  const input = document.getElementById("materialFileInput");
  const file = input?.files?.[0];

  if (!file) { setMaterialManagerStatus("Алдымен файлды таңдаңыз.", "error"); return; }

  const maxSize = section === "videos" ? 500 * 1024 * 1024 : 100 * 1024 * 1024;
  if (file.size > maxSize) {
    setMaterialManagerStatus(
      section === "videos" ? "Бейне тым үлкен (максимум 500 МБ)." : "Файл тым үлкен (максимум 100 МБ).",
      "error"
    );
    return;
  }

  setMaterialManagerBusy(true);
  setMaterialManagerStatus("Файл жүктеп жатырмын...", "");

  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) throw new Error("Пайдаланушы сессиясы табылмады.");

    const safeName = file.name.normalize("NFKD").replace(/[^a-zA-Z0-9._-]+/g, "_").replace(/^_+|_+$/g, "") || "file";
    const unique = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + "_" + Math.random().toString(36).slice(2);
    const path = `${section}/${direction}/${unique}_${safeName}`;

    const { error: uploadError } = await supabaseClient.storage
      .from(PLATFORM_STORAGE_BUCKET)
      .upload(path, file, { cacheControl: "3600", upsert: false });
    if (uploadError) throw uploadError;

    setMaterialManagerStatus("Файл жүктелді. Жазбаны сақтап жатырмын...", "");

    const { error: insertError } = await supabaseClient.from(PLATFORM_MATERIALS_TABLE).insert({
      section, direction, material_type: "file", url: null, file_path: path, title: file.name, created_by: session.user.id
    });

    if (insertError) {
      await supabaseClient.storage.from(PLATFORM_STORAGE_BUCKET).remove([path]);
      throw insertError;
    }

    setMaterialManagerStatus("Файл сәтті сақталды.", "ok");
    await loadDirectionMaterialsList();
    setTimeout(() => document.getElementById("materialManager")?.remove(), 700);
  } catch (error) {
    console.error("Ошибка загрузки файла:", error);
    setMaterialManagerStatus("Файлды жүктеу мүмкін болмады: " + (error.message || error), "error");
  } finally {
    setMaterialManagerBusy(false);
  }
}

const LIBRARY_LINKS_TABLE = "library_links";
let currentLibraryLinks = [];

function isRealAdminUser() {
  return window.currentUserRole === "admin";
}

function loadLibrary() {
  const contentCards = document.getElementById("contentCards");
  if (!contentCards) return;
  contentCards.className = "";
  contentCards.innerHTML = `
    <div class="cards">
      <div class="card library-main-card" onclick="openLibraryLinksView()" role="button" tabindex="0">
        <div class="card-icon library-icon">📚</div>
        <div class="card-content">
          <h3>Нумеролог<br>кітапханасы</h3>
          <p>Нумерология бойынша кітаптар</p>
        </div>
      </div>
    </div>`;
}

async function openLibraryLinksView() {
  const contentCards = document.getElementById("contentCards");
  if (!contentCards) return;
  contentCards.className = "";
  const isAdmin = isRealAdminUser();
  contentCards.innerHTML = `
    <div class="materials-page">
      <button class="back-link" onclick="loadLibrary()">← Артқа</button>
      <div class="materials-head">
        <h2>Нумеролог кітапханасы</h2>

      <div id="libraryListBox">Жүктелуде...</div>
    </div>`;

async function loadLibraryLinksList() {
  const box = document.getElementById("libraryListBox");
  if (!box) return;

    const { data, error } = await supabaseClient
      .from(LIBRARY_LINKS_TABLE)
      .select("id, title, url, created_at")

      return `
        <div class="material-row">
          <div class="material-row-icon">📚</div>
          <div class="material-row-body">
            <div class="material-row-title">${escapeHtml(item.title || "Кітапхана")}</div>
            <div class="material-row-meta">${hasUrl ? escapeHtml(item.url) : "Сілтеме әлі қосылмаған"}</div>
          </div>
          ${hasUrl ? `<button class="material-row-open" onclick='openLibraryLink(${JSON.stringify(item.id)})'>Ашу</button>` : ""}
          ${isAdmin ? `<button class="material-row-open" style="margin-left:8px;" onclick='showLibraryLinkManager(${JSON.stringify(item.id)},${JSON.stringify(item.title)},${JSON.stringify(item.url || "")})'>${hasUrl ? "Сілтемені өзгерту" : "Сілтеме кірістіру"}</button>` : ""}

function openLibraryLink(id) {
  const item = currentLibraryLinks.find(m => String(m.id) === String(id));
  if (!item || !item.url) return;
  window.open(item.url, "_blank", "noopener,noreferrer");
}

function showLibraryLinkManager(id, title, existingUrl) {
  if (!isRealAdminUser()) return;
  const old = document.getElementById("libraryLinkManager");
  if (old) old.remove();

  const isNew = !id;
  const box = document.createElement("div");
  box.id = "libraryLinkManager";
  box.innerHTML = `
    <div class="material-manager-overlay">
      <div class="material-manager">
        <button class="material-manager-close" onclick="document.getElementById('libraryLinkManager').remove()">×</button>
        <h2>${isNew ? "Жаңа кітап қосу" : escapeHtml(title)}</h2>

        ${isNew ? `
        <label class="material-manager-label">Кітаптың атауы</label>
        <input id="libraryLinkTitleInput" class="material-manager-input" type="text" placeholder="Кітаптың атауын енгізіңіз">` : ""}

        <label class="material-manager-label">Сілтеме</label>
        <input id="libraryLinkUrlInput" class="material-manager-input" type="url" placeholder="https://..." value="${escapeHtml(existingUrl || "")}">

        <button id="saveLibraryLinkButton" class="material-manager-button" onclick='saveLibraryLink(${JSON.stringify(id || "")})'>🔗 Сілтемені сақтау</button>

        <div id="libraryLinkManagerStatus" class="material-manager-status"></div>
      </div>
    </div>`;
  document.body.appendChild(box);
}

function setLibraryLinkManagerStatus(text, type) {
  const box = document.getElementById("libraryLinkManagerStatus");
  if (!box) return;
  box.className = "material-manager-status " + (type || "");
  box.textContent = text || "";
}

async function saveLibraryLink(id) {
  if (!isRealAdminUser()) {
    setLibraryLinkManagerStatus("Тек әкімші кітапхананы өзгерте алады.", "error");
    return;
  }
  const urlInput = document.getElementById("libraryLinkUrlInput");
  const url = urlInput?.value.trim() || "";
  const isNew = !id;
  const titleInput = document.getElementById("libraryLinkTitleInput");
  const title = isNew ? (titleInput?.value.trim() || "") : "";

  if (isNew && !title) { setLibraryLinkManagerStatus("Кітаптың атауын енгізіңіз.", "error"); return; }
  if (!url) { setLibraryLinkManagerStatus("Сілтеме кірістіріңіз.", "error"); return; }
  try { new URL(url); } catch (_) {
    setLibraryLinkManagerStatus("https:// немесе http://-дан басталатын дұрыс сілтеме енгізіңіз", "error");
    return;
  }

  const saveButton = document.getElementById("saveLibraryLinkButton");
  if (saveButton) saveButton.disabled = true;
  setLibraryLinkManagerStatus("Сілтемені сақтап жатырмын...", "");

  try {
    if (isNew) {
      const { data, error } = await supabaseClient.from(LIBRARY_LINKS_TABLE).insert({ title, url }).select();
      if (error) throw error;
      if (!data || !data.length) throw new Error("Жазба сақталмады.");
    } else {
      const { data, error } = await supabaseClient.from(LIBRARY_LINKS_TABLE).update({ url }).eq("id", id).select();
      if (error) throw error;
      if (!data || !data.length) throw new Error("Жазба табылмады немесе өзгертуге құқық жоқ.");
    }

    setLibraryLinkManagerStatus("Сілтеме сақталды.", "ok");
    await loadLibraryLinksList();
    setTimeout(() => document.getElementById("libraryLinkManager")?.remove(), 700);
  } catch (error) {
    console.error("Сілтемені сақтау қатесі:", error);
    setLibraryLinkManagerStatus("Сілтемені сақтау мүмкін болмады: " + (error.message || error), "error");
  } finally {
    if (saveButton) saveButton.disabled = false;
  }
}

const DIRECTION_ORDER = ["adult", "child", "compatibility", "moonsun", "prognostika", "karmic", "biorhythms", "codes"];

function paginatedTableHtml(containerId, headerHtml, rowsHtmlArray, pageSize) {
  pageSize = pageSize || 15;
  window["__paginatedRows_" + containerId] = rowsHtmlArray;
  return renderPaginatedPage(containerId, headerHtml, 1, pageSize);
}

function renderPaginatedPage(containerId, headerHtml, page, pageSize) {
  const rows = window["__paginatedRows_" + containerId] || [];
  if (!rows.length) return `<div class="empty-table">Әзірге бос.</div>`;
  const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
  page = Math.min(Math.max(1, page), totalPages);
  const start = (page - 1) * pageSize;
  const pageRows = rows.slice(start, start + pageSize);
  const pagerHtml = totalPages > 1 ? `<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px;">
    ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `<button type="button" onclick='setPaginatedPage(${JSON.stringify(containerId)}, ${JSON.stringify(headerHtml)}, ${p}, ${pageSize})' style="padding:6px 12px;border-radius:8px;border:1px solid ${p === page ? "#f6d66c" : "rgba(225,180,52,.4)"};background:${p === page ? "linear-gradient(90deg,#3c8783,#2f6d6a)" : "transparent"};color:#f5d46b;cursor:pointer;font-size:13px;">${p}</button>`).join("")}
  </div>` : "";
  return `<div style="overflow-x:auto;"><table class="data-table">${headerHtml}<tbody>${pageRows.join("")}</tbody></table></div>${pagerHtml}`;
}

function setPaginatedPage(containerId, headerHtml, page, pageSize) {
  const el = document.getElementById(containerId);
  if (el) el.innerHTML = renderPaginatedPage(containerId, headerHtml, page, pageSize);
}

function calcStatsByDirection(rows) {
  const shownDirections = DIRECTION_ORDER.filter((d) => isDirectionVisible(d));
  const counts = Object.fromEntries(shownDirections.map((d) => [d, 0]));
  rows = rows.filter((r) => counts[r.direction] !== undefined);
  rows.forEach((r) => { counts[r.direction]++; });
  return `<div class="stats-grid">` +
    shownDirections.map((d) => `<div class="stat-card"><span>${escapeHtml(DIRECTION_NAMES[d] || d)}</span><strong>${counts[d]}</strong></div>`).join("") +
    `<div class="stat-card"><span>Барлығы</span><strong>${rows.length}</strong></div>` +
    `</div>`;
}

function calcHistoryTable(rows, showEmail) {
  if (!rows.length) return `<div class="empty-table">Әлі сақталған есептеулер жоқ.</div>`;
  const headerHtml = `<thead><tr>${showEmail ? "<th>Email</th>" : ""}<th>Күні мен уақыты</th><th>Бағыт</th><th>Клиент</th><th>Туған күні</th><th></th></tr></thead>`;
  const rowsHtml = rows.map(r => `
          <tr>
            ${showEmail ? `<td><a href="javascript:void(0)" style="color:#8a8098;text-decoration:underline;" onclick='showUserDetailModal(${JSON.stringify(r.user_id)})'>${escapeHtml(r._email || "—")}</a></td>` : ""}
            <td>${new Date(r.created_at).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" })}</td>
            <td>${escapeHtml(DIRECTION_NAMES[r.direction] || r.direction)}</td>
            <td>${escapeHtml(r.person_name || (r.last_name ? r.last_name + " " + (r.first_name || "") : "—"))}</td>
            <td>${escapeHtml(r.birth_date || "—")}${r.birth_date2 ? " / " + escapeHtml(r.birth_date2) : ""}</td>

async function reopenCalculation(r) {
  window._skipHistorySave = true;
  try {
    await openCalculator(r.direction);
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    if (r.direction === "pythagoras" || r.direction === "codes") {
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v || ""; };
      set("pythLastName", r.last_name);
      set("pythFirstName", r.first_name);
      set("pythPatronymic", r.patronymic);
      set("pythAlphabet", r.alphabet || "russian");
      set("birthDate", r.birth_date);
      if (r.direction === "codes") calculateCodes(); else calculatePythagoras();
    } else if (r.direction === "compatibility") {
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v || ""; };
      set("birthDate1", r.birth_date);
      set("birthDate2", r.birth_date2);
      calculateCompatibility();
    } else {
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v || ""; };
      set("name", r.person_name);
      set("birthDate", r.birth_date);
      calculate(r.direction);
    }

    // Иәём результату отрисоваться и сразу запускаем скачивание — из истории
    // человек хочет именно скачать сохранённый расчёт, а не просто посмотреть его на экране.
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    await new Promise(resolve => setTimeout(resolve, 150));
    document.getElementById("calcDownloadBtn")?.click();
  } finally {
    window._skipHistorySave = false;
  }
}

async function applyTeacherCode() {
  const input = document.getElementById("studentTeacherCodeInput");
  const msg = document.getElementById("studentTeacherCodeMessage");
  const code = (input?.value || "").trim().toUpperCase();
  const setMsg = (text, ok) => { if (msg) { msg.textContent = text; msg.style.color = ok ? "#8fe3a1" : "#ff9d9d"; } };

  if (!code) { setMsg("Кодты енгізіңіз.", false); return; }
  setMsg("Кодты тексеріп жатырмын...", true);

  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { setMsg("Аккаунтқа кіру керек.", false); return; }

    const { data: teachers, error: teachersError } = await supabaseClient.from("profiles").select("id").eq("role", "numerologist");
    if (teachersError) throw teachersError;
    const match = (teachers || []).find(t => t.id.slice(0, 8).toUpperCase() === code);
    if (!match) { setMsg("Мұндай коды бар ұстаз табылмады. Кодты тексеріңіз.", false); return; }

    const { error: updateError } = await supabaseClient.from("profiles").update({ teacher_id: match.id }).eq("id", session.user.id);
    if (updateError) throw updateError;

    setMsg("Дайын, сіз ұстазға бекітілдіңіз.", true);
    const box = document.getElementById("studentTeacherCodeBox");
    if (box) setTimeout(() => { box.style.display = "none"; }, 1200);
  } catch (error) {
    console.error("Ошибка применения кода учителя:", error);
    setMsg("Кодты қолдану мүмкін болмады: " + (error.message || "Supabase қатесі"), false);
  }
}

    const schoolInput = document.getElementById("teacherSchoolNameInput");

async function saveTeacherSchoolName() {
  const input = document.getElementById("teacherSchoolNameInput");
  const msg = document.getElementById("teacherSchoolNameMessage");
  const name = (input?.value || "").trim();
  const setMsg = (text, ok) => { if (msg) { msg.textContent = text; msg.style.color = ok ? "#8fe3a1" : "#ff9d9d"; } };

  if (!name) { setMsg("Мектептің атауын енгізіңіз.", false); return; }
  setMsg("Сақтап жатырмын...", true);

  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    const { data: existing } = await supabaseClient.from("schools").select("id").eq("owner_id", session.user.id).maybeSingle();

    let schoolId = existing?.id;
    if (existing) {
      const { error } = await supabaseClient.from("schools").update({ name }).eq("id", existing.id);
      if (error) throw error;
    } else {
      const { data: created, error } = await supabaseClient.from("schools").insert({ owner_id: session.user.id, name }).select("id").single();
      if (error) throw error;
      schoolId = created.id;
    }

    await supabaseClient.from("profiles").update({ school_id: schoolId }).eq("id", session.user.id);
    setMsg("Сақталды.", true);
  } catch (error) {
    console.error("Ошибка сохранения школы:", error);
    setMsg("Сақтау мүмкін болмады: " + (error.message || error), false);
  }
}

let adminUsersFilterTeacher = null; // { id, name } — admin drilled into one numerologist's students

function roleLabel(role) {
  const labels = { student: "Student", numerologist: "Teacher", admin: "Admin" };
  return labels[String(role || "student").trim().toLowerCase()] || (role || "Student");
}

function statusLabel(status) {
  const labels = { active: "Белсенді", deleted: "Жойылды" };
  return labels[String(status || "active").trim().toLowerCase()] || (status || "Белсенді");
}

async function loadAdminUsers() {
  const box = document.getElementById("adminUsersTable");
  const accessSelect = document.getElementById("accessUserSelect");
  const roleSelect = document.getElementById("roleUserSelect");
  const attachStudentSelect = document.getElementById("attachStudentSelect");
  const attachTeacherSelect = document.getElementById("attachTeacherSelect");
  if (!box) return;
  box.innerHTML = '<div class="empty-table">Жүктелуде...</div>';

  const isRealAdmin = window.currentUserRole === "admin";
  const { data: { session } } = await supabaseClient.auth.getSession();

  let query = supabaseClient
    .from("profiles")
    .select("id, first_name, last_name, middle_name, email, phone, role, status, teacher_id, created_at, restored_at")
    .or("status.neq.deleted,status.is.null")
    .order("last_name", { ascending: true });

  if (!isRealAdmin) query = query.eq("teacher_id", session.user.id);
  else if (adminUsersFilterTeacher) query = query.eq("teacher_id", adminUsersFilterTeacher.id);

  const { data, error } = await query;

  if (error) {
    console.error("Пайдаланушыларды жүктеу қатесі:", error);
    box.innerHTML = '<div class="empty-table">Пайдаланушыларды жүктеу мүмкін болмады.</div>';
    return;
  }

  const users = data || [];
  const nameOf = (u) => [u.last_name, u.first_name, u.middle_name].filter(Boolean).join(" ") || u.email || "Пайдаланушы";

  // Проверяем реальный статус доступа (истёк / активен / вообще не выдавался) для каждого пользователя одним запросом.
  const accessByUser = {};
  if (users.length) {
    const { data: periods } = await supabaseClient
      .from("access_periods")
      .select("profile_id, status, ends_at, is_unlimited, payment_status, starts_at, created_at")
      .in("profile_id", users.map(u => u.id))
      .order("created_at", { ascending: false });
    (periods || []).forEach(function (p) {
      if (!accessByUser[p.profile_id]) accessByUser[p.profile_id] = p; // первый попавшийся — самый свежий, т.к. отсортировано по starts_at desc
    });
  }
  function accessBadge(user) {
    if (user.role !== "student" && user.role !== "numerologist") return "";
    const latest = accessByUser[user.id];
    if (!latest) return `<div style="font-size:11px;color:#8a8098;margin-top:3px;">Қолжетімділік берілмеген</div>`;
    if (hasActivePlatformAccess(latest)) return `<div style="font-size:11px;color:#8fd18f;margin-top:3px;">Қолжетімділік белсенді${latest.is_unlimited ? "" : (latest.ends_at ? " — " + new Date(latest.ends_at).toLocaleDateString("ru-RU") + " дейін" : "")}</div>`;
    return `<div style="font-size:11px;color:#e8a94e;margin-top:3px;">Қолжетімділік мерзімі өтті <button type="button" onclick='scrollToGrantAccess(${JSON.stringify(user.id)})' style="margin-left:4px;padding:2px 8px;font-size:11px;border-radius:8px;border:1px solid #d7aa31;background:linear-gradient(90deg,#3c8783,#2f6d6a);color:#f8d96d;cursor:pointer;">Жаңарту</button></div>`;
  }

  // Селекты доступа/ролей всегда строятся из ПОЛНОГО списка, не из отфильтрованного вида.
  if (isRealAdmin && adminUsersFilterTeacher) {
    const { data: allData } = await supabaseClient
      .from("profiles")
      .select("id, first_name, last_name, middle_name, email, phone, role, status, teacher_id, created_at")
      .order("last_name", { ascending: true });
    fillAccessSelects(allData || [], nameOf);
  } else {
    fillAccessSelects(users, nameOf);
  }

  function fillAccessSelects(list, nameFn) {
    const fillSelect = (el, opts, emptyLabel) => {
      if (!el) return;
      const prevValue = el.value;
      el.innerHTML = opts.length
        ? opts.map(u => `<option value="${escapeHtml(u.id)}">${escapeHtml(nameFn(u))}${u.email ? " — " + escapeHtml(u.email) : ""}</option>`).join("")
        : `<option value="">${emptyLabel}</option>`;
      if (prevValue && opts.some(u => u.id === prevValue)) el.value = prevValue;
    };
    fillSelect(accessSelect, list.filter(u => u.role !== "admin"), "Пайдаланушылар жоқ");
    if (isRealAdmin) {
      fillSelect(roleSelect, list.filter(u => u.role !== "admin"), "Пайдаланушылар жоқ");
      fillSelect(attachStudentSelect, list.filter(u => (u.role || "student") !== "numerologist" && (u.role || "student") !== "admin"), "Оқушылар жоқ");
      fillSelect(attachTeacherSelect, list.filter(u => u.role === "numerologist"), "Ұстаздар жоқ");
    }
    loadScopeForSelectedUser();
  }

  const backLink = (isRealAdmin && adminUsersFilterTeacher)
    ? `<button class="back-link" onclick='closeNumerologistDrilldown()'>← Барлық пайдаланушылар</button>`
    : "";

  if (!users.length) {
    box.innerHTML = backLink + `<div class="empty-table">${
      adminUsersFilterTeacher
        ? "Бұл ұстазда әзірге оқушылар жоқ."
        : (isRealAdmin ? "Әзірге тіркелген пайдаланушылар жоқ." : "Сізде әзірге оқушылар жоқ. Әкімшіден оларды сізге бекітуді сұраңыз.")
    }</div>`;
    return;
  }

  const teacherName = (teacherId) => {
    if (!teacherId) return "Тағайындалмаған";
    const t = users.find(u => u.id === teacherId);
    return t ? nameOf(t) : "—";
  };

  const teachersSorted = users
    .filter(u => u.role === "numerologist")
    .slice()
    .sort((a, b) => new Date(a.created_at || 0) - new Date(b.created_at || 0));
  const teacherNumber = {};
  teachersSorted.forEach((t, i) => { teacherNumber[t.id] = i + 1; });

  box.innerHTML = backLink + `
    <div style="overflow-x:auto;">
    <table class="data-table">
      <thead><tr><th>Пайдаланушы</th><th>Email</th><th>Телефон</th><th>Рөл</th><th>Тіркелген</th>${isRealAdmin ? "<th>Ұстаз коды</th><th>Ұстазға бекітілген</th>" : ""}<th>Мәртебе</th><th></th></tr></thead>
      <tbody>
        ${users.map(function (user) {
          const codeCell = user.role === "numerologist" ? `<td style="font-family:'Courier New',monospace;letter-spacing:1px;color:#f6d66c;font-weight:bold;">${escapeHtml(user.id.slice(0, 8).toUpperCase())}</td>` : (user.role === "admin" ? `<td style="color:#f6d66c;font-weight:bold;">Admin</td>` : `<td>—</td>`);
          return `<tr>
            <td>${isRealAdmin ? `<a href="javascript:void(0)" style="color:#f5f0df;text-decoration:underline;" onclick='showUserDetailModal(${JSON.stringify(user.id)})'>${escapeHtml(nameOf(user))}</a>` : escapeHtml(nameOf(user))}</td>
            <td>${escapeHtml(user.email || "—")}</td>
            <td>${escapeHtml(user.phone || "—")}</td>
            <td>${escapeHtml(roleLabel(user.role))}</td>
            <td>${user.created_at ? new Date(user.created_at).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "—"}${user.restored_at ? " / " + new Date(user.restored_at).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : ""}</td>
            ${isRealAdmin ? `${codeCell}<td>${user.role === "student" ? escapeHtml(teacherName(user.teacher_id)) : "—"}</td>` : ""}
            <td>${statusLabel(user.status)}${user.restored_at ? ` <span style="color:#8fd18f;font-size:11px;">(қалпына келтірілді ${new Date(user.restored_at).toLocaleDateString("ru-RU")})</span>` : ""}${accessBadge(user)}</td>
            ${user.role === "admin" ? (isRealAdmin ? "<td>—</td>" : "") : `<td><button type="button" class="material-manager-button" style="width:auto;padding:6px 10px;font-size:12px;" onclick='deleteUserAccount(${JSON.stringify(user.id)}, ${JSON.stringify(nameOf(user))})'>Жою</button></td>`}
          </tr>`;
        }).join("")}
      </tbody>
    </table>
    </div>`;

  loadDeletedUsersLog();
}

      <button type="button" id="confirmDeleteBtn" class="material-manager-button" style="width:auto;background:#a33;" onclick='confirmDeleteUser(${JSON.stringify(userId)})'>Жою</button>

async function confirmDeleteUser(userId) {
  const btn = document.getElementById("confirmDeleteBtn");
  const msg = document.getElementById("deleteModalMessage");
  if (btn) { btn.disabled = true; btn.textContent = "Жойып жатырмын..."; }
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    const resp = await fetch(SUPABASE_URL + "/functions/v1/delete-user", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + session.access_token },
      body: JSON.stringify({ userId, action: "delete" }),
    });
    const result = await resp.json();
    if (!resp.ok || result.error) throw new Error(result.error || ("Сервер қате қайтарды " + resp.status));
    closeModal();
    loadAdminUsers();
  } catch (error) {
    console.error("Пайдаланушыны жою қатесі:", error);
    if (msg) { msg.textContent = "Аккаунтты жою мүмкін болмады: " + (error.message || error); msg.style.color = "#ff9d9d"; }
    if (btn) { btn.disabled = false; btn.textContent = "Жою"; }
  }
}
