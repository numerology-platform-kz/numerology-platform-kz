              <span>${escapeHtml(text)}</span>
            </button>`).join("")}
        </div>

        <div style="display:flex;gap:12px;margin-top:24px;">
          ${currentIndex > 0 ? `<button class="material-manager-button" style="width:auto;background:rgba(0,0,0,.15);" onclick="goToTestQuestion(${currentIndex - 1})">← Артқа</button>` : ""}
          ${!isLast ? `<button class="material-manager-button" style="width:auto;" onclick="goToTestQuestion(${currentIndex + 1})">Келесі →</button>` : ""}
          ${isLast ? `<button class="material-manager-button" style="width:auto;" onclick="finishTest()">Тестті аяқтау</button>` : ""}
        </div>

        <div style="margin-top:18px;display:flex;flex-wrap:wrap;gap:6px;">
          ${questions.map((qq, i) => `
            <button onclick="goToTestQuestion(${i})" style="width:30px;height:30px;border-radius:6px;border:1px solid rgba(225,180,52,.4);cursor:pointer;font-size:12px;
              background:${i === currentIndex ? "#d7aa31" : (answers[qq.id] ? "rgba(215,170,49,.35)" : "rgba(0,0,0,.15)")};
              color:${i === currentIndex ? "#122522" : "#f8e7a8"};">${i + 1}</button>`).join("")}
        </div>
        <div style="color:#8a8098;font-size:13px;margin-top:8px;">Отвечено: ${answeredCount} из ${total}</div>
      </div>`);
}

function selectTestAnswer(letter) {
  if (!testState) return;
  const q = testState.questions[testState.currentIndex];
  testState.answers[q.id] = letter;
  renderTestQuestion();
}

function goToTestQuestion(index) {
  if (!testState) return;
  testState.currentIndex = index;
  renderTestQuestion();
}

async function finishTest() {
  if (!testState) return;
  const { direction, title, questions, answers } = testState;

  const unanswered = questions.filter(q => !answers[q.id]).length;
  if (unanswered > 0 && !(await customConfirm(`Вы не ответили на ${unanswered} вопрос(ов). Тестті аяқтау всё равно?`))) {
    return;
  }

  let score = 0;
  questions.forEach(q => { if (answers[q.id] === q.correct_option) score++; });

  testPageShell(`<p>Нәтижені сақтап жатырмын...</p>`);

  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      await supabaseClient.from(TEST_ATTEMPTS_TABLE).insert({
        user_id: session.user.id,
        direction,
        score,
        total_questions: questions.length,
        answers,
      });
    }
  } catch (error) {
    console.error("Тест нәтижесін сақтау мүмкін болмады:", error);
  }

  renderTestResult(score, questions.length, answers, questions, direction, title);
}

function renderTestResult(score, total, answers, questions, direction, title) {
  const percent = Math.round((score / total) * 100);
  const dateStr = new Date().toLocaleDateString("ru-RU");

  testPageShell(`
      <div style="text-align:center;">
        <div style="font-size:48px;margin-bottom:10px;">${percent >= 70 ? "🎉" : "📝"}</div>
        <h2 style="color:#f6d66c;font-family:Georgia,serif;font-weight:500;">Тест аяқталды</h2>
        <p style="font-size:24px;color:#f8e7a8;margin:10px 0;">Дұрыс: <strong style="color:#f6d66c;">${score} из ${total}</strong></p>
        <p style="color:#c9bfa8;font-size:14px;">Күні прохождения: ${dateStr}</p>

        <div style="display:flex;gap:12px;margin-top:24px;justify-content:center;flex-wrap:wrap;">
          <button class="material-manager-button" style="width:auto;" onclick='reviewTestAnswers(${JSON.stringify(direction)},${JSON.stringify(title)})'>Жауаптарды қарау</button>
          <button class="material-manager-button" style="width:auto;" onclick='startTest(${JSON.stringify(direction)},${JSON.stringify(title)})'>Қайта тапсыру</button>
          <button class="material-manager-button" style="width:auto;background:rgba(0,0,0,.15);" onclick="location.reload()">Тесттер тізіміне</button>
        </div>
      </div>`);

  window._lastTestReview = { questions, answers };
}

function reviewTestAnswers(direction, title) {
  const review = window._lastTestReview;
  if (!review) return;
  const { questions, answers } = review;
  const letters = { a: "A", b: "B", c: "C", d: "D" };

  testPageShell(`
      <button onclick="location.reload()" style="background:none;border:none;color:#d7aa31;cursor:pointer;font-size:14px;margin-bottom:16px;">← Тесттер тізіміне</button>
      <h2 style="color:#f6d66c;font-family:Georgia,serif;font-weight:500;">${escapeHtml(title)} — разбор ответов</h2>
      <div>
        ${questions.map((q, i) => {
          const userAns = answers[q.id];
          const isCorrect = userAns === q.correct_option;
          const options = { a: q.option_a, b: q.option_b, c: q.option_c, d: q.option_d };
          return `
            <div style="margin-bottom:20px;padding:16px;border-radius:12px;border:1px solid ${isCorrect ? "rgba(120,200,120,.4)" : "rgba(220,100,100,.4)"};background:rgba(255,255,255,.03);">
              <div style="color:#c9bfa8;font-size:13px;margin-bottom:4px;">Вопрос ${i + 1}</div>
              <div style="color:#f8e7a8;margin-bottom:10px;">${escapeHtml(q.question_text)}</div>
              <div style="font-size:14px;">
                <div style="color:${isCorrect ? "#8fd98f" : "#ff9d9d"};">Ваш ответ: ${userAns ? letters[userAns] + ") " + escapeHtml(options[userAns]) : "не отвечено"}</div>
                ${!isCorrect ? `<div style="color:#8fd98f;margin-top:4px;">Правильный ответ: ${letters[q.correct_option]}) ${escapeHtml(options[q.correct_option])}</div>` : ""}
              </div>
            </div>`;
        }).join("")}
      </div>`);
}


/* ============================================================
   МЕТОДИЧЕСКИЕ ПОСОБИЯ / ВИДЕО
   Единая система: таблица platform_materials + bucket methodicals.
   Для каждого направления — одна запись (ссылка или файл).
   ============================================================ */

const PLATFORM_MATERIALS_TABLE = "platform_materials";
const PLATFORM_STORAGE_BUCKET = "methodicals";

let materialManagerState = { section: "", direction: "", title: "" };
let currentMaterialsView = null;
let currentDirectionMaterials = [];

async function loadPlatformMaterials(section) {
  const contentCards = document.getElementById("contentCards");
  if (!contentCards) return;
  currentMaterialsView = null;
  contentCards.className = "cards";
  contentCards.innerHTML = renderDirectionCards(section, "material");
}

/* Полноценная страница конкретного направления: список материалов + добавление. */
async function openDirectionMaterials(section, direction, title) {
  currentMaterialsView = { section, direction, title };
  hideWelcome();

  const contentCards = document.getElementById("contentCards");
  if (!contentCards) return;
  contentCards.className = "";

  if (window.currentUserRole !== "admin" && !hasGrant(section, direction)) {
    contentCards.innerHTML = `
      <div class="materials-page">
        <button class="back-link" onclick='showSection(${JSON.stringify(section)})'>← Артқа</button>
        <div class="access-locked">
          <div class="access-locked-icon">🔒</div>
          <h2>Бұл бөлімге қолжетімділік жоқ</h2>
          <p>Обратитесь к әкімшіу или учителю, чтобы открыть «${escapeHtml(title)}».</p>
        </div>
      </div>`;
    return;
  }

  contentCards.innerHTML = `
    <div class="materials-page">
      <button class="back-link" onclick='showSection(${JSON.stringify(section)})'>← Артқа</button>
      <div class="materials-head">
        <h2>${escapeHtml(title)} — ${escapeHtml(SECTION_LABELS[section] || "Материалдар")}</h2>
        ${window.currentUserIsManager
          ? `<button class="materials-add-btn" onclick='showMaterialManager(${JSON.stringify(section)},${JSON.stringify(direction)},${JSON.stringify(title)})'>Материал қосу +</button>`
          : ""}
      </div>
      <div id="materialsListBox">Жүктелуде...</div>
    </div>`;

  await loadDirectionMaterialsList();
}

async function loadDirectionMaterialsList() {
  const box = document.getElementById("materialsListBox");
  if (!box || !currentMaterialsView) return;
  const { section, direction } = currentMaterialsView;

  try {
    const { data, error } = await supabaseClient
      .from(PLATFORM_MATERIALS_TABLE)
      .select("id, material_type, url, file_path, title, created_at, created_by")
      .eq("section", section)
      .eq("direction", direction)
      .order("created_at", { ascending: false });
    if (error) throw error;

    currentDirectionMaterials = data || [];

    if (!currentDirectionMaterials.length) {
      box.innerHTML = `<div class="table-card"><div class="empty-table">Материал әлі қосылмаған.</div></div>`;
      return;
    }

    box.innerHTML = currentDirectionMaterials.map(function (item) {
      const isLink = item.material_type === "link";
      const icon = isLink ? "🔗" : (section === "videos" ? "▶" : "📄");
      const label = isLink ? "Сілтеме" : (item.title || (section === "videos" ? "Бейнефайл" : "Файл"));
      const meta = isLink ? escapeHtml(item.url || "") : "";
      const date = item.created_at ? new Date(item.created_at).toLocaleDateString("ru-RU") : "";
      return `
        <div class="material-row">
          <div class="material-row-icon">${icon}</div>
          <div class="material-row-body">
            <div class="material-row-title">${escapeHtml(label)}</div>
            <div class="material-row-meta">${meta}${date ? (meta ? " · " : "") + date : ""}</div>
          </div>
          <button class="material-row-open" onclick='openMaterialById(${JSON.stringify(item.id)})'>Ашу</button>
          ${(window.currentUserRole === "admin" || item.created_by === window.currentUserId) ? `<button class="material-row-open" style="margin-left:8px;background:rgba(200,60,60,.35);" onclick='deleteMaterialById(${JSON.stringify(item.id)})' title="Удалить">🗑</button>` : ""}
        </div>`;
    }).join("");
  } catch (error) {
    console.error("Ошибка загрузки списка материалов:", error);
    box.innerHTML = `<div class="table-card"><div class="empty-table">Материалдарды жүктеу мүмкін болмады.</div></div>`;
  }
}

async function deleteMaterialById(id) {
  if (!window.currentUserIsManager) return;
  const item = currentDirectionMaterials.find(m => String(m.id) === String(id));
  if (!item) return;
  if (!(await customConfirm("Бұл материалды қайтарымсыз жою керек пе?"))) return;

  try {
    const { error } = await supabaseClient.from(PLATFORM_MATERIALS_TABLE).delete().eq("id", id);
    if (error) throw error;

    if (item.file_path) {
      await supabaseClient.storage.from(PLATFORM_STORAGE_BUCKET).remove([item.file_path]);
    }

    await loadDirectionMaterialsList();
  } catch (error) {
    console.error("Материалды жою қатесі:", error);
    customAlert("Материалды жою мүмкін болмады. " + (error.message || error));
  }
}

async function openMaterialById(id) {
  const item = currentDirectionMaterials.find(m => String(m.id) === String(id));
  if (!item) return;
  const isVideoFile = currentMaterialsView?.section === "videos" && item.material_type === "file";
  try {
    if (item.url) { window.open(item.url, "_blank", "noopener,noreferrer"); return; }
    if (item.file_path) {
      // Открываем вкладку СРАЗУ (по клику), чтобы мобильный браузер не заблокировал её как всплывающее окно —
      // адрес подставляем уже после того, как получим ссылку.
      const newTab = window.open("", "_blank");
      const { data, error } = await supabaseClient.storage
        .from(PLATFORM_STORAGE_BUCKET)
        .createSignedUrl(item.file_path, 60 * 60);
      if (error) throw error;
      if (!data?.signedUrl) throw new Error("Файлға сілтеме алу мүмкін болмады.");

      if (isVideoFile) {
        // Бейне показываем во встроенном плеере без стандартной кнопки "Жүктеп алу" в меню плеера
        // и без контекстного меню — это не абсолютная защита от копирования (её не даёт ни один
        // сайт в браузере), но убирает очевидный способ скачать файл в один клик.
        const niceTitleV = (item.title || "Бейне").replace(/[<>]/g, "");
        const videoWrapperHtml = `<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${niceTitleV}</title>
<style>html,body{margin:0;padding:0;height:100%;background:#000;display:flex;align-items:center;justify-content:center;}video{max-width:100%;max-height:100%;}</style>
</head><body><video src="${data.signedUrl}" controls controlsList="nodownload noremoteplayback" disablePictureInPicture oncontextmenu="return false;" autoplay></video></body></html>`;
        if (newTab) { newTab.document.open(); newTab.document.write(videoWrapperHtml); newTab.document.close(); }
        else window.open(data.signedUrl, "_blank", "noopener,noreferrer");
        return;
      }

      // Показываем файл в собственной обёртке — тогда во вкладке видно нормальное
      // название материала, а не служебное имя файла в хранилище (там оно всегда
      // с случайным кодом впереди, чтобы файлы с одинаковыми именами не перезаписывали друг друга).
      // На телефоне эту рамку не используем — там она мешает нормально листать
      // многостраничный PDF (виден только первый лист), поэтому там просто
      // открываем файл напрямую — родной просмотрщик телефона листает его правильно.
      const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobileDevice) {
        if (newTab) newTab.location.href = data.signedUrl;
        else window.open(data.signedUrl, "_blank", "noopener,noreferrer");
        return;
      }

      const niceTitle = (item.title || "Материал").replace(/[<>]/g, "");
      const wrapperHtml = `<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<title>${niceTitle}</title>
<style>html,body{margin:0;padding:0;height:100%;background:#525659;}iframe{width:100%;height:100%;border:0;display:block;}</style>
</head><body><iframe src="${data.signedUrl}"></iframe></body></html>`;

      if (newTab) {
        newTab.document.open();
        newTab.document.write(wrapperHtml);
        newTab.document.close();
      } else {
        window.open(data.signedUrl, "_blank", "noopener,noreferrer");
      }
    }
  } catch (error) {
    console.error("Материалды ашу қатесі:", error);
    customAlert("Материалды ашу мүмкін болмады. " + (error.message || error));
  }
}

function showMaterialManager(section, direction, title) {
  const old = document.getElementById("materialManager");
  if (old) old.remove();

  materialManagerState = { section, direction, title };
  const isVideo = section === "videos";
  const accept = isVideo ? "video/*,.mp4,.webm,.mov,.m4v" : ".pdf,.doc,.docx";

  const box = document.createElement("div");
  box.id = "materialManager";
  box.innerHTML = `
    <div class="material-manager-overlay">
      <div class="material-manager">
        <button class="material-manager-close" onclick="document.getElementById('materialManager').remove()">×</button>
        <h2>${escapeHtml(title)}</h2>

        <label class="material-manager-label">Сілтеме кірістіру</label>
        <input id="materialUrlInput" class="material-manager-input" type="url" placeholder="https://...">
        <button id="saveMaterialUrlButton" class="material-manager-button" onclick="savePlatformMaterialUrl()">🔗 Сілтемені сақтау</button>

        <div class="material-manager-or">или</div>

        <label class="material-manager-label">Файл жүктеу</label>
        <input id="materialFileInput" class="material-manager-input" type="file" accept="${accept}">
        <button id="uploadMaterialFileButton" class="material-manager-button" onclick="uploadPlatformMaterialFile()">📁 Файл жүктеу</button>

        <div class="material-manager-hint">
          ${isVideo
            ? "Бейне үшін сілтеме көрсетуге (мысалы, YouTube) немесе бейнефайл жүктеуге болады."
            : "Құжатқа сілтеме көрсетуге немесе PDF/DOC/DOCX жүктеуге болады."}
        </div>

        <div id="materialManagerStatus" class="material-manager-status"></div>
      </div>
    </div>`;
  document.body.appendChild(box);
}

function setMaterialManagerStatus(text, type) {
  const box = document.getElementById("materialManagerStatus");
  if (!box) return;
  box.className = "material-manager-status " + (type || "");
  box.textContent = text || "";
}
function setMaterialManagerBusy(busy) {
  const saveButton = document.getElementById("saveMaterialUrlButton");
  const uploadButton = document.getElementById("uploadMaterialFileButton");
  if (saveButton) saveButton.disabled = busy;
  if (uploadButton) uploadButton.disabled = busy;
}

async function savePlatformMaterialUrl() {
  if (!window.currentUserIsManager) return;
  const { section, direction } = materialManagerState;
  const input = document.getElementById("materialUrlInput");
  const url = input?.value.trim() || "";

  if (!url) { setMaterialManagerStatus("Вставьте ссылку.", "error"); return; }
  try { new URL(url); } catch (_) {
    setMaterialManagerStatus("https:// немесе http://-дан басталатын дұрыс сілтеме енгізіңіз", "error");
    return;
  }

  setMaterialManagerBusy(true);
  setMaterialManagerStatus("Сілтемені сақтап жатырмын...", "");

  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) throw new Error("Сессия пользователя не найдена.");

    const { error } = await supabaseClient.from(PLATFORM_MATERIALS_TABLE).insert({
      section, direction, material_type: "link", url, file_path: null, created_by: session.user.id
    });
    if (error) throw error;

    setMaterialManagerStatus("Сілтеме сохранена.", "ok");
    await loadDirectionMaterialsList();
    setTimeout(() => document.getElementById("materialManager")?.remove(), 700);
  } catch (error) {
    console.error("Ошибка сохранения ссылки:", error);
    setMaterialManagerStatus("Не удалось сохранить ссылку: " + (error.message || error), "error");
  } finally {
    setMaterialManagerBusy(false);
  }
}

async function uploadPlatformMaterialFile() {
  if (!window.currentUserIsManager) return;
  const { section, direction } = materialManagerState;
  const input = document.getElementById("materialFileInput");
  const file = input?.files?.[0];

  if (!file) { setMaterialManagerStatus("Алдымен файлды таңдаңыз.", "error"); return; }

  const maxSize = section === "videos" ? 500 * 1024 * 1024 : 100 * 1024 * 1024;
  if (file.size > maxSize) {
    setMaterialManagerStatus(
      section === "videos" ? "Бейне тым үлкен (максимум 500 МБ)." : "Файл тым үлкен (максимум 100 МБ).",
      "error"
    );
    return;
  }

  setMaterialManagerBusy(true);
  setMaterialManagerStatus("Файл жүктеп жатырмын...", "");

  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) throw new Error("Сессия пользователя не найдена.");

    const safeName = file.name.normalize("NFKD").replace(/[^a-zA-Z0-9._-]+/g, "_").replace(/^_+|_+$/g, "") || "file";
    const unique = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + "_" + Math.random().toString(36).slice(2);
    const path = `${section}/${direction}/${unique}_${safeName}`;

    const { error: uploadError } = await supabaseClient.storage
      .from(PLATFORM_STORAGE_BUCKET)
      .upload(path, file, { cacheControl: "3600", upsert: false });
    if (uploadError) throw uploadError;

    setMaterialManagerStatus("Файл жүктелді. Жазбаны сақтап жатырмын...", "");

    const { error: insertError } = await supabaseClient.from(PLATFORM_MATERIALS_TABLE).insert({
      section, direction, material_type: "file", url: null, file_path: path, title: file.name, created_by: session.user.id
    });

    if (insertError) {
      await supabaseClient.storage.from(PLATFORM_STORAGE_BUCKET).remove([path]);
      throw insertError;
    }

    setMaterialManagerStatus("Файл сәтті сақталды.", "ok");
    await loadDirectionMaterialsList();
    setTimeout(() => document.getElementById("materialManager")?.remove(), 700);
  } catch (error) {
    console.error("Ошибка загрузки файла:", error);
    setMaterialManagerStatus("Не удалось загрузить файл: " + (error.message || error), "error");
  } finally {
    setMaterialManagerBusy(false);
  }
}

async function loadLibraryLinksList() {
  const box = document.getElementById("libraryListBox");
  if (!box) return;

    const { data, error } = await supabaseClient
      .from(LIBRARY_LINKS_TABLE)
      .select("id, title, url, created_at")
      .order("created_at", { ascending: true });
    if (error) throw error;

    currentLibraryLinks = data || [];
    const isAdmin = isRealAdminUser();

    box.innerHTML = currentLibraryLinks.map(function (item) {
      const hasUrl = !!item.url;
      return `
        <div class="material-row">
          <div class="material-row-icon">📚</div>
          <div class="material-row-body">
            <div class="material-row-title">${escapeHtml(item.title || "Кітапхана")}</div>
            <div class="material-row-meta">${hasUrl ? escapeHtml(item.url) : "Сілтеме әлі қосылмаған"}</div>

function openLibraryLink(id) {

function showLibraryLinkManager(id, title, existingUrl) {
  if (!isRealAdminUser()) return;

  box.id = "libraryLinkManager";

function setLibraryLinkManagerStatus(text, type) {
  const box = document.getElementById("libraryLinkManagerStatus");
  if (!box) return;
  box.className = "material-manager-status " + (type || "");
  box.textContent = text || "";
}

async function saveLibraryLink(id) {
  console.log("saveLibraryLink called", id, "isAdmin:", isRealAdminUser(), "role:", window.currentUserRole);
  if (!isRealAdminUser()) {
    setLibraryLinkManagerStatus("Только әкімші может редактировать библиотеку.", "error");
    return;
  }
  const urlInput = document.getElementById("libraryLinkUrlInput");
  const url = urlInput?.value.trim() || "";

  if (!url) { setLibraryLinkManagerStatus("Вставьте ссылку.", "error"); return; }
  try { new URL(url); } catch (_) {
    setLibraryLinkManagerStatus("https:// немесе http://-дан басталатын дұрыс сілтеме енгізіңіз", "error");
    return;
  }

  const saveButton = document.getElementById("saveLibraryLinkButton");
  if (saveButton) saveButton.disabled = true;
  setLibraryLinkManagerStatus("Сілтемені сақтап жатырмын...", "");

  try {
    const { data, error } = await supabaseClient.from(LIBRARY_LINKS_TABLE).update({ url }).eq("id", id).select();
    if (error) throw error;
    if (!data || !data.length) throw new Error("Запись не найдена или нет прав на изменение.");

    setLibraryLinkManagerStatus("Сілтеме сохранена.", "ok");
    await loadLibraryLinksList();
    setTimeout(() => document.getElementById("libraryLinkManager")?.remove(), 700);
  } catch (error) {
    console.error("Ошибка сохранения ссылки:", error);
    setLibraryLinkManagerStatus("Не удалось сохранить ссылку: " + (error.message || error), "error");
  } finally {
    if (saveButton) saveButton.disabled = false;
  }
}

const DIRECTION_ORDER = ["adult", "child", "compatibility"];

function paginatedTableHtml(containerId, headerHtml, rowsHtmlArray, pageSize) {
  pageSize = pageSize || 15;
  window["__paginatedRows_" + containerId] = rowsHtmlArray;
  return renderPaginatedPage(containerId, headerHtml, 1, pageSize);
}

function renderPaginatedPage(containerId, headerHtml, page, pageSize) {
  const rows = window["__paginatedRows_" + containerId] || [];
  if (!rows.length) return `<div class="empty-table">Әзірге бос.</div>`;
  const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
  page = Math.min(Math.max(1, page), totalPages);
  const start = (page - 1) * pageSize;
  const pageRows = rows.slice(start, start + pageSize);
  const pagerHtml = totalPages > 1 ? `<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px;">
    ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `<button type="button" onclick='setPaginatedPage(${JSON.stringify(containerId)}, ${JSON.stringify(headerHtml)}, ${p}, ${pageSize})' style="padding:6px 12px;border-radius:8px;border:1px solid ${p === page ? "#f6d66c" : "rgba(225,180,52,.4)"};background:${p === page ? "linear-gradient(90deg,#3c8783,#2f6d6a)" : "transparent"};color:#f5d46b;cursor:pointer;font-size:13px;">${p}</button>`).join("")}
  </div>` : "";
  return `<div style="overflow-x:auto;"><table class="data-table">${headerHtml}<tbody>${pageRows.join("")}</tbody></table></div>${pagerHtml}`;
}

function setPaginatedPage(containerId, headerHtml, page, pageSize) {
  const el = document.getElementById(containerId);
  if (el) el.innerHTML = renderPaginatedPage(containerId, headerHtml, page, pageSize);
}

function calcStatsByDirection(rows) {
  const counts = Object.fromEntries(DIRECTION_ORDER.map((d) => [d, 0]));
  rows.forEach((r) => { if (counts[r.direction] !== undefined) counts[r.direction]++; });
  return `<div class="stats-grid">` +
    DIRECTION_ORDER.map((d) => `<div class="stat-card"><span>${escapeHtml(DIRECTION_NAMES[d] || d)}</span><strong>${counts[d]}</strong></div>`).join("") +
    `<div class="stat-card"><span>Всего</span><strong>${rows.length}</strong></div>` +
    `</div>`;
}

  if (!rows.length) return `<div class="empty-table">Әлі сақталған есептеулер жоқ.</div>`;
  const headerHtml = `<thead><tr>${showEmail ? "<th>Email</th>" : ""}<th>Күні мен уақыты</th><th>Бағыт</th><th>Клиент</th><th>Туған күні</th><th></th></tr></thead>`;
  const rowsHtml = rows.map(r => `
          <tr>
            ${showEmail ? `<td><a href="javascript:void(0)" style="color:#8a8098;text-decoration:underline;" onclick='showUserDetailModal(${JSON.stringify(r.user_id)})'>${escapeHtml(r._email || "—")}</a></td>` : ""}
            <td>${new Date(r.created_at).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" })}</td>
            <td>${escapeHtml(DIRECTION_NAMES[r.direction] || r.direction)}</td>

async function reopenCalculation(r) {
  window._skipHistorySave = true;
  try {
    await openCalculator(r.direction);
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    if (r.direction === "pythagoras") {
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v || ""; };
      set("pythLastName", r.last_name);
      set("pythFirstName", r.first_name);
      set("pythPatronymic", r.patronymic);
      set("pythAlphabet", r.alphabet || "russian");
      set("birthDate", r.birth_date);
      calculatePythagoras();
    } else if (r.direction === "compatibility") {
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v || ""; };
      set("birthDate1", r.birth_date);
      set("birthDate2", r.birth_date2);
      calculateCompatibility();
    } else {
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v || ""; };
      set("name", r.person_name);
      set("birthDate", r.birth_date);
      calculate(r.direction);
    }

    // Иәём результату отрисоваться и сразу запускаем скачивание — из истории
    // человек хочет именно скачать сохранённый расчёт, а не просто посмотреть его на экране.
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    await new Promise(resolve => setTimeout(resolve, 150));
    document.getElementById("calcDownloadBtn")?.click();
  } finally {
    window._skipHistorySave = false;
  }
}

async function applyTeacherCode() {
  const input = document.getElementById("studentTeacherCodeInput");
  const msg = document.getElementById("studentTeacherCodeMessage");
  const code = (input?.value || "").trim().toUpperCase();
  const setMsg = (text, ok) => { if (msg) { msg.textContent = text; msg.style.color = ok ? "#8fe3a1" : "#ff9d9d"; } };

  if (!code) { setMsg("Введите код.", false); return; }
  setMsg("Проверяю код...", true);

  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { setMsg("Аккаунтқа кіру керек.", false); return; }

    const { data: teachers, error: teachersError } = await supabaseClient.from("profiles").select("id").eq("role", "numerologist");
    if (teachersError) throw teachersError;
    const match = (teachers || []).find(t => t.id.slice(0, 8).toUpperCase() === code);
    if (!match) { setMsg("Мұндай коды бар Teacher табылмады. Кодты тексеріңіз.", false); return; }

    const { error: updateError } = await supabaseClient.from("profiles").update({ teacher_id: match.id }).eq("id", session.user.id);
    if (updateError) throw updateError;

    setMsg("Готово, вы прикреплены к учителю.", true);
    const box = document.getElementById("studentTeacherCodeBox");
    if (box) setTimeout(() => { box.style.display = "none"; }, 1200);
  } catch (error) {
    console.error("Ошибка применения кода учителя:", error);
    setMsg("Не удалось применить код: " + (error.message || "Supabase қатесі"), false);
  }
}

async function saveTeacherSchoolName() {
  const input = document.getElementById("teacherSchoolNameInput");
  const msg = document.getElementById("teacherSchoolNameMessage");
  const name = (input?.value || "").trim();
  const setMsg = (text, ok) => { if (msg) { msg.textContent = text; msg.style.color = ok ? "#8fe3a1" : "#ff9d9d"; } };

  if (!name) { setMsg("Введите название школы.", false); return; }
  setMsg("Сохраняю...", true);

  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    const { data: existing } = await supabaseClient.from("schools").select("id").eq("owner_id", session.user.id).maybeSingle();

    let schoolId = existing?.id;
    if (existing) {
      const { error } = await supabaseClient.from("schools").update({ name }).eq("id", existing.id);
      if (error) throw error;
    } else {
      const { data: created, error } = await supabaseClient.from("schools").insert({ owner_id: session.user.id, name }).select("id").single();
      if (error) throw error;
      schoolId = created.id;
    }

    await supabaseClient.from("profiles").update({ school_id: schoolId }).eq("id", session.user.id);
    setMsg("Сохранено.", true);
  } catch (error) {
    console.error("Ошибка сохранения школы:", error);
    setMsg("Не удалось сохранить: " + (error.message || error), false);
  }
}

let adminUsersFilterTeacher = null; // { id, name } — admin drilled into one numerologist's students

function roleLabel(role) {
  const labels = { student: "Student", numerologist: "Teacher", admin: "Admin" };
  return labels[String(role || "student").trim().toLowerCase()] || (role || "Student");
}

function statusLabel(status) {
  const labels = { active: "Белсенді", deleted: "Жойылды" };
  return labels[String(status || "active").trim().toLowerCase()] || (status || "Белсенді");
}

async function loadAdminUsers() {
  const box = document.getElementById("adminUsersTable");
  const accessSelect = document.getElementById("accessUserSelect");
  const roleSelect = document.getElementById("roleUserSelect");
  const attachStudentSelect = document.getElementById("attachStudentSelect");
  const attachTeacherSelect = document.getElementById("attachTeacherSelect");
  if (!box) return;
  box.innerHTML = '<div class="empty-table">Жүктелуде...</div>';

  const isRealAdmin = window.currentUserRole === "admin";
  const { data: { session } } = await supabaseClient.auth.getSession();

  let query = supabaseClient
    .from("profiles")
    .select("id, first_name, last_name, middle_name, email, phone, role, status, teacher_id, created_at, restored_at")
    .or("status.neq.deleted,status.is.null")
    .order("last_name", { ascending: true });

  if (!isRealAdmin) query = query.eq("teacher_id", session.user.id);
  else if (adminUsersFilterTeacher) query = query.eq("teacher_id", adminUsersFilterTeacher.id);

  const { data, error } = await query;

  if (error) {
    console.error("Пайдаланушыларды жүктеу қатесі:", error);
    box.innerHTML = '<div class="empty-table">Пайдаланушыларды жүктеу мүмкін болмады.</div>';
    return;
  }

  const users = data || [];
  const nameOf = (u) => [u.last_name, u.first_name, u.middle_name].filter(Boolean).join(" ") || u.email || "Пайдаланушы";

  // Проверяем реальный статус доступа (истёк / активен / вообще не выдавался) для каждого пользователя одним запросом.
  const accessByUser = {};
  if (users.length) {
    const { data: periods } = await supabaseClient
      .from("access_periods")
      .select("profile_id, status, ends_at, is_unlimited, payment_status, starts_at, created_at")
      .in("profile_id", users.map(u => u.id))
      .order("created_at", { ascending: false });
    (periods || []).forEach(function (p) {
      if (!accessByUser[p.profile_id]) accessByUser[p.profile_id] = p; // первый попавшийся — самый свежий, т.к. отсортировано по starts_at desc
    });
  }
  function accessBadge(user) {
    if (user.role !== "student" && user.role !== "numerologist") return "";
    const latest = accessByUser[user.id];
    if (!latest) return `<div style="font-size:11px;color:#8a8098;margin-top:3px;">Қолжетімділік берілмеген</div>`;
    if (hasActivePlatformAccess(latest)) return `<div style="font-size:11px;color:#8fd18f;margin-top:3px;">Қолжетімділік активен${latest.is_unlimited ? "" : (latest.ends_at ? " до " + new Date(latest.ends_at).toLocaleDateString("ru-RU") : "")}</div>`;
    return `<div style="font-size:11px;color:#e8a94e;margin-top:3px;">Қолжетімділік мерзімі өтті <button type="button" onclick='scrollToGrantAccess(${JSON.stringify(user.id)})' style="margin-left:4px;padding:2px 8px;font-size:11px;border-radius:8px;border:1px solid #d7aa31;background:linear-gradient(90deg,#3c8783,#2f6d6a);color:#f8d96d;cursor:pointer;">Жаңарту</button></div>`;
  }

  // Селекты доступа/ролей всегда строятся из ПОЛНОГО списка, не из отфильтрованного вида.
  if (isRealAdmin && adminUsersFilterTeacher) {
    const { data: allData } = await supabaseClient
      .from("profiles")
      .select("id, first_name, last_name, middle_name, email, phone, role, status, teacher_id, created_at")
      .order("last_name", { ascending: true });
    fillAccessSelects(allData || [], nameOf);
  } else {
    fillAccessSelects(users, nameOf);
  }

  function fillAccessSelects(list, nameFn) {
    const fillSelect = (el, opts, emptyLabel) => {
      if (!el) return;
      const prevValue = el.value;
      el.innerHTML = opts.length
        ? opts.map(u => `<option value="${escapeHtml(u.id)}">${escapeHtml(nameFn(u))}${u.email ? " — " + escapeHtml(u.email) : ""}</option>`).join("")
        : `<option value="">${emptyLabel}</option>`;
      if (prevValue && opts.some(u => u.id === prevValue)) el.value = prevValue;
    };
    fillSelect(accessSelect, list.filter(u => u.role !== "admin"), "Пайдаланушылар жоқ");
    if (isRealAdmin) {
      fillSelect(roleSelect, list.filter(u => u.role !== "admin"), "Пайдаланушылар жоқ");
      fillSelect(attachStudentSelect, list.filter(u => (u.role || "student") !== "numerologist" && (u.role || "student") !== "admin"), "Оқушылар жоқ");
      fillSelect(attachTeacherSelect, list.filter(u => u.role === "numerologist"), "Ұстаздар жоқ");
    }
    loadScopeForSelectedUser();
  }

  const backLink = (isRealAdmin && adminUsersFilterTeacher)
    ? `<button class="back-link" onclick='closeNumerologistDrilldown()'>← Барлық пайдаланушылар</button>`
    : "";

  if (!users.length) {
    box.innerHTML = backLink + `<div class="empty-table">${
      adminUsersFilterTeacher
        ? "У этого учителя пока нет оқушылар."
        : (isRealAdmin ? "Тіркелгенных пользователей пока нет." : "У вас пока нет оқушылар. Попросите әкімшіа прикрепить их к вам.")
    }</div>`;
    return;
  }

  const teacherName = (teacherId) => {
    if (!teacherId) return "Не назначен";
    const t = users.find(u => u.id === teacherId);
    return t ? nameOf(t) : "—";
  };

  const teachersSorted = users
    .filter(u => u.role === "numerologist")
    .slice()
    .sort((a, b) => new Date(a.created_at || 0) - new Date(b.created_at || 0));
  const teacherNumber = {};
  teachersSorted.forEach((t, i) => { teacherNumber[t.id] = i + 1; });

  box.innerHTML = backLink + `
    <div style="overflow-x:auto;">
    <table class="data-table">
      <thead><tr><th>Пайдаланушы</th><th>Email</th><th>Телефон</th><th>Рөл</th><th>Тіркелген</th>${isRealAdmin ? "<th>Ұстаз коды</th><th>Ұстазға бекітілген</th>" : ""}<th>Мәртебе</th><th></th></tr></thead>
      <tbody>
        ${users.map(function (user) {
          const codeCell = user.role === "numerologist" ? `<td style="font-family:'Courier New',monospace;letter-spacing:1px;color:#f6d66c;font-weight:bold;">${escapeHtml(user.id.slice(0, 8).toUpperCase())}</td>` : (user.role === "admin" ? `<td style="color:#f6d66c;font-weight:bold;">Admin</td>` : `<td>—</td>`);
          return `<tr>
            <td>${isRealAdmin ? `<a href="javascript:void(0)" style="color:#f5f0df;text-decoration:underline;" onclick='showUserDetailModal(${JSON.stringify(user.id)})'>${escapeHtml(nameOf(user))}</a>` : escapeHtml(nameOf(user))}</td>
            <td>${escapeHtml(user.email || "—")}</td>
            <td>${escapeHtml(user.phone || "—")}</td>
            <td>${escapeHtml(roleLabel(user.role))}</td>
            <td>${user.created_at ? new Date(user.created_at).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "—"}</td>
            ${isRealAdmin ? `${codeCell}<td>${user.role === "student" ? escapeHtml(teacherName(user.teacher_id)) : "—"}</td>` : ""}
            <td>${statusLabel(user.status)}${user.restored_at ? ` <span style="color:#8fd18f;font-size:11px;">(восстановлен ${new Date(user.restored_at).toLocaleDateString("ru-RU")})</span>` : ""}${accessBadge(user)}</td>
            ${user.role === "admin" ? (isRealAdmin ? "<td>—</td>" : "") : `<td><button type="button" class="material-manager-button" style="width:auto;padding:6px 10px;font-size:12px;" onclick='deleteUserAccount(${JSON.stringify(user.id)}, ${JSON.stringify(nameOf(user))})'>Удалить</button></td>`}
          </tr>`;
        }).join("")}
      </tbody>
    </table>
    </div>`;

  loadDeletedUsersLog();
}

  showModal(`

async function confirmDeleteUser(userId) {
  const btn = document.getElementById("confirmDeleteBtn");
  const msg = document.getElementById("deleteModalMessage");
  if (btn) { btn.disabled = true; btn.textContent = "Жойып жатырмын..."; }
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    const resp = await fetch("https://skvprhqsxnlacshucncq.supabase.co/functions/v1/delete-user", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + session.access_token },
      body: JSON.stringify({ userId, action: "delete" }),
    });
    const result = await resp.json();
    if (!resp.ok || result.error) throw new Error(result.error || ("Сервер қате қайтарды " + resp.status));
    closeModal();
    loadAdminUsers();
  } catch (error) {
    console.error("Пайдаланушыны жою қатесі:", error);
    if (msg) { msg.textContent = "Аккаунтты жою мүмкін болмады: " + (error.message || error); msg.style.color = "#ff9d9d"; }
    if (btn) { btn.disabled = false; btn.textContent = "Удалить"; }
  }
}

async function loadDeletedUsersLog() {
  const box = document.getElementById("deletedUsersTable");
  if (!box) return;
  const isRealAdmin = window.currentUserRole === "admin";
  const { data: { session } } = await supabaseClient.auth.getSession();

  let query = supabaseClient
    .from("profiles")
    .select("id, first_name, last_name, email, role, created_at, deleted_at, deleted_by, teacher_id, status")
    .in("status", ["deleted", "active"])
    .order("deleted_at", { ascending: false });
  if (!isRealAdmin) query = query.eq("teacher_id", session.user.id);

  const { data, error } = await query;
  if (error) { box.innerHTML = `<div class="empty-table">Журналды жүктеу мүмкін болмады.</div>`; return; }

  const allProfiles = data || [];
  const deletedProfiles = allProfiles.filter(p => p.status === "deleted");
  const activeCandidates = allProfiles.filter(p => p.status !== "deleted" && (p.role === "student" || p.role === "numerologist"));

  // Подтягиваем имена тех, кто удалял (админ или конкретный учитель), одним запросом.
  const deleterIds = [...new Set(deletedProfiles.map(r => r.deleted_by).filter(Boolean))];
  const deleterNameById = {};
  if (deleterIds.length) {
    const { data: deleters } = await supabaseClient.from("profiles").select("id, role, first_name, last_name, email").in("id", deleterIds);
    (deleters || []).forEach(d => {
      deleterNameById[d.id] = d.role === "admin" ? "Admin" : ("Teacher: " + ([d.last_name, d.first_name].filter(Boolean).join(" ") || d.email));
    });
  }

  const restorable = deletedProfiles.map(r => ({
    id: r.id, email: r.email, name: [r.last_name, r.first_name].filter(Boolean).join(" "),
    role: r.role, registered_at: r.created_at, sortDate: r.deleted_at,
    statusLabel: "Жойылды " + (r.deleted_at ? new Date(r.deleted_at).toLocaleDateString("ru-RU") : ""),
    accessLabel: deleterNameById[r.deleted_by] || "—",
    action: `<button type="button" class="material-manager-button" style="width:auto;padding:6px 10px;font-size:12px;" onclick='restoreUserAccount(${JSON.stringify(r.id)}, ${JSON.stringify([r.last_name, r.first_name].filter(Boolean).join(" ") || r.email)})'>Қалпына келтіру</button>`,
  }));

  // Истёкший срок доступа — не удаление, но тоже требует внимания: показываем в том же журнале отдельной пометкой.
  let expired = [];
  if (activeCandidates.length) {
    const { data: periods } = await supabaseClient
      .from("access_periods")
      .select("profile_id, status, ends_at, starts_at, is_unlimited, payment_status, created_at")
      .in("profile_id", activeCandidates.map(p => p.id))
      .order("created_at", { ascending: false });
    const latestByUser = {};
    (periods || []).forEach(p => { if (!latestByUser[p.profile_id]) latestByUser[p.profile_id] = p; });
    expired = activeCandidates
      .map(p => ({ profile: p, period: latestByUser[p.id] }))
      .filter(x => x.period && !x.period.is_unlimited && !hasActivePlatformAccess(x.period))
      .map(({ profile: r, period }) => {
        const days = Math.max(1, Math.round((new Date(period.ends_at) - new Date(period.starts_at)) / 86400000));
        const durationLabel = days >= 28 ? Math.round(days / 30) + " ай" : days + " күн.";
        return {
          id: r.id, email: r.email, name: [r.last_name, r.first_name].filter(Boolean).join(" "),
          role: r.role, registered_at: r.created_at, sortDate: period.ends_at,
          statusLabel: "Истёк срок " + new Date(period.ends_at).toLocaleDateString("ru-RU"),
          accessLabel: `Истёк срок (${durationLabel})`,
          action: `<button type="button" class="material-manager-button" style="width:auto;padding:6px 10px;font-size:12px;" onclick='scrollToGrantAccess(${JSON.stringify(r.id)})'>Жаңарту</button>`,
        };
      });
  }

  let legacy = [];
  if (isRealAdmin) {
    // Старые аккаунты, удалённые ещё до того, как удаление стало обратимым — они удалены
    // окончательно и восстановлению не подлежат, но остаются в журнале как история.
    const { data: legacyData } = await supabaseClient
      .from("deleted_users_log")
      .select("email, first_name, last_name, role, registered_at, deleted_at, deleted_by")
      .order("deleted_at", { ascending: false });
    const legacyDeleterIds = [...new Set((legacyData || []).map(r => r.deleted_by).filter(Boolean).filter(id => !deleterNameById[id]))];
    if (legacyDeleterIds.length) {
      const { data: moreDeleters } = await supabaseClient.from("profiles").select("id, role, first_name, last_name, email").in("id", legacyDeleterIds);
      (moreDeleters || []).forEach(d => { deleterNameById[d.id] = d.role === "admin" ? "Admin" : ("Teacher: " + ([d.last_name, d.first_name].filter(Boolean).join(" ") || d.email)); });
    }
    legacy = (legacyData || []).map(r => ({
      id: null, email: r.email, name: [r.last_name, r.first_name].filter(Boolean).join(" "),
      role: r.role, registered_at: r.registered_at, sortDate: r.deleted_at,
      statusLabel: "Жойылды " + (r.deleted_at ? new Date(r.deleted_at).toLocaleDateString("ru-RU") : ""),
      accessLabel: deleterNameById[r.deleted_by] || "—",
      action: `<span style="color:#8a8098;font-size:12px;">Мүлдем жойылды</span>`,
    }));
  }

  const rows = [...restorable, ...expired, ...legacy].sort((a, b) => new Date(b.sortDate) - new Date(a.sortDate));
  if (!rows.length) { box.innerHTML = `<div class="empty-table">Әлі ешкім жойылған жоқ және ешкімнің мерзімі өтпеген.</div>`; return; }

  const headerHtml = `<thead><tr><th>Email</th><th>Аты</th><th>Рөл</th><th>Тіркелген</th><th>Мәртебе</th><th>Қолжетімділік</th><th>Әрекет</th></tr></thead>`;
  const rowsHtml = rows.map(r => `
          <tr>
            <td>${r.id ? `<a href="javascript:void(0)" style="color:#8a8098;text-decoration:underline;" onclick='showUserDetailModal(${JSON.stringify(r.id)})'>${escapeHtml(r.email || "—")}</a>` : escapeHtml(r.email || "—")}</td>
            <td>${escapeHtml(r.name || "—")}</td>
            <td>${escapeHtml(roleLabel(r.role))}</td>
            <td>${r.registered_at ? new Date(r.registered_at).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "—"}</td>
            <td>${escapeHtml(r.statusLabel)}</td>
            <td>${escapeHtml(r.accessLabel)}</td>
            <td>${r.action}</td>
          </tr>`);
  box.innerHTML = paginatedTableHtml("deletedUsersTable", headerHtml, rowsHtml, 15);
}

async function confirmRestoreUser(userId) {
  const btn = document.getElementById("confirmRestoreBtn");
  const msg = document.getElementById("restoreModalMessage");
  if (btn) { btn.disabled = true; btn.textContent = "Қалпына келтіріп жатырмын..."; }
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    const resp = await fetch("https://skvprhqsxnlacshucncq.supabase.co/functions/v1/delete-user", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + session.access_token },
      body: JSON.stringify({ userId, action: "restore" }),
    });
    const result = await resp.json();
    if (!resp.ok || result.error) throw new Error(result.error || ("Сервер қате қайтарды " + resp.status));

    loadAdminUsers();
  } catch (error) {
    console.error("Пайдаланушыны қалпына келтіру қатесі:", error);
    if (msg) { msg.textContent = "Аккаунтты қалпына келтіру мүмкін болмады: " + (error.message || error); msg.style.color = "#ff9d9d"; }

  }
}

const TERM_OPTIONS = [
  { value: "unlimited", label: "Бессрочно" },
  { value: "30", label: "1 месяц" },
  { value: "90", label: "3 месяца" },
  { value: "180", label: "6 месяцев" },
  { value: "365", label: "12 месяцев" }
];

function termSelectHtml(extraClass, attrs) {
  return `<select class="material-manager-input ${extraClass || ""}" ${attrs || ""} style="margin-bottom:0;padding:8px 10px;width:auto;">
    ${TERM_OPTIONS.map(t => `<option value="${t.value}">${t.label}</option>`).join("")}
  </select>`;
}

function computeEndsAt(termValue) {
  if (termValue === "unlimited") return { unlimited: true, ends_at: null };
  const days = Number(termValue);
  const d = new Date(Date.now() + days * 24 * 60 * 60 * 1000);
  return { unlimited: false, ends_at: d.toISOString() };
}

function toggleScopeAll(checked) {
  document.querySelectorAll(".scope-cell, .scope-flag").forEach(function (el) { el.checked = checked; });
}

function fillScopeCheckboxes(scope) {
  scope = scope || {};
  document.querySelectorAll(".scope-cell").forEach(function (el) {
    const dir = el.dataset.direction, type = el.dataset.type;
    const item = (scope[dir] || {})[type];
    el.checked = !!(item && item.granted);
    const termSelect = document.querySelector(`.scope-term-row[data-direction="${dir}"]`);
    if (termSelect && item && item.granted) termSelect.value = item.unlimited ? "unlimited" : (item.ends_at ? String(Math.max(1, Math.round((new Date(item.ends_at) - new Date()) / 86400000))) : "unlimited");
  });
  const setFlag = function (checkboxId, termId, item) {
    const cb = document.getElementById(checkboxId);
    const term = document.getElementById(termId);
    if (cb) cb.checked = !!(item && item.granted);
    if (term && item && item.granted) term.value = item.unlimited ? "unlimited" : (item.ends_at ? String(Math.max(1, Math.round((new Date(item.ends_at) - new Date()) / 86400000))) : "unlimited");
  };
  setFlag("scopeLibrary", "scopeLibraryTerm", scope.library);
  setFlag("scopeMyCalc", "scopeMyCalcTerm", scope.my_calculations);
  setFlag("scopeAccess", "scopeAccessTerm", scope.access);
  setFlag("scopeStatistics", "scopeStatisticsTerm", scope.statistics);
  const allBox = document.getElementById("scopeSelectAll");
  if (allBox) allBox.checked = Array.from(document.querySelectorAll(".scope-cell, .scope-flag")).every(el => el.checked);
}

async function loadScopeForSelectedUser() {
  const userId = document.getElementById("accessUserSelect")?.value || "";
  document.querySelectorAll(".scope-cell, .scope-flag").forEach(function (el) { el.checked = false; });
  if (!userId) return;
  const { data, error } = await supabaseClient
    .from("access_periods")
    .select("status, payment_status, starts_at, ends_at, is_unlimited, granted_scope, created_at")
    .eq("profile_id", userId)
    .order("created_at", { ascending: false })
    .limit(10);
  if (error) { console.error("Ошибка загрузки текущего доступа:", error); return; }
  const activePeriods = (data || []).filter(hasActivePlatformAccess);
  fillScopeCheckboxes(activePeriods[0]?.granted_scope || {});
}

function collectScope() {
  const scope = {};
  DIRECTIONS.forEach(function (d) { scope[d.key] = {}; });

  document.querySelectorAll(".scope-cell").forEach(function (el) {
    const dir = el.dataset.direction, type = el.dataset.type;
    if (!el.checked) { scope[dir][type] = { granted: false }; return; }
    const termSelect = document.querySelector(`.scope-term-row[data-direction="${dir}"]`);
    const term = termSelect ? termSelect.value : "unlimited";
    scope[dir][type] = Object.assign({ granted: true }, computeEndsAt(term));
  });

  const libChecked = document.getElementById("scopeLibrary")?.checked;
  const libTerm = document.getElementById("scopeLibraryTerm")?.value || "unlimited";
  scope.library = libChecked ? Object.assign({ granted: true }, computeEndsAt(libTerm)) : { granted: false };

  const calcChecked = document.getElementById("scopeMyCalc")?.checked;
  const calcTerm = document.getElementById("scopeMyCalcTerm")?.value || "unlimited";
  scope.my_calculations = calcChecked ? Object.assign({ granted: true }, computeEndsAt(calcTerm)) : { granted: false };

  const accessChecked = document.getElementById("scopeAccess")?.checked;
  const accessTerm = document.getElementById("scopeAccessTerm")?.value || "unlimited";
  scope.access = accessChecked ? Object.assign({ granted: true }, computeEndsAt(accessTerm)) : { granted: false };

  const statsChecked = document.getElementById("scopeStatistics")?.checked;
  const statsTerm = document.getElementById("scopeStatisticsTerm")?.value || "unlimited";
  scope.statistics = statsChecked ? Object.assign({ granted: true }, computeEndsAt(statsTerm)) : { granted: false };

  return scope;
}

function scopeHasAnything(scope) {
  return Object.keys(scope).some(function (key) {
    if (key === "library" || key === "my_calculations" || key === "access" || key === "statistics") return !!scope[key]?.granted;
    return Object.values(scope[key] || {}).some(function (item) { return item && item.granted; });
  });
}

async function grantPlatformAccess() {
  const userId = document.getElementById("accessUserSelect")?.value || "";
  const message = document.getElementById("accessAdminMessage");

  const setMsg = function (text, ok) {
    if (!message) return;
    message.textContent = text;
    message.style.color = ok ? "#8fe3a1" : "#ff9d9d";
  };

  if (!userId) { setMsg("Сначала выберите пользователя.", false); return; }

  const scope = collectScope();
  if (!scopeHasAnything(scope)) { setMsg("Отметьте хотя бы один пункт доступа.", false); return; }

  setMsg("Выдаю доступ...", true);

  const startsAt = new Date();

  const { error: closeError } = await supabaseClient
    .from("access_periods")
    .update({ status: "expired" })
    .eq("profile_id", userId)
    .eq("status", "active");
  if (closeError) console.warn("Ескі қолжетімділікті жабу мүмкін болмады:", closeError);

  // Общий срок записи считаем по факту выбранных галочек: если ХОТЯ БЫ ОДНА не бессрочная —
  // запись целиком считается срочной, и её датой окончания берём САМУЮ ПОЗДНЮЮ из выбранных сроков
  // (чтобы «Қолжетімділік мерзімі өтті» в общей таблице срабатывал только когда реально закончились ВСЕ пункты).
  let overallUnlimited = true;
  let overallEndsAt = null;
  Object.keys(scope).forEach(function (key) {
    const val = scope[key];
    const items = (val && typeof val.granted === "boolean") ? [val] : Object.values(val || {});
    items.forEach(function (item) {
      if (!item || !item.granted) return;
      if (item.unlimited) return;
      overallUnlimited = false;
      if (item.ends_at && (!overallEndsAt || new Date(item.ends_at) > new Date(overallEndsAt))) {
        overallEndsAt = item.ends_at;
      }
    });
  });

  // Мерзім хранится по каждому пункту внутри granted_scope,
  // общая запись access_periods дублирует самый долгий срок — для показа в общей таблице пользователей.
  const { error } = await supabaseClient.from("access_periods").insert({
    profile_id: userId,
    status: "active",
    payment_status: "paid",
    starts_at: startsAt.toISOString(),
    ends_at: overallUnlimited ? null : overallEndsAt,
    is_unlimited: overallUnlimited,
    granted_scope: scope
  });

  if (error) {
    console.error("Қолжетімділік беру қатесі:", error);
    setMsg("Қолжетімділік беру мүмкін болмады: " + (error.message || "Supabase қатесі"), false);
    return;
  }

  setMsg("Қолжетімділік сәтті берілді.", true);
  await loadAdminUsers();
}

      .from("test_attempts")
      .select("id, user_id, direction, score, total_questions, answers, completed_at")
      .order("completed_at", { ascending: false });
    if (!isRealAdmin) attemptsQuery = attemptsQuery.in("user_id", [...clientIds]);
    const { data: attempts } = await attemptsQuery;

    const attemptUserIds = [...new Set((attempts || []).map(a => a.user_id))];
    let testNameById = {};
    if (attemptUserIds.length) {
      const { data: attemptProfiles } = await supabaseClient.from("profiles").select("id, first_name, last_name, email").in("id", attemptUserIds);
      testNameById = Object.fromEntries((attemptProfiles || []).map((p) => [p.id, [p.last_name, p.first_name].filter(Boolean).join(" ") || p.email]));
    }
    window.__testAttempts = attempts || [];
    window.__testStatsNameById = testNameById;

    const filterSelect = document.getElementById("testStatsUserFilter");
    if (filterSelect) {
      const seen = new Set();
      const options = ["<option value=\"\">Все</option>"];
      (attempts || []).forEach(a => {
        if (seen.has(a.user_id)) return;
        seen.add(a.user_id);
        options.push(`<option value="${escapeHtml(a.user_id)}">${escapeHtml(testNameById[a.user_id] || a.user_id)}</option>`);
      });
      filterSelect.innerHTML = options.join("");
    }
    renderTestStatsTable();

    if (!isRealAdmin) return;

    // ---- У кого скоро заканчивается доступ ----
    const { data: periods } = await supabaseClient.from("access_periods").select("profile_id, granted_scope");
    const { data: allProfilesForNames } = await supabaseClient.from("profiles").select("id, first_name, last_name, email");
    const nameById = Object.fromEntries((allProfilesForNames || []).map((p) => [p.id, [p.last_name, p.first_name].filter(Boolean).join(" ") || p.email]));

    const in7days = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
    const expiringRows = [];
    function scanScopeForExpiry(scope, profileId, path) {
      if (!scope || typeof scope !== "object") return;
      if (scope.granted && scope.ends_at) {
        const endDate = new Date(scope.ends_at);
        if (endDate >= now && endDate <= in7days) {
          expiringRows.push({ profileId, label: path, endsAt: scope.ends_at });
        }
        return;
      }
      Object.keys(scope).forEach((key) => scanScopeForExpiry(scope[key], profileId, path ? path + " / " + key : key));
    }
    (periods || []).forEach((p) => scanScopeForExpiry(p.granted_scope, p.profile_id, ""));
    expiringRows.sort((a, b) => new Date(a.endsAt) - new Date(b.endsAt));

    document.getElementById("expiringSoonTable").innerHTML = expiringRows.length
      ? `<div style="overflow-x:auto;"><table class="data-table"><thead><tr><th>Пайдаланушы</th><th>Не аяқталады</th><th>Аяқталу күні</th></tr></thead><tbody>
          ${expiringRows.map(r => `<tr><td><a href="javascript:void(0)" style="color:#d7aa31;" onclick='showUserDetailModal(${JSON.stringify(r.profileId)})'>${escapeHtml(nameById[r.profileId] || r.profileId)}</a></td><td>${escapeHtml(r.label)}</td><td>${new Date(r.endsAt).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" })}</td></tr>`).join("")}
        </tbody></table></div>`
      : `<div class="empty-table">Алдағы 7 күнде ешнәрсе аяқталмайды.</div>`;

    // ---- Рейтинг учителей ----
    const { data: allProfilesFull } = await supabaseClient.from("profiles").select("id, first_name, last_name, email, role, teacher_id");
    const teachers = (allProfilesFull || []).filter((p) => p.role === "numerologist");
    const teacherCounts = teachers.map((t) => ({
      id: t.id,
      name: [t.last_name, t.first_name].filter(Boolean).join(" ") || t.email,
      count: (allProfilesFull || []).filter((p) => p.teacher_id === t.id).length,
    })).sort((a, b) => b.count - a.count);

    document.getElementById("teacherLeaderboardTable").innerHTML = teacherCounts.length
      ? `<div style="overflow-x:auto;"><table class="data-table"><thead><tr><th>Ұстаз</th><th>Оқушылар</th></tr></thead><tbody>
          ${teacherCounts.map(t => `<tr><td><a href="javascript:void(0)" style="color:#d7aa31;" onclick='showUserDetailModal(${JSON.stringify(t.id)})'>${escapeHtml(t.name)}</a></td><td>${t.count}</td></tr>`).join("")}
        </tbody></table></div>`
      : `<div class="empty-table">Әлі ұстаздар жоқ.</div>`;

  } catch (error) {
    console.error("Ошибка статистики:", error);
  }
}

function renderTestStatsTable() {
  const box = document.getElementById("testStatsTable");
  if (!box) return;
  const attempts = window.__testAttempts || [];
  const nameById = window.__testStatsNameById || {};
  const filterValue = document.getElementById("testStatsUserFilter")?.value || "";
  const rows = filterValue ? attempts.filter(a => a.user_id === filterValue) : attempts;

  box.innerHTML = rows.length
    ? `<div style="overflow-x:auto;"><table class="data-table"><thead><tr><th>Пайдаланушы</th><th>Бағыт</th><th>Нәтиже</th><th>Күні</th><th></th></tr></thead><tbody>
        ${rows.map(a => `<tr>
          <td><a href="javascript:void(0)" style="color:#d7aa31;" onclick='showUserDetailModal(${JSON.stringify(a.user_id)})'>${escapeHtml(nameById[a.user_id] || a.user_id)}</a></td>
          <td>${escapeHtml(DIRECTION_NAMES[a.direction] || a.direction)}</td>
          <td>${a.score} из ${a.total_questions}</td>
          <td>${new Date(a.completed_at).toLocaleDateString("ru-RU")}</td>
          <td><button type="button" class="material-manager-button" style="width:auto;padding:6px 10px;font-size:12px;" onclick='showTestAttemptDetail(${JSON.stringify(a.id)})'>Жауаптарды талдау</button></td>
        </tr>`).join("")}
      </tbody></table></div>`
    : `<div class="empty-table">Әлі ешкім тест тапсырған жоқ.</div>`;
}

async function showTestAttemptDetail(attemptId) {
  const attempt = (window.__testAttempts || []).find(a => a.id === attemptId);
  if (!attempt) return;

  showModal(`<h3 style="margin-top:0;color:#f6d66c;font-family:Georgia,serif;">Жауаптарды талдау</h3><div id="testDetailBody">Жүктелуде...</div>`);

  const { data: questions, error } = await supabaseClient
    .from("test_questions")
    .select("id, question_order, question_text, option_a, option_b, option_c, option_d, correct_option")
    .eq("direction", attempt.direction)
    .order("question_order", { ascending: true });

  const body = document.getElementById("testDetailBody");
  if (!body) return;
  if (error || !questions) { body.innerHTML = `<div class="empty-table">Сұрақтарды жүктеу мүмкін болмады.</div>`; return; }

  const optionLabel = (q, letter) => ({ a: q.option_a, b: q.option_b, c: q.option_c, d: q.option_d }[letter] || letter);

  body.innerHTML = `<div style="max-height:60vh;overflow-y:auto;">` + questions.map((q, i) => {
    const given = attempt.answers ? attempt.answers[q.id] : null;
    const isCorrect = given === q.correct_option;
    return `<div style="padding:10px 0;border-bottom:1px solid rgba(225,180,52,.18);">
      <div style="color:#f8e7a8;margin-bottom:6px;">${i + 1}. ${escapeHtml(q.question_text)}</div>
      <div style="font-size:13px;color:${isCorrect ? "#8fe3a1" : "#ff9d9d"};">
        ${isCorrect ? "✓ Ответил(а) верно" : "✗ Ответил(а): " + escapeHtml(given ? optionLabel(q, given) : "—")}
      </div>
      ${!isCorrect ? `<div style="font-size:13px;color:#8a8098;">Правильный ответ: ${escapeHtml(optionLabel(q, q.correct_option))}</div>` : ""}
    </div>`;
  }).join("") + `</div>`;
}

async function loginUser() {
  const email = document.getElementById("loginEmail")?.value.trim().toLowerCase();
  const password = document.getElementById("loginPassword")?.value || "";
  const errorBox = document.getElementById("loginError");
  if (errorBox) errorBox.textContent = "";

  if (!email || !password) { if (errorBox) errorBox.textContent = "Введите email и пароль."; return; }

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error || !data?.user) {
    if (errorBox) errorBox.textContent = "Email немесе құпия сөз қате.";

  }
  updateLastActivity();

function formatPhoneInput(el) {
  let digits = el.value.replace(/\D/g, "");
  digits = digits.slice(0, 15);
  el.value = digits ? "+" + digits : "";
}

async function registerUser() {
  const lastName = document.getElementById("registerLastName")?.value.trim() || "";
  const firstName = document.getElementById("registerFirstName")?.value.trim() || "";
  const middleName = document.getElementById("registerMiddleName")?.value.trim() || "";
  const phone = document.getElementById("registerPhone")?.value.trim() || "";
  const email = document.getElementById("registerEmail")?.value.trim().toLowerCase() || "";
  const password = document.getElementById("registerPassword")?.value || "";
  const password2 = document.getElementById("registerPassword2")?.value || "";
  const teacherCode = document.getElementById("registerTeacherCode")?.value.trim().toUpperCase() || "";
  const message = document.getElementById("registerMessage");

  const setMessage = (text, ok = false) => {
    if (!message) return;
    message.textContent = text;
    message.className = "auth-message " + (ok ? "success" : "error");
  };

  const nameRe = /^[A-Za-zА-Яа-яЁёӘәҒғҚқҮүҰұІіЖжҮүҺһ' -]{2,}$/;
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  const phoneRe = /^\+\d{8,15}$/;

  if (!lastName || !firstName || !middleName || !phone || !email || !password || !password2) {
    setMessage("Барлық міндетті өрістерді толтырыңыз: тегі, аты, әкесінің аты, телефон, email және құпия сөз.");
    return;
  }
  if (!nameRe.test(lastName)) { setMessage("Тегіңізді тексеріңіз — тек әріптер, кемінде 2 таңба."); return; }
  if (!nameRe.test(firstName)) { setMessage("Атыңызды тексеріңіз — тек әріптер, кемінде 2 таңба."); return; }
  if (!nameRe.test(middleName)) { setMessage("Әкесінің атын тексеріңіз — тек әріптер, кемінде 2 таңба."); return; }
  if (!phoneRe.test(phone)) { setMessage("Телефон нөмірін тексеріңіз — + белгісінен бастап, ел кодын және нөмірді толық, бос орынсыз және артық таңбаларсыз енгізіңіз, мысалы +77001234567."); return; }
  if (!emailRe.test(email)) { setMessage("Email тексеріңіз — дұрыс форматта көрсетіңіз."); return; }
  if (password.length < 6) { setMessage("Құпия сөз кемінде 6 таңбадан тұруы керек."); return; }
  if (password !== password2) { setMessage("Құпия сөздер сәйкес келмейді."); return; }

  setMessage("Аккаунт жасап жатырмын...", true);

  const { data, error } = await supabaseClient.auth.signUp({
    email, password,
    options: {
      data: { first_name: firstName, last_name: lastName, middle_name: middleName, phone, role: "student", status: "pending" },
      emailRedirectTo: window.location.origin + window.location.pathname
    }
  });

  if (error) { setMessage(error.message || "Пайдаланушыны тіркеу мүмкін болмады."); return; }

  let teacherIdFound = null;
  if (data?.user && teacherCode) {
    try {
      const { data: teachers } = await supabaseClient.from("profiles").select("id").eq("role", "numerologist");
      const match = (teachers || []).find(t => t.id.slice(0, 8).toUpperCase() === teacherCode);
      if (match) teacherIdFound = match.id;
    } catch (e) { console.warn("Ұстаз кодын тексеру мүмкін болмады:", e); }
  }

  if (data?.user) {
    const { error: profileError } = await supabaseClient.from("profiles").upsert({
      id: data.user.id, first_name: firstName, last_name: lastName, middle_name: middleName,
      email, phone, role: "student", status: "pending",
      ...(teacherIdFound ? { teacher_id: teacherIdFound } : {})
    }, { onConflict: "id" });
    if (profileError) console.warn("Профиль не обновлён из браузера:", profileError);
  }

  if (data?.session) {
    setMessage("Тіркелу завершена. Сейчас откроется платформа.", true);
    setTimeout(() => location.reload(), 900);
  } else {
    setMessage("Тіркелу создана. Подтвердите email и войдите. Қолжетімділік к разделам откроет әкімші или учитель.", true);
  }
}

async function sendPasswordReset() {
  const email = document.getElementById("resetEmail")?.value.trim().toLowerCase();
  const message = document.getElementById("resetMessage");

  if (!email) {
    if (message) { message.textContent = "Email енгізіңіз."; message.className = "auth-message error"; }
    return;
  }
  if (resetSent) {
    if (message) { message.textContent = "Сілтеме бұрын жіберілген. Поштаңызды тексеріңіз."; message.className = "auth-message success"; }

  try {

    });

    resetSent = true;
    if (message) { message.textContent = "Құпия сөзді қалпына келтіру сілтемесі поштаңызға жіберілді."; message.className = "auth-message success"; }
  } catch (error) {
    console.error("Қалпына келтіру қатесі:", error);
    if (message) { message.textContent = error.message || "Хат жіберу мүмкін болмады."; message.className = "auth-message error"; }
  }
}

const INACTIVITY_LIMIT = 60 * 60 * 1000;
const LAST_ACTIVITY_KEY = "numerology_last_activity";
let inactivityTimer = null;

function updateLastActivity() {
  localStorage.setItem(LAST_ACTIVITY_KEY, Date.now().toString());
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(autoLogoutAfterInactivity, INACTIVITY_LIMIT);
}

async function autoLogoutAfterInactivity() {
  const lastActivity = Number(localStorage.getItem(LAST_ACTIVITY_KEY) || 0);
  if (!lastActivity) { updateLastActivity(); return; }
  const inactiveTime = Date.now() - lastActivity;

  if (inactiveTime >= INACTIVITY_LIMIT) {
    localStorage.removeItem(LAST_ACTIVITY_KEY);
    try { await supabaseClient.auth.signOut(); } catch (error) { console.error("Автоматты шығу қатесі:", error); }
    showLogin();
    return;
  }
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(autoLogoutAfterInactivity, INACTIVITY_LIMIT - inactiveTime);
}

function startInactivityTimer() {
  const lastActivity = Number(localStorage.getItem(LAST_ACTIVITY_KEY) || 0);
  if (lastActivity && Date.now() - lastActivity >= INACTIVITY_LIMIT) { autoLogoutAfterInactivity(); return; }
  updateLastActivity();
}

["click", "keydown", "mousemove", "scroll", "touchstart"].forEach(function (eventName) {
  document.addEventListener(eventName, updateLastActivity, { passive: true });
});
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) autoLogoutAfterInactivity();
});

async function logoutUser() {
  try { await supabaseClient.auth.signOut(); } catch (error) { console.error("Шығу қатесі:", error); }
  localStorage.removeItem(LAST_ACTIVITY_KEY);
  clearTimeout(inactivityTimer);
  window.currentUser = null;
  window.currentUserRole = "";
  window.currentUserIsManager = false;
  window.currentUserHasAccess = false;
  showLogin();
}

async function submitNewPassword() {
  const p1 = document.getElementById("newPassword1")?.value || "";
  const p2 = document.getElementById("newPassword2")?.value || "";
  const msg = document.getElementById("newPasswordMessage");
  const setMsg = (text, ok) => { if (msg) { msg.textContent = text; msg.className = "auth-message " + (ok ? "success" : "error"); } };

  if (p1.length < 6) { setMsg("Құпия сөз кемінде 6 таңбадан тұруы керек.", false); return; }
  if (p1 !== p2) { setMsg("Құпия сөздер сәйкес келмейді.", false); return; }

  setMsg("Сохраняю новый пароль...", true);
  const { error } = await supabaseClient.auth.updateUser({ password: p1 });
  if (error) { setMsg("Не удалось сохранить пароль: " + (error.message || "Supabase қатесі"), false); return; }

  setMsg("Құпия сөз изменён. Сейчас откроется платформа.", true);

async function checkAuth() {
  try {
    if (window.location.hash.includes("type=recovery")) {
      showSetNewPasswordForm();
      return;
    }
    const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
    if (sessionError) { console.error("Сессияны алу қатесі:", sessionError); showLogin("Авторизацияны тексеру мүмкін болмады."); return; }
    if (!session) { showLogin(); return; }

    const user = session.user;
    window.currentUser = user;
    const userEmail = String(user.email || "").trim().toLowerCase();

    let profile = null;
    const { data: profileData, error: profileError } = await supabaseClient
      .from("profiles")
      .select("role, first_name, last_name, middle_name, email, phone, status")
      .eq("id", user.id)
      .maybeSingle();
    if (profileError) console.error("Ошибка загрузки профиля:", profileError);
    else profile = profileData;

    const role = String(profile?.role || user.user_metadata?.role || "student").trim().toLowerCase();
    const isManager = isManagerRole(role) || isAdminEmail(userEmail);

    let hasAccess = false;
    let currentGrant = {};
    let latestPeriod = null;
    {
      const { data: access, error: accessError } = await supabaseClient
        .from("access_periods")
        .select("id, status, starts_at, ends_at, is_unlimited, payment_status, granted_scope, created_at")
        .eq("profile_id", user.id)
        .order("created_at", { ascending: false });
      if (accessError) {
        console.error("Қолжетімділікті тексеру қатесі:", accessError);
      } else {
        latestPeriod = (access || [])[0] || null;
        const activePeriods = (access || []).filter(hasActivePlatformAccess);
        hasAccess = activePeriods.length > 0;
        currentGrant = activePeriods[0]?.granted_scope || {};
      }
    }
    if (isManager) hasAccess = true;

    window.currentUserRole = isAdminEmail(userEmail) ? "admin" : role;
    window.currentUserId = user.id;
    window.currentUserIsManager = isManager;
    window.currentUserHasAccess = hasAccess;
    window.currentUserGrant = currentGrant;
    window.currentUserAccessMeta = {
      hasAnyPeriod: !!latestPeriod,
      isExpired: !!latestPeriod && !latestPeriod.is_unlimited && !hasActivePlatformAccess(latestPeriod),
      startsAt: latestPeriod?.starts_at || null,
      endsAt: latestPeriod?.ends_at || null,
    };

    const displayName = profile?.first_name || profile?.last_name || user.user_metadata?.first_name || (isManager ? "Центр Нумера" : userEmail.split("@")[0]) || "Пайдаланушы";

    const nameNode = document.getElementById("clientName");
    const emailNode = document.getElementById("clientEmail");
    if (nameNode) nameNode.textContent = displayName;
    if (emailNode) emailNode.textContent = profile?.email || user.email || "";

    const navStats = document.getElementById("navStatistics");
    if (navStats) navStats.style.display = window.currentUserIsManager ? "" : "none";

    // Показываем название школы ученику/ученице, если её задал их учитель.
    if (!isManager && profile?.teacher_id) {
      supabaseClient.from("schools").select("name").eq("owner_id", profile.teacher_id).maybeSingle().then(({ data: school }) => {
        const line = document.getElementById("studentSchoolLine");
        if (line && school?.name) {
          line.textContent = "Мектеп/бренд: " + school.name;
          line.style.display = "block";
        }
      });
    }

    document.body.style.visibility = "visible";
    startInactivityTimer();
    setActiveSection("calculators");
    renderCalculators();

  } catch (error) {
    console.error("Ошибка checkAuth:", error);
    showLogin("Не удалось подключиться к платформе. Проверьте соединение и попробуйте ещё раз.");
  }
}

document.addEventListener("DOMContentLoaded", checkAuth);
</script>
</body>
</html>
